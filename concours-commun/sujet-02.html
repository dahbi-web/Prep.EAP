<script>const DATA=["Concours Recrutement\n2026\nD\nPREPARE MON CONCOURS\nConCours 15\nRegion Marrakech 2025 - Commun\n06 16 03 08 31 s l i t - a n a s s\nANASS SLIT- INFIRMIER POLYVALENT\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "1/ Les déterminants principaux de santé au Maroc selon l’OMS sont :\nA/ Facteurs socio-économiques\nB/ Comportements individuels (tabac, nutrition, activité)\nC/ Nationalité\nD/ Environnement physique et conditions de logement\n2/ Le concept de \"souveraineté sanitaire\" au Maroc inclut :\nA/ L'importation massive de médicaments étrangers\nB/ La production locale et la sécurité des produits pharmaceutiques\nC/ L'abandon des politiques de prévention\nD/ Le retrait de l'État du secteur pharmaceutique\n3/ Quel indicateur international est couramment utilisé pour mesurer la performance\nglobale d’un système de santé ?\nA/ Taux d’occupation hospitalier\nB/ Nombre de consultations externes\nC/ Espérance de vie à la naissance\nD/ Taux d’accidents domestiques\n4/ Parmi les obstacles structurels fréquemment évoqués pour la gouvernance sanitaire\nmarocaine, on trouve :\nA/ La fragmentation institutionnelle entre acteurs de santé\nB/ L'absence de mécanismes incitatifs pour la performance\nC/ La surcentralisation complète (sans autonomie régionale)\nD/ L'excès d'harmonisation entre tous les établissements\n5/ Parmi ces organismes, lequel a une mission territoriale directe ?\nA/ Haute Autorité de Santé\nB/ Groupement Sanitaire Territorial\nC/ Agence Marocaine des Médicaments et dispositifs médicaux\nD/ Agence Marocaine du Sang et dérivés\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "6/ L’audit externe préalable à l’accréditation d’un centre hospitalier régional s’inscrit dans\nun dispositif coordonné par :\nA/ Le groupement Sanitaire Territorial\nB/ La haute Autorité de Santé\nC/ L'agence Marocaine des Médicaments et dispositifs médicaux\nD/ L'agence Marocaine du Sang et dérivés\n7/ L’organisation d’un réseau régional de soins palliatifs et de soins à domicile (parcours,\ncontinuité, coordination) est prioritairement une compétence de :\nA/ Groupement Sanitaire Territorial\nB/ Haute Autorité de Santé\nC/ Agence Marocaine des Médicaments et dispositifs médicaux\nD/ Agence Marocaine du Sang et dérivés\n8/ L’intérêt d’une centralisation de la stérilisation est de :\nA/ Assurer la continuité et la reproductivité des procédures\nB/ Assurer l’efficacité de la stérilisation\nC/ Regrouper les moyens et les compétences\nD/ Organiser les locaux et les circuits de manière rationnelle\n9/ Maladie constamment présente dans une région donnée, est dite :\nA/ Epidémie\nB/ Pandémie\nC/ Sporadique\nD/ Endémie\n10/ Laquelle des maladies suivantes, est soumise au règlement sanitaire International :\nA/ Le trachome\nB/ La diphtérie\nC/ Le paludisme\nD/ Le choléra\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "11/ L'Etude de cohorte est :\nA/ Est adaptée pour étudier les maladies rares\nB/ Permet de déterminer directement l'incidence de la maladie chez les exposés et les non exposés\nC/ Toujours prospective\nD/ La validité des résultats peut être très affectée par les non répondants et les perdus de vue\n12/ Les résultats d'une enquête de cohorte révèle un RR = 0.5 et un IC à 95% [0.3-0.7] quelle\nest l'interprétation qui convient ?\nA/ Facteur de risque, liaison significative\nB/ Facteur protecteur, liaison significative\nC/ Facteur de risque possible, mais liaison non significative\nD/ Facteur de protection possible, mais liaison non significative\n13/ Comment se répartissent les responsabilités dans la nouvelle gouvernance sanitaire ?\nA/ Le ministère définit la politique nationale et exerce la tutelle\nB/ Les GST gèrent les établissements publics de leur région\nC/ La HAS administre directement les hôpitaux\nD/ La HAS évalue la qualité et émet des recommandations\n14/ Quels principes en matière de qualité et sécurité des soins sont promus par la réforme ?\nA/ L'instauration d'un référentiel national d'évaluation\nB/ Exclusion du secteur public de la démarche qualité\nC/ L'amélioration continue et la transparence des résultats\nD/ Abrogation des audits sanitaires\n15/ Que prévoit la loi 09-08 pour le transfert international des données de santé ?\nA/ Autorisation uniquement si le pays de destination offre une protection adéquate\nB/ Encadrement juridique et autorisation CNDP nécessaires\nC/ Dispense d'accord du patient\nD/ Aucune réponse n’est juste\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "16/ Parmi les principes cardinaux explicitement posés par 06-22 :\nA/ Équité d'accès et continuité des prestations\nB/ Territorialisation de l'offre et réduction des inégalités spatiales\nC/ Rattachement organique des hôpitaux aux communes\nD/ Souveraineté et sécurité des médicaments/produits de santé\n17/ Comment se répartissent les fonctions institutionnelles dans la réforme sanitaire ?\nA/ MSPS élabore la politique nationale, assure la tutelle et la régulation\nB/ HAS évalue la qualité et la sécurité des soins\nC/ GST gère les établissements publics régionaux et planifie l'offre\nD/ Toutes les réponses sont justes\n18/ Quelle est la hiérarchie juridique des normes dans le système de santé marocain ?\nA/ Dahir de promulgation → Loi→ Décret → Arrêté\nB/ Circulaire → Loi organique\nC/ Bulletin officiel : publication authentique des lois et décrets\nD/ Présentations internes → Dahir royal\n19/ Quelle institution assure la coordination nationale de la stratégie de vaccination au Maros ?\nA/ Le ministère de l'intérieur\nB/ Un partenariat OMS-UNICEF\nC/ Le Ministère de la Santé et de la Protection Sociale\nD/ Les agences régionales de pharmacie\n20/ En 2024, quelle initiative a été mise en œuvre pour renforcer la prise en charge dans les services\nd'urgences hospitalières ?\nA/ Création de pôles de traumatologie dans plusieurs hôpitaux régionaux\nB/ Délocalisation des SAMU vers les capitales régionales\nC/ Réduction par décret des admissions non urgentes\nD/ Augmentation du nombre de cabinets privés d'urgence\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "21/ Quelle problématique sanitaire constitue une priorité majeure dans la région Marrakech-safi ?\nA/ Maladies radio-induites\nB/ Accidents de la route et urgences traumatologiques\nC/ Infections nosocomiales exclusives\nD/ Maladies vectorielles rares\n22/ Quel est l'objectif principal du plan \"Hôpital sans rendez-vous\", lancé en 2023 ?\nA/ Supprimer la médecine de famille\nB/ Soumettre l'offre hospitalière publique à des quotas\nC/ Faciliter l'accès des citoyens aux consultations spécialisées sans délai préalable\nD/ Limiter l'accès aux urgences vitales\n23/ Quelle structure nationale a été créée en avril 2025 pour améliorer la réponse aux\nurgences sanitaires ?\nA/ Centre National d'Opérations d'Urgence en Santé Publique (CNOUSP)\nB/ Centre National de Coordination des Épidémies\nC/ Direction Générale de la Sécurité Sanitaire\nD/ Centre National de Prévention Médicale\n24/ À quoi sert un système d'alerte précoce sanitaire ?\nA/ Détecter rapidement et signaler les menaces épidémiques émergentes\nB/ Centraliser les données des ambulances dans un centre logistique\nC/ Reporter les décisions sanitaires au niveau hospitalier\nD/ Organiser le transport interrégional des patients graves\n25/ L'initiative mondiale \"Santé pour tous\" de l'OMS a pour objectif principal :\nA/ La privatisation des systèmes de santé\nB/ L'accès universel aux soins de santé essentiels et équitables\nC/ L'augmentation du coût des soins hospitaliers\nD/ La limitation des soins de base\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "26/ En 2025, la part du financement public dans les dépenses de santé au Maroc représente environ :\nA/ 38%\nB/ 51%\nC/ 60%\nD/ 67%\n27/ L'indicateur le plus pertinent pour évaluer l'efficacité des services d'urgence est :\nA/ Le nombre de lits hospitaliers\nB/ Le taux d'occupation des salles d'attente\nC/ Le temps moyen de réponse pré hospitalier\nD/ Le nombre d'ambulances régionales\n28/ Quelle réforme clé a marqué la gouvernance hospitalière en 2023 ?\nA/ La centralisation des budgets hospitaliers\nB/ La fermeture de structures rurales\nC/ La création et l'autonomisation progressive des Groupements Sanitaires Territoriaux (GST)\nD/ La suppression des CHU régionaux\n29/ Quel défi sanitaire majeur découle du vieillissement démographique au Maroc ?\nA/ La recrudescence des maladies infectieuses aigués\nB/ L'augmentation des maladies chroniques (diabète, cancers, HTA, Alzheimer)\nC/ Les pathologies infantiles\nD/ Les zoonoses tropicales\n30/ La réforme hospitalière prévoit d'accroître la capacité du secteur public d'ici 2030 d'environ :\nA/ 10 000 lits\nB/ 15 000 lits\nC/ 20 000 lits supplémentaires\nD/ 25 000 lits\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "31/ L'organisme international responsable de la fixation des normes mondiales de préparation\nsanitaire est :\nA/ FAO\nB/ OMS (Organisation Mondiale de la Santé)\nC/ UNESCO\nD/ Banque africaine de développement\n32/ La première cause d'hospitalisation dans les hôpitaux publics marocains en 2024 est\nA/ Les traumatismes routiers\nB/ Les infections respiratoires\nC/ Les accouchements et complications obstétricales\nD/ Les maladies infectieuses tropicales\n33/ Quelle stratégie transversale a été introduite en 2025 pour renforcer la gouvernance et la\ntransparence du secteur de la santé ?\nA/ Initiative Santé Privée\nB/ Charte nationale de la santé et de la transparence\nC/ Fonds africain de solidarité médicale\nD/ Plan numérique de l'OMS\n34/ Les principales avancées du programme \"Soins de proximité 2025\" comprennent :\nA/ L'arrêt de la médecine communautaire\nB/ La rénovation de près de 1 000 centres de santé de première ligne\nC/ La suppression du dossier médical partagé\nD/ L'abandon du plan de couverture rurale\n35/ Quel outil numérique a été déployé en 2025 pour la coordination des soins primaires et\nhospitaliers ?\nA/ Application privée \"Clinica\"\nB/ Système intégré de dossier médical partagé (DMP)\nC/ Portail CNOPS mobile\nD/ Base de données \"Système Communal de Santé\"\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "36/ Quelle mesure renforce la redevabilité et la performance hospitalière dans la réforme 2023-2025\nA/ Diminution de l'offre publique\nB/ Signature de contrats-programmes entre le ministère et les hôpitaux publics\nC/ Exonération fiscale du secteur privé\nD/ Suppression des rapports de performance\n37/ L’objectif du Plan Hôpital sans rendez-vous est de :\nA/ Réduire t'accès des patients non assurés\nB/ Faciliter l'accès rapide aux consultations spécialisées\nC/ Supprimer les urgences\nD/ Créer des cliniques à la demande\n38/ Le système d'alerte sanitaire marocain vise avant tout à :\nA/ Détecter et signaler précocement les menaces épidémiques\nB/ Coordonner les évacuations administratives\nC/ Reporter les décisions vers le niveau régional\nD/ Transférer les hôpitaux vers les capitales\n39/ Quelle proportion de la population marocaine bénéficiera de la couverture médicale universelle\ncomplète en 2025 ?\nA/ 60 %\nB/ 75 %\nC/ Près de 100\nD/ 40 %\n40/ Le principal frein Identifié à la mise en œuvre du dossier médical numérique est :\nA/ L'absence de connexion Internet dans les CHU\nB/ Le manque d'interopérabilité entre systèmes d'information régionaux\nC/ Le refus des patients d'être enregistrés\nD/ La suppression du cadre légal CNDP\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31"];const root=document.getElementById('pages'),q=document.getElementById('q'),count=document.getElementById('count');
