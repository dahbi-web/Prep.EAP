* C. Unités médicales mobiles ;\n* D. Toutes les réponses sont fausses.\n25. La loi-cadre 06-22 concernant la refonte du système de santé s'articule autour de 4 piliers.\nQuelle propositions est incorrecte ?\n* A. La digitalisation ;\n* B. La création des groupements sanitaires territoriaux ;\n* C. La revalorisation des ressources humaines ;", "* D. La gouvernance.\n26. L'économie de la santé a pour objectif de :\n* A. Diminuer les dépenses ;\n* B. Faire des économies ;\n* C. Proposer des solutions aux problèmes de financement de la santé ;\n* D. Rechercher l'utilisation optimale des ressources.\n27. Parmi les sources de financement du système de santé marocain, on trouve :\n* A. Les subventions de l'état ;\n* B. La coopération internationale ;\n* C. La contribution directe des ménages ;\n* D. Les ONG.\n28. La protection sociale, au sens de la loi-cadre 09-21, comprend :\n* A. La protection contre les risques de maladie ;\n* B. La protection contre les risques liés à l'enfance et l'octroi d'allocations forfaitaires...\ncouvertes par cette protection ;\n* C. La protection contre les risques liés au vieillissement ;\n* D. La protection contre le risque de perte d'emploi.\n29. Parmi les avantages de la digitalisation :\n* A. Un accès aux outils centralisés ;\n* B. Mise à jour des données en temps réel ;\n* C. Partage du travail instantané ;\n* D. Toutes les réponses sont justes ;\n30. La loi 07-22 est relative à :\n* A. Les groupements sanitaires territoriaux ;\n* B. La haute autorité de santé ;\n* C. L'agence nationale de sang ;", "* D. Toutes les réponses sont fausses ;\n31. Lesquelles(laquelle) de(s) unité(s) suivante(s) ne fait(font) pas partie de (la Direction)\nRégionale de la Santé et de la Protection Sociale :\n* A. L'unité de la télécommunication ;\n* B. L'unité régionale d'approvisionnement et de la pharmacie ;\n* C. L'unité de médicaments ;\n* D. Toutes les réponses sont justes.\n32. Selon la loi cadre 06-22, le modèle du système de soins...\n* A. Transversal et fondé sur les soins ambulatoires et hospitaliers ;\n* B. Pyramidal, intégré, hiérarchisé et fondé sur les établissements de soins de santé primaire ;\n* C. Hiérarchisé, régionalisé et fondé sur la santé communautaire ;\n* D. Décentralisé, orienté sur la prise en charge des maladies chroniques.\n33. Le groupement sanitaire territorial comporte tous les établissements sanitaires publics\nrelevant de son territoire sauf :\n* A. Les Centres Hospitaliers Universitaires ;\n* B. Les établissements des Forces Armées Royales ;\n* C. Les offices collectifs d'hygiène ;\n* D. Les cliniques médicales privées.\n34. Le GST est géré par :\n* A. Le directeur régional ;\n* B. Le conseil administratif ;\n* C. Le président du conseil régional ;\n* D. Toutes les réponses sont justes.\n35. La journée mondiale de la santé est :\n* A. 7 Avril ;\n* B. 7 Août ;\n* C. 10 Octobre ;", "* D. Toutes les dates sont fausses.\n36. Lequel / lesquels des établissements suivants ne fait/ ne font pas partie du Réseau des\nétablissements Médico-sociaux :\n* A. Les Hôpitaux psychiatriques ;\n* B. Les Centres régionaux d'oncologie ;\n* C. Les Centres d'hémodialyse ;\n* D. Des Centres de Soins Palliatifs.\n37. Parmi les sources des ressources financière des GST :\n* A. Les subventions de l'État et des collectivités locales ;\n* B. Les revenus des activités des GST ;\n* C. Dons et legs ;\n* D. Toutes les réponses sont fausses.\n38. Chaque GST comprend :\n* A. Toutes les institutions et Services de santé relevant du Ministère de la santé et de la\nprotection sociale ;\n* B. Les établissements de santé relevant des FAR ;\n* C. Seulement les établissements de santé relevant du réseau hospitalier implantés dans la\ncirconscription territoriale du GST ;\n* D. Les bureaux municipaux d'hygiènes ;\n39. Le statut juridique de l'agence nationale du sang et de ses dérivés :\n* A. Association Privée à but non lucratif ;\n* B. Association privée à but lucratif ;\n* C. Établissement public doté de la personnalité mor n en phase terminale d'une maladie (type cancer), d'une pathologie, etc... ;\n* C. Est toujours souffrante du diabète ;\n* D. Aucune réponse n'est juste.\n8. Les complications de décubitus se manifestent par :\n* A. Des signes au niveau des membres inférieurs ;\n* B. Des signes pulmonaires ;\n* C. Des signes cardiaques ;\n* D. Des troubles du transit intestinal.\n9. Une action préventive, c'est :\n* A. Une action différée qui agit sur la cause du dysfonctionnement ; pour éviter que celui-ci ne\nréapparaisse.\n* B. Une action immédiate qui agit sur l'effet du dysfonctionnement ;\n* C. Une action qui agit sur les causes probables d'un dysfonctionnement ; afin d'éviter son\napparition.\n* D. Aucune réponse n'est juste.", "10. Une augmentation significative et inhabituelle de la fréquence d'une maladie dans le temps\net dans l'espace est une :\n* A. Endémie ;\n* B. Pandémie ;\n* C. Épidémie ;\n* D. Aucune proposition n'est juste.\n11. Les activités de la prévention primaire sont :\n* A. Le dépistage ;\n* B. La vaccination ;\n* C. L'hygiène ;\n* D. La chimiothérapie.\n12. L'handicap sensoriel comprend :\n* A. Handicap visuel ;\n* B. Handicap moteur ;\n* C. Handicap psychomoteur ;\n* D. Handicap auditif.\n13. Les infirmiers et les techniciens de santé exercent leurs professions soit :\n* A. Sur prescription médicale ;\n* B. Sous l'encadrement et la responsabilité d'un médecin ;\n* C. D'une manière indépendante en ce qui concerne les actes qui lui sont propres ;\n* D. En fonction des circonstances et le contexte d'exercice.\n14. Par quel organe la bile est-elle sécrétée :\n* A. L'estomac ;\n* B. Le pancréas ;\n* C. Le foie ;\n* D. Le rein.", "15. L'hygiène hospitalière a pour objectifs :\n* A. D'améliorer la qualité des soins ;\n* B. D'éviter la contamination des patients par le matériel technique ;\n* C. D'éviter la propagation des germes des personnels soignants aux patients ;\n* D. De prévenir l'apparition de bactéries multi-résistantes.\n16. Parmi ces propositions, lesquelles sont correctes :\n* A. Un médicament générique ne possède pas le même principe actif que le médicament\nprinceps ;\n* B. Un excipient est une préparation avec activité thérapeutique ;\n* C. Les gélules sont des médicaments de forme galénique ;\n* D. Un médicament est toute substance ou composition présentée comme possédant des\npropriétés curatives ou préventives.\n17. Parmi les hépatites suivantes, quelles sont celles transmises par le sang :\n* A. Hépatite A ;\n* B. Hépatite B ;\n* C. Hépatite C ;\n* D. Hépatite E.\n18. Quelle pratique de communication est essentielle pour un bon travail en équipe dans un\nenvironnement de soins :\n* A. Communiquer uniquement par écrit pour éviter les malentendus.\n* B. Éviter de poser des questions pour ne pas déranger les collègues.\n* C. Confier toutes les décisions au médecin chef.\n* D. Utiliser les briefings et débriefings pour partager les informations importantes.\n19. L'infirmier exerce sa profession soit :\n* A. Sur prescription médicale ;\n* B. Sous l'encadrement et la responsabilité d'un médecin ;\n* C. D'une manière indépendante en ce qui concerne les actes qui lui sont propres ;", "* D. En fonction des circonstances et le contexte d'exercice.\n20. Le lavage simple des mains :\n* A. Élimine la flore transitoire ;\n* B. Élimine la flore commensale ;\n* C. Dure 30 secondes ;\n* D. Dure 1 minute.\n21. Le lavage hygiénique ou antiseptique des mains :\n* A. Élimine la flore transitoire ;\n* B. Diminue la flore commensale ;\n* C. Doit être effectué après tout soin antiseptique ;\n* D. Doit être effectué avant un soin septique.\n22. La première cause de mortalité au Maroc est représentée par :\n* A. Les maladies transmissibles ;\n* B. Les maladies cardiovasculaires ;\n* C. La tuberculose et les maladies respiratoires ;\n* D. Les cancers.\n23. Parmi les critères d'un soin de qualité Selon l'Organisation Mondiale de la Santé (OMS) :\n* A. La délivrance à chaque patient de l'assortiment d'actes diagnostiques et thérapeutiques qui\nlui assurera le meilleur résultat en termes de santé, conformément à l'état actuel de la science\nmédicale, au meilleur coût pour un même résultat ;\n* B. Moindre risque iatrogène ;\n* C. Plus grande satisfaction du malade en termes de procédures, de résultats et de contacts\nhumains à l'intérieur du système de soins ;\n* D. Aucune réponse n'est juste.\n24. Le respect du droit du patient amène le soignant à :\n* A. Respecter le droit de disposition du patient ;\n* B. Respecter le droit de la protection du patient (consentement ; information...) ;", "* C. Imposer au patient le traitement quelque soit les circonstances ;\n* D. Faire le soin adapté à la personne sans respecter son consentement.\n25. Une personne de groupe ORh+ peut donner du sang à :\n* A. Une personne de groupe AB Rh+ ;\n* B. Une personne de groupe O Rh+ ;\n* C. Une personne de groupe A Rh+ ;\n* D. Une personne de groupe B Rh+.\n26. L'éthique :\n* A. Est l'étude des principes qui guident l'action humaine ;\n* B. Elle cherche à déterminer la meilleure façon de vivre ensemble ;\n* C. Elle est axée sur le concept de responsabilité, et donc s'inscrit dans l'histoire des idées ;\n* D. C'est un ensemble de valeurs que se donne un groupe en termes de bien et de mal.\n27. L'éthique a pour base de :\n* A. Droit et de devoir ;\n* B. La responsabilité ;\n* C. La sanction ;\n* D. Toutes les réponses sont justes.\n28. La profession de l'infirmier et du technicien de santé exige :\n* A. Le professionnalisme ;\n* B. Les qualités humaines et relationnelles ;\n* C. La forte motivation ;\n* D. Toutes les réponses sont fausses.\n29. Parmi les qualités morales de l'infirmier et du technicien de santé :\n* A. La patience ;\n* B. Le secret professionnel ;\n* C. Le dévouement ;", "* D. La conscience professionnelle.\n30. Les instituts supérieurs des professions infirmières et techniques de santé :\n* A. Sont des établissements de l'enseignement supérieur ne relevant pas des universités ;\n* B. Sont des établisse
