<script>const DATA=["RECUEIL DES CONCOURS\nDE RECRUTEMENT DES INFIRMIERS\nET TECHNICIENS DE SANTÉ\nPartie Commune\n2021 – 2025\nVersion Initiale\nDocument de Préparation et de Révision\nDestiné aux Candidats des Concours\nDe Recrutement des ITS au Maroc.\nPréparé par :\nL'Infirmière\nRafiaa Chabab\n♥ Votre réussite, notre mission !", "SOMMAIRE\n❖ Concours de recrutement 2025 — Région Tanger-Tétouan-Al\nHoceïma (3 à 8)\n❖ Concours de recrutement 2025 — Région Casablanca-Settat (9 à 15)\n❖ Concours de recrutement 2025 — Région Fès-Meknès (16 à 18)\n❖ Concours de recrutement 2025 — Région de l’Oriental (19 à 22)\n❖ Concours de recrutement 2024 — Région Casablanca-Settat (23 à 28)\n❖ Concours de recrutement 2024 — Région Fès-Meknès (29 à 33)\n❖ Concours de recrutement 2024 — Région Souss-Massa Agadir (34 à\n41)\n❖ Concours de recrutement 2024 — Région Dakhla (42 à 48)\n❖ Concours de recrutement 2024 — Région Drâa-Tafilalet (49 à 54)\n❖ Concours de recrutement 2023 — Région Guelmim-Oued Noun\n(55 à 61)\n❖ Concours de recrutement 2023 — Région Tanger-Tétouan-Al\nHoceïma (62 à 73)\n❖ Concours de recrutement 2023 — Région Béni Mellal-Khénifra (74 à\n81)\n❖ Concours de recrutement 2023 — Région Drâa-Tafilalet (82 à 88)\n❖ Concours de recrutement 2021 — Région Drâa-Tafilalet (89 à 94)", "Concours de recrutement des infirmiers et techniciens de santé 1er grade\nRégion Tanger-Tétouan-Al Hoceima\nSession de 2025 Épreuve Commune\nCochez-la ou les bonnes réponses\n1- Le groupement sanitaire de territoire est :\nA. Établissement public\nB. Établissement privé à but non lucratif\nC. Établissement à caractère régional\nD. Établissement privé à but lucratif\n2- Le groupement sanitaire de territoire comporte :\nA. Les établissements hospitaliers militaires\nB. Les B.C.H\nC. Les établissements des soins de santé primaires\nD. Les établissements hospitaliers publics\n3- La protection sociale couvre :\nA. L'assurance du patrimoine\nB. L'assurance vie\nC. L'assurance maladie\nD. Les allocations familiales\n4- Parmi les droits du patient on a :\nA. Le droit à l'information\nB. Le droit à l'accès aux soins de qualité\nC. Le droit au respect de secret professionnel\nD. Le droit au consentement\n5- Les règles professionnelles sont des règles :\nA. Sociales\nB. Déontologiques\nC. Juridiques\nD. Morales\n6- Le centre de santé urbain de 1er niveau est implanté pour une population environ de:\nA. 15000 habitants\nB. 25000 habitants\nC. 35000 habitants\nD. 45000 habitants", "7- Un centre de santé rural niveau 2 offre :\nA. Des soins pour la mère et l'enfant\nB. Des soins uniquement pour la mère\nC. Des soins uniquement pour l'enfant\nD. La vaccination de la mère et de l'enfant\n8- Les prestations d'un hôpital de jour sont :\nA. Des prestations de soins\nB. Des prestations rendues dans la journée sans hébergement\nC. Des prestations pour les grandes urgences\nD. Toutes les réponses sont justes\n9- La responsabilité pénale du professionnel de santé est engagée en cas de :\nA. Violation du secret professionnel\nB. Omission de porter secours à une personne en danger\nC. Homicide involontaire\nD. Exercice illégal de la profession\n10- La promotion de la santé repose sur :\nA. Une approche sociale et économique\nB. Une approche médicale\nC. Une approche épidémiologique\nD. Une approche comportementale\n11- Un espace santé jeune (ESJ) :\nA. Est assimilé à un centre de santé urbain niveau 2\nB. Un ESJ est pour 50000 habitants\nC. Contribue à la promotion de la santé des jeunes de 10 et 25 ans\nD. Aucune réponse n'est juste\n12- Cocher les prestations offertes par le réseau des établissements des soins de santé\nprimaires :\nA. La consultation de médecine générale\nB. L'accouchement\nC. La prise en charge des urgences\nD. La planification familiale\n13- Les établissements médicosociaux assurent :\nA. Une prise en charge médicalisée des personnes âgées\nB. Une prise en charge médicalisée des personnes à besoin spécifique\nC. Une prise en charge des urgences Graves\nD. Aucune réponse n'est juste\n14- Les principales actions communautaires au Maroc sont :\nA. SAMU Obstétrical Rural\nB. Dar Al Oumouma\nC. Classes des mères\nD. Classes des pères", "15- Le groupement sanitaire de territoire jouit de :\nA. La personnalité juridique uniquement\nB. L'autonomie financière uniquement\nC. La personnalité juridique et l'autonomie financière\nD. L'autonomie administrative uniquement la personnalité juridique uniquement\n16- Les examens d'échographie sont assurés dans un :\nA. Centre de santé rural niveau 1\nB. Centre de santé urbain niveau 1\nC. Centre de santé urbain niveau 2\nD. Centre de santé rural niveau 2\n17- L'institut national d'hygiène est :\nA. Une structure spécialisée au réseau des ESSP\nB. Une structure spécialisée au réseau hospitalier\nC. Un établissement médicosocial\nD. Un établissement à caractère national\n18- Le groupement sanitaire de territoire assure :\nA. La formation initiale pour les étudiants de médecine et des ISPITS\nB. La formation pratique initiale pour les étudiants de médecine\nC. La formation pratique initiale pour les étudiants des ISPITS\nD. La formation continue des professionnels de santé du GST\n19- Le groupement sanitaire de territoire est dirigé par :\nA. Un conseil d'établissement\nB. Un conseil d'administration\nC. Un conseil de sages\nD. Un conseil consultatif\n20- Le centre hospitalier régional assure les prestations hospitalières de :\nA. Premier niveau\nB. Deuxième niveau\nC. Troisième niveau\nD. Quatrième niveau\n21- La mortalité maternelle est imputée à :\nA. La grossesse seulement\nB. La grossesse et à l'accouchement\nC. L'accouchement seulement\nD. Ni à la grossesse ni à l'accouchement\n22- La filière de soins est :\nA. Une organisation horizontale des soins\nB. Une organisation verticale des soins\nC. Une organisation hiérarchisée du parcours de patient\nD. Un réseau coordonné des soins", "23- Le centre hospitalier régional assure les urgences médicales :\nA. De proximité\nB. De base\nC. Complètes\nD. Spécialisées\n24- Le centre de diagnostic et de traitement des maladies respiratoires est une structure\nspécialisée d'appui au réseau :\nA. Des établissements de soins de santé primaires\nB. Hospitalier\nC. RISUM\nD. Médico-social\n25-La santé est relative au bien être :\nA. Physique, mental ou social\nB. Physique, mental et social\nC. Mental et social\nD. Physique et social\n26- Le système national de santé est basé sur les principes suivants :\nA. L'égalité d'accès aux soins et aux prestations de santé\nB. La continuité des prestations de santé\nC. La subsidiarité\nD. La bonne gouvernance\n27- Le système national de santé est composé de :\nA. 2 secteurs sanitaires\nB. 3 secteurs sanitaires\nC. 4 secteurs sanitaires\nD. 5 secteurs sanitaires\n28- L'offre de soins est composée :\nA. Des infrastructures sanitaires\nB. Des ressources financières\nC. Des équipements\nD. Des ressources humaines\n29- Le comité d'établissement d'un hôpital :\nA. Est présidé par le directeur\nB. Est présidé par le délégué\nC. Définit les orientations stratégiques de l'hôpital\nD. Aucune réponse n'est juste\n30- Un hôpital de 120 à 240 lits est organisé en :\nA. 06 départements et 03 services\nB. 08 départements et 02 services\nC. 03 départements et 06 services\nD. 02 départements et 08 services", "31- La Haute Autorité de la Santé (HAS) :\nA. Instaurée par la loi 06.22\nB. Instaurée par la loi 07.22\nC. Instaurée par la loi 08.22\nD. Instaurée par la loi 09.22\n32- La Haute Autorité de la Santé (HAS) vise à garantir :\nA. La pérennité de l’action de l’État dans le domaine de la santé\nB. L’encadrement technique de l’Assurance Maladie Obligatoire (AMO)\nC. L’évaluation de la qualité des prestations des établissements de santé publics et privés\nD. L’émission d’avis concernant les politiques publiques de santé\n33- La Haute Autorité de la Santé (HAS) :\nA. Est une personne morale de droit public\nB. Jouit d’une indépendance financière\nC. Dispose d’un conseil d’administration\nD. Aucune réponse n’est juste\n34- L’Agence Marocaine du Sang et de ses Dérivés :\nA. Instaurée par la loi 09.22\nB. Instaurée par la loi 10.22\nC. Instaurée par la loi 11.22\nD. Instaurée par la loi 08.22\n35- Les établissements de santé publics et privés peuvent dispenser des prestations de\nsoins et services en mode mobile via :\nA. Visites à domicile\nB. Unités médicales mobiles\nC. Caravanes médicales spécialisées\nD. Aucune réponse n’est juste\n36- Un hôpital de proximité est :\nA. Pour une population de 70 000 habitants\nB. Pour une population de 700 000 habitants\nC. Dispose de 05 spécialités\nD. Dispose de 20 spécialités\n37- Le laboratoire de santé publique est :", "A. Un établissement médico-social\nB. Un service hospitalier\nC. Une structure spécialisée d’appui au réseau des établissements de soins de santé\nprimaire\nD. Un centre de santé de deuxième niveau", "Concours de recrutement des infirmiers et techniciens de santé 1er grade\nRégion Casablanca-Settat\nSession de 05 Octobre 2025 Épreuve Commune\nCochez la ou les bonne(s) réponse(s) :\n1- Selon l'OMS, la santé est :\nA. Un état de complet bien-être physique, mental et social,\nB. Ne consiste pas seulement en une absence de maladie ou d'infirmité\nC. Consiste seulement en une absence de maladie ou d'infirmité\nD. L'un des droits fondamentaux de tout être humain,\n2- La santé communautaire :\nA. Est une approche locale des problèmes de santé d'une communauté\nB. Implique la participation active d'une communauté\nC. N'exige pas l'implication et la participation de la communauté pour sa propre santé\nD. Est une approche nationale des problèmes de santé d'une nation\n3- Parmi les fonctions d'un système de santé :\nA. La Prestation de service ;\nB. La production des ressources humaines ;\nC. L'Information ;\nD. Le financement ;\n4- Parmi les attributions de l'administration centrale :\nA. L'élaboration des plans nationaux sanitaires\nB. Les contrôles des qualités des produits agro-alimentaires.\nC. La réglementation du développement du personnel y compris la formation\nD. La réglementation des organismes prestataires de soins du secteur privé.\n5- Parmi les instances de concertation et d'appui d'un hôpital :\nA. Le comité de lutte contre les infections respiratoires\nB. Le comité de suivi et d'évaluation\nC. Le comité d'établissement\nD. Le comité de gestion des ressources humaines\n6- Parmi les territoires sanitaires, on trouve :\nA. Les préfectures et provinces sanitaires\nB. Les régions sanitaires\nC. La commune sanitaire", "D. La circonscription sanitaire\n7- S'agissant de la surveillance des maladies transmissibles :\nA. La déclaration des maladies listées est obligatoire pour les professionnels de santé.\nB. Les établissements publics et privés sont tenus de notifier selon les modalités fixées.\nC. La déclaration des cas est facultative et laissée à l'appréciation de chaque structure.\nD. La notification s'effectue selon des formulaires et des circuits définis par l'autorité\nsanitaire.\n8- Parmi les missions suivantes attribuées à la Haute Autorité de Santé :\nA. L'encadrement technique de l'assurance maladie\nB. Le partenariat public-privé\nC. L'accréditation des établissements de santé\nD. Le suivi, l'analyse et l'évaluation des données épidémiologiques\n9- Parmi les Directions de l'administration Centrale du Ministère de la Santé et de la\nprotection sociale, on trouve :\nA. La direction des Ressources Humaines\nB. La direction des Oeuvres Sociales\nC. La direction de l'Epidémiologie et de lutte contre les Maladies\nD. La direction de la Planification et des ressources financières\n10- L'hôpital est organisé en :\nA. 2 pôles ;\nB. 3 pôles ;\nC. 4 pôles ;\nD. 5 pôles\n11- La promotion de la santé repose sur :\nA. Une approche médicale\nB. Une approche comportementale\nC. Une approche sociale et économique\nD. Une approche épidémiologique\n12- Parmi les structures d'appui du réseau hospitalier, on retrouve :\nA. Les laboratoires de l'institut national d'hygiène\nB. Le centre national antipoison et de pharmacovigilance\nC. L'observatoire régional de la santé\nD. Le Bureau municipal d'hygiène", "13- Selon la constitution marocaine de 2011, quel article garantit aux citoyens le droit\nd'accès aux soins de santé et à la protection sociale :\nA. 29\nB. 30\nC. 31\nD. 32\n14- Les domaines de compétence du ministère de la santé ont été élargis pour inclure la\nprotection sociale en :\nA. 2019\nB. 2020\nC. 2021\nD. 2022\n15- Dans le cadre de la refonte du système national de santé, la gestion de l'hôpital\npublic sera assurée par :\nA. Le directeur général du groupement sanitaire territorial\nB. Le directeur régional de la santé et de la protection sociale\nC. Le médecin chef du pôle des affaires médicales\nD. Toutes les réponses sont fausses.\n16- L'institution responsable de la régulation du secteur des médicaments et des\nproduits de santé est :\nA. L'Agence marocaine de régulation des médicaments et des produits de santé\nB. La Direction des médicaments et de la pharmacie\nC. L'Agence marocaine des médicaments et des produits de santé\nD. Toutes les réponses sont fausses\n17- Le budget de l'état alloué à la santé au Maroc en 2023 est de :\nA. 6,4%\nB. 7,4%\nC. 8,4%\nD. 9,4%\n18- Concernant la surveillance épidémiologique :\nA. La surveillance s'appuie sur le dispositif des maladies à déclaration obligatoire.\nB. Des bulletins épidémiologiques officiels assurent le suivi des indicateurs de santé\npublique.\nC. La surveillance repose sur des sources non officielles qui ne nécessitent pas de\nvalidation.\nD. Les définitions de cas sont harmonisées au niveau national par l'autorité sanitaire\ncompétente.", "19- La Direction Régionale de Santé et de la protection sociale est composée de :\nA. Le service de santé reproductive\nB. Le service des ressources humaines et de contentieux\nC. Le service de l'offre de soins\nD. L'observatoire régional de la santé\n20- L'Agence marocaine du sang est chargée de :\nA. Assurer l'autosuffisance nationale en sang et en produits sanguins.\nB. Garantir la qualité et la sécurité transfusionnelle sur l'ensemble du territoire.\nC. Commercialiser le sang à l'étranger comme mission principale du dispositif\ntransfusionnel.\nD. Coordonner le réseau transfusionnel comprenant les centres régionaux et les banques\nhospitalières de sang.\n21- Parmi les principes de sécurité transfusionnelle :\nA. Le don de sang repose sur le volontariat et l'anonymat des donneurs.\nB. Des dépistages biologiques systématiques et la traçabilité sont mis en oeuvre avant la\ndélivrance des produits sanguins.\nC. La rémunération des donneurs de sang constitue un principe général du dispositif\nnational.\nD. Des actions de sensibilisation et de communication publiques visent à promouvoir le\ndon de sang régulier.\n22- Le taux de létalité permet d'estimer :\nA. Les décès parmi la population générale\nB. La gravité de la maladie\nC. Les décès des accidents de la circulation\nD. Les décès parmi les malades\n23- Parmi les dimensions de la qualité en santé, on retrouve :\nA. L'innocuité des soins\nB. La performance de système\nC. L'accessibilité aux soins\nD. Toutes les réponses sont fausses\n24- La loi-cadre 06-22 fixe :\nA. Les principes et les objectifs de la réforme du système national de santé.\nB. La territorialisation de l'offre de soins par la création de groupements sanitaires\nterritoriaux.\nC. L'abolition de la prévention au profit exclusif du curatif.\nD. Le rôle unique du secteur privé dans l'organisation du système national de santé.", "25- S'agissant du parcours de soins conformément à la loi 06-22 :\nA. L'offre de soins est organisée au niveau de chaque région conformément à la carte\nsanitaire régionale, dans le respect du parcours de soins.\nB. Dans le secteur public, le parcours commence par les établissements de soins de santé\nde base.\nC. Le patient doit obligatoirement passer par un établissement universitaire avant tout\nautre niveau de soins.\nD. Toutes les réponses sont fausses\n26- Les missions des établissements de santé comprennent :\nA. La prévention, le diagnostic, les soins et la réadaptation, avec ou sans hospitalisation.\nB. L'organisation d'un accueil adapté à l'état de santé, y compris en cas d'urgence.\nC. La limitation aux prestations nécessitant exclusivement une hospitalisation.\nD. L'orientation, le cas échéant, du patient vers l'établissement approprié.\n27- La durée et la mise à jour des cartes sanitaires régionales sont :\nA. Illimitées et ne peuvent jamais être révisées.\nB. Fixées pour une durée déterminée par les textes en vigueur\nC. Mises à jour en cas de changements dans les orientations de la carte nationale.\nD. Nécessairement établies pour une durée unique de dix ans.\n28- Quelle est la principale cause de la mortalité au Maroc :\nA. Les cancers\nB. Les maladies endocriniennes.\nC. Les maladies respiratoires.\nD. Les maladies cardiovasculaires.\n29- S'agissant des maladies à Déclaration Obligatoire (MDO) :\nA. L'obligation de déclarer certaines maladies transmissibles repose sur des textes en\nvigueur.\nB. La liste et les modalités ne peuvent jamais être modifiées avec le temps.\nC. Les modalités d'application et la liste des maladies sont fixées par un arrêté\nministériel.\nD. Les MDO s'appliquent uniquement aux structures du secteur public.\n30- Le centre de diagnostic et de traitement de maladies respiratoire :\nA. S'occupe de la prise en charge seulement des cas de la tuberculose\nB. S'occupe de la prise en charge seulement des cas de l'asthme\nC. Est considéré comme un appui des ESSP (Etablissements de Soins de Santé Primaire)\nD. S'occupe de la prise en charge des tuberculeux et des maladies respiratoires\n31- Les comptes nationaux de la santé :", "A. Représentent une source de données sur les dépenses en santé\nB. Sont un instrument pour l'évaluation du système de financement de la santé\nC. Permettent le recueil des données sur l'efficience hospitalière\nD. Aucune proposition n'est juste\n32- Les sources officielles de données sanitaires sont :\nA. Les rapports « Santé en chiffres ».\nB. Les Comptes nationaux de la santé.\nC. Les bulletins épidémiologiques.\nD. Les rapports non officiels d'associations.\n33- Les indicateurs démographiques utilisés en santé sont :\nA. Le taux brut de natalité et le taux brut de mortalité.\nB. La prévalence.\nC. L'espérance de vie.\nD. La mortalité maternelle et infantile.\n34- Concernant la gouvernance des groupements sanitaires territoriaux (GST)\nla(es)quelle(s) de ces propositions est (sont) correctes :\nA. Le conseil d'administration comprend des représentants de l'Etat conformément aux\ntextes d'application.\nB. Les collectivités territoriales sont représentées au sein des organes délibérants des\ngroupements.\nC. Seuls des usagers élus siègent au sein du conseil d'administration des groupements.\nD. Une direction générale est chargée de l'exécution des décisions des organes\ndélibérants.\n35- Parmi les propositions suivantes, identifiez les maladies à déclaration obligatoire au\nMaroc :\nA. Le paludisme ;\nB. La peste ;\nC. La tuberculose ;\nD. La Grippe due à un nouveau sous type de virus.\n36- Concernant la performance des GST :\nA. Toute évaluation indépendante des établissements de santé est exclue par principe.\nB. Les GST contribuent au dispositif d'amélioration continue de la qualité et de la\nsécurité des soins.\nC. Des indicateurs de performance territoriaux sont mis en place pour le suivi et\nl'évaluation.\nD. Les groupements rendent compte périodiquement des résultats et des actions menées.\n37- L'ANAM signifie :", "A. L'académie nationale de l'assurance maladie\nB. L'agence nationale de l'assurance maladie\nC. L'agence nationale de l'assurance médicale\nD. L'agence nationale de l'assurance marocaine\n38- L'action d'agir sur les causes et les facteurs de risque de maladies signifie :\nA. Prévention primordiale\nB. Prévention primaire\nC. Prévention secondaire\nD. Prévention tertiaire\n39- S'agissant du sys r un conseil d’administration.\nD. Administré par un directeur général.\n5- La loi cadre 09.21 définit la protection sociale comme :\nA. La protection contre les risques d’handicaps.\nB. La protection contre les risques de perte d’emploi.\nC. La protection contre les risques liés à l’enfance.\nD. L’octroi d’allocations forfaitaires aux familles non couvertes.", "6- Les maladies à déclaration obligatoire :\nA. Diabète.\nB. Botulisme.\nC. Listériose.\nD. Zika.\n7- La journée mondiale de lutte contre la tuberculose est :\nA. 24 mars.\nB. 07 avril.\nC. 21 mai.\nD. Toutes les réponses sont fausses.\n8- Le thème de la journée mondiale de la santé 2025 est :\nA. Une bonne santé à la naissance pour un avenir plein d’espoir.\nB. Notre planète, notre santé.\nC. Ma santé, mon droit.\nD. Toutes les réponses sont fausses.\n9- La journée mondiale des malades est organisée le :\nA. 11 janvier.\nB. 11 février.\nC. 11 mars.\nD. 11 avril.\n10- L’élaboration du SROS repose sur les principes suivants :\nA. Globalité.\nB. L’intégration.\nC. Fiabilité.\nD. Accessibilité.\n11- Dans le cadre du système national de santé, les structures de l’offre de soin des\nmutuelles relèvent du :\nA. Secteur privé.\nB. Secteur étatique.\nC. Secteur semi-public (privé à but non lucratif).\nD. Toutes les réponses sont fausses.\n12-Les types de prévention et ses classifications selon l’OMS :\nA. La prévention primaire vise à réduire l'incidence.\nB. La prévention primaire vise à réduire la prévalence.\nC. La prévention secondaire vise à réduire la propagation.\nD. La prévention tertiaire vise à réduire la prévalence.", "13-Les motifs de sortie d’un patient :\nA. Contre avis médical.\nB. Fin de traitement.\nC. Sortie volontaire.\n14- Fin de travail d’un fonctionnaire :\nA. Démission.\nB. Révocation.\nC. Licenciement.\nD. Retraite.\n15- Les missions du GST dans le domaine administratif.\n16- Les attributions des services de la direction régionale.\n17- Champs d’action de l’institut Pasteur au Maroc.\n18- Les on le vaccin)\n7- SIDA :\nA. Au Maroc, environ 0,8 % (selon les supports pédagogiques)\n8- Fonction publique :\nA. 30 jours de congés annuels ouvrables\nB. 22 jours de congés annuels non ouvrables\nC. 22 jours de congés annuels ouvrables\nD. 30 jours de congés annuels ouvrables\n9- PEH :\nA. Outil de planification\nB. Outil de management\nC. Projet des établissements hospitaliers\nD. Moyen de mobilisation des ressources\n10- Développement de la santé sexuelle et reproductive (OMS) :\nA. Lutte contre le VIH/SIDA\nB. Santé maternelle\nC. Ménopause et santé reproductive\n11- Accident d’exposition au sang :\nA. Lavage immédiat des mains à l’eau et au savon\nB. Information du médecin responsable pour évaluer le risque infectieux\nC. Déclaration comme accident de travail\n12- Prestations de l’hôpital de jour :\nA. Prestations hospitalières réalisées dans la journée sans hébergement\n13- Prévention primaire :\n• Vaccination\n• Hygiène\n14- Étude transversale :\nA. Mesure de la prévalence\n15- ODD 3 :\nA. Lutte contre le VIH et autres maladies\nB. Amélioration de la santé maternelle\nC. Réduction de la mortalité infantile\nD. Bien-être pour tous", "16- Objectifs de la HAS :\n• Encadrement technique de l’ANAM\n• Évaluation de la qualité des prestations\n• Accréditation des établissements de santé\n17- Dimensions de la qualité :\nA. Innocuité\nB. Accessibilité\nC. Bonne gouvernance\n18- Opération Riaya 2024/2025 :\nA. Zones touchées par la vague de froid\n19- MSPS – mobilisation générale :\nA. Rougeole\n20- Campagne de vérification vaccinale :\nA. Moins de 18 ans\n21- Déterminants socio-économiques (OMS) :\nA. Emploi\nB. Genre\nC. Environnement\nD. Mode de vie\n22- Vieillissement en bonne santé (OMS) :\nA. Adaptation des systèmes de santé aux besoins des personnes âgées\nB. Développement des soins spécifiques\nC. Création d’environnements favorables\nD. Amélioration de la surveillance et de l’évaluation\n23-Stratégie de financement de la santé :\nA. Renforcement du cadre réglementaire et du partenariat\nB. Mobilisation efficace des ressources\nC. Achat stratégique des services de santé", "D. Gouvernance du financement\n24- Politique nationale de santé de l’enfant 2030 :\nA. Droit à la santé pour les enfants de 0 à 18 ans\nB. Systèmes territoriaux intégrés multisectoriels\nC. Participation des enfants aux décisions\nD. Environnement sain", "Concours de recrutement des infirmiers et techniciens de santé 1er grade\nRégion Casablanca-Settat\nSession de 2024 Épreuve Commune\nCochez-la ou les bonne(s) réponse(s) :\n1- La carte sanitaire a pour objectif(s) :\nA. L'optimisation de l'utilisation des ressources par le système de soins ;\nB. La détermination du cadre le plus approprié pour le développement de différentes\ncomposantes de l'offre de soins ;\nC. La maitrise de l'organisation qualitative et quantitative de l'offre de soins ;\nD. La bonne gouvernance des établissements de soins.\n2- Parmi les maladies suivantes lesquelles sont ciblées par le programme national\nd'immunisation (PNI) :\nA. La rougeole ;\nB. La méningite à hémophiles influenza ;\nC. L'hépatite virale B ;\nD. La poliomyélite.\n3- Le taux de létalité permet d'estimer :\nA. Les décès parmi la population générale ;\nB. La gravité de la maladie ;\nC. Les décès des accidents de la circulation ;\nD. Les décès parmi les malades.\n4- Le taux de mortalité générale permet d'estimer :\nA. Les décès survenus chez la population adulte ;\nB. Les décès survenus chez la population malade ;\nC. Les décès survenus chez toute la population ;\nD. Les décès non déclarés.\n5- La surveillance épidémiologique est :\nA. Un programme de santé ;\nB. Une alerte en santé publique ;\nC. Un outil bio statistique ;\nD. Un dispositif de recueil d'informations d'ordre épidémiologique.\n6- L'objectif d'une étude épidémiologique peut être :", "A. De préciser la prévalence d'une situation de santé au sein d'une population donnée ;\nB. D'établir le lien entre un facteur d'exposition et un phénomène de santé ;\nC. D'évaluer l'efficacité d'un nouveau traitement par rapport à un autre ;\nD. D'identifier les facteurs de risque associés à la survenue d'une maladie.\n7- Selon la classification des niveaux de prévention définis par l'OMS :\nA. La prévention primaire a pour but de réduire l'incidence d'une maladie ;\nB. La prévention primaire a pour but de réduire la prévalence d'une maladie ;\nC. La prévention secondaire a pour but de réduire la prévalence d'une maladie ;\nD. La prévention tertiaire a pour but d'éviter la récidive d'une maladie ou d'en limiter les\ncomplications.\n8- Parmi les types d'enquêtes suivants lesquelles sont descriptives :\nA. Enquêtes cas-témoins ;\nB. Enquêtes de cohorte ;\nC. Enquêtes de prévalence ;\nD. Enquêtes d'incidence.\n9- Le taux d'incidence :\nA. Est un indicateur dynamique ;\nB. Tient compte de la vitesse de survenue de la maladie ;\nC. Prend en compte les anciens et les nouveaux cas de la maladie ;\nD. Ne prend en compte que les anciens cas de la maladie.\n10- Parmi les dimensions de la qualité en santé on retrouve :\nA. L'innocuité des soins ;\nB. La performance du système ;\nC. L'accessibilité aux soins ;\nD. La réactivité et l'empathie.\n11- Parmi les déterminants de la santé on retrouve :\nA. Le mode de vie ;\nB. L'environnement ;\nC. L'organisation des soins ;\nD. La technologie médicale.\n12- La santé communautaire :\nA. Fait partie intégrante de la santé publique ;\nB. Peut-être populationnelle et individuelle ;\nC. Est liée à un ensemble de facteurs démographiques géographiques et sociaux ;\nD. Toutes les propositions sont fausses.\n13- Parmi ces indicateurs, quels sont ceux en rapport avec l'activité hospitalière :", "A. Taux d'occupation moyenne ;\nB. Nombre de malades dialysés ;\nC. Nombre de décès extrahospitaliers ;\nD. Durée moyenne de séjour.\n14- Parmi les fonctions d'une Direction Régionale de Santé, on trouve :\nA. Protection de la santé publique et veille sanitaire\nB. Planification stratégique ;\nC. Pilotage et coordination de l'offre de soins ;\nD. Contractualisation avec les délégations de santé.\n15- L'hôpital constitue un élément intégré dans le système national de santé, il assure :\nA. L'appui aux soins de santé de base ;\nB. L'assistance médicosociale ;\nC. L'enseignement et la formation ;\nD. La recherche et l'expertise.\n16- Le réseau des établissements de soins de santé primaires (RESSP) est appuyé par :\nA. Le centre de diagnostic et de traitement des maladies respiratoires ;\nB. Les centres de consultations spécialisées ;\nC. Les centres d'addictologie ;\nD. Les laboratoires de santé publique.\n17- L'action d'agir sur les causes et les facteurs de risque de maladies signifie :\nA. Prévention primordiale ;\nB. Prévention primaire ;\nC. Prévention secondaire ;\nD. Prévention tertiaire.\n18- La promotion de la santé repose sur :\nA. Une approche médicale ;\nB. Une approche comportementale ;\nC. Une approche sociale et économique ;\nD. Une approche épidémiologique.\n19- Parmi les attributions de la Direction de l'épidémiologie et de la lutte contre les\nmaladies :\nA. Surveillance épidémiologique de la population et tenue du fichier épidémiologique\ncentral ;\nB. Etablissement et mise à jour de la liste des médicaments essentiels ;\nC. Affectation, recrutements, administration et gestion des affaires du personnel et\npromotion des actions d'oeuvres sociales ;\nD. Recherche et proposition des projets d'infrastructure liés à la carte sanitaire.", "20- Sont des domaines de compétence du Groupement Sanitaire Territorial (missions) :\nA. Offre de soins ;\nB. Financement de santé au niveau territorial ;\nC. Recherche, expertise et innovation ;\nD. Formation.\n21- Conformément à la loi cadre n°06-22, l'action de l'Etat dans le domaine de la santé\ntend à :\nA. Garantir une répartition équilibrée et équitable de l'offre de soins ;\nB. Asseoir la territorialisation de l'offre de soins dans le secteur public ;\nC. Digitaliser le système de santé ;\nD. Aucune proposition n'est just
