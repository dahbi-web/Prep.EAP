<script>const DATA=["Concours Recrutement\n2026\nD\nPREPARE MON CONCOURS\nConCours 08\nRegion Marrakech 2024 - Commun\n06 16 03 08 31 s l i t - a n a s s\nANASS SLIT- INFIRMIER POLYVALENT\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "1/ Parmi les piliers de la refonte du système national de santé marocain, on cite :\nA/ La généralisation de la protection sociale\nB/ L'adoption d'une bonne gouvernance\nC/ La digitalisation du système national de santé\nD/ La valorisation de l'offre de soins\n2/ Selon la loi-cadre 06.22 relative au système national de santé, il est instauré un système\nd'information sanitaire national intégré, qui collecte et traite toutes les données relatives :\nA/ Aux établissements de santé publics, à leurs activités et à l'évaluation de la dimension et de la\nqualité des soins\nB/ Aux établissements de santé privée, à leurs activités et à l’évaluation de la dimension et de la\nqualité des soins\nC/ Aux établissements de santé publics et privés, à leurs activités et à l'évaluation de la\ndimension et de la qualité des soins\nD/ Aucune réponse n'est juste\n3/ Les missions d'un hôpital :\nA/ Mission de soins\nB/ Mission de santé publique\nC/ Mission économique et managériale\nD/ Mission stratégique\n4/ L'hôpital est dirigé par un médecin chef ou un infirmier cadre, nommé par le ministre de\nsanté après avis du directeur régional de la santé, il est aidé dans ces fonctions par :\nA/ 03 pôles de gestion, 06 instances de planification, de coordination de concertation et d'appui\net 02 services\nB/ 03 pôles de gestion, 08 instances de planification, de coordination de concertation et d'appui\net 02 services\nC/ 02 pôles de gestion, 03 instances de planification, de coordination de concertation et d'appui\net 04 services\nD/ Aucune réponse n'est juste\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "5/ Les urgences médico-hospitalières spécialisées sont assurées par :\nA/ Le service d'assistance médicale urgente\nB/ Le service mobile d'urgence et de réanimation médicale\nC/ L'hôpital régional\nD/ L'hôpital interrégional\n6/ Le territoire de santé interrégional correspondant au bassin de desserte :\nA/ D'une infrastructure\nB/ D'un équipement\nC/ Du territoire d'un CHU\nD/ D'une installation de haute technologie\n7/ Les fonctions d'un système de santé selon l’OMS :\nA/ Prestation de services de santé\nB/ Personnel de santé\nC/ Système de formation\nD/ Technologies de communication et d'information\n8/ Selon la loi-cadre 06.22, Quelle(s) est[sont) la(les) proposition(s) qui est (sont) correcte(s)\n:\nA/ Le système national de santé est l'ensemble des institutions, des organisations, des actions et\ndes ressources humaines y affectées intervenant dans le domaine de la protection sociale, aussi\nbien dans le secteur public que dans le secteur privé, aux niveaux national et régional et qui sont\norganisés pour la réalisation des objectifs du millénium de la santé\nB/ Le système national e santé est ensemble des institutions, des organisations, des actions et des\nressources y affectées intervenant dans le domaine de la protection de la santé, aussi bien dans le\nsecteur public que dans le secteur privé, aux niveaux national et régional et qui sont organisés\npour la réalisation des objectifs de la sante\nC/ L'offre de soins comporte, l'ensemble des infrastructures sanitaires relevant des secteurs\npublics et toutes autres installations de santé, ainsi que les moyens mis en œuvre pour la\nfourniture des soins et des prestations de santé\nD/ L'offre de soins comporte, outre les ressources humaines, l’ensemble des infrastructures\nsanitaires relevant des secteurs public et privé et toutes autres installations de santé, fixes ou\nmobiles, ainsi que les moyens mis en œuvre pour la fourniture des soins et des prestations de\nsanté\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "9/ La mise en œuvre des principes du système de santé incombe principalement :\nA/ A I ’Etat\nB/ Au M.S\nC/ Au conseil de 1'ordre des médecins\nD/ Aux organismes de prévoyance sociale\n10/ Selon la loi-cadre 06.22, parmi les objectifs suivants en matière de santé, l'Etat œuvre à\n:\nA/ Asseoir la territorialisation de l'offre de soins dans le secteur public et améliorer sa\ngouvernance à travers la création des agences sanitaires territoriales\nB/ Développer et perfectionner les moyens de détection et de prévention contre le cancer\nC/ Garantir une répartition équilibrée et équitable de l'offre de soins sur l’ensemble du territoire\nnational\nD/ Valoriser et mettre à niveau les ressources humaines travaillant dans le domaine de la santé à\ntravers la mise en place de partenariat, de coopération et de complémentarité entre les secteurs\npublic et privé\n11/ L'organisation de soins doit intégrer la dimension territoriale pour :\nA/ Répondre à une approche ascendante\nB/ Répondre à une approche descendante\nC/ Profiter des opportunités de collaboration intersectorielle\nD/ Faciliter la responsabilité territoriale et politique en matière de santé\n12/ Parmi les principes régissant l'offre de soins, on trouve :\nA/ La solidarité et la responsabilisation de la population\nB/ L'égalité d'accès aux soins t services de sante\nC/ L'équité dans la répartition spatiale des ressources sanitaires\nD/ La complémentarité intersectorielle\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "13/ Selon la loi cadre 06.22, s'agissant de l'offre de soins :\nA/ Le parcours de soins commence par le passage par les établissements de soins de santé de\nbase, en ce qui concerne le secteur public, ou par un médecin généraliste pour le secteur privé et\nce, conformément aux modalités fixées par voie réglementaire\nB/ Elle est organisée au niveau de chaque région, conformément au schéma régional de l'offre de\nsoins, dans le respect de la filière des soins\nC/ L'Etat prend les mesures nécessaires pour assurer une répartition équilibrée et équitable de\nl'offre de soins sur l'ensemble du territoire régional en fonction des particularités de la carte\nsanitaire\nD/ Le secteur public et le secteur privé à but lucratif, sont organisés de manière synergique afin\nde répondre avec efficacité aux besoins de santé par une offre de soins et de prestations\ncomplémentaires, intégrées et cohérentes\n14/ Selon la loi cadre 06.22, parmi les principes sur lesquels se base le SNS, on trouve :\nA/ La mutualisation et la solidarisation des frais médicaux\nB/ L'équité et l'équilibre dans la répartition spéciale des ressources humaines sur l'ensemble du\nterritoire national\nC/ La gestion basée sur les objectifs et la corrélation entre la responsabilité et la reddition des\ncomptes\nD/ L'égalité d'accès aux soins et aux prestations de santé et la continuité des prestations de santé\n15/ Selon la loi 06.22, L'organisation et la gestion des établissements de santé doivent obéir\naux principes, normes et règles, dont :\nA/ Les droits fondamentaux des personnes handicapées\nB/ Les normes de sécurité des usagers et des personnes qui y travaillent\nC/ Les règles de déontologie applicables à la médecine\nD/ Les règles d'hygiène et de salubrité et de bonne pratique clinique\n16/ L'offre de soins dans le secteur privé est composée de :\nA/ Cabinets de médecine dentaire\nB/ Clinique de jour\nC/ Hôpitaux de proximité\nD/ Espace Santé de jeunes\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "17/ Selon le Rapport Santé en chiffres 2021, Le taux de mortalité maternelle au Maroc est\nde :\nA/ 72,6/100000 NV\nB/ 112/100000 NV\nE/ 148/100000 NV\nD/ 110/100000 NV\n18/ Selon le Rapport Santé en chiffres 2021, l'indice synthétique de fécondité au Maroc est\nde :\nA/ 2,83 enfants par femme\nB/ 2,38 enfants par femme\nC/ 3,38 enfants par femme\nD/ 3,83 enfants par femme\n19/ Selon la loi 06.22, concernant les établissements de santé :\nA/ Les établissements de santé sont les divers établissements publics, organisés dans le but de\ncontribuer à l'offre de soin\nB/ Les établissements de santé assurent, chacun selon son objet, des prestations de prévention, de\ndiagnostic, de soins et de réadaptation, que ces prestations nécessitent ou non une hospitalisation\nau sein de l'établissement\nC/ Chaque établissement de santé est organisé pour assurer aux patients les conditions de sécurité\nsanitaire optimales possibles, et les accueillir dans des conditions adaptées état de santé, y\ncompris en cas d'urgence, et les diriger, le cas échéant, vers l'établissement de santé approprié\nD/ L'organisation et la gestion des établissements de santé relevant du secteur public, sont\nsoumises aux dispositions législatives et réglementaires relatives à l'exercice de la médecine et\ndes autres professions de santé\n20/ Selon le Rapport Santé en chiffres 2021, l'espérance de vie à la naissance au Maroc est\nde :\nA/ 65,6 ans\nB/ 72,6 ans\nC/ 76,6 ans\nD/ 78,6 ans\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "21/ Parmi les indicateurs de production hospitaliers, on cite :\nA/ Le Taux d'Occupation Global\nB/ La Durée Moyenne de Séjour\nC/ Le Taux de Rotation\nD/ L'Indice de Rotation\n22/ Selon le Rapport Santé en chiffres 2021, parmi les indicateurs de production des\nhôpitaux publics, cocher celui(ceux) qui est(sont) correct(s) :\nA/ Capacité Litière Fonctionnelle est de 20364\nB/ TOM est de 95,7%%\nC/ DMS est de 3,4 jours\nD/ TROT est de 46,1\n23/ Dans le système de l'offre de soins au Maroc, les structures d'appui sont constituées de :\nA/ Laboratoire de Santé public\nB/ Centre de diagnostic et de traitement des maladies respiratoires\nC/ Centre national et centres régionaux de transfusion sanguine et d'hématologie\nD/ Centre national de radioprotection\n24/Le centre de santé urbain de 2ème niveau est implanté au chef-lieu d'une commune\nd'une population environ de :\nA/ 7000 habitants\nB/ 25000 habitants\nC/ 45000 habitants\nD/ 50000 habitants\n25/ La durée moyenne de séjour (DMS) se définit par :\nA/ Nombre total d'hospitalisation/Le nombre total d'entrées\nB/ (Nombre total d'hospitalisation/Le nombre total d'entrées) x 1000\nC/ (Nombre total d'admission/Le nombre total d'entrées) x 1000\nD/ Aucune réponse n'est juste\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "26/ Le panier de soins d'un hôpital régional comporte :\nA/ 25 spécialités\nB/ 26 spécialités\nC/ 27 spécialités\nD/ 28 spécialités\n27/ Le panier de soins d'un centre hospitalier interrégional comporte :\nA/ 39 spécialités\nB/ 40 spécialités\nC/ 54 spécialités\nD/ 45 spécialités\n28/ La circonscription sanitaire :\nA/ Représente le territoire de base dans le découpage sanitaire\nB/ Peut-être découpée en deux ou plusieurs secteurs de santé\nC/ Correspond L'aire de desserte d'un centre de santé\nD/ Peut-être rurale ou urbaine\n29/ Selon la réglementation en vigueur, la Carte Sanitaire prévoit des sous-territoires\nsanitaires fonctionnels dont on cite :\nA/ Secteur sanitaire\nB/ Bassin de desserte du DR\nC/ Bassin de desserte d'un hôpital de proximité\nD/ Bassin de desserte d'un équipement lourd ou de haute technologie\n30/ Selon la réglementation en vigueur, la création et l'implantation des infrastructures et\ndes installations publiques relevant du RESSP doivent répondre aux critères suivants :\nA/ Un centre de santé rural de premier niveau pour une population minimale de desserte de\n10.000 habitants\nB/ Un centre de santé rural de deuxième niveau pour une population minimale de desserte de\n25.000 habitants\nC/ Un centre de santé urbain de premier niveau pour une population minimale de desserte de\n50.000 habitants\nD/ Un centre de santé urbain de deuxième niveau pour une population minimale de desserte de\n50.000 habitants\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "31/ Les établissements relevant du réseau hospitalier sont organisés en :\nA/ Hôpitaux de proximités\nB/ Centres hospitaliers provinciaux ou préfectoraux\nC/ Hôpitaux locaux\nD/ Centres hospitaliers inter-régionaux\nQ32- Les établissements médicaux sociaux publics sont :\nA/ Des établissements qui assurent la prise en charge médicale et chirurgicale avec\naccompagnement social des malades\nB/ Des établissements qui assurent la prise en charge médicale avec accompagnement social des\npersonnes à besoins spécifiques\nC/ Des établissements qui assurent la prise en charge médicale avec accompagnement social des\npersonnes en fin de vie\nD/ Des établissements qui assurent une prise en charge médicalisée des personnes âgées\n33- Parmi les propositions suivantes en rapport avec le domaine de l’épidémiologie,\nQuelle(s) est(sont) celle(s) qui est(sont) correcte(s) :\nA/ L'épidémiologie est 'étude de la distribution des phénomènes de santé dans la population ainsi\nque leurs déterminants\nB/ L'épidémiologie descriptive s’intéresse à l'étude des facteurs de risques ou de protection qui\nfavorisent ou provoquent les phénomènes de santé\nC/ L'incidence c'est le nombre de nouveaux cas survenus dans une population durant un\nintervalle de temps donné.\nD/ La prévalence d'une maladie c'est la fréquence des cas d'une maladie dans une population\ndont sont issus ces cas à un moment donné\n34/ Concernant les Groupements Sanitaires Territoriaux (GST) :\nA/ Ils sont régis par la loi 08.22, publiée en Août 2022\nB/ Ce sont des établissements publics dotés de la personnalité physique et morale\nC/ Ils sont composés des établissements sanitaires relevant du secteur public et privé\nD/ Toutes les propositions sont fausses\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "35/ Parmi les orientations stratégiques de la mise en place des GST, on cite :\nA/ Réponse au nouveau modèle de gestion axée sur les résultats\nB/ Mise en œuvre de l'article 32 de la loi-cadre 06.22 relative au SNS\nC/ Instauration de la territorialisation de l'offre de soins dans le secteur privé et améliorer le\nrendement des ressources\nD/ Régulation de l'offre publique en termes de soins au niveau régional\n36/ Selon la loi 08.22, parmi les missions ou les champs d'intervention des GST, on cite :\nA/ La santé publique\nB/ L'offre de soins en santé publique\nC/ Le soin\nD/ La recherche, l’expertise et l'innovation\nQ37- Selon la loi 08.22, parmi les missions relatives au domaine de l'offre de soins des GST,\non cite :\nA/ Elaboration de la carte régionale de l'offre de soins\nB/ Elaboration de la carte sanitaire régionale\nC/ Élaboration du programme médical d'urgence\nD/ Organisation de la filière de soins et le réseau coordonnés de soins\n38/ Selon la loi 08.22, les missions relatives au domaine de la santé publique des GST :\nA/ Promotion de la santé, prévention et sécurité sanitaire\nB/ Elaboration de la carte sanitaire régionale\nC/ Organisation et contrôle médical des urgences hospitalières\nD/ Education sanitaire et éducation thérapeutique\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31", "39/ Selon la réglementation en vigueur, l'offre de soins est répartie sur le territoire national\n:\nA/ En territoires sanitaires qui constituent des bassins de desserte de la population desservie par\nun ou plusieurs directions régionales ou délégation de santé\nB/ En se basant sur la division administrative du royaume uniquement, en vue d'arrêter les\nterritoires les plus pertinents pour l'action sanitaire\nC/ En fonction du bassin de desserte de la population, de ses caractéristiques épidémiologiques,\ngéographiques, démographiques, socio-économiques et administratives\nD/ Les territoires de santé sont au nombre de 6\n40/ Parmi les propositions suivantes relatives aux déterminants de la santé selon I'OMS,\nquelle(s) est(sont) celle(s) qui est(sont) fausse(s) ?\nA/ Les déterminants de la santé selon l’OMS sont \"ensemble des facteurs sociaux e\nenvironnementaux qui déterminent l‘état de santé des individus ou des populations\nB/ Les déterminants de la santé selon l'OMS sont l'ensemble des facteurs personnels, sociaux\néconomiques et environnementaux qui déterminent |'état de santé des individus ou des\npopulations\nC/ L'état de santé 'une population est le résultat dynamique de l’interaction de quatre grandes\ncatégories de facteurs biologiques, les habitudes de vie, les conditions environnementales, et\nl’organisation du système de soins\nD/ Les déterminants sociaux de la santé sont les circonstances dans lesquelles les individus\nnaissent, grandissent, vivent, travaillent et vieillissent ainsi que les systèmes mis en place pour\nfaire face à la maladie\nANASS SLIT - INFIRMIER POLYVALENT – 06 16 03 08 31"];const root=document.getElementById('pages'),q=document.getElementById('q'),count=document.getElementById('count');
function draw(){const term=q.value.trim().toLocaleLowerCase();let visible=0;root.innerHTML=DATA.map((text,i)=>{const hit=!term||text.toLocaleLowerCase().includes(term);if(hit)visible++;return `<section class="page ${hit?'':'hidden'}"><div class="page-head"><span>Page ${i+1}</span><span>${term&&hit?'Correspondance trouvée':''}</span></div><div class="text">${text?esc(text):'<span class="empty">Cette page est une image sans texte extractible. Ouvrir le PDF original pour la consulter.</span>'}</div></section>`}).join('');count.textContent=(term?visible+' page(s) trouvée(s) · ':'')+DATA.length+' page(s)';}
