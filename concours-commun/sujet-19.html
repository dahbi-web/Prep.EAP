<script>const DATA=["Qcm marrakech 2024\nQCM — Système national de santé / Loi-cadre 06.22 / GST\nCochez la ou les bonnes réponses\n1. Parmi les piliers de la refonte du système national de santé marocain, on cite :\nA. La généralisation de la protection sociale\nB. L’adoption d’une bonne gouvernance\nC. La digitalisation du système national de santé\nD. La valorisation de l’offre de soins\n2. Selon la loi-cadre 06.22 relative au système national de santé, il est instauré un système d’information\nsanitaire national intégré, qui collecte et traite toutes les données relatives :\nA. Aux établissements de santé publics, à leurs activités et à l’évaluation de la dimension et de la qualité des soins\nB. Aux établissements de santé privés, à leurs activités et à l’évaluation de la dimension et de la qualité des soins\nC. Aux établissements de santé publics et privés, à leurs activités et à l’évaluation de la dimension et de la qualité\ndes soins\nD. Aucune réponse n’est juste\n3. Les missions d’un hôpital :\nA. Mission de soins\nB. Mission de santé publique\nC. Mission économique et managériale\nD. Mission stratégique\n4. L’hôpital est dirigé par un médecin chef ou un infirmier cadre, nommé par le ministre de santé après avis\ndu directeur régional de la santé. Il est aidé dans ses fonctions par :\nA. 03 pôles de gestion, 06 instances de planification, de coordination, de concertation et d’appui et 02 services\nB. 03 pôles de gestion, 08 instances de planification, de coordination, de concertation et d’appui et 02 services\nC. 02 pôles de gestion, 03 instances de planification, de coordination, de concertation et d’appui et 04 services\nD. Aucune réponse n’est juste\n5. Les urgences médico-hospitalières spécialisées sont assurées par :\nA. Le service d’assistance médicale urgente\nB. Le service mobile d’urgence et de réanimation médicale\nC. L’hôpital régional\nD. L’hôpital interrégional\n6. Le territoire de santé interrégional correspondant au bassin de desserte :\nA. D’une infrastructure\nB. D’un équipement\nC. Du territoire d’un CHU\nD. D’une installation de haute technologie\n7. Les fonctions d’un système de santé selon l’OMS :\nA. Prestation de services de santé\nB. Personnel de santé\nC. Système de formation\nD. Technologies de communication et d’information\n8. Selon la loi-cadre 06.22, quelle(s) est/sont la/les proposition(s) correcte(s) :", "A. Le système national de santé est l’ensemble des institutions, des organisations, des actions et des ressources\nhumaines y affectées intervenant dans le domaine de la protection sociale, aussi bien dans le secteur public\nque dans le secteur privé, aux niveaux national et régional et qui sont organisés pour la réalisation des\nobjectifs du relèvement de la santé.\nB. Le système national de santé est l’ensemble des institutions, des organisations, des actions et des ressources\ny affectées intervenant dans le domaine de la protection de la santé, aussi bien dans le secteur public que\ndans le secteur privé, aux niveaux national et régional et qui sont organisés pour la réalisation des objectifs de\nla santé.\nC. L’offre de soins comporte l’ensemble des infrastructures sanitaires relevant des secteurs publics et toutes\nautres installations de santé, ainsi que les moyens mis en œuvre pour la fourniture des soins et des prestations\nde santé.\nD. L’offre de soins comporte, outre les ressources humaines, l’ensemble des infrastructures sanitaires relevant\ndes secteurs public et privé et toutes autres installations de santé, fixes ou mobiles, ainsi que les moyens mis\nen œuvre pour la fourniture des soins et des prestations de santé.\n9. La mise en œuvre des principes du système de santé incombe principalement :\nA. À l’État\nB. Au M.S\nC. Au conseil de l’ordre des médecins\nD. Aux organismes de prévoyance sociale\n10. Selon la loi-cadre 06.22, parmi les objectifs suivants en matière de santé, l’État œuvre à :\nA. Assurer la territorialisation de l’offre de soins dans le secteur public et améliorer sa gouvernance à travers la\ncréation des agences sanitaires territoriales.\nB. Développer et perfectionner les moyens de détection et de prévention contre le cancer.\nC. Garantir une répartition équilibrée et équitable de l’offre de soins sur l’ensemble du territoire national.\nD. Valoriser et mettre à niveau les ressources humaines travaillant dans le domaine de la santé à travers la mise\nen place de partenariat, de coopération et de complémentarité entre les secteurs public et privé.\n11. L’organisation de soins doit intégrer la dimension territoriale pour :\nA. Répondre à une approche ascendante.\nB. Répondre à une approche descendante.\nC. Profiter des opportunités de collaboration intersectorielle.\nD. Faciliter la responsabilité territoriale et politique en matière de santé.\n12. Parmi les principes régissant l’offre de soins, on trouve :\nA. La solidarité et la responsabilisation de la population.\nB. L’égalité d’accès aux soins et services de santé.\nC. L’équité dans la répartition spatiale des ressources sanitaires.\nD. La complémentarité intersectorielle.\n13. Selon la loi-cadre 06.22, s’agissant de l’offre de soins :\nA. Le parcours de soins commence par le passage par les établissements de soins de santé de base, en ce qui\nconcerne le secteur public, ou par un médecin généraliste pour le secteur privé et ce, conformément aux\nmodalités fixées par voie réglementaire.\nB. Elle est organisée au niveau de chaque région, conformément au schéma régional de l’offre de soins, dans le\nrespect de la filière des soins.\nC. L’État prend les mesures nécessaires pour assurer une répartition équilibrée et équitable de l’offre de soins sur\nl’ensemble du territoire régional en fonction des particularités de la carte sanitaire.\nD. Le secteur public et le secteur privé à but lucratif sont organisés de manière synergique afin de répondre avec\nefficacité aux besoins de santé par une offre de soins et de prestations complémentaires, intégrées et\ncohérentes.\n14. Selon la loi-cadre 06.22, parmi les principes sur lesquels se base le SNS, on trouve :", "A. La mutualisation et la solidarisation des frais médicaux\nB. L’équité et l’équilibre dans la répartition spatiale des ressources humaines sur l’ensemble du territoire national\nC. La gestion basée sur les objectifs et la corrélation entre la responsabilité et la reddition des comptes\nD. L’égalité d’accès aux soins et aux prestations de santé et la continuité des prestations de santé\n15. Selon la loi 06.22, l’organisation et la gestion des établissements de santé doivent obéir aux principes,\nnormes et règles, dont :\nA. Les droits fondamentaux des personnes handicapées\nB. Les normes de sécurité des usagers et des personnes qui y travaillent\nC. Les règles de déontologie applicables à la médecine\nD. Les règles d’hygiène et de salubrité et de bonne pratique clinique\n16. L’offre de soins dans le secteur privé est composée de :\nA. Cabinets de médecine dentaire\nB. Clinique de jour\nC. Hôpitaux de proximité\nD. Espace « Santé de jeunes »\n17. Selon le Rapport Santé en chiffres 2021, le taux de mortalité maternelle au Maroc est de :\nA. 72,6/100000 NV\nB. 112/100000 NV\nC. 148/100000 NV\nD. 110/100000 NV\n18. Selon le Rapport Santé en chiffres 2021, l’indice synthétique de fécondité au Maroc est de :\nA. 2,83 enfants par femme\nB. 2,38 enfants par femme\nC. 3,38 enfants par femme\nD. 3,83 enfants par femme\n19. Selon la loi 06.22, concernant les établissements de santé :\nA. Les établissements de santé sont les divers établissements publics, organisés dans le but de contribuer à l’offre\nde soin\nB. Les établissements de santé assurent, chacun selon son objet, des prestations de prévention, de diagnostic, de\nsoins et de réadaptation, que ces prestations nécessitent ou non une hospitalisation au sein de l’établissement.\nC. Chaque établissement de santé est organisé pour assurer aux patients les conditions de sécurité sanitaire\noptimales possibles, et les accueillir dans des conditions adaptées à leur état de santé, y compris en cas\nd’urgence, et les diriger, le cas échéant, vers l’établissement de santé approprié.\nD. L’organisation et la gestion des établissements de santé relevant du secteur public, sont soumises aux\ndispositions législatives et réglementaires relatives à l’exercice de la médecine et des autres professions de\nsanté.\n20. Selon le Rapport Santé en chiffres 2021, l’espérance de vie à la naissance au Maroc est de :\nA. 65,6 ans\nB. 72,6 ans\nC. 76,6 ans\nD. 78,6 ans\n21. Parmi les indicateurs de production hospitaliers, on cite :\nA. Le Taux d’Occupation Global\nB. La Durée Moyenne de Séjour\nC. Le Taux de Rotation\nD. L’Indice de Rotation", "22. Selon le Rapport Santé en chiffres 2021, parmi les indicateurs de production des hôpitaux publics,\ncocher celui/ceux qui est/sont correct(s) :\nA. Capacité litière fonctionnelle est de 20364\nB. TOM est de 95,7%\nC. DMS est de 3,4 jours\nD. Trot est de 46,1\n23. Dans le système de l’offre de soins au Maroc, les structures d’appui sont constituées de :\nA. Laboratoire de Santé publique\nB. Centre de diagnostic et de traitement des maladies respiratoires\nC. Centre national et centres régionaux de transfusion sanguine et d’hématologie\nD. Centre national de radioprotection\n24. Le centre de santé urbain de 2ème niveau est implanté au chef-lieu d’une commune d’une population\nenviron de :\nA. 7000 habitants\nB. 25000 habitants\nC. 45000 habitants\nD. 50000 habitants\n25. La durée moyenne de séjour (DMS) se définit par :\nA. Nombre total de journées d’hospitalisation / le nombre total d’entrées\nB. (Nombre total d’hospitalisation / le nombre total d’entrées) × 1000\nC. (Nombre total d’admission / le nombre total d’entrées) × 1000\nD. Aucune réponse n’est juste\n26. Le panier de soins d’un hôpital régional comporte :\nA. 25 spécialités\nB. 26 spécialités\nC. 27 spécialités\nD. 28 spécialités\n27. Le panier de soins d’un centre hospitalier interrégional comporte :\nA. 39 spécialités\nB. 40 spécialités\nC. 54 spécialités\nD. 45 spécialités\n28. La circonscription sanitaire :\nA. Représente le territoire de base dans le découpage sanitaire\nB. Peut-être découpée en deux ou plusieurs secteurs de santé\nC. Correspond à l’aire de desserte d’un centre de santé\nD. Peut-être rurale ou urbaine\n29. Selon la réglementation en vigueur, la Carte Sanitaire prévoit des sous-territoires sanitaires fonctionnels\ndont on cite :\nA. Secteur sanitaire\nB. Bassin de desserte du DR\nC. Bassin de desserte d’un hôpital de proximité\nD. Bassin de desserte d’un équipement lourd ou de haute technologie\n30. Selon la réglementation en vigueur, la création et l’implantation des infrastructures et des installations\npubliques relevant du RESSP doivent répondre aux critères suivants :\nA. Un centre de santé rural de premier niveau pour une population minimale de desserte de 10 000 habitants", "B. Un centre de santé rural de deuxième niveau pour une population minimale de desserte de 25 000 habitants\nC. Un centre de santé urbain de premier niveau pour une population minimale de desserte de 50 000 habitants\nD. Un centre de santé urbain de deuxième niveau pour une population minimale de desserte de 50 000 habitants\n31. Les établissements relevant du réseau hospitalier sont organisés en :\nA. Hôpitaux de proximité\nB. Centres hospitaliers provinciaux ou préfectoraux\nC. Hôpitaux locaux\nD. Centres hospitaliers interrégionaux\n32. Les établissements médicaux sociaux publics sont :\nA. Des établissements qui assurent la prise en charge médicale et chirurgicale avec accompagnement social des\nmalades\nB. Des établissements qui assurent la prise en charge médicale avec accompagnement social des personnes à\nbesoins spécifiques\nC. Des établissements qui assurent la prise en charge médicale avec accompagnement social des personnes en\nfin de vie\nD. Des établissements qui assurent une prise en charge médicalisée des personnes âgées\n33. Parmi les propositions suivantes en rapport avec le domaine de l’épidémiologie, quelle(s) est/sont\ncelle(s) qui est/sont correcte(s) :\nA. L’épidémiologie est l’étude de la distribution des phénomènes de santé dans la population ainsi que leurs\ndéterminants\nB. L’épidémiologie descriptive s’intéresse à l’étude des facteurs de risque ou de protection qui favorisent ou\nprovoquent les phénomènes de santé\nC. L’incidence c’est le nombre de nouveaux cas survenus dans une population durant un intervalle de temps\ndonné.\nD. La prévalence d’une maladie c’est la fréquence des cas d’une maladie dans une population dont sont issus ces\ncas à un moment donné\n34. Concernant les Groupements Sanitaires Territoriaux (GST) :\nA. Ils sont régis par la loi 08.22, publiée en Août 2022\nB. Ce sont des établissements publics dotés de la personnalité physique et morale\nC. Ils sont composés des établissements sanitaires relevant du secteur public et privé\nD. Toutes les propositions sont fausses\n35. Parmi les orientations stratégiques de la mise en place des GST, on cite :\nA. Réponse au nouveau modèle de gestion axée sur les résultats\nB. Mise en œuvre de l’article 32 de la loi-cadre 06.22 relative au SNS\nC. Instauration de la territorialisation de l’offre de soins dans le secteur privé et améliorer le rendement des\nressources\nD. Régulation de l’offre publique en termes de soins au niveau régional\n36. Selon la loi 08.22, parmi les missions ou les champs d’intervention des GST, on cite :\nA. La santé publique\nB. L’offre de soins en santé publique\nC. Le soin\nD. La recherche, l’expertise et l’innovation\n37. Selon la loi 08.22, parmi les missions relatives au domaine de l’offre de soins des GST, on cite :\nA. Élaboration de la carte régionale de l’offre de soins\nB. Élaboration de la carte sanitaire régionale\nC. Élaboration du programme médical d’urgence\nD. Organisation de la filière de soins et le réseau coordonnés de soins", "38. Selon la loi 08.22, les missions relatives au domaine de la santé publique des GST :\nA. Promotion de la santé, prévention et sécurité sanitaire\nB. Élaboration de la carte sanitaire régionale\nC. Organisation et contrôle médical des urgences hospitalières\nD. Éducation sanitaire et éducation thérapeutique\n39. Selon la réglementation en vigueur, l’offre de soins est répartie sur le territoire national :\nA. En territoires sanitaires qui constituent des bassins de desserte de la population desservie par une ou plusieurs\ndirections régionales ou délégation de santé\nB. En se basant sur la division administrative du royaume uniquement, en vue d’arrêter les territoires les plus\npertinents pour l’action sanitaire\nC. En fonction du bassin de desserte de la population, de ses caractéristiques épidémiologiques, géographiques,\ndémographiques, socio-économiques et administratives\nD. Les territoires de santé sont au nombre de 6\n40. Parmi les propositions suivantes relatives aux déterminants de la santé selon l’OMS, quelle(s) est/sont\ncelle(s) qui est/sont fausse(s) ?\nA. Les déterminants de la santé selon l’OMS sont l’ensemble des facteurs sociaux et environnementaux qui\ndéterminent l’état de santé des individus ou des populations\nB. Les déterminants de la santé selon l’OMS sont l’ensemble des facteurs personnels, sociaux, économiques et\nenvironnementaux qui déterminent l’état de santé des individus ou des populations\nC. L’état de santé d’une population est le résultat dynamique de l’interaction de quatre grandes catégories de\nfacteurs biologiques, les habitudes de vie, les conditions environnementales, et l’organisation du système de\nsoins\nD. Les déterminants sociaux de la santé sont les circonstances dans lesquelles les individus naissent,\ngrandissent, vivent, travaillent et vieillissent ainsi que les systèmes mis en place pour faire face à la maladie\nNB : transcription réalisée à partir des photos fournies ; certains passages peu lisibles peuvent nécessiter une vérification avec\nl’original."];const root=document.getElementById('pages'),q=document.getElementById('q'),count=document.getElementById('count');
