<script>const DATA=["Concours de recrutement des infirmiers et techniciens de santé 1e grade\nSession du 20 Octobre 2024\nNum : 06 16 03 08 31 ANass SLit Infirmier polyvalent insta : ana-ss-sl\nPartie 1 : Commun\n1/ La loi-cadre n° 06.22 relative au national de santé est articulée autour des piliers\nsuivants :\nA/ La bonne gouvernance\nB/ La valorisation des ressources humaines\nC/ La mise à niveau l'offre sanitaire\nD/ La digitalisation\n2/ L'égal accès au droit de la protection sociale et à la couverture médicale est une\nresponsabilité :\nA/ De l'Etat\nB/ Du Ministère de la santé et de la protection sociale\nC/ Des établissements publics\nD/ Des collectivités territoriales\n3/ La haute autorité de santé est une institution considérée comme :\nA/ Opérationnelle\nB/ Stratégique\nC/ Intermédiaire\nD/ Aucune réponse n'est juste", "4/ La haute autorité de la santé a pour attributions :\nA/ L’encadrement technique de AMO de base et la mise en place des outils de gouvernance\nB/ L’évaluation de la qualité des services offerts par les établissements de santé du secteur\npublic et privé et les conditions de la prise en charge des patients\nC/ L'accréditation des établissements de santé du secteur public et privé en se basant sur des\nindicateurs, des normes et des référentiels nationaux fixé par elle\nD/ Le suivi, l'analyse et l'évaluation des données épidémiologiques\n5/ Dans la conception du « plan santé 2025 », une démarche participative a été adoptée\nen se basant sur les niveaux de référence suivants :\nA/ Les principes de la régionalisation avancée\nB/ Les hautes orientations royales\nC/ Les tendances sanitaires mondiales actuelles\nD/ Les engagements « sante » dans le programme gouvernemental 2016/2021\n6/ Concernant l’hôpital public, parmi les objectifs spécifiques des stratégies et plans\nd'action 2025 :\nA/ Améliorer l'accessibilité de l'hôpital public\nB/ Coordonner l'offre ambulatoire et l’offre hospitalière\nC/ Assurer la sécurité et la qualité des soins hospitaliers\nD/ Améliorer la gouvernance de l'hôpital public\n7/ L’infection est définie par :\nA/ L'invasion d'un ou plusieurs tissus par un micro-organisme avec réaction inflammatoire\navec ou sans symptômes\nB/ L'invasion d'un ou plusieurs tissus par un micro-organisme avec réaction inflammatoire et\nsymptômes\nC/ La présence d'un agent pathogène dans les tissus\nD/ L'aptitude d'un germe à se développer chez l'hôte et y sécréter des toxines\n8/ Une augmentation soudaine et inhabituelle de la fréquence d'une maladie est appelée :\nA/ Epidémie\nB/ Pandémie\nC/ Endémie\nD/ Sporadique", "9/ La prévention primaire sert à :\nA/ Réduire l'apparition de nouveaux cas d'une maladie\nB/ Réduire la durée d'une maladie\nC/ Réduire la prévalence des incapacités chroniques\nD/ Diminuer l’incidence d'une maladie\n10/ La grippe A-H1N1 :\nA/ Est une maladie pandémique\nB/ D’origine porcine, aviaire et humaine\nC/ D'origine porcine et humaine\nD/ D'origine porcine et aviaire\n11/ Parmi les premiers moyens de lutte contre l’infection nosocomiale on retrouve :\nA/ Stérilisation du Matériel\nB/ Désinfection du Matériel\nC/ Hygiène des locaux et évacuation correcte des déchets\nD/ Tenue complète et propre\n12/ La circonscription sanitaire est un outil législatif de :\nA/ Organisation des de services de soins\nB/ Organisation des établissements hospitaliers\nC/ L'organisation des établissements de soins primaires\nD/ L'organisation de l’offre de soins\n13/ Le régime d’assistance médicale soins de couvre les prestations médicalement requises\nsuivantes :\nA/ Les dispositifs médicaux et implants nécessaires aux différents actes médicaux et\nchirurgicaux\nB/ Les interventions de chirurgie plastique et esthétique\nC/ Les articles de prothèses et d'orthèses\nD/ Les actes de chirurgie réparatrice et d'orthopédie maxillo-faciale", "14/ La source principale de financement des activités du ministère de la santé et de la\nprotection sociale est représentée par :\nA/ Les ménages\nB/ Le budget de l'Etat\nC/ Les assurances et mutuelles\nD/ La coopération internationale\n15/ Lequel des établissements ne fait pas partie du réseau hospitalier :\nA/ Centre d'hémodialyse\nB/ Hôpital psychiatrique\nC/ Centre régional de rééducation\nD/ Centre régional d'oncologie\n16/ L'élaboration du SROS repose sur les principes suivants :\nA/ La globalité\nB/ L'intégration\nC/ La fiabilité\nD/ L'accessibilité\n17/ Les urgences médicales de proximité faisant partie du RISUM assurent les fonctions\nd’urgence suivantes :\nA/ Les gestes de réanimation\nB/ Les gestes de premier secours\nC/ La transfusion\nD/ Le diagnostic de détresse vitale\n18/ Lequel des pôles suivants ne fait pas partie des pôles de gestion d'un centre hospitalier\nA/ Pôle des affaires médicales\nB/ Pôle des affaires professionnelles\nC/ Pôle des affaires administratives\nD/ Pôle des affaires sociales", "19/ La carte sanitaire est un outil législatif de :\nA/ Organisation de l'offre de soins\nB/ Organisation des services de soins\nC/ L'organisation des établissements hospitaliers\nD/ L’organisation des établissements de soins primaires\n20/ La filière de soins est une organisation :\nA/ Verticale hiérarchisée de prise en charge des patients\nB/ Verticale non hiérarchisée de prise en charge des patients\nC/ Horizontale hiérarchisée de prise en charge des patients\nD/ Horizontale non hiérarchisée de prise en charge des patients\n21/ Quel niveau du réseau intégré des soins d’urgences médicales représentent les\nurgences médio-hospitaliers de base :\nA/ 1er niveau\nB/ 2ème niveau\nC/ 3ème niveau\nD/ 4ème niveau\n22/ Dans le découpage sanitaire national les territoires de santé sont :\nA/ Des structures centrales\nB/ Les circonscriptions sanitaires\nC/ Des préfectures et provinces sanitaires\nD/ Des régions sanitaires\n23/ Le médicament générique :\nA/ A la même composition en principe actif et qui a une forme pharmaceutique différente du\nmédicament de référence\nB/ A la même composition en principe actif et qui a la même forme pharmaceutique différente\ndu médicament de référence\nC/ Est de la même famille du médicament de référence\nD/ Dérivé du médicament de référence", "24/ La refonte du système nationale de santé repose sur :\nA/ La création d'un système d'information intégré\nB/ La mise en place d'une nouvelle gouvernance du système de santé\nC/ L'élargissement des structures d'appui\nD/ La formation les ressources humaines\n25/ Quel est le rôle des groupements sanitaires territoriaux ? :\nA La mise en œuvre de la politique de l'Etat dans le domaine de la santé au niveau national\nB/ La mise en œuvre de la politique de l'Etat dans le domaine de la santé au niveau régional\nC/ L’évaluation des politiques publiques dans le domaine de la santé\nD/ L’évaluation de la qualité des prestations des établissements de santé\n26/ La revalorisation des ressources humaine dans la loi 06.22 passe par :\nA/ La révision du statut de la fonction publique dans le domaine de la santé\nB/ La mise en place d'un système de formation\nC/ L'ouverture sur les compétences médicale étrangères\nD/ Toutes les réponses sont fausses\n27/ L’instauration d'une fonction publique sanitaire vise :\nA/ L’adoption d'un système salariale basé sur l’accomplissement des taches professionnelles\nB/ La motivation des compétences médicales Marocaines résidentes à l'étranger\nC/ L’ouverture sur les compétences médicales étrangères\nD/ Toutes les réponses sont justes\n28/ En vue de favoriser la répartition équitable de l’offre de soins à travers le territoire\nnational, la loi cadre 06 vise :\nA/ La réhabilitation des structures sanitaires primaires\nB/ La création d'un système d'homologation des établissements de santé\nC/ La mise à niveau des cliniques privées\nD/ L'instauration de l'obligation de respect du parcours de soins", "29/ Lequel des objectifs du développement durable concerne directement la santé ?\nA/ L’objectif 1\nB/ L’objectif 3\nC/ L'objectif 6\nD/ L'objectif 7\n30/ Le règlement intérieur des hôpitaux est défini par :\nA/ Décret\nB/ Arrêté\nC/ Circulaire\nD/ Dahir\n31/ Une convention cadre, dotée d'une enveloppe budgétaire de 3 milliards de DH, a été\nsignée par le ministre de la santé et de la protection sociale. Le ministre de l'enseignement\nsupérieur et le ministre délègue chargé du Budget en 25 juillet 2022 visant :\nA/ La création de trois facultés de médecine et de pharmacie et de trois CHU\nB/ L’augmentation du nombre des professionnels de la sante à 68000 en 2022 et à plus de\n90000 à l’horizon 2025\nC/ L'augmentation du nombre des professionnels de la sante et à plus de 90000 à l’horizon\n2025\nD/ Toutes les réponses sont fausses\n32/ L'OMS recommande que le budget de la santé publique :\nA/ Soit de 6% du budget de l'Etat\nB/ Soit de 9% du budget de l’Etat\nC/ Soit de 12% du budget de l'Etat\nD/ soit de 15% du budget de l'Etat\n33/ Le projet d’établissement hospitalier comprend :\nA/ Le projet managérial\nB/ Le projet administratif\nC/ Le projet médical\nD/ Le projet social", "34/ Les politiques, les stratégies et les plans sanitaires nationaux permettent de :\nA/ Renforcer le système de santé par l'amélioration des soins de santé primaires\nB/ Produire des plans directeurs s'adressant au secteur public\nG Prendre en considération les déterminants sociaux de la santé\nD/ Prévoir une budgétaire réaliste, un suivi et une évaluation rigoureuse\n35/ La première politique intégrée de protection sociale a été adoptée pour la période de\nA/ 2015 - 2020\nB/ 2020 - 2025\nC/ 2021 - 2025\nD/ 2020 - 2030\n36/ Lequel des principes suivants ne faisant pas partie des fondements sur lesquels repose\nle système de santé ?\nA/ L'égalité d'accès aux soins et services de santé\nB/ La gratuité d'accès à l'offre de soins\nC/ L'équité dans la répartition spatiale des ressources sanitaires\nD/ Aucune de ces r réponses\n37/ La revalorisation des ressources humaines citée par la loi-cadre n° 06-22 passera par\nA/ L'introduction d'incitations salariales\nB/ La révision du statut de la fonction publique dans le secteur de la santé\nC/ La réforme du système de la formation\nD. Aucune de ces réponses\n38/ Parmi les attributions de la Haute Autorité de Santé, on cite :\nA/ L'évaluation de la qualité des services fournis par le secteur public uniquement\nB/ Le suivi, l'analyse et l'évaluation des donnés épidémiologique\nC/ L'élaboration des guides et des référentiels relatifs à la formation continue des\nprofessionnels de la santé\nD/ Toutes les propositions sont correctes", "39/ Parmi les attributions des Groupements Sanitaires Territoriaux, on cite :\nA/ La création des nouveaux établissements sanitaires\nB/ La surveillance des nouvelles épidémies\nC/ Garantir la formation continue au profit des professionnels de la santé\nD/ Toutes les propositions fausses\n40/ D'après la loi-cadre 06-22 relative au système national de santé, les établissements de\nsanté comprennent :\nA/ Les divers établissements, quel qu'en soit le régime juridique, organisés dans le but de\ncontribuer à l'offre de soins\nB/ L’ensemble des institutions, des organismes, des actions et des ressources y affectées\nintervenant dans le domaine de la santé aussi bien dans le secteur public que dans le secteur\nprivé\nC/ L'ensemble des structures intervenant directement dans l'offre des prestations de santé\nD/ Toutes les propositions sont fausses\n41/ Dans le cadre du partenariat public-privé selon la loi-cadre n° 06.22 :\nA/ Les professionnels de santé, peuvent exercer dans des établissements de santé du secteur\nprivé\nB/ Certains professionnels de santé, peuvent exercer dans des établissements de santé du\nsecteur privé\nC/ Certains professionnels de santé, peuvent exercer quelques tâches dans des établissements\nde santé du secteur privé\nD/ Certains professionnels de santé du secteur privé, peuvent exercer quelques tâches dans\ndes établissements de santé publiques\n42/ le Groupement sanitaire territorial (GST) est un établissement public jouissant de :\nA/ La personnalité politique et l'autonomie administrative\nB/ La personnalité morale et l'autonomie financière\nC/ La subordination au gouvernement central et la tutelle financière\nD/ Aucune proposition n'est juste\n43/ Les structures de soins exclues des GST sont :\nB/ Les établissements sanitaires des FAR\nA/ Les établissements publics soumis à des textes législatifs et réglementaire spéciaux\nC/ Les Bureaux Municipaux d'Hygiène\nD/ Toutes les réponses sont justes", "44/ Le dossier médical partagé est :\nA/ Utilise par tous les niveaux du système sanitaire public et privé\nB/ Utilise par le système sanitaire public uniquement\nC/ Centré sur L’individu\nD/ Intégré, réactif et flexible\n45/ Les objectifs du système de santé marocain selon la loi-cadre n° 06.22 sont :\nA/ L'égalité d'accès aux soins et aux prestations de santé\nB/ Garantir une répartition équilibrée et équitable de l’offre de soins sur l'ensemble du\nterritoire national\nC/ La gestion basée sur les résultats et la corrélation entre la responsabilité et la reddition des\ncomptes\nD/ Réorganiser le parcours de soins et digitaliser le système de santé\n46/ les notificateurs des événements indésirables lés aux médicaments et autres produits\nde santé sont :\nA/ Les professionnels de santé travaillant dans les secteurs publics et privés\nB/ L'industrie pharmaceutique\nC/ Le public\nD/ Les sociétés de protection du consommateur\n47/ Le mauvais usage des antibiotiques consiste à :\nA/ Prescrire trop d'antibiotiques en général\nB/ Les prescrire de façon systématique en cas de fièvre « inexpliquée »\nC. Prescrire de préférence des antibiotiques à spectre étroit\nD/ Utiliser systématiquement les antibiotiques en prévention après une intervention\nchirurgicale\n48/ Le programme médical régional PMR est :\nA/ Un instrument de pilotage régional\nB/ Outil d’optimisation et mutualisation des ressources entre les réseaux et filières de soins\nC/ Outil d'organisation des circuits de prise en charge\nD/ Outil de gestion des programmes de santé", "49/ Parmi les principes de la généralisation de la protection sociale :\nA/ La solidarité\nB/ La non-discrimination\nC/ L'anticipation\nD/ Aucune réponse est juste\n50/ L'OMS recommande que le budget de la santé publique :\nA/ Soit de 6% du budget de l'Etat\nB/ Soit de 9% du budget de l'Etat\nC/ Soit de 12% du budget de l'Etat\nD/ Soit de 15% du budget de l'Etat"];const root=document.getElementById('pages'),q=document.getElementById('q'),count=document.getElementById('count');
function draw(){const term=q.value.trim().toLocaleLowerCase();let visible=0;root.innerHTML=DATA.map((text,i)=>{const hit=!term||text.toLocaleLowerCase().includes(term);if(hit)visible++;return `<section class="page ${hit?'':'hidden'}"><div class="page-head"><span>Page ${i+1}</span><span>${term&&hit?'Correspondance trouvée':''}</span></div><div class="text">${text?esc(text):'<span class="empty">Cette page est une image sans texte extractible. Ouvrir le PDF original pour la consulter.</span>'}</div></section>`}).join('');count.textContent=(term?visible+' page(s) trouvée(s) · ':'')+DATA.length+' page(s)';}
