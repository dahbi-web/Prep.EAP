s de santé\n13. Selon la définition de l’OMS, qu’est-ce qui caractérise une communauté ?\nA. Des individus partageant les mêmes centres d’intérêt\nB. Un groupe de personnes vivant dans la même région géographique définie,\npartageant une culture, des valeurs et ayant des interactions sociales\nC. Des professionnels de santé regroupés dans une organisation\nD. Un ensemble de patients suivant un traitement médical similaire\n14. Selon l’OMS, que désignent les Déterminants Sociaux de la Santé (DSS) ?\nA. Les infrastructures mises en place pour les objectifs professionnels communs\nB. Les circonstances dans lesquelles les individus naissent, grandissent, vivent,\ntravaillent et vieillissent, ainsi que le système mis en place pour faire face à la maladie\nC. Les politiques de santé publique au niveau national\nD. Les médicaments disponibles sur le marché\n15. Quels sont les différents niveaux de participation de la communauté dans les\nprogrammes, selon le degré d’implication ?\nA. Participation aux avantages des programmes\nB. Participation aux activités des programmes\nC. Participation à l’exécution des programmes\nD. Participation à la planification des programmes\n16. L’apparition dans une collectivité humaine d’une maladie dont la fréquence est\nclairement en excès par rapport à la fréquence attendue :\nA. Épidémie\nB. Endémie\nC. Pandémie\nD. Cas sporadiques\n17. La Pandémie est un phénomène de masse\nA. Limité dans le temps et dans l’espace\nB. Limité dans le temps illimité dans l’espace\nC. Limité dans le temps et dans l’espace avec fréquence basse\nD. Illimité dans le temps, limité dans l’espace\n18. La démarche épidémiologique consiste à :\nA. Mesurer la fréquence d’un phénomène de santé, tel qu’une maladie, d’en faire la\ndistribution selon les caractéristiques de personne, de lieu et de temps", "B. Émettre des hypothèses sur les déterminants de la fréquence d’un phénomène\nC. Une fois les hypothèses vérifiées, des actions appropriées seront menées pour\ncontr
