{t:`Le local professionnel et son inspection`,ic:`🏠`,pages:`Art. 23-24`,
lesson:`<h3>🔍 L'ouverture du local</h3>
<p>Elle est subordonnée à un <b>contrôle effectué par l'administration</b>, <b>en présence d'un représentant de l'Ordre national des infirmiers s'il existe</b>, qui peut émettre des réserves consignées dans un <b>procès-verbal</b>.</p>
<p>Le contrôle vérifie la conformité aux <b>normes d'hygiène, de sécurité et de salubrité</b>, ainsi qu'aux <b>normes techniques des équipements et du personnel</b>.</p>
<p>Si le local est conforme → <b>autorisation d'exercer</b>. Sinon, l'administration invite à se conformer ; l'autorisation n'est délivrée qu'<b>après un nouveau contrôle</b>.</p>
<div class="tip">⏱️ <b>Délai : 30 jours</b> à compter du dépôt de la demande d'ouverture, ou de l'information de l'accomplissement des travaux, pour effectuer le contrôle et délivrer l'autorisation.</div>
<p>Tout <b>changement de local</b> est subordonné à une <b>nouvelle autorisation</b>.</p>
<h3>🕵️ L'inspection périodique (art. 24)</h3>
<p>Les locaux des professions d'<b>infirmier polyvalent et en gériatrie</b> sont soumis à des <b>inspections périodiques, sans préavis</b>, <b>au moins une fois tous les 5 ans</b>, sur la base d'un <b>programme annuel</b> établi par l'administration.</p>
<p><b>Composition de la commission</b> : des <b>fonctionnaires assermentés</b> de l'autorité gouvernementale compétente + un représentant du <b>conseil régional de l'Ordre national des médecins</b> + un représentant de l'<b>Ordre national des infirmiers s'il existe</b>. En cas d'absence d'un membre, les inspecteurs assermentés présents procèdent quand même, en le <b>signalant dans le rapport</b>.</p>
<p>À l'issue : un <b>procès-verbal</b> paraphé à chaque page et signé à la dernière ; l'autorité gouvernementale doit le recevoir <b>dans un délai maximum de 8 jours</b> et en adresse copie au président du conseil régional de l'Ordre des médecins et à l'Ordre national des infirmiers.</p>
<h3>⚠️ En cas d'infraction</h3>
<p>Rapport motivé + <b>mise en demeure</b> avec un délai fixé selon l'importance des corrections. À l'expiration sans suite → <b>saisine du ministère public</b>. Si l'infraction porte atteinte à la <b>santé et/ou à la sécurité des patients</b> → l'autorité peut demander au <b>président de la juridiction</b> d'ordonner la <b>fermeture</b> du local dans l'attente du jugement.</p>`,
qs:[
{q:`Dans quel délai le contrôle du local est-il effectué et l'autorisation délivrée ?`,o:[`8 jours`,`15 jours`,`30 jours`,`60 jours`],c:2,e:`30 jours à compter du dépôt de la demande d'ouverture ou de l'information de l'accomplissement des travaux.`},
{q:`Les locaux sont inspectés sans préavis au moins :`,o:[`Une fois par an`,`Une fois tous les 2 ans`,`Une fois tous les 5 ans`,`Une fois tous les 10 ans`],c:2,e:`Article 24 : au moins une fois tous les 5 ans, sur la base d'un programme annuel.`},
{q:`Quels locaux sont soumis aux inspections périodiques de l'article 24 ?`,o:[`Ceux des infirmiers polyvalents et en gériatrie`,`Tous les locaux de santé`,`Les cliniques uniquement`,`Les pharmacies`],c:0,e:`Ce sont les seules professions exerçables en libéral avec local propre.`},
{q:`Le procès-verbal d'inspection doit parvenir à l'autorité gouvernementale dans un délai maximum de :`,o:[`8 jours`,`15 jours`,`30 jours`,`3 mois`],c:0,e:`8 jours, avec copie au président du conseil régional de l'Ordre des médecins et à l'Ordre national des infirmiers.`},
{q:`La commission d'inspection comprend :`,o:[`Des fonctionnaires assermentés, un représentant du conseil régional de l'Ordre des médecins et un représentant de l'Ordre des infirmiers s'il existe`,`Uniquement des policiers`,`Uniquement des médecins`,`Le procureur`],c:0,e:`Composition tripartite prévue par l'article 24.`},
{q:`Si un membre de la commission est absent le jour de l'inspection :`,o:[`L'inspection est annulée`,`Les inspecteurs assermentés présents procèdent en signalant l'absence dans le rapport`,`Elle est reportée de 30 jours`,`Le local est fermé`],c:1,e:`L'inspection a lieu quand même, l'absence étant mentionnée au rapport.`},
{q:`Si l'infraction porte atteinte à la santé ou à la sécurité des patients, l'autorité peut :`,o:[`Fermer elle-même le local`,`Demander au président de la juridiction compétente d'ordonner la fermeture en attendant le jugement`,`Retirer le diplôme`,`Imposer une amende immédiate`],c:1,e:`La fermeture est ordonnée par le juge, sur demande de l'autorité gouvernementale.`},
{q:`Le contrôle d'ouverture du local se fait en présence :`,o:[`D'un représentant de l'Ordre national des infirmiers s'il existe`,`Du maire`,`D'un huissier`,`Du médecin traitant`],c:0,e:`Il peut émettre réserves et observations, consignées au procès-verbal.`}
],
cards:[
{f:`Les délais du local professionnel`,b:`Contrôle + autorisation : <b>30 jours</b> · inspection périodique sans préavis : au moins <b>1 fois / 5 ans</b> · transmission du PV : <b>8 jours</b> max`},
{f:`Composition de la commission d'inspection`,b:`<b>Fonctionnaires assermentés</b> + un représentant du <b>conseil régional de l'Ordre national des médecins</b> + un représentant de l'<b>Ordre national des infirmiers s'il existe</b>`},
{f:`Suites d'une infraction constatée`,b:`Rapport motivé + <b>mise en demeure</b> · à défaut, <b>saisine du ministère public</b> · en cas de danger, <b>fermeture ordonnée par le juge</b>`}
]},

/* U7 */
{t:`Les règles d'exercice et les interdits`,ic:`🚫`,pages:`Art. 27-35`,
lesson:`<h3>🚫 Les interdictions</h3>
<p>• Aucun infirmier autorisé dans le privé ne peut exercer <b>concurremment une autre activité professionnelle</b>, même s'il détient un titre l'y autorisant.<br>
• Il est <b>interdit de pratiquer sous un pseudonyme</b>.<br>
• Il est interdit d'exercer sa profession <b>à titre commercial</b>.<br>
• Il est interdit de faire de la <b>propagande et de la publicité</b> en sa faveur ou en faveur de tiers, par tout moyen direct ou indirect — l'interdiction vise aussi les <b>personnes physiques et morales</b> qui exploiteraient les locaux ou les infirmiers à des fins publicitaires.</p>
<h3>📍 Lieu et exclusivité</h3>
<p>L'infirmier doit exercer <b>exclusivement à l'adresse où il a élu domicile professionnel</b> et pour laquelle il a été autorisé. Il doit exercer <b>personnellement</b> et disposer d'un local, ou élire domicile dans le local d'un infirmier autorisé (sans clause aliénant l'indépendance professionnelle).</p>
<p>Il peut toutefois accomplir ses actes <b>au domicile des patients</b> ou dans des <b>lieux d'hébergement</b> de groupements d'enfants, de jeunes, de personnes âgées ou de personnes à besoins spécifiques.</p>
<h3>🪧 La plaque (art. 33)</h3>
<p>À l'entrée du local, une <b>plaque indicatrice</b> répondant aux caractéristiques fixées par l'administration, ne comportant <b>que</b> : <b>prénom et nom</b>, <b>titre ou diplôme avec son origine</b>, la <b>profession</b> et les <b>références de l'autorisation</b>. En exploitation commune, ces mentions figurent pour <b>chaque associé</b>.</p>
<h3>💵 Tarifs et assurance</h3>
<p>Les infirmiers doivent <b>afficher de manière apparente et lisible le tarif</b> des actes et prestations, dans les <b>lieux d'accueil ou la salle d'attente</b>.</p>
<p>L'infirmier autorisé doit <b>souscrire une police d'assurance</b> couvrant la <b>responsabilité civile et professionnelle</b>, en <b>déposer copie</b> auprès de l'autorité gouvernementale compétente et refaire ce dépôt à <b>chaque renouvellement</b>.</p>
<h3>🔚 Cessation, nomination publique, retrait</h3>
<p>• <b>Nommé à un emploi public</b> : informer l'administration <b>dans la quinzaine</b> pour annulation de l'autorisation ; en exercice individuel, <b>fermeture immédiate</b> du local.<br>
• <b>Cessation</b> définitive ou <b>supérieure à un an</b> : déclaration <b>dans la quinzaine</b> pour suspension ou annulation.<br>
• <b>Retrait pour inaptitude</b> (infirmité, état pathologique sévère ou chronique rendant l'exercice dangereux) : prononcé après examen par une <b>commission de 3 médecins experts spécialistes</b>, dont <b>2 désignés par l'administration</b> et <b>1 par l'intéressé</b> (ou un membre de sa famille). Reprise après retrait temporaire : <b>après avis de la même commission</b>.<br>
• Reprise après une interruption <b>≥ 2 ans</b> : <b>nouvelle autorisation</b> exigée.</p>`,
qs:[
{q:`La commission qui examine l'infirmier avant retrait d'autorisation comprend :`,o:[`3 médecins experts spécialistes, dont 2 désignés par l'administration et 1 par l'intéressé`,`2 médecins et un juge`,`Un seul médecin-conseil`,`Le conseil de l'Ordre`],c:0,e:`3 experts : 2 désignés par l'administration, 1 par l'intéressé ou un membre de sa famille.`},
{q:`Après une interruption d'exercice égale ou supérieure à 2 ans, la reprise exige :`,o:[`Une simple déclaration`,`Une nouvelle autorisation`,`Un stage`,`Rien`],c:1,e:`Interruption ≥ 2 ans → nouvelle autorisation.`},
{q:`Que peut comporter la plaque à l'entrée du local (art. 33) ?`,o:[`Prénom et nom, titre ou diplôme avec son origine, profession et références de l'autorisation`,`Les tarifs`,`Les horaires et une publicité`,`Le nom de la clinique partenaire`],c:0,e:`Liste limitative ; le pseudonyme est interdit.`},
{q:`Le tarif des actes doit être :`,o:[`Affiché de manière apparente et lisible dans les lieux d'accueil ou la salle d'attente`,`Communiqué sur demande`,`Envoyé à l'administration`,`Publié au BO`],c:0,e:`Affichage obligatoire, apparent et lisible.`},
{q:`L'assurance de responsabilité civile et professionnelle :`,o:[`Est facultative`,`Est obligatoire, avec dépôt d'une copie à chaque renouvellement`,`Est souscrite par l'employeur`,`Est payée par l'Ordre`],c:1,e:`Souscription obligatoire + dépôt de copie auprès de l'autorité gouvernementale, renouvellement compris.`},
{q:`Un infirmier du privé nommé à un emploi public doit :`,o:[`Informer l'administration dans la quinzaine et fermer immédiatement son local s'il exerce à titre individuel`,`Garder son local un an`,`Vendre son local`,`Ne rien faire`],c:0,e:`Article 28 : information dans la quinzaine pour annulation de l'autorisation, fermeture immédiate du local.`},
{q:`L'infirmier autorisé dans le privé peut-il exercer une autre activité professionnelle ?`,o:[`Oui, s'il en a le diplôme`,`Non, même s'il est titulaire d'un titre l'y autorisant`,`Oui, à mi-temps`,`Oui, dans le public`],c:1,e:`Interdiction expresse d'exercer concurremment une autre activité professionnelle.`},
{q:`En dehors de son local, l'infirmier peut accomplir ses actes :`,o:[`Au domicile des patients et dans les lieux d'hébergement de groupements (enfants, jeunes, personnes âgées, besoins spécifiques)`,`N'importe où`,`Uniquement à l'hôpital`,`Uniquement en clinique`],c:0,e:`Deux cas prévus par la loi.`}
],
cards:[
{f:`Les interdits de l'article 33 et suivants`,b:`Pas de <b>pseudonyme</b> · pas d'exercice <b>à titre commercial</b> · pas de <b>publicité ni propagande</b> · pas d'<b>autre activité professionnelle</b> concurrente`},
{f:`Commission de retrait pour inaptitude`,b:`<b>3 médecins experts spécialistes</b> : <b>2</b> désignés par l'administration, <b>1</b> par l'intéressé ou sa famille`},
{f:`Reprise d'exercice`,b:`Après retrait <b>temporaire</b> : avis de la commission · après interruption <b>≥ 2 ans</b> : <b>nouvelle autorisation</b>`},
{f:`Obligations d'affichage et d'assurance`,b:`<b>Plaque</b> limitée (nom, diplôme et origine, profession, références de l'autorisation) · <b>tarifs affichés</b> en salle d'attente · <b>assurance RC professionnelle</b> déposée à chaque renouvellement`}
]},

{t:`Les remplacements`,ic:`🔄`,pages:`Remplacements`,
lesson:`<h3>🔄 Le remplacement en cas d'absence temporaire</h3>
<p>L'infirmier exerçant sous forme <b>libérale</b> peut se faire remplacer pendant une durée <b>maximum de 60 jours</b> par un confrère remplissant les conditions d'autorisation — avec <b>déclaration préalable</b> à l'administration.</p>
<p>Au-delà de <b>60 jours</b> : <b>autorisation préalable</b> de l'administration, délivrée à l'infirmier remplacé et <b>comportant le nom du remplaçant et la durée</b>. Cette autorisation <b>vaut autorisation d'exercice pour le remplaçant</b> pendant cette durée.</p>
<p>La durée du remplacement ne peut dépasser <b>une année continue</b>, sauf <b>dérogations exceptionnelles</b> accordées par l'administration, notamment pour raisons de santé.</p>
<h3>🏛️ Le cas du fonctionnaire</h3>
<p>Par dérogation à l'article 15 du dahir du <b>24 février 1958</b> portant statut général de la fonction publique, l'infirmier du <b>secteur public</b> peut, <b>durant son congé administratif annuel</b>, remplacer un confrère du privé — après <b>autorisation délivrée par l'administration dont il relève</b>.</p>
<h3>⚰️ En cas de décès</h3>
<p>Les <b>ayants droit</b> peuvent, sur autorisation de l'administration, confier la gestion du local <b>pour 2 années</b> à une personne remplissant les conditions de l'article 20. Passé ce délai, l'autorisation devient <b>caduque</b> et le local doit être <b>fermé</b>.</p>
<p>Toutefois, si le <b>conjoint ou l'un des enfants</b> du défunt poursuit des études préparant au diplôme, l'autorisation peut être <b>renouvelée annuellement</b> jusqu'à l'expiration de la durée réglementaire nécessaire à l'obtention du diplôme — le renouvellement courant <b>à compter de la fin des 2 années</b>.</p>`,
qs:[
{q:`Sans autorisation préalable, un remplacement peut durer au maximum :`,o:[`30 jours`,`60 jours`,`90 jours`,`6 mois`],c:1,e:`60 jours avec simple déclaration préalable ; au-delà, autorisation préalable de l'administration.`},
{q:`La durée totale d'un remplacement ne peut dépasser :`,o:[`6 mois`,`Une année continue, sauf dérogation exceptionnelle`,`2 ans`,`Aucune limite`],c:1,e:`Une année continue, sauf dérogations exceptionnelles notamment pour raisons de santé.`},
{q:`L'autorisation de remplacement au-delà de 60 jours :`,o:[`Vaut autorisation d'exercice pour le remplaçant pendant cette durée`,`Ne concerne que le remplacé`,`Est délivrée par l'Ordre`,`Est tacite`],c:0,e:`Elle comporte le nom du remplaçant et la durée, et vaut autorisation d'exercice pour lui.`},
{q:`Un infirmier du secteur public peut remplacer un confrère du privé :`,o:[`Jamais`,`Durant son congé administratif annuel, après autorisation de l'administration dont il relève`,`Le week-end`,`Après démission`],c:1,e:`Dérogation à l'article 15 du dahir du 24 février 1958 portant statut général de la fonction publique.`},
{q:`En cas de décès de l'infirmier, ses ayants droit peuvent faire gérer le local pendant :`,o:[`6 mois`,`1 an`,`2 années`,`5 ans`],c:2,e:`2 années, sur autorisation de l'administration, par une personne remplissant les conditions de l'article 20.`},
{q:`Si un enfant du défunt poursuit les études menant au diplôme, l'autorisation :`,o:[`Devient définitive`,`Peut être renouvelée annuellement jusqu'à l'obtention du diplôme`,`Est annulée`,`Est transférée à l'Ordre`],c:1,e:`Renouvellement annuel à compter de l'expiration des deux premières années.`},
{q:`Passé le délai de gestion par les ayants droit sans renouvellement :`,o:[`L'autorisation devient caduque et le local doit être fermé`,`Le local est vendu par l'administration`,`L'autorisation est transférée`,`Rien ne change`],c:0,e:`Caducité de l'autorisation et fermeture du local.`}
],
cards:[
{f:`Les durées du remplacement`,b:`<b>60 jours</b> max sur simple <b>déclaration préalable</b> · au-delà : <b>autorisation préalable</b> · jamais plus d'<b>1 année continue</b> (sauf dérogation)`},
{f:`Décès de l'infirmier libéral`,b:`Gestion du local confiée pour <b>2 ans</b> sur autorisation ; renouvelable <b>annuellement</b> si le conjoint ou un enfant prépare le diplôme ; sinon <b>caducité et fermeture</b>`},
{f:`Le fonctionnaire remplaçant`,b:`Possible <b>durant le congé administratif annuel</b>, par dérogation au statut général de la fonction publique (dahir du <b>24 février 1958</b>), après autorisation de son administration`}
]},

/* U9 */
{t:`Représentation professionnelle et sanctions`,ic:`⚖️`,pages:`Représentation · Sanctions`,
lesson:`<h3>🏛️ Le régime de représentation</h3>
<p>À titre <b>transitoire</b>, en attendant la création d'un <b>Ordre professionnel</b>, les infirmiers autorisés dans le privé peuvent se constituer en <b>association professionnelle nationale</b> (dahir du <b>15 novembre 1958</b> sur le droit d'association). Les statuts sont soumis à l'administration, qui s'assure de leur conformité.</p>
<p><b>Ses 6 objets</b> : sauvegarder les principes de <b>moralité, dignité et abnégation</b> · veiller au <b>respect des lois et usages</b> par ses membres · <b>gérer son patrimoine</b> et défendre les <b>intérêts moraux et professionnels</b> · <b>représenter</b> la profession auprès de l'administration et contribuer à la <b>politique de santé</b> en matière de soins infirmiers · <b>donner son avis</b> sur les sujets qui lui sont soumis · contribuer à l'organisation des cycles de <b>formation continue</b>.</p>
<h3>🚨 L'exercice illégal — les 10 cas</h3>
<p>Notamment : exercer <b>sans titre ou diplôme</b> · prendre part <b>habituellement</b> aux actes <b>sans autorisation</b> (sauf étudiants agissant sur ordre de leurs encadrants et sous leur responsabilité) · <b>fonctionnaire</b> exerçant dans le privé en violation de la loi · continuer après <b>retrait</b> de l'autorisation · <b>reprendre</b> en violation des règles · <b>changer de mode d'exercice</b> sans autorisation · ne pas <b>fermer son local</b> après nomination publique · <b>remplacement</b> irrégulier · <b>gérance</b> sans autorisation · actes accomplis en violation des dispositions.</p>
<h3>💸 Le barème des peines</h3>
<table><tr><th>Cas</th><th>Peine</th></tr>
<tr><td>Sans diplôme / sans autorisation (1 et 2)</td><td><b>3 mois à 2 ans</b> et <b>10 000 à 50 000 DH</b></td></tr>
<tr><td>Exercer après retrait (4)</td><td><b>1 an à 2 ans</b> et <b>50 000 à 100 000 DH</b></td></tr>
<tr><td>Reprise irrégulière (5)</td><td><b>3 mois à 2 ans</b> et <b>5 000 à 20 000 DH</b> (retrait définitif) ; amende seule si retrait provisoire</td></tr>
<tr><td>Local non fermé après nomination publique (7)</td><td>Amende de <b>50 000 à 100 000 DH</b></td></tr>
<tr><td>Actes en violation (10)</td><td><b>3 mois à 2 ans</b> et <b>5 000 à 20 000 DH</b></td></tr>
<tr><td>Changement de mode / gérance sans autorisation (6 et 9)</td><td><b>1 à 3 mois</b> et <b>5 000 à 10 000 DH</b></td></tr>
<tr><td>Remplacement irrégulier (8)</td><td>Amende de <b>10 000 à 20 000 DH</b></td></tr>
<tr><td>Ouverture d'un local sans autorisation</td><td>Amende de <b>5 000 à 10 000 DH</b> + fermeture conservatoire</td></tr>
<tr><td>Refus de se soumettre à l'inspection (art. 24)</td><td>Amende de <b>10 000 à 50 000 DH</b> et/ou <b>1 à 3 mois</b></td></tr>
<tr><td>Local présentant un danger grave</td><td><b>1 à 3 mois</b> et <b>20 000 à 50 000 DH</b></td></tr>
<tr><td>Employeur limitant l'indépendance professionnelle</td><td>Amende de <b>50 000 à 100 000 DH</b></td></tr>
<tr><td>Salarié acceptant cette limitation</td><td>Amende de <b>5 000 à 10 000 DH</b></td></tr>
<tr><td>Défaut de déclaration de changement d'employeur</td><td>Amende de <b>1 200 à 4 000 DH</b></td></tr></table>
<div class="warn">⚠️ <b>Récidive</b> : amende et emprisonnement <b>portés au double</b>, et la peine d'emprisonnement <b>ne peut être inférieure à 6 mois</b>. Est en récidive celui qui commet une infraction identique <b>moins de 5 ans</b> après l'expiration ou la prescription de la peine.</div>`,
qs:[
{q:`En attendant la création d'un Ordre, les infirmiers du privé peuvent :`,o:[`Se constituer en association professionnelle nationale`,`Créer un syndicat obligatoire`,`Rejoindre l'Ordre des médecins`,`Rien`],c:0,e:`Régime transitoire : association professionnelle nationale, statuts soumis à l'administration.`},
{q:`Exercer sans titre ni diplôme est puni de :`,o:[`3 mois à 2 ans et 10 000 à 50 000 DH`,`1 an à 2 ans et 50 000 à 100 000 DH`,`Une amende de 5 000 DH`,`Un simple avertissement`],c:0,e:`Cas 1 et 2 de l'exercice illégal.`},
{q:`Continuer à exercer après retrait de l'autorisation est puni de :`,o:[`3 mois à 2 ans et 10 000 à 50 000 DH`,`1 an à 2 ans et 50 000 à 100 000 DH`,`Une amende de 20 000 DH`,`3 mois seulement`],c:1,e:`C'est la peine la plus lourde du barème de l'exercice illégal.`},
{q:`L'employeur qui impose des règles limitant l'indépendance professionnelle de l'infirmier encourt :`,o:[`50 000 à 100 000 DH d'amende`,`5 000 à 10 000 DH`,`Une peine de prison ferme`,`Rien`],c:0,e:`50 000 à 100 000 DH pour l'employeur ; 5 000 à 10 000 DH pour le salarié qui l'accepte.`},
{q:`Le refus de se soumettre à l'inspection de l'article 24 est puni de :`,o:[`10 000 à 50 000 DH et/ou 1 à 3 mois d'emprisonnement`,`Une simple mise en demeure`,`2 ans de prison`,`5 000 DH`],c:0,e:`Amende de 10 000 à 50 000 DH et/ou emprisonnement d'un à trois mois.`},
{q:`Le défaut de déclaration de changement d'employeur est puni d'une amende de :`,o:[`1 200 à 4 000 DH`,`5 000 à 10 000 DH`,`10 000 à 20 000 DH`,`50 000 DH`],c:0,e:`C'est l'amende la plus faible du barème.`},
{q:`En cas de récidive, la peine d'emprisonnement ne peut être inférieure à :`,o:[`1 mois`,`3 mois`,`6 mois`,`1 an`],c:2,e:`Récidive : montants et durées doublés, emprisonnement au minimum de 6 mois.`},
{q:`Il y a récidive lorsque l'infraction identique est commise moins de :`,o:[`2 ans après l'expiration de la peine`,`5 ans après l'expiration ou la prescription de la peine`,`10 ans après`,`1 an après`],c:1,e:`Définition légale de la récidive dans la loi 43-13.`},
{q:`Les étudiants qui accomplissent des actes ordonnés par leurs encadrants :`,o:[`Commettent un exercice illégal`,`Ne sont pas concernés, agissant sous la responsabilité de leurs encadrants`,`Doivent être autorisés`,`Sont sanctionnés d'une amende`],c:1,e:`Exception expresse au 2e cas d'exercice illégal.`}
],
cards:[
{f:`Les peines les plus lourdes de la loi 43-13`,b:`Exercer <b>après retrait</b> : 1 à 2 ans + <b>50 000 à 100 000 DH</b> · <b>employeur</b> limitant l'indépendance : <b>50 000 à 100 000 DH</b> · local <b>non fermé</b> après nomination publique : 50 000 à 100 000 DH`},
{f:`Exercice sans diplôme ou sans autorisation`,b:`<b>3 mois à 2 ans</b> d'emprisonnement et <b>10 000 à 50 000 DH</b> d'amende`},

{f:`L'association professionnelle nationale`,b:`Régime <b>transitoire</b> en attendant l'<b>Ordre</b> ; statuts soumis à l'<b>administration</b> ; représente la profession et contribue à la <b>formation continue</b>`}

{t:`Dispositions diverses et transitoires`,ic:`📅`,pages:`Dispositions transitoires`,
lesson:`<h3>👥 Qui peut accomplir des actes infirmiers comme salarié du privé ?</h3>
<p>Sous le <b>contrôle et la responsabilité d'un médecin</b> et après <b>autorisation administrative</b>, pour les actes dont la liste est fixée par voie réglementaire :</p>
<p>• les titulaires du <b>diplôme de technicien spécialisé</b> dans l'une des filières d'infirmiers (établissement de formation professionnelle privée autorisé)<br>
• les titulaires du <b>diplôme d'adjoint de santé breveté</b>, du <b>diplôme de technicien option infirmier auxiliaire</b> ou du <b>diplôme de qualification professionnelle option aide-soignant</b><br>
• les personnes ayant appartenu au cadre des <b>aides sanitaires</b> du ministère de la Santé, ou à un cadre similaire des <b>services de santé des Forces Armées Royales</b><br>
• les <b>aides-soignants en activité</b> dans le cadre du salariat à la date d'entrée en vigueur de la loi</p>
<h3>⏳ La période transitoire de 4 ans</h3>
<p>Par dérogation aux conditions d'exercice, et pour une période transitoire <b>ne dépassant pas 4 ans</b> à compter de l'entrée en vigueur de la loi, les titulaires du <b>diplôme de technicien spécialisé</b> d'un établissement de formation professionnelle <b>privé autorisé</b> peuvent être autorisés à exercer l'une des professions infirmières.</p>
<h3>🌍 Les autres professions infirmières</h3>
<p>L'exercice de toute <b>autre profession infirmière non prévue</b> par la loi est subordonné à une <b>autorisation administrative</b>, sous réserve que le demandeur soit titulaire d'un diplôme lui donnant le droit d'exercer cette profession <b>dans le pays qui l'a délivré</b>, <b>dûment authentifié</b> et <b>assorti du baccalauréat</b>. La durée de formation ne peut être <b>inférieure à 3 ans</b>.</p>`,
qs:[
{q:`La période transitoire ouverte aux titulaires du diplôme de technicien spécialisé est de :`,o:[`2 ans`,`3 ans`,`4 ans`,`5 ans`],c:2,e:`4 ans au maximum à compter de l'entrée en vigueur de la loi.`},
{q:`Les aides-soignants peuvent accomplir des actes infirmiers dans le privé :`,o:[`En toute autonomie`,`Sous le contrôle et la responsabilité d'un médecin, après autorisation administrative`,`Sans autorisation`,`Jamais`],c:1,e:`Contrôle et responsabilité d'un médecin + autorisation administrative, pour les actes fixés par voie réglementaire.`},
{q:`Pour une profession infirmière non prévue par la loi, la formation ne peut être inférieure à :`,o:[`2 ans`,`3 ans`,`4 ans`,`5 ans`],c:1,e:`Durée minimale de 3 ans, diplôme authentifié et assorti du baccalauréat.`},
{q:`Parmi les personnes visées par les dispositions transitoires figurent :`,o:[`Les anciens aides sanitaires du ministère de la Santé et des services de santé des FAR`,`Les étudiants en médecine`,`Les pharmaciens`,`Les kinésithérapeutes`],c:0,e:`Cadre des aides sanitaires du ministère de la Santé ou cadre similaire des services de santé des FAR.`},
{q:`Le diplôme étranger permettant d'exercer une profession non prévue doit être :`,o:[`Dûment authentifié et assorti du baccalauréat`,`Traduit seulement`,`Reconnu par l'Ordre`,`Obtenu au Maroc`],c:0,e:`Authentification + baccalauréat + formation d'au moins 3 ans.`},
{q:`La liste des actes que peuvent accomplir ces personnels est fixée :`,o:[`Par voie réglementaire`,`Par le médecin employeur`,`Par la convention collective`,`Par l'Ordre des médecins`],c:0,e:`Liste fixée par voie réglementaire.`}
],

{t:`Fondements de la CMB (loi 65-00)`,ic:`📜`,pages:`p.1-3`,
lesson:`<h3>📜 Le texte fondateur</h3>
<p>La <b>loi 65-00</b> portant <b>code de la couverture médicale de base</b> est le dispositif juridique fondateur de la progressivité de l'<b>universalisation</b> de la couverture maladie au Maroc. Elle consacre le droit des citoyens à la santé et les principes d'<b>équité et d'égalité</b> dans l'accès <b>géographique et financier</b> à des services de qualité.</p>
<p>Ancrages : <b>discours du Trône du 30 juillet 2004</b> · <b>article 31 de la Constitution 2011</b> (égal accès aux soins, à la protection sociale, à la couverture médicale et à la solidarité mutualiste).</p>
<h3>🏗️ Les 2 composantes du système</h3>
<p>Le financement des prestations repose sur la <b>solidarité</b> et l'<b>équité</b>. Le système de couverture médicale de base comprend :</p>
<p>• l'<b>AMO</b> (assurance maladie obligatoire de base), fondée sur le <b>principe contributif</b> et la <b>mutualisation des risques</b><br>
• le <b>RAMED</b> (régime d'assistance médicale), fondé sur la <b>solidarité nationale</b> au profit de la population démunie</p>
<h3>🚫 Non-discrimination</h3>
<p>Les assurés et bénéficiaires doivent être couverts <b>sans aucune discrimination</b> due à l'<b>âge</b>, au <b>sexe</b>, à la <b>nature de l'activité</b>, au <b>niveau et à la nature du revenu</b>, aux <b>antécédents pathologiques</b> ou à la <b>zone de résidence</b>.</p>
<h3>🏛️ L'ANAM</h3>
<p>Créée en <b>2005</b>, l'<b>Agence Nationale de l'Assurance Maladie</b> a accompagné la mise en place de la CMB (ses missions d'encadrement technique de l'AMO reviennent aujourd'hui à la <b>Haute Autorité de Santé</b>, loi 07-22).</p>
<div class="tip">Chiffres : à fin septembre 2024, plus de <b>31,8 millions</b> de personnes immatriculées ; en 2026, l'AMO couvre <b>88 %</b> de la population (~32 millions).</div>`,
qs:[
{q:`Quelle loi porte le code de la couverture médicale de base ?`,o:[`La loi 65-00`,`La loi 98-15`,`La loi 27-22`,`La loi 60-22`],c:0,e:`La loi 65-00 est le dispositif juridique fondateur de la CMB.`},
{q:`L'AMO est fondée sur :`,o:[`La solidarité nationale`,`Le principe contributif et la mutualisation des risques`,`L'impôt exclusivement`,`Le volontariat`],c:1,e:`AMO = principe contributif + mutualisation des risques ; le RAMED = solidarité nationale au profit des démunis.`},
{q:`Le RAMED est fondé sur :`,o:[`Le principe contributif`,`La solidarité nationale au profit de la population démunie`,`La mutualisation des risques`,`Le financement privé`],c:1,e:`Régime d'assistance médicale fondé sur la solidarité nationale.`},
{q:`Quel article de la Constitution 2011 est cité comme fondement de la couverture médicale ?`,o:[`Article 20`,`Article 21`,`Article 31`,`Article 71`],c:2,e:`Article 31 : égal accès aux soins de santé, à la protection sociale, à la couverture médicale et à la solidarité mutualiste ou organisée par l'État.`},

{q:`Le discours du Trône fondateur de la réforme de la protection sociale date de :`,o:[`30 juillet 1999`,`30 juillet 2004`,`30 juillet 2011`,`30 juillet 2021`],c:1,e:`Discours du Trône du 30 juillet 2004 : élargir la protection sociale et l'assurance maladie.`}

/* U2 */
{t:`Champ d'application et bénéficiaires`,ic:`👨‍👩‍👧`,pages:`p.4-6`,
lesson:`<h3>👥 À qui s'applique l'AMO ?</h3>
<p>• Fonctionnaires et agents de l'État, des collectivités locales, des établissements publics et personnes morales de droit public<br>
• Personnes assujetties au régime de <b>sécurité sociale du secteur privé</b><br>
• <b>Titulaires de pension</b> des deux secteurs<br>
• <b>Travailleurs indépendants</b>, professions libérales et autres activités <b>non salariées</b><br>
• <b>Anciens résistants et membres de l'armée de libération</b><br>
• <b>Étudiants</b> de l'enseignement supérieur public et privé</p>
<p>Les <b>personnes économiquement faibles</b> non assujetties à un régime d'AMO relèvent du <b>régime d'assistance médicale</b>.</p>
<h3>👨‍👩‍👧 Les membres de la famille à charge</h3>
<p>À condition qu'ils ne soient pas bénéficiaires à titre personnel d'une assurance de même nature :</p>
<p>1. Le(s) <b>conjoint(s)</b><br>
2. Les enfants à charge âgés de <b>21 ans au plus</b><br>
3. Les enfants <b>non mariés</b> âgés de <b>26 ans au plus</b> poursuivant des <b>études supérieures</b><br>
4. Les enfants <b>handicapés</b> à charge, <b>sans limite d'âge</b></p>
<p>Sont aussi à charge sans limite d'âge les enfants atteints d'un <b>handicap physique ou mental</b> et ceux dans l'<b>impossibilité totale, permanente et définitive</b> d'exercer une activité rémunérée.</p>
<h3>👴 Extension aux parents</h3>
<p>L'assuré peut demander l'extension du bénéfice à son <b>père et à sa mère</b>, à condition de <b>prendre en charge leur cotisation</b> (fixée par décret).</p>
<h3>📋 Règles de déclaration des enfants</h3>
<p>• Si les deux parents sont assurés : les enfants sont déclarés à l'organisme assureur <b>du père</b>.<br>
• En cas de <b>dissolution du mariage</b> : déclaration auprès de l'organisme de l'ex-conjoint <b>à qui la garde est confiée</b>.<br>
• Si la garde est confiée à un <b>tiers</b> : les enfants conservent le bénéfice du régime de <b>l'un des parents assurés</b>.<br>
• Si un seul parent est assuré et en cas de dissolution : déclaration auprès de l'organisme de l'<b>ex-conjoint</b>.</p>`,
qs:[
{q:`Les enfants à charge sont couverts jusqu'à :`,o:[`18 ans`,`21 ans au plus`,`26 ans au plus`,`30 ans`],c:1,e:`21 ans au plus ; 26 ans au plus s'ils sont non mariés et poursuivent des études supérieures.`},
{q:`Les enfants poursuivant des études supérieures sont couverts jusqu'à :`,o:[`21 ans`,`24 ans`,`26 ans, s'ils sont non mariés`,`30 ans`],c:2,e:`26 ans au plus, à condition d'être non mariés et de poursuivre des études supérieures.`},
{q:`Les enfants handicapés à charge sont couverts :`,o:[`Jusqu'à 21 ans`,`Jusqu'à 26 ans`,`Sans limite d'âge`,`Jusqu'à 30 ans`],c:2,e:`Sans limite d'âge, s'ils sont dans l'impossibilité totale, permanente et définitive d'exercer une activité rémunérée.`},
{q:`Lorsque les deux parents sont assurés, les enfants sont déclarés :`,o:[`À l'organisme assureur du père`,`À l'organisme assureur de la mère`,`Aux deux organismes`,`Au choix des parents`],c:0,e:`Les enfants sont déclarés à l'organisme assureur du père.`},
{q:`En cas de dissolution du mariage, la déclaration des enfants se fait :`,o:[`Auprès de l'organisme de l'ex-conjoint auquel la garde est confiée`,`Toujours auprès du père`,`Toujours auprès de la mère`,`Auprès du tribunal`],c:0,e:`Auprès de l'organisme assureur de l'ex-conjoint auquel la garde des enfants est confiée.`},
{q:`L'extension de l'AMO aux parents de l'assuré :`,o:[`Est automatique et gratuite`,`Est possible à condition que l'assuré prenne en charge leur cotisation`,`Est interdite`,`Nécessite une décision de justice`],c:1,e:`L'assuré peut demander l'extension à son père et sa mère en prenant en charge la cotisation les concernant, fixée par décret.`},
{q:`Un membre de la famille peut-il être couvert s'il bénéficie déjà d'une assurance de même nature ?`,o:[`Oui, cumul autorisé`,`Non, la couverture suppose qu'il n'en bénéficie pas à titre personnel`,`Oui, avec accord de l'organisme`,`Uniquement pour les enfants`],c:1,e:`Condition expresse : ne pas être bénéficiaire à titre personnel d'une assurance de même nature.`},
{q:`Si la garde des enfants est confiée à une personne autre que le père ou la mère :`,o:[`Les enfants perdent la couverture`,`Ils conservent le bénéfice du régime de l'un des parents assurés`,`Ils passent au RAMED`,`Ils sont couverts par le tuteur`],c:1,e:`Ils conservent le bénéfice du régime d'AMO de l'un des parents assurés.`}
],
cards:[

{t:`Prestations garanties et exclusions`,ic:`🧾`,pages:`p.6-8`,
lesson:`<h3>🛡️ Les 4 risques couverts</h3>
<p>L'AMO garantit la couverture des risques et frais inhérents à : la <b>maladie</b> · l'<b>accident</b> · la <b>maternité</b> · la <b>réhabilitation physique et fonctionnelle</b>.</p>
<p>⚠️ Les <b>accidents du travail et maladies professionnelles</b> restent régis par leur propre législation.</p>
<h3>📋 Les 16 prestations remboursables</h3>
<p>1. Soins préventifs et curatifs liés aux <b>programmes prioritaires</b> · 2. Actes de médecine générale et de spécialités médicales et chirurgicales · 3. Suivi de la <b>grossesse, accouchement et suites</b> · 4. <b>Hospitalisation</b> et interventions chirurgicales, y compris <b>chirurgie réparatrice</b> · 5. <b>Analyses de biologie médicale</b> · 6. <b>Radiologie et imagerie</b> · 7. <b>Explorations fonctionnelles</b> · 8. <b>Médicaments admis au remboursement</b> · 9. <b>Poches de sang</b> et dérivés · 10. <b>Dispositifs médicaux et implants</b> · 11. <b>Prothèses et orthèses</b> · 12. <b>Lunetterie médicale</b> · 13. <b>Soins bucco-dentaires</b> · 14. <b>Orthodontie pour les enfants</b> · 15. <b>Rééducation fonctionnelle et kinésithérapie</b> · 16. <b>Actes paramédicaux</b>.</p>
<h3>🚫 Les 7 exclusions de l'AMO</h3>
<p><b>Chirurgie esthétique</b> · <b>cures thermales</b> · <b>acupuncture</b> · <b>mésothérapie</b> · <b>thalassothérapie</b> · <b>homéopathie</b> · prestations de la <b>médecine dite douce</b>.</p>
<div class="warn">⚠️ Mnémo des exclusions : <b>« E-CAMTH-D »</b> — Esthétique, Cures thermales, Acupuncture, Mésothérapie, Thalassothérapie, Homéopathie, Douce. La <b>chirurgie réparatrice</b>, elle, est <b>couverte</b>.</div>`,
qs:[
{q:`Les 4 risques couverts par l'AMO sont :`,o:[`Maladie, accident, maternité, réhabilitation physique et fonctionnelle`,`Maladie, vieillesse, invalidité, décès`,`Maladie, accident du travail, maternité, retraite`,`Maladie, chômage, accident, décès`],c:0,e:`Maladie, accident, maternité et réhabilitation physique et fonctionnelle. Les AT/MP relèvent d'une législation propre.`},
{q:`Lequel de ces actes est EXCLU des prestations de l'AMO ?`,o:[`La chirurgie réparatrice`,`La thalassothérapie`,`L'orthodontie pour les enfants`,`Les explorations fonctionnelles`],c:1,e:`Les 7 exclusions : chirurgie esthétique, cures thermales, acupuncture, mésothérapie, thalassothérapie, homéopathie, médecine douce.`},
{q:`Les accidents du travail et maladies professionnelles :`,o:[`Sont couverts par l'AMO`,`Restent régis par leur propre législation`,`Sont couverts par le RAMED`,`Ne sont pas couverts du tout`],c:1,e:`Ils demeurent régis par la législation et la réglementation les concernant.`},
{q:`L'orthodontie est prise en charge :`,o:[`Pour tous les assurés`,`Pour les enfants`,`Pour les femmes enceintes`,`Jamais`],c:1,e:`Orthodontie pour les enfants (prestation n° 14).`},
{q:`La chirurgie réparatrice est :`,o:[`Exclue comme la chirurgie esthétique`,`Couverte dans le cadre de l'hospitalisation et des interventions chirurgicales`,`Réservée au RAMED`,`Couverte à 100% seulement`],c:1,e:`Elle est expressément incluse dans les soins liés à l'hospitalisation et aux interventions chirurgicales.`},
{q:`Combien d'exclusions l'AMO prévoit-elle ?`,o:[`5`,`6`,`7`,`8`],c:2,e:`7 exclusions.`},
{q:`Parmi les prestations garanties figurent :`,o:[`Les poches de sang humain et dérivés sanguins`,`Les cures thermales`,`L'acupuncture`,`La médecine douce`],c:0,e:`Les poches de sang humain et les dérivés sanguins font partie des 16 prestations garanties.`}
],

{f:`Les 7 exclusions de l'AMO`,b:`Chirurgie <b>esthétique</b> · <b>cures thermales</b> · <b>acupuncture</b> · <b>mésothérapie</b> · <b>thalassothérapie</b> · <b>homéopathie</b> · médecine <b>douce</b>`},

/* U4 */
{t:`Remboursement, tarification et délais`,ic:`💳`,pages:`p.8-11`,
lesson:`<h3>💰 Principe</h3>
<p>L'AMO garantit le remboursement ou la <b>prise en charge directe d'une partie</b> des frais ; l'autre partie (<b>ticket modérateur</b>) reste à la charge de l'assuré, qui garde la <b>liberté de souscrire une assurance complémentaire</b>.</p>
<p>En cas de <b>maladie grave ou invalidante</b> nécessitant des soins de longue durée ou particulièrement onéreux, la part restant à charge fait l'objet d'une <b>exonération totale ou partielle</b>.</p>
<h3>🧮 Les 4 modes de remboursement</h3>
<p>• À l'<b>acte</b>, sur la base des <b>nomenclatures</b> fixées par l'autorité gouvernementale chargée de la santé<br>
• Sous forme de <b>forfait par pathologie</b> ou par <b>groupe homogène de maladies</b><br>
• Sous forme de <b>dotation globale ou de prépaiement</b><br>
• Sous forme de <b>capitation</b></p>
<h3>📏 Tarification nationale de référence (TNR)</h3>
<p>Fixée par voie <b>conventionnelle</b> ou, le cas échéant, <b>réglementaire</b>. Pour les <b>médicaments</b>, le TNR est le <b>prix public</b> ; pour les <b>appareillages et dispositifs médicaux</b>, les tarifs sont approuvés par l'administration <b>sur proposition de l'ANAM</b>.</p>
<h3>🌍 Soins à l'étranger</h3>
<p>Les prestations ne sont remboursées que si elles sont <b>prescrites et exécutées sur le territoire national</b>. Exceptions : <b>maladie inopinée</b> au cours d'un séjour à l'étranger, ou <b>impossibilité de recevoir au Maroc les soins appropriés</b> — dans ce dernier cas, <b>accord préalable</b> de l'organisme assureur exigé.</p>
<h3>⏱️ Les délais à retenir</h3>
<p>• Remboursement des frais médicaux à l'assuré : <b>3 mois maximum</b><br>
• Déboursement au profit du prestataire en cas de <b>tiers payant</b> : <b>6 mois maximum</b><br>
• Dépôt du dossier de remboursement (CNSS) : <b>60 jours</b> à compter de la première consultation</p>
<p>👉 Le bénéficiaire conserve le <b>libre choix</b> du praticien, de l'établissement, du pharmacien, du paramédical et du fournisseur, sous réserve des mesures de régulation. L'<b>inobservation des procédures</b> ne fait pas perdre le remboursement lorsqu'elle est <b>indépendante de la volonté</b> de l'intéressé, notamment du fait de son état de santé.</p>`,
qs:[
{q:`Le délai maximum de remboursement des frais médicaux à l'assuré est de :`,o:[`1 mois`,`3 mois`,`6 mois`,`12 mois`],c:1,e:`3 mois maximum pour le remboursement à l'assuré ; 6 mois maximum pour le déboursement au prestataire en tiers payant.`},

{q:`Pour les médicaments, le tarif national de référence est :`,o:[`Le prix public des médicaments`,`Le prix d'achat en gros`,`Un forfait fixé par l'ANAM`,`Le prix international`],c:0,e:`Pour les médicaments, le TNR est le prix public ; pour les dispositifs, les tarifs sont approuvés sur proposition de l'ANAM.`},
{q:`Les soins dispensés à l'étranger sont pris en charge :`,o:[`Toujours`,`Jamais`,`En cas de maladie inopinée lors d'un séjour, ou si les soins ne sont pas disponibles au Maroc avec accord préalable`,`Uniquement pour les fonctionnaires`],c:2,e:`Deux cas d'exception, le second exigeant l'accord préalable de l'organisme assureur.`},

],

{t:`La CNSS : secteur privé`,ic:`🏢`,pages:`p.12-15`,
lesson:`<h3>🏢 Qui gère quoi ?</h3>
<p><b>CNSS</b> : personnes assujetties au régime de sécurité sociale (<b>secteur privé</b>), leurs ayants droit et les <b>titulaires de pensions du privé</b>.<br>
<b>CNOPS</b> (et les sociétés mutualistes la composant) : <b>fonctionnaires et agents de l'État</b>, des collectivités locales, des établissements publics et personnes morales de droit public, et <b>titulaires de pensions du public</b>.<br>
👉 La couverture des <b>Forces armées royales</b> reste régie par ses propres textes.</p>
<h3>💼 Budget autonome de la CNSS (AMO)</h3>
<p>La gestion de l'AMO par la CNSS est <b>autonome</b> par rapport aux autres prestations.<br>
<b>Ressources</b> : cotisations salariales · contributions patronales · cotisations des titulaires de pensions · produits financiers des placements · majorations, astreintes et pénalités de retard · emprunts autorisés · dons et legs acceptés par le CA · autres ressources.<br>
<b>Dépenses</b> : paiements et remboursements des prestations · <b>contributions aux frais de fonctionnement de l'ANAM</b> · fonctionnement · investissement · remboursement des emprunts.</p>
<h3>📊 Taux de couverture CNSS</h3>
<p>• <b>70 %</b> de la tarification nationale de référence pour les groupes de prestations<br>
• <b>90 %</b> pour les <b>maladies graves ou invalidantes</b> nécessitant des soins de longue durée ou particulièrement coûteux, <b>lorsque les prestations sont dispensées dans les hôpitaux publics</b>, établissements publics de santé et services sanitaires de l'État<br>
👉 La prise en charge de ces maladies englobe <b>toutes</b> les prestations médicalement requises, <b>y compris la transplantation d'organes et de tissus</b>.</p>
<h3>💵 Les cotisations CNSS</h3>
<p>• Salariés du privé : <b>4 %</b> des rémunérations, réparti <b>50 % employeur / 50 % salarié</b><br>
• <b>+ 1 %</b> de la rémunération brute mensuelle, à la <b>charge exclusive de l'employeur</b><br>
• Marins pêcheurs à la part : <b>1,2 %</b> du produit brut sur les <b>chalutiers</b>, <b>1,5 %</b> sur les <b>sardiniers et palangriers</b><br>
• Titulaires de pensions : <b>4 %</b> du montant global des pensions de base, si ce montant ≥ <b>910 DH/mois</b> dans l'<b>agriculture</b> et ≥ <b>1 289 DH/mois</b> dans les autres secteurs<br>
• Assurance volontaire : <b>4 %</b> de la rémunération ayant servi à la dernière cotisation obligatoire</p>`,
qs:[
{q:`Le taux de couverture de base de la CNSS est de :`,o:[`70 % du TNR`,`80 % du TNR`,`90 % du TNR`,`100 % du TNR`],c:0,e:`70 % de la tarification nationale de référence ; 90 % pour les maladies graves prises en charge dans les structures publiques.`},
{q:`Le taux CNSS est porté à 90 % :`,o:[`Pour tous les soins hospitaliers`,`Pour les maladies graves ou invalidantes dispensées dans les structures publiques`,`Pour la maternité`,`Pour les médicaments`],c:1,e:`90 % pour les maladies graves ou invalidantes nécessitant des soins de longue durée ou coûteux, dans les hôpitaux publics, établissements publics de santé et services de l'État.`},
{q:`Le taux de cotisation AMO des salariés du secteur privé est de :`,o:[`4 %, réparti à 50/50 entre employeur et salarié`,`5 %, réparti à 50/50`,`6,37 %`,`2,5 %`],c:0,e:`4 % des rémunérations, moitié employeur moitié salarié, majoré de 1 % à la charge exclusive de l'employeur.`},
{q:`La majoration de 1 % de la cotisation CNSS est :`,o:[`À la charge du salarié`,`À la charge exclusive de l'employeur`,`Partagée`,`À la charge de l'État`],c:1,e:`Cette majoration, due par tous les employeurs assujettis, est à leur charge exclusive.`},
{q:`Le taux de cotisation des marins pêcheurs sur les sardiniers et palangriers est de :`,o:[`1,2 %`,`1,5 %`,`4 %`,`5 %`],c:1,e:`1,5 % sur les sardiniers et palangriers ; 1,2 % sur les chalutiers.`},
{q:`Les titulaires de pensions cotisent à la CNSS à hauteur de 4 % si le montant est au moins de :`,o:[`910 DH dans l'agriculture et 1 289 DH dans les autres secteurs`,`1 000 DH partout`,`600 DH`,`2 000 DH`],c:0,e:`Seuils : 910,00 DH/mois dans l'agriculture, 1 289,00 DH/mois dans les autres secteurs.`},
{q:`La prise en charge des maladies graves par la CNSS englobe :`,o:[`Toutes les prestations médicalement requises, y compris la transplantation d'organes et de tissus`,`Les seuls médicaments`,`La seule hospitalisation`,`Les seules analyses`],c:0,e:`Elle englobe l'ensemble des prestations médicalement requises, y compris la transplantation d'organes et de tissus.`},
{q:`Parmi les dépenses du budget AMO de la CNSS figure :`,o:[`La contribution aux frais de fonctionnement de l'ANAM`,`Le paiement des retraites`,`Les allocations familiales`,`Les indemnités de chômage`],c:0,e:`Les dépenses comprennent les remboursements, la contribution aux frais de fonctionnement de l'ANAM, le fonctionnement, l'investissement et le remboursement des emprunts.`}
],
cards:[
{f:`Répartition CNSS / CNOPS`,b:`<b>CNSS</b> : secteur <b>privé</b> et pensions du privé · <b>CNOPS</b> : fonctionnaires et agents publics et pensions du <b>public</b> · <b>FAR</b> : textes propres`},
{f:`Taux de couverture CNSS`,b:`<b>70 %</b> du TNR · <b>90 %</b> pour les maladies graves/invalidantes dispensées dans les <b>structures publiques</b> (y compris transplantation d'organes)`},
{f:`Cotisations CNSS (privé)`,b:`<b>4 %</b> des rémunérations (50 % employeur / 50 % salarié) <b>+ 1 %</b> à la charge exclusive de l'employeur`},
{f:`Cotisations des marins pêcheurs`,b:`<b>1,2 %</b> chalutiers · <b>1,5 %</b> sardiniers et palangriers (produit brut de la vente du poisson)`},
{f:`Seuils de cotisation des pensionnés CNSS`,b:`4 % si pension ≥ <b>910 DH</b>/mois (agriculture) ou ≥ <b>1 289 DH</b>/mois (autres secteurs)`}
]},

{t:`La CNOPS : secteur public`,ic:`🏛️`,pages:`p.15-17`,
lesson:`<h3>📋 Les 6 missions de la CNOPS en matière d'AMO</h3>
<p>1. <b>Instruire</b> les demandes d'affiliation des employeurs et d'immatriculation, en coordination avec les sociétés mutualistes<br>
2. Assurer le <b>recouvrement</b> des cotisations salariales et contributions patronales<br>
3. <b>Rembourser ou prendre en charge</b> directement les prestations garanties<br>
4. Conclure les <b>conventions nationales</b> avec les prestataires de soins<br>
5. Établir les <b>comptes</b> de la gestion de l'AMO<br>
6. Assurer le <b>contrôle médical</b>, en coordination avec les sociétés mutualistes</p>
<h3>📊 Les taux CNOPS — à mémoriser</h3>
<table><tr><th>Prestation</th><th>Taux</th></tr>
<tr><td>Actes ambulatoires (médecine, paramédical, kiné) hors médicaments</td><td><b>80 %</b> du TNR</td></tr>
<tr><td>Hospitalisation, chirurgie, chirurgie réparatrice, sang et dérivés labiles</td><td><b>90 %</b> du TNR — <b>100 %</b> dans les structures publiques</td></tr>
<tr><td>Médicaments admis au remboursement</td><td><b>70 %</b> du prix public Maroc</td></tr>
<tr><td>Lunetterie, dispositifs médicaux et implants</td><td><b>Forfaits</b> du TNR</td></tr>
<tr><td>Prothèses et orthèses</td><td><b>Forfaits</b> du TNR</td></tr>
<tr><td>Soins bucco-dentaires</td><td><b>80 %</b> du TNR</td></tr>
<tr><td>Orthodontie des enfants</td><td><b>Forfait</b> du TNR</td></tr></table>
<p>En cas de <b>maladie grave ou invalidante</b> : exonération <b>totale ou partielle</b> selon la liste arrêtée par le ministre de la Santé ; la part restant à charge <b>ne peut dépasser 10 %</b> du TNR, et l'exonération est <b>totale pour les soins onéreux</b>.</p>
<h3>💵 Cotisations CNOPS</h3>
<p>• Salariés du public : <b>5 %</b> des rémunérations, <b>50 % employeur / 50 % salarié</b>, chaque part étant perçue avec un <b>minimum de 70 DH</b> et un <b>plafond de 400 DH</b> par mois<br>
• Titulaires de pensions : <b>2,5 %</b> du montant global des pensions de base, dans les mêmes limites <b>70 – 400 DH</b><br>
• Assurance volontaire : <b>5 %</b> du dernier salaire mensuel de référence</p>
<div class="warn">⚠️ Piège fréquent : <b>CNSS = 4 % (+1 % employeur)</b> · <b>CNOPS = 5 %</b>. Pensions : <b>CNSS 4 %</b> · <b>CNOPS 2,5 %</b>.</div>`,
qs:[
{q:`Le taux de cotisation AMO des salariés du secteur public (CNOPS) est de :`,o:[`4 %`,`5 %`,`6,37 %`,`2,5 %`],c:1,e:`5 % des rémunérations, réparti 50 % employeur / 50 % salarié, avec minimum 70 DH et plafond 400 DH par part et par mois.`},
{q:`Les cotisations CNOPS sont perçues dans la limite d'un plafond mensuel de :`,o:[`200 DH`,`400 DH`,`600 DH`,`1 000 DH`],c:1,e:`Minimum mensuel de 70 DH et plafond mensuel de 400 DH par part.`},
{q:`Le taux de cotisation des titulaires de pensions du public est de :`,o:[`2,5 %`,`4 %`,`5 %`,`6 %`],c:0,e:`2,5 % du montant global des pensions de base, dans la limite 70–400 DH par mois.`},
{q:`Les soins ambulatoires (hors médicaments) sont remboursés par la CNOPS à :`,o:[`70 %`,`80 % du TNR`,`90 %`,`100 %`],c:1,e:`80 % de la tarification nationale de référence pour les actes ambulatoires, paramédicaux et de kinésithérapie hors médicaments.`},
{q:`L'hospitalisation est prise en charge par la CNOPS à 90 %, taux porté à 100 % :`,o:[`Dans les cliniques privées`,`Dans les hôpitaux publics, établissements publics de santé et services sanitaires de l'État`,`À l'étranger`,`Pour les enfants`],c:1,e:`100 % lorsque les prestations sont rendues dans les structures publiques.`},
{q:`Les médicaments sont remboursés par la CNOPS à :`,o:[`70 % du prix public Maroc`,`80 % du TNR`,`90 % du prix public`,`100 %`],c:0,e:`70 % du prix public Maroc.`},
{q:`Pour les maladies graves, la part restant à la charge de l'assuré CNOPS :`,o:[`Ne peut dépasser 10 % du TNR`,`Est toujours de 20 %`,`Est de 30 %`,`N'est pas plafonnée`],c:0,e:`Elle ne peut être supérieure à 10 % du TNR ; l'exonération est totale pour les soins onéreux.`},
{q:`Les soins bucco-dentaires sont remboursés par la CNOPS à :`,o:[`70 %`,`80 % du TNR`,`90 %`,`Sous forme de forfait`],c:1,e:`80 % du TNR ; l'orthodontie des enfants, elle, fait l'objet d'un forfait.`},
{q:`Qui conclut les conventions nationales avec les prestataires de soins ?`,o:[`La CNOPS (parmi ses missions)`,`Le ministère de l'Intérieur`,`Les sociétés mutualistes seules`,`Le Parlement`],c:0,e:`Conclure les conventions nationales avec les prestataires de soins fait partie des missions de la CNOPS.`}
],
cards:[
{f:`Taux CNOPS : le tableau`,b:`Ambulatoire <b>80 %</b> · hospitalisation <b>90 %</b> (<b>100 %</b> dans le public) · médicaments <b>70 %</b> du PPM · bucco-dentaire <b>80 %</b> · lunetterie, dispositifs, prothèses, orthodontie : <b>forfaits</b>`},
{f:`Cotisations CNOPS`,b:`Salariés publics : <b>5 %</b> (50/50), min <b>70 DH</b> – plafond <b>400 DH</b> par part · pensions : <b>2,5 %</b> (mêmes limites)`},
{f:`Piège des taux de cotisation`,b:`<b>CNSS</b> : 4 % (+1 % employeur), pensions 4 % · <b>CNOPS</b> : 5 %, pensions 2,5 %`},
{f:`Reste à charge maladies graves (CNOPS)`,b:`≤ <b>10 %</b> du TNR ; exonération <b>totale</b> pour les <b>soins onéreux</b>`}
]},

{t:`Le RAMED`,ic:`🤝`,pages:`p.18-24`,
lesson:`<h3>📅 Repères</h3>
<p>Phase pilote en <b>2008</b> dans la région de <b>Tadla-Azilal</b> ; <b>généralisation le 13 mars 2012</b>.</p>
<h3>💰 Financement (3 sources)</h3>
<p>• <b>État : 75 %</b><br>• <b>Collectivités territoriales : 5 %</b>, soit <b>40 DH</b> par personne en situation de <b>pauvreté</b><br>• <b>Bénéficiaires : 20 %</b>, soit <b>120 DH</b> par personne en situation de <b>vulnérabilité</b>, plafond <b>600 DH par ménage</b></p>
<h3>🎯 Éligibilité</h3>
<p><b>Deux conditions</b> : ne relever d'<b>aucun régime d'AMO</b> et ne pas disposer de <b>ressources suffisantes</b>.</p>
<table><tr><th></th><th>Urbain</th><th>Rural</th></tr>
<tr><td>Critère principal</td><td>Revenu annuel ≤ <b>5 650 DH</b></td><td>Score patrimonial ≤ <b>70</b> par personne</td></tr>
<tr><td>Score socio-économique</td><td>≤ <b>11</b></td><td>≤ <b>6</b></td></tr>
<tr><td><b>Vulnérabilité</b></td><td>Revenu &gt; 3 767 et ≤ 5 650 DH</td><td>Score patrimonial &gt; 28 et ≤ 70</td></tr>
<tr><td><b>Pauvreté</b></td><td>Revenu ≤ <b>3 767 DH</b></td><td>Score patrimonial ≤ <b>28</b></td></tr></table>
<p><b>Carte</b> : <b>pauvreté</b> → aucune contribution, validité <b>3 ans</b> · <b>vulnérabilité</b> → <b>120 DH/personne/an</b> (plafond 600 DH/ménage), validité <b>1 an</b>. Le <b>récépissé</b> est valable <b>3 mois</b>.</p>
<h3>👤 Les bénéficiaires de droit (art. 118)</h3>
<p>Pensionnaires des <b>établissements de bienfaisance</b>, orphelinats, hospices, établissements de rééducation et tout établissement à but non lucratif hébergeant des enfants abandonnés ou adultes sans famille · pensionnaires des <b>établissements pénitentiaires</b> · <b>personnes sans domicile fixe</b> · personnes bénéficiant de la <b>gratuité en vertu d'une législation particulière</b>.<br>
Ils sont <b>dispensés de la procédure d'éligibilité</b>, <b>ne paient aucune contribution</b> et ont droit aux <b>mêmes prestations</b>.</p>
<p><b>Article 119</b> — gratuité en vertu de textes particuliers : <b>anciens militaires et anciens combattants</b> (loi 34-97) · <b>pupilles de la Nation</b> (loi 33-97) · <b>malades indigents étrangers</b> (dahir 1-61-203).</p>
<h3>🏥 Panier de soins</h3>
<p><b>Gratuit</b>, à condition de respecter la <b>filière de soins</b> : elle <b>commence par le centre de santé de rattachement</b> et peut se terminer par le <b>CHU</b>. Toutes les prestations sont dispensées <b>uniquement dans les structures publiques</b>. Le panier comprend 18 postes, dont les <b>évacuations sanitaires interhospitalières</b>. Sont <b>exclues</b> la chirurgie plastique et esthétique, <b>sauf</b> chirurgie réparatrice et orthopédie maxillo-faciale médicalement requises.</p>`,
qs:[
{q:`Le RAMED a été généralisé le :`,o:[`18 août 2005`,`13 mars 2012`,`13 janvier 2016`,`14 avril 2021`],c:1,e:`Généralisation du RAMED le 13 mars 2012, après une phase pilote lancée en 2008 à Tadla-Azilal.`},
{q:`La part de l'État dans le financement du RAMED est de :`,o:[`50 %`,`75 %`,`80 %`,`95 %`],c:1,e:`État 75 %, collectivités territoriales 5 %, bénéficiaires 20 %.`},
{q:`La contribution annuelle des personnes en situation de vulnérabilité est de :`,o:[`40 DH par personne`,`120 DH par personne, plafond 600 DH par ménage`,`600 DH par personne`,`Gratuite`],c:1,e:`120 DH par personne et par an, plafonnés à 600 DH par ménage.`},
{q:`En milieu urbain, une personne est en situation de pauvreté si son revenu pondéré est :`,o:[`≤ 3 767 DH par personne et par an`,`≤ 5 650 DH`,`≤ 11 DH`,`≤ 600 DH`],c:0,e:`Pauvreté urbaine : revenu pondéré ≤ 3 767 DH/personne/an ; vulnérabilité : > 3 767 et ≤ 5 650 DH.`},
{q:`En milieu rural, le score patrimonial ne doit pas dépasser :`,o:[`28 par personne`,`70 par personne`,`11`,`6`],c:1,e:`Éligibilité rurale : score patrimonial ≤ 70 par personne et score socio-économique ≤ 6.`},
{q:`La carte RAMED des personnes en situation de pauvreté est valable :`,o:[`1 an`,`2 ans`,`3 ans`,`5 ans`],c:2,e:`3 ans et sans contribution ; celle des personnes vulnérables est valable 1 an avec contribution annuelle.`},
{q:`Le récépissé de la demande RAMED est valable :`,o:[`1 mois`,`3 mois`,`6 mois`,`1 an`],c:1,e:`Trois mois ; passé ce délai il n'est plus valable.`},
{q:`Les pensionnaires des établissements pénitentiaires sont :`,o:[`Bénéficiaires de droit du RAMED`,`Exclus du RAMED`,`Soumis à la procédure d'éligibilité`,`Redevables d'une contribution`],c:0,e:`Bénéficiaires de droit (art. 118) : dispensés de la procédure d'éligibilité, sans contribution, mêmes prestations.`},
{q:`La filière de soins du RAMED commence par :`,o:[`Le CHU`,`Le centre de santé de rattachement`,`L'hôpital provincial`,`Une clinique privée`],c:1,e:`Elle commence par le centre de santé de rattachement et peut se terminer par le CHU ; les prestations sont dispensées uniquement dans le public.`},
{q:`Les pupilles de la Nation bénéficient de la gratuité en vertu de :`,o:[`La loi 34-97`,`La loi 33-97`,`Le dahir 1-61-203`,`La loi 65-00`],c:1,e:`Loi 33-97 : pupilles de la Nation ; loi 34-97 : anciens militaires et anciens combattants ; dahir 1-61-203 : malades indigents étrangers.`}
],
cards:[
{f:`Financement du RAMED`,b:`<b>État 75 %</b> · <b>collectivités 5 %</b> (40 DH/personne en pauvreté) · <b>bénéficiaires 20 %</b> (120 DH/personne vulnérable, plafond 600 DH/ménage)`},
{f:`Seuils RAMED urbain / rural`,b:`<b>Urbain</b> : revenu ≤ 5 650 DH et score socio-éco ≤ 11 (pauvreté ≤ 3 767 DH) · <b>Rural</b> : score patrimonial ≤ 70 et score socio-éco ≤ 6 (pauvreté ≤ 28)`},
{f:`Validité des cartes RAMED`,b:`<b>Pauvreté</b> : 3 ans, sans contribution · <b>Vulnérabilité</b> : 1 an, 120 DH/personne/an · <b>Récépissé</b> : 3 mois`},
{f:`Bénéficiaires de droit (art. 118)`,b:`Pensionnaires des établissements de bienfaisance et pénitentiaires · <b>SDF</b> · personnes bénéficiant de la gratuité par législation particulière — <b>sans procédure d'éligibilité ni contribution</b>`},
{f:`Filière de soins du RAMED`,b:`Commence par le <b>centre de santé de rattachement</b>, se termine éventuellement au <b>CHU</b> ; prestations <b>uniquement dans le public</b>`}
]},

/* U8 */
{t:`AMO TADAMON`,ic:`🫱`,pages:`p.25-30`,
lesson:`<h3>🔄 Du RAMED à l'AMO TADAMON</h3>
<p>La <b>loi 27-22</b>, modifiant et complétant la loi 65-00, a créé l'<b>AMO-TADAMON</b> pour les personnes <b>incapables de s'acquitter des cotisations</b>, en <b>supprimant le RAMED</b>. Le <b>1er décembre 2022</b>, tous les RAMEDistes titulaires d'une carte valide au 30/11/2022 ont <b>basculé automatiquement</b> vers ce régime.</p>
<p><b>Gestionnaire : la CNSS.</b> L'<b>État prend en charge l'intégralité des cotisations</b> et le <b>ticket modérateur</b> pour les prestations du secteur public → <b>gratuité</b> dans le public. Le régime couvre plus de <b>30 % de la population</b>, soit plus de <b>11 millions</b> de personnes.</p>
<h3>🎯 Les 3 conditions d'éligibilité</h3>
<p>1. <b>Inscription au Registre Social Unifié (RSU)</b><br>
2. Incapacité de s'acquitter des cotisations : score <b>inférieur au seuil</b> d'éligibilité (<b>9,3264284</b>, décret n° 2-22-923)<br>
3. <b>Non-assujettissement</b> à un autre régime d'AMO, ni comme assuré ni comme ayant droit</p>
<p>Le ciblage <b>RNP/RSU</b> est encadré par la <b>loi 72-18</b>, qui crée l'<b>Agence Nationale des Registres (ANR)</b>.</p>
<h3>🏢 Les 4 intervenants</h3>
<p>Ministère de l'<b>Économie et des Finances</b> (Direction du Budget) · ministère de l'<b>Intérieur</b> (ANR) · <b>CNSS</b> · <b>Haute Autorité de Santé</b>.</p>
<h3>📊 Taux de remboursement</h3>
<p>• <b>70 %</b> du tarif national de référence<br>• <b>Entre 70 % et 100 %</b> pour certaines <b>ALD / ALC</b><br>• <b>100 %</b> pour les prestations dispensées <b>à l'étranger</b> ne pouvant être exécutées au Maroc</p>
<h3>🧬 ALD et ALC</h3>
<p><b>ALD</b> = <b>affection de longue durée</b> : maladie chronique nécessitant un <b>traitement à vie</b>. <b>ALC</b> = <b>affection lourde et coûteuse</b> : traitements coûteux (chirurgie cardiovasculaire, transplantation d'organes).<br>
La liste, fixée par arrêté du ministre de la Santé, compte <b>197 maladies</b>, prises en charge entre <b>90 % et 100 %</b>. S'y ajoutent <b>252 maladies rares</b> hors liste, prises en charge exceptionnellement par la CNSS.</p>
<p><b>Panier</b> : 17 postes, identiques à l'AMO, y compris les <b>évacuations sanitaires interhospitalières</b>. <b>Exclusion</b> : chirurgie plastique et esthétique, <b>sauf</b> chirurgie réparatrice et orthopédie maxillo-faciale médicalement requises.</p>`,
qs:[
{q:`Quelle loi a créé l'AMO-TADAMON en supprimant le RAMED ?`,o:[`La loi 65-00`,`La loi 27-22`,`La loi 60-22`,`La loi 98-15`],c:1,e:`La loi 27-22, modifiant et complétant la loi 65-00.`},
{q:`Le basculement automatique des RAMEDistes vers l'AMO-TADAMON a eu lieu le :`,o:[`1er décembre 2022`,`13 mars 2012`,`14 avril 2021`,`1er janvier 2024`],c:0,e:`Le 01/12/2022, pour tous les titulaires d'une carte RAMED valide au 30/11/2022.`},
{q:`Qui gère l'AMO-TADAMON ?`,o:[`La CNOPS`,`La CNSS`,`L'ANAM`,`La mutuelle des FAR`],c:1,e:`Régime assurantiel géré par la Caisse Nationale de Sécurité Sociale.`},
{q:`Combien de maladies figurent sur la liste des ALD/ALC fixée par arrêté ?`,o:[`100`,`152`,`197`,`252`],c:2,e:`197 maladies ALD/ALC, prises en charge entre 90 % et 100 % ; 252 maladies rares hors liste sont prises en charge exceptionnellement.`},

{q:`Le seuil d'éligibilité à l'AMO-TADAMON est fixé à :`,o:[`9,3264284`,`10,237316`,`11,013068`,`5 650`],c:0,e:`Score inférieur au seuil de 9,3264284 fixé par l'article 1 du décret n° 2-22-923.`},
{q:`L'inscription à quel registre conditionne l'éligibilité à l'AMO-TADAMON ?`,o:[`Le registre du commerce`,`Le Registre Social Unifié (RSU)`,`Le registre de l'état civil`,`Le registre des professions`],c:1,e:`Inscription au RSU, avec un score inférieur au seuil et l'absence d'autre régime AMO.`},
{q:`Quelle loi encadre le dispositif de ciblage RNP/RSU et crée l'ANR ?`,o:[`La loi 72-18`,`La loi 27-22`,`La loi 65-00`,`La loi 46-23`],c:0,e:`Loi 72-18 relative au dispositif de ciblage des bénéficiaires des programmes d'appui social et à la création de l'Agence nationale des registres.`},
{q:`Dans l'AMO-TADAMON, l'État prend en charge :`,o:[`Uniquement la cotisation`,`La cotisation et le ticket modérateur pour les prestations du secteur public`,`Uniquement le ticket modérateur`,`Rien`],c:1,e:`Cotisation intégrale + part restant à charge (ticket modérateur) dans le public, d'où la gratuité des prestations publiques.`},
{q:`Une ALC est :`,o:[`Une maladie chronique nécessitant un traitement à vie`,`Une affection lourde et coûteuse nécessitant des traitements coûteux`,`Une maladie rare`,`Une maladie professionnelle`],c:1,e:`ALD = affection de longue durée (traitement à vie) ; ALC = affection lourde et coûteuse (ex. chirurgie cardiovasculaire, transplantation).`}
],

{t:`AMO ACHAMIL et AMO-TNS`,ic:`🧑‍🔧`,pages:`p.31-36`,
lesson:`<h3>🧑‍🔧 AMO ACHAMIL</h3>
<p>Institué par la <b>loi 60-22</b> (publiée le <b>15 juin 2023</b>, dahir du 25/05/2023) et son <b>décret 2.23.690</b>, au profit des personnes <b>capables de s'acquitter des cotisations</b> et <b>n'exerçant aucune activité</b> rémunérée ou non rémunérée. Lancé progressivement <b>entre 2022 et 2025</b>, il vise les <b>22 millions</b> de Marocains sans couverture. Gestionnaire : la <b>CNSS</b>.</p>
<p><b>Conditions</b> : inscription au <b>RSU</b> (demandeur et ayants droit) · score <b>supérieur au seuil</b> ouvrant droit à l'AMO TADAMON · ne pas relever d'un autre régime AMO.</p>
<p><b>Cotisation mensuelle selon le score RSU</b>, de <b>144 DH</b> (score &gt; 9,3264284) jusqu'à <b>1 164 DH</b> (score &gt; 11,013068), par prélèvement bancaire mensuel. Paliers intermédiaires : 176 · 224 · 287 · 355 · 454 · 611 DH.</p>
<p><b>Remboursement</b> : <b>70 %</b> du TNR · <b>70 à 100 %</b> pour ALD/ALC · <b>100 %</b> pour les soins à l'étranger indisponibles au Maroc. Base : TNR ; pour les médicaments, le <b>prix public de vente</b> ou celui du <b>générique le plus proche</b> s'il est disponible. Dépôt du dossier : <b>60 jours</b> ; remboursement : <b>3 mois</b> ; versement par <b>virement bancaire</b>.</p>
<p>👉 La réforme a fait passer le taux de couverture maladie de <b>42 % (2020)</b> à plus de <b>95 % (2025)</b>.</p>
<h3>👷 AMO-TNS</h3>
<p>Régime des <b>travailleurs non salariés</b> : professionnels, travailleurs indépendants et personnes exerçant une <b>activité libérale</b>. Institué par la <b>loi 98-15</b>, modifiée et complétée par la <b>loi 46-23</b>, qui :</p>
<p>• priorise le classement selon les régimes de l'<b>auto-entrepreneur</b> ou de la <b>Contribution Professionnelle Unique (CPU)</b><br>
• introduit un <b>délai de carence de 3 mois</b> en cas de régularisation après une interruption de paiement <b>supérieure à 6 mois</b><br>
• impose <b>une seule cotisation</b> en cas d'activités multiples<br>
• conditionne la <b>délivrance des autorisations d'exercice</b> et la <b>recevabilité des aides et subventions</b> de l'État à une <b>attestation de régularité</b> de paiement</p>
<p>La cotisation est calculée sur un <b>revenu forfaitaire</b> par catégorie professionnelle ; le <b>taux est de 6,37 %</b>. Le panier est <b>identique</b> à celui des salariés CNSS.</p>`,
qs:[
{q:`Quelle loi institue l'AMO ACHAMIL ?`,o:[`La loi 27-22`,`La loi 60-22`,`La loi 98-15`,`La loi 72-18`],c:1,e:`Loi 60-22 (publiée le 15 juin 2023), avec le décret d'application 2.23.690.`},
{q:`L'AMO ACHAMIL s'adresse aux personnes :`,o:[`Incapables de payer les cotisations`,`Capables de s'acquitter des cotisations et n'exerçant aucune activité rémunérée ou non`,`Fonctionnaires`,`Étudiants`],c:1,e:`Personnes capables de payer, n'exerçant aucune activité, dont le score RSU dépasse le seuil de l'AMO TADAMON.`},
{q:`La cotisation mensuelle la plus élevée de l'AMO ACHAMIL est de :`,o:[`611 DH`,`1 164 DH`,`454 DH`,`355 DH`],c:1,e:`1 164 DH pour un score supérieur à 11,013068 ; la plus faible est de 144 DH.`},
{q:`La cotisation mensuelle minimale de l'AMO ACHAMIL est de :`,o:[`120 DH`,`144 DH`,`176 DH`,`224 DH`],c:1,e:`144 DH pour un score supérieur à 9,3264284 et ne dépassant pas 9,5124369.`},
{q:`Le taux de cotisation de l'AMO-TNS est de :`,o:[`4 %`,`5 %`,`6,37 %`,`2,5 %`],c:2,e:`6,37 %, calculé sur la base d'un revenu forfaitaire applicable à la catégorie professionnelle.`},
{q:`Quelle loi institue le régime AMO-TNS ?`,o:[`La loi 98-15`,`La loi 46-23`,`La loi 60-22`,`La loi 65-00`],c:0,e:`Loi 98-15, modifiée et complétée par la loi 46-23.`},
{q:`La loi 46-23 introduit un délai de carence de :`,o:[`1 mois`,`3 mois en cas de régularisation après une interruption de plus de 6 mois`,`6 mois`,`12 mois`],c:1,e:`Délai de carence de 3 mois lorsque l'assuré régularise après une interruption de paiement supérieure à 6 mois.`},
{q:`Grâce à la réforme, le taux de couverture maladie est passé de 42 % en 2020 à :`,o:[`Plus de 95 % en 2025`,`70 % en 2025`,`80 % en 2024`,`60 % en 2023`],c:0,e:`De 42 % (2020) à plus de 95 % (2025).`},
{q:`En cas d'activités multiples, le TNS paie :`,o:[`Une cotisation par activité`,`Une seule cotisation`,`Une cotisation double`,`Aucune cotisation`],c:1,e:`La loi 46-23 impose le paiement d'une seule cotisation en cas de double ou multiples activités.`}
],
cards:[
{f:`AMO ACHAMIL : loi et cible`,b:`<b>Loi 60-22</b> (décret 2.23.690) · personnes <b>capables de cotiser</b> n'exerçant <b>aucune activité</b> · gérée par la <b>CNSS</b>`},
{f:`Cotisations AMO ACHAMIL`,b:`De <b>144 DH</b> à <b>1 164 DH</b> par mois selon le score RSU (144 · 176 · 224 · 287 · 355 · 454 · 611 · 1 164)`},
{f:`AMO-TNS : lois et taux`,b:`<b>Loi 98-15</b>, modifiée par la <b>loi 46-23</b> · taux de cotisation <b>6,37 %</b> sur revenu forfaitaire · panier identique aux salariés CNSS`},
{f:`Apports de la loi 46-23`,b:`Priorité au classement auto-entrepreneur/<b>CPU</b> · <b>carence de 3 mois</b> après interruption &gt; 6 mois · <b>une seule cotisation</b> si activités multiples · attestation de régularité exigée pour les autorisations et les aides`}
]},

{t:`AMO Étudiants`,ic:`🎓`,pages:`p.36-40`,
lesson:`<h3>🎓 Le régime AMO-E</h3>
<p>Démarré le <b>13 janvier 2016</b>, il s'adresse aux étudiants <b>ne disposant d'aucune couverture médicale</b>, ni à titre personnel ni comme ayant droit.</p>
<p><b>Publics éligibles</b> : étudiants et stagiaires de l'enseignement supérieur ou de la formation des cadres (accès exigeant au moins le <b>baccalauréat</b>) · cycle terminal de l'<b>enseignement traditionnel</b> · classes préparatoires et <b>technicien supérieur</b> · <b>technicien spécialisé</b> · établissements <b>privés</b> de formation professionnelle.</p>
<p><b>Conditions</b> : être <b>régulièrement inscrit</b> · être âgé de <b>30 ans au plus</b> (sauf cycle terminal de l'enseignement traditionnel) · ne bénéficier d'<b>aucune couverture</b> comme assuré ou ayant droit.</p>
<div class="warn">⚠️ L'AMO-E ne couvre <b>pas les ayants droit</b> de l'étudiant (ni conjoint ni enfants). Les étudiants déjà couverts (CNOPS, CNSS, TNS-Tadamon, couverture transitoire art. 114, mutuelle des FAR) ne sont pas éligibles et restent couverts <b>jusqu'à 26 ans</b>.</div>
<h3>📊 Les taux de remboursement (CNOPS)</h3>
<p>• Consultations et visites (généraliste ou spécialiste) : <b>80 % du TNR</b><br>
• Analyses de biologie médicale : <b>80 % du TNR</b><br>
• Soins et prothèses dentaires : <b>80 % du TNR</b><br>
• Prothèses et orthèses : <b>100 % du forfait</b> fixé par arrêté du ministre de la Santé<br>
• <b>Optique</b> : forfait de <b>800 DH</b>, renouvellement des lunettes <b>tous les 2 ans</b><br>
• <b>Kinésithérapie</b> : <b>80 %</b> du TNR, fixé à <b>50 DH la séance</b><br>
• <b>Médicaments</b> : <b>70 % du PPV</b> pour les soins ordinaires, <b>100 % du PPV</b> en cas d'<b>ALD / maladies coûteuses</b> (remboursement sur la base du <b>générique</b> s'il est disponible)</p>
<p>Les <b>exclusions</b> sont les mêmes que pour l'AMO (esthétique, cures thermales, acupuncture, mésothérapie, thalassothérapie, homéopathie, médecine douce). La liste des ALD comporte <b>42 affections</b> (AVC, diabète, insuffisance rénale chronique terminale, SIDA, sclérose en plaques, tumeurs malignes…).</p>`,
qs:[
{q:`Le régime AMO des étudiants a démarré le :`,o:[`18 août 2005`,`13 mars 2012`,`13 janvier 2016`,`14 avril 2021`],c:2,e:`13 janvier 2016.`},
{q:`L'âge maximum pour bénéficier de l'AMO-Étudiants est de :`,o:[`26 ans`,`28 ans`,`30 ans au plus`,`35 ans`],c:2,e:`30 ans au plus, sauf pour les étudiants du cycle terminal de l'enseignement traditionnel.`},
{q:`L'AMO-Étudiants couvre :`,o:[`L'étudiant et ses ayants droit`,`L'étudiant uniquement, sans ses ayants droit`,`Uniquement les boursiers`,`Uniquement le public`],c:1,e:`L'AMO-E est destinée aux étudiants éligibles et ne concerne pas leurs ayants droit (conjoints ou enfants).`},
{q:`Les consultations sont remboursées à l'étudiant à hauteur de :`,o:[`70 % du TNR`,`80 % du TNR`,`90 % du TNR`,`100 %`],c:1,e:`80 % du tarif national de référence, comme les analyses et les soins dentaires.`},
{q:`Le forfait optique de l'AMO-Étudiants est fixé à :`,o:[`400 DH`,`600 DH`,`800 DH`,`1 000 DH`],c:2,e:`800 DH, avec renouvellement possible tous les deux ans à compter de la dernière prestation.`},
{q:`La séance de kinésithérapie est remboursée sur la base d'un tarif de :`,o:[`30 DH`,`50 DH`,`80 DH`,`100 DH`],c:1,e:`80 % du TNR, ce dernier étant fixé à 50 DH par séance.`},
{q:`Les médicaments sont remboursés à l'étudiant à :`,o:[`70 % du PPV, et 100 % en cas d'ALD ou maladie coûteuse`,`80 % dans tous les cas`,`100 % dans tous les cas`,`50 %`],c:0,e:`70 % du prix public de vente pour les soins ordinaires, 100 % pour les ALD et maladies coûteuses.`},
{q:`Les étudiants déjà couverts par la CNOPS ou la CNSS comme ayants droit :`,o:[`Sont éligibles à l'AMO-E`,`Ne sont pas éligibles et restent couverts jusqu'à 26 ans`,`Doivent choisir`,`Perdent leur couverture`],c:1,e:`Ils ne sont pas éligibles à l'AMO-Étudiants et bénéficient des prestations de leur régime jusqu'à 26 ans.`},
{q:`Le remboursement des prothèses et orthèses médicales pour l'étudiant est de :`,o:[`80 % du TNR`,`100 % du montant forfaitaire fixé par arrêté du ministre de la Santé`,`70 % du PPV`,`50 %`],c:1,e:`100 % de la base du montant forfaitaire, certains dispositifs nécessitant un accord de remboursement (prise en charge).`}
],
cards:[
{f:`AMO-Étudiants : date et âge limite`,b:`Démarrage le <b>13 janvier 2016</b> · âge <b>≤ 30 ans</b> (sauf cycle terminal de l'enseignement traditionnel) · <b>ne couvre pas les ayants droit</b>`},
{f:`Taux AMO-E`,b:`Consultations, analyses, dentaire : <b>80 % du TNR</b> · prothèses/orthèses : <b>100 % du forfait</b> · médicaments : <b>70 % du PPV</b> (<b>100 %</b> si ALD)`},
{f:`Forfaits AMO-E à retenir`,b:`<b>Optique : 800 DH</b>, renouvellement tous les <b>2 ans</b> · <b>kinésithérapie : 50 DH la séance</b> remboursée à 80 %`}
]},

lesson:`<h3>🧱 Les 3 préalables</h3>
<p>1. Une <b>vision claire et des valeurs partagées</b><br>
2. Une <b>analyse approfondie</b> des dysfonctionnements du système, des problèmes de santé et des changements sociodémographiques<br>
3. Une <b>réponse aux besoins</b> de la population : accès aux soins, promotion de la santé et surtout <b>qualité des prestations</b></p>
<h3>🏛️ Les 3 piliers</h3>
<p><b>Pilier 1</b> : organisation et développement de l'<b>offre de soins</b> pour améliorer l'accès aux services de santé<br>
<b>Pilier 2</b> : renforcement des <b>programmes nationaux de santé</b> et de lutte contre les maladies<br>
<b>Pilier 3</b> : amélioration de la <b>gouvernance</b> et optimisation de l'allocation et de l'utilisation des <b>ressources</b></p>
<div class="tip">🔢 Les chiffres du plan : <b>3 piliers · 25 axes · 125 actions · près de 700 mesures opérationnelles</b>.<br>
Détail : Pilier 1 = <b>8 axes, 34 actions, 178 mesures</b> · Pilier 2 = <b>8 axes, 41 actions, 211 mesures</b> · Pilier 3 = <b>9 axes, 50 actions, 253 mesures</b>.</div>
<h3>💎 Les 6 valeurs</h3>
<p><b>Équité · Solidarité · Accessibilité · Qualité · Performance · Redevabilité</b></p>
<h3>👁️ La vision</h3>
<p>« Un <b>système de santé cohérent</b> pour une <b>offre de soins organisée, de qualité et accessible pour tous</b>, animée par des <b>programmes sanitaires performants</b> et supportée par une <b>nouvelle gouvernance</b>. »</p>

/* U2 */
{t:`Le contexte international`,ic:`🌍`,pages:`p.3-5`,
lesson:`<h3>🎯 Les ODD</h3>
<p>L'<b>objectif 3</b> — « permettre à tous de vivre en bonne santé et promouvoir le bien-être de tous à tout âge » — engage le Maroc à réduire les inégalités, garantir la <b>sécurité sanitaire</b> et améliorer la réponse du système aux <b>changements climatiques</b>, aux <b>urgences de santé publique</b> et aux <b>catastrophes naturelles</b>.</p>
<h3>⚠️ Les 4 défis mondiaux</h3>
<p>1. La <b>couverture sanitaire universelle (CSU)</b><br>
2. La <b>sécurité sanitaire internationale</b> via le <b>règlement sanitaire international 2005 (RSI 2005)</b><br>
3. La <b>pénurie en ressources humaines</b> de santé<br>
4. La <b>maîtrise des déterminants sociaux</b> de la santé</p>
<h3>👥 La stratégie mondiale OMS « ressources humaines » à l'horizon 2030 — 4 objectifs</h3>
<p>1. <b>Optimiser la performance, la qualité et l'impact</b> du personnel de santé par des politiques fondées sur les <b>données factuelles</b><br>
2. <b>Faire correspondre l'investissement</b> en RH aux besoins futurs, en tenant compte du <b>marché du travail</b> et des politiques d'éducation<br>
3. <b>Renforcer les capacités des institutions</b> (local, national, régional, mondial) pour un <b>leadership et une gouvernance efficaces</b><br>
4. <b>Renforcer les données</b> sur les RH pour le <b>suivi et le contrôle</b> des stratégies</p>
<h3>📜 Alma-Ata (1978)</h3>
<p>Le Maroc s'est engagé à adopter les <b>soins de santé primaires (SSP)</b> comme approche permettant l'<b>accès universel</b>, l'<b>équité sociale</b> et la <b>protection financière des plus démunis</b>.</p>
<h3>🩺 Les grands fardeaux</h3>
<p><b>MNT</b> : principale cause de mortalité mondiale — <b>75 % des décès</b>. Résolutions d'appui : <b>convention-cadre antitabac</b>, <b>stratégie alimentation et activité physique</b>, <b>stratégie de réduction de l'usage nocif de l'alcool</b>, <b>plan d'action</b> de la stratégie mondiale MNT. En <b>septembre 2011</b>, l'Assemblée générale des Nations Unies adopte la <b>Déclaration politique</b> sur la prévention et la maîtrise des MNT.</p>
<p><b>MT</b> : tuberculose, paludisme, VIH, hépatite virale et <b>maladies tropicales négligées</b> tuent encore <b>plus de 4 millions</b> de personnes par an.</p>
<p><b>Santé mentale</b> : <b>1 personne sur 4</b> a souffert d'un trouble mental ou neurologique ; <b>450 millions</b> de personnes affectées ; <b>121 M</b> de dépression, <b>50 M</b> d'épilepsie, <b>24 M</b> de schizophrénie ; <b>1 million de suicides</b> par an et <b>10 à 20 millions</b> de tentatives ; <b>20 % des enfants</b> souffrent de maladies mentales. Ces troubles représentent <b>30 %</b> de la charge de morbidité des MNT et <b>12 %</b> de la charge mondiale, et <b>6 des 20 premières causes d'incapacité</b>. Le <b>Plan d'action global de l'OMS pour la santé mentale 2013-2020</b> a été approuvé en <b>2013</b>.</p>`,
qs:[
{q:`Quelle proportion des décès dans le monde est imputable aux MNT ?`,o:[`50 %`,`60 %`,`75 %`,`90 %`],c:2,e:`75 % des décès sont imputables aux maladies non transmissibles.`},

{q:`Selon l'OMS, quelle proportion de la population mondiale a souffert d'un trouble mental ou neurologique ?`,o:[`Une personne sur dix`,`Une personne sur quatre`,`Une personne sur deux`,`Une personne sur vingt`],c:1,e:`1 personne sur 4 ; 450 millions de personnes sont actuellement affectées.`},
