<style>
/* ==========================================================================
   CNC ANASS — feuille de style
   Thème clair / sombre pilotés par variables CSS
   ========================================================================== */

:root{
  --green:#58cc02; --green-dk:#46a302; --green-bg:#e8f9d8;
  --blue:#1cb0f6; --blue-dk:#1899d6; --blue-bg:#ddf4ff;
  --gold:#ffc800; --gold-dk:#e5a600; --gold-bg:#fff4d1;
  --red:#ff4b4b; --red-dk:#ea2b2b; --red-bg:#ffdfe0;
  --purple:#ce82ff; --purple-dk:#a568cc; --purple-bg:#f6ecff;
  --orange:#ff9600; --orange-dk:#e08600;

  --ink:#1f2937; --ink2:#3c4858; --sub:#7b8794; --line:#e5e9ee;
  --bg:#f7f9fc; --card:#ffffff; --card2:#f2f5f9;
  --shadow:0 2px 0 rgba(0,0,0,.07);
  --radius:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

html[data-theme="dark"]{
  --green:#58cc02; --green-dk:#3d8f01; --green-bg:#1e3312;
  --blue:#1cb0f6; --blue-dk:#0f7ab0; --blue-bg:#0e2a3a;
  --gold:#ffc800; --gold-dk:#b08b00; --gold-bg:#3a3008;
  --red:#ff5b5b; --red-dk:#c22; --red-bg:#3a1414;
  --purple:#ce82ff; --purple-dk:#8a55b0; --purple-bg:#2a1b38;
  --ink:#e7edf5; --ink2:#c7d2de; --sub:#93a1b1; --line:#26303c;
  --bg:#111820; --card:#1a2330; --card2:#141c26;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}


/* thème système (avant tout choix explicite) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --green:#58cc02; --green-dk:#3d8f01; --green-bg:#1e3312;
  --blue:#1cb0f6; --blue-dk:#0f7ab0; --blue-bg:#0e2a3a;
  --gold:#ffc800; --gold-dk:#b08b00; --gold-bg:#3a3008;
  --red:#ff5b5b; --red-dk:#c22; --red-bg:#3a1414;
  --purple:#ce82ff; --purple-dk:#8a55b0; --purple-bg:#2a1b38;
  --ink:#e7edf5; --ink2:#c7d2de; --sub:#93a1b1; --line:#26303c;
  --bg:#111820; --card:#1a2330; --card2:#141c26;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;
  overscroll-behavior-y:none;
}
button{font-family:inherit}
a{color:var(--blue);text-decoration:none}

/* ---------- layout ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(76px + var(--safe-b))}
.wrap{padding:14px 16px}
.screen{animation:fadeUp .22s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.topbar .ttl{flex:1;font-weight:800;font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:6px 8px;border-radius:10px}
.iconbtn:hover{background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.xp{background:var(--gold-bg);color:var(--gold-dk)}
.pill.streak{background:var(--orange);color:#fff}
.pill.hearts{background:var(--red-bg);color:var(--red-dk)}
.pill.gem{background:var(--blue-bg);color:var(--blue-dk)}
html[data-theme="dark"] .pill.xp{color:var(--gold)}
html[data-theme="dark"] .pill.hearts{color:var(--red)}

/* ---------- generic ---------- */
h1{font-size:22px;margin:4px 0 2px;font-weight:800}
h2{font-size:17px;margin:18px 0 8px;font-weight:800}
.sub{color:var(--sub);font-size:13.5px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.tight{padding:12px}
.muted{color:var(--sub)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spacer{height:10px}
.hr{height:2px;background:var(--line);border-radius:2px;margin:14px 0}

.btn{display:block;width:100%;text-align:center;background:var(--green);color:#fff;font-weight:800;
  letter-spacing:.4px;text-transform:uppercase;font-size:14px;border:none;border-radius:14px;padding:14px;
  cursor:pointer;box-shadow:0 4px 0 var(--green-dk);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-dk)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue-dk)}
.btn.gold{background:var(--gold);color:#5a4100;box-shadow:0 4px 0 var(--gold-dk)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-dk)}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-dk)}
.btn.purple:active{box-shadow:0 1px 0 var(--purple-dk)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-dk)}
.btn.red:active{box-shadow:0 1px 0 var(--red-dk)}
.btn.ghost{background:transparent;color:var(--sub);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.sm{padding:10px;font-size:12.5px;border-radius:12px}

.progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden;flex:1}
.progress>div{height:100%;background:var(--green);border-radius:999px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.progress.thin{height:8px}
.progress.blue>div{background:var(--blue)}
.progress.gold>div{background:var(--gold)}

.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--sub)}
.badge.ok{background:var(--green-bg);color:var(--green-dk)}
.badge.hot{background:var(--red-bg);color:var(--red-dk)}
.badge.new{background:var(--blue-bg);color:var(--blue-dk)}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,var(--green),var(--green-dk));color:#fff;padding:18px 16px 22px;
  border-radius:0 0 26px 26px}
.hero h1{color:#fff}
.hero .sub{color:#eafbe0}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.goal-ring{display:flex;align-items:center;gap:14px;margin-top:14px;background:rgba(255,255,255,.15);
  border-radius:16px;padding:12px}
.ring{width:56px;height:56px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}

.mod{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--radius);padding:11px 13px;margin-bottom:10px;cursor:pointer;transition:transform .08s}
.mod:active{transform:scale(.985)}
.mod .bub{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;background:var(--card2);border:2px solid var(--line)}
.mod.started .bub{background:var(--blue-bg);border-color:var(--blue)}
.mod.done .bub{background:var(--gold-bg);border-color:var(--gold)}
.mod .info{flex:1;min-width:0}
.mod .info .t{font-weight:800;font-size:14px;line-height:1.25}
.mod .info .p{font-size:11.5px;color:var(--sub);margin-top:2px}
.mod .pct{font-size:11.5px;font-weight:800;color:var(--green-dk);background:var(--green-bg);padding:3px 8px;border-radius:999px}
html[data-theme="dark"] .mod .pct{color:var(--green)}

.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:transform .08s}
.qa:active{transform:scale(.97)}
.qa .ic{font-size:26px;line-height:1}
.qa .t{font-weight:800;font-size:13px;margin-top:6px}
.qa .d{font-size:11px;color:var(--sub)}

.search{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  color:var(--ink);font-size:14px;outline:none}
.search:focus{border-color:var(--blue)}

/* ---------- path (unités) ---------- */
.path{padding:8px 4px 10px;position:relative}
.node{display:flex;align-items:center;gap:12px;margin-bottom:10px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:transform .08s}
.node:active{transform:scale(.985)}
.node.locked{opacity:.55}
.node .circ{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;
  flex-shrink:0;background:var(--card2);border:3px solid var(--line);position:relative}
.node.started .circ{background:var(--blue-bg);border-color:var(--blue)}
.node.mastered .circ{background:var(--gold-bg);border-color:var(--gold)}
.node .crowns{font-size:11px;color:var(--gold-dk);font-weight:800;margin-top:2px}
html[data-theme="dark"] .node .crowns{color:var(--gold)}
.node .t{font-weight:800;font-size:14px;line-height:1.25}
.node .d{font-size:11.5px;color:var(--sub)}

/* ---------- leçon ---------- */
.lesson h3{color:var(--green-dk);font-size:16px;margin:16px 0 6px}
html[data-theme="dark"] .lesson h3{color:var(--green)}
.lesson h3:first-child{margin-top:0}
.lesson p{font-size:14.8px;margin:7px 0}
.lesson ul{margin:6px 0 6px 18px;padding:0}
.lesson li{margin:3px 0;font-size:14.5px}
.lesson b{color:var(--ink);font-weight:800}
.lesson .tip{background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.lesson .warn{background:var(--red-bg);border-left:4px solid var(--red);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.lesson table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.lesson th{background:var(--card2);font-weight:800}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:0;z-index:35;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.qtext{font-size:18px;font-weight:800;margin:16px 0 14px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-bottom-width:4px;border-radius:14px;padding:13px 15px;margin-bottom:10px;font-size:14.8px;color:var(--ink);
  cursor:pointer;transition:transform .06s,background .15s}
.opt:active{transform:translateY(1px)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-dk);font-weight:700}
.opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-dk);font-weight:800}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-dk);font-weight:800}
html[data-theme="dark"] .opt.correct{color:var(--green)}
html[data-theme="dark"] .opt.wrong{color:var(--red)}
html[data-theme="dark"] .opt.sel{color:var(--blue)}
.opt[disabled]{cursor:default}
.opt .k{display:inline-flex;width:22px;height:22px;border-radius:6px;background:var(--card2);color:var(--sub);
  align-items:center;justify-content:center;font-size:11.5px;font-weight:800;margin-right:9px;vertical-align:1px}

.fbbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:14px 16px calc(14px + var(--safe-b));
  border-top:2px solid var(--line);animation:slideUp .2s ease both}
.fbbar.ok{background:var(--green-bg)}
.fbbar.ko{background:var(--red-bg)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.fbbar .inner{max-width:520px;margin:0 auto}
.fbbar .h{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.fbbar.ok .h{color:var(--green-dk)}
.fbbar.ko .h{color:var(--red-dk)}
html[data-theme="dark"] .fbbar.ok .h{color:var(--green)}
html[data-theme="dark"] .fbbar.ko .h{color:var(--red)}
.fbbar .e{font-size:13.8px;margin:6px 0 12px;color:var(--ink2)}
.combo{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;background:var(--gold);color:#5a4100;
  font-weight:800;padding:6px 14px;border-radius:999px;animation:pop .5s ease both;pointer-events:none}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}30%{transform:translateX(-50%) scale(1.1);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- flashcards ---------- */
.flip{perspective:1100px;height:270px;margin:14px 0;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .ba{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:20px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:16.5px;border:2px solid var(--line);
  background:var(--card);overflow:auto}
.flip .ba{transform:rotateY(180deg);background:var(--blue-bg);border-color:var(--blue);font-weight:700}
.srsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.srsbtn{border:none;border-radius:12px;padding:12px 4px;font-weight:800;font-size:12px;color:#fff;cursor:pointer}
.srsbtn.again{background:var(--red)}.srsbtn.hard{background:var(--orange)}
.srsbtn.good{background:var(--green)}.srsbtn.easy{background:var(--blue)}

/* ---------- barre de navigation ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:2px solid var(--line);
  padding-bottom:var(--safe-b)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;background:none;border:none;padding:9px 0 8px;cursor:pointer;color:var(--sub);font-size:10.5px;font-weight:800}
.nav button .ic{font-size:21px;display:block;line-height:1.15;filter:grayscale(1);opacity:.65}
.nav button.on{color:var(--green-dk)}
.nav button.on .ic{filter:none;opacity:1}
html[data-theme="dark"] .nav button.on{color:var(--green)}
.nav .dot{position:absolute;top:4px;left:50%;margin-left:4px;background:var(--red);color:#fff;border-radius:999px;
  font-size:9.5px;padding:1px 5px;font-weight:800;line-height:1.35}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:70;animation:pop .3s ease both;max-width:88%}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:20px;font-weight:800}
.stat .l{font-size:11px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .b{flex:1;background:var(--green);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.bars .b span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;padding:7px 13px;border-radius:999px;border:2px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.warn{color:var(--red)}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}

/* ---------- surlignage des leçons (charte du Doc 1) ---------- */
.hl{padding:1px 5px;border-radius:4px;color:#1c2733;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl.def{background:#fff3b0}                     /* 💡 définition */
.hl.date{background:#bbdefb;font-weight:700}    /* 📅 date */
.hl.num{background:#c8e6c9;font-weight:700}     /* 🔢 chiffre clé */
.hl.art{background:#f8bbd0;font-weight:700}     /* ⚖️ loi / article */
.lesson b .hl,.hl b{color:#1c2733}
.legend-hl{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--sub);
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.legend-hl i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend-hl .sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- charte du document source : listes émoji, citations, pièges ---------- */
.lesson ul.emo{list-style:none;margin-left:0;padding-left:0}
.lesson ul.emo>li{padding-left:2px;margin-bottom:6px}
.lesson .quote{border-left:3px solid var(--sub);background:var(--card2);padding:9px 13px;margin:9px 0;
  font-style:italic;font-size:14.2px;border-radius:0 8px 8px 0}
.lesson .quote .hl.def{font-style:normal}
.lesson .trap{background:#fff3e0;border:1px solid #ffcc80;color:#5d3a00;border-radius:10px;
  padding:9px 12px;font-size:13.4px;margin:10px 0}
.lesson .trap b{color:#e65100}
html[data-theme="dark"] .lesson .trap{background:#3a2508;border-color:#8a5a10;color:#ffd9a8}
html[data-theme="dark"] .lesson .trap b{color:#ffb74d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lesson .trap{background:#3a2508;border-color:#8a5a10;color:#ffd9a8}
  :root:not([data-theme="light"]) .lesson .trap b{color:#ffb74d}}
.lesson .timeline{list-style:none;margin:8px 0;padding:0;font-size:13.6px}
.lesson .timeline li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.lesson .timeline li:last-child{border-bottom:none}
.lesson .timeline .y{font-weight:800;color:var(--green-dk);min-width:104px}
html[data-theme="dark"] .lesson .timeline .y{color:var(--green)}
.lesson .fiche{background:var(--green-bg);border:1px solid var(--green);border-radius:12px;padding:13px 15px;margin:16px 0}
.lesson .fiche>b.title{color:var(--green-dk);display:block;margin-bottom:9px;font-size:15px}
html[data-theme="dark"] .lesson .fiche>b.title{color:var(--green)}
.lesson .fiche h5{color:var(--green-dk);font-size:13px;margin:13px 0 6px;text-transform:uppercase;letter-spacing:.3px}
.lesson .fiche h5:first-of-type{margin-top:0}
.lesson table.fiche-tbl{width:100%;border-collapse:collapse;font-size:13.2px;background:var(--card);border-radius:8px;overflow:hidden}
.lesson table.fiche-tbl th{background:var(--green-dk);color:#fff;text-align:left;padding:7px 9px;font-size:12.4px}
.lesson table.fiche-tbl td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.lesson table.fiche-tbl td.n{font-weight:800;color:var(--green-dk);text-align:center;width:50px;font-size:16px}
html[data-theme="dark"] .lesson table.fiche-tbl td.n{color:var(--green)}

/* bouton flashcards sur chaque unité */
.node .cardbtn{flex-shrink:0;background:var(--blue-bg);color:var(--blue-dk);border:2px solid var(--blue);
  border-radius:12px;font-size:18px;line-height:1;padding:9px 11px;cursor:pointer;transition:transform .08s}
.node .cardbtn:active{transform:scale(.92)}
html[data-theme="dark"] .node .cardbtn{color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .node .cardbtn{color:var(--blue)}}

<script>
/* Module 01 — SNS Maroc (migré depuis CNC_ANASS_data.js, enrichi jour 3) */
(window.CNC_DATA=window.CNC_DATA||{docs:[]}).docs.push(
{"id":1,"code":"01","title":"SNS Maroc","sub":"Système National de Santé — Doc 1 (p.1-30)","icon":"🏥","units":[{"t":"Définitions de la santé","ic":"🚪","pages":"p.2-3","lesson":"<h3>🚪 Le droit à la santé</h3>\n<p>Depuis <b>2011</b>, le droit à la santé est un droit constitutionnel au Maroc : le droit à la vie (<b>article 20</b>), le droit à la sécurité et à la protection de la santé (<b>article 21</b>).</p>\n<p>La <b>loi-cadre 06-22</b> (décembre 2022) réforme le système de santé autour de <b>4 piliers</b> — mnémo <b>G-R-O-D</b> : <b>G</b>ouvernance, <b>R</b>essources humaines, <b>O</b>ffre de soins, <b>D</b>igitalisation.</p>\n<h3>❤️ Le concept de santé</h3>\n<p><b>OMS (1946, en vigueur 1948)</b> : « Un état de complet bien-être physique, mental et social et ne consiste pas uniquement en une absence de maladie ou d'infirmité ». Critiquée par <b>Evans et Stoddart (1991)</b> : trop large, le « bien-être » n'est pas mesurable.</p>\n<p><b>Monnier</b> : la santé est l'équilibre de toutes les possibilités de la personne humaine — <b>biologiques, psychologiques et sociales</b>.</p>\n<p><b>OMS, rapport 2000</b> : la santé est un « <b>capital humain</b> ».</p>","qs":[{"q":"En quelle année le droit à la santé est-il devenu un droit constitutionnel au Maroc ?","o":["2001","2011","2022","1996"],"c":1,"e":"Depuis la Constitution de 2011, le droit à la santé est un droit constitutionnel (articles 20 et 21)."},{"q":"Que garantit l'article 20 de la Constitution marocaine ?","o":["Le droit à la vie","Le droit au travail","Le droit à l'éducation","Le droit de vote"],"c":0,"e":"L'article 20 garantit le droit à la vie ; l'article 21 garantit la sécurité et la protection de la santé."},{"q":"La loi-cadre 06-22 a été promulguée en :","o":["Janvier 2011","Décembre 2022","Juillet 2013","Avril 1959"],"c":1,"e":"La loi-cadre 06-22, qui réforme en profondeur le système de santé marocain, a été promulguée en décembre 2022."},{"q":"Les 4 piliers de la loi-cadre 06-22 (mnémo G-R-O-D) sont :","o":["Gestion, Recherche, Organisation, Décentralisation","Gouvernance, Ressources humaines, Offre de soins, Digitalisation","Genre, Réforme, Objectifs, Développement","Gouvernance, Répartition, Offre, Droit"],"c":1,"e":"G-R-O-D : Gouvernance, Ressources humaines, Offre de soins, Digitalisation."},{"q":"La définition OMS de la santé a été adoptée en 1946 et est entrée en vigueur en :","o":["1948","1952","1978","1991"],"c":0,"e":"Adoptée en 1946, la définition OMS de la santé est entrée en vigueur en 1948."},{"q":"Qui a critiqué la définition OMS de la santé comme « trop large et irréalisable » (1991) ?","o":["Monnier et al.","L'OMS elle-même","Evans et Stoddart","Alma-Ata"],"c":2,"e":"Evans et Stoddart (1991) ont jugé le « bien-être » non mesurable, contrairement à l'aspect négatif (maladie)."},{"q":"Selon Monnier, la santé est l'équilibre de toutes les possibilités de la personne humaine, à savoir :","o":["Physiques, mentales, sociales","Biologiques, psychologiques et sociales","Économiques, culturelles, spirituelles","Individuelles et collectives"],"c":1,"e":"Monnier définit la santé comme l'équilibre et l'harmonie des possibilités biologiques, psychologiques et sociales de la personne."},{"q":"Selon le rapport OMS 2000, la santé est décrite comme :","o":["Un droit fondamental uniquement","Un « capital humain »","Une absence de maladie","Un service public"],"c":1,"e":"Le rapport OMS 2000 présente la santé comme un « capital humain », mesuré par le poids des « manques de santé »."}],"cards":[{"f":"Définition OMS de la santé (1946/1948)","b":"« Un état de complet bien-être physique, mental et social et ne consiste pas uniquement en une absence de maladie ou d'infirmité »"},{"f":"Article 20 de la Constitution (2011)","b":"Le droit à la vie"},{"f":"Article 21 de la Constitution (2011)","b":"Le droit à la sécurité et à la protection de la santé"},{"f":"4 piliers de la loi-cadre 06-22 (mnémo)","b":"G-R-O-D : Gouvernance, Ressources humaines, Offre de soins, Digitalisation"},{"f":"Critique d'Evans et Stoddart (1991) sur la santé","b":"La définition OMS est trop large et irréalisable ; le « bien-être » n'est pas mesurable"},{"f":"Définition de la santé selon Monnier","b":"L'équilibre et l'harmonie de toutes les possibilités de la personne humaine : biologiques, psychologiques et sociales"}]},{"t":"Service et système de santé","ic":"⚙️","pages":"p.4-5","lesson":"<h3>🏢 Service de santé — 2 sens</h3>\n<p>Un <b>établissement</b> de santé (service hospitalier, urgences…) OU un ensemble de <b>prestations</b> de santé.</p>\n<h3>⚙️ Système de santé</h3>\n<p>Un système reçoit des <b>inputs</b> (entrées) convertis en <b>outputs</b> (sorties) par des processus.</p>\n<p><b>OMS (2000)</b> : « Toutes les activités dont le but essentiel est de promouvoir, restaurer ou entretenir la santé ».</p>\n<p>La nouvelle réforme marocaine vise <b>3 objectifs</b> : 🚪 accès · ⭐ qualité · 🗺️ répartition <b>égale et équitable</b> de l'offre de soins sur tout le territoire.</p>\n<h3>⚖️ Loi-cadre 34-09</h3>\n<p><b>5 principes du système de santé</b> : <b>solidarité et responsabilisation de la population</b>, égalité d'accès, équité spatiale, complémentarité intersectorielle, approche genre. La mise en œuvre de ces principes <b>incombe principalement à l'État</b>.</p>\n<p>Modèle : système <b>pyramidal, intégré, hiérarchisé</b>, fondé sur les <b>SSP</b>.</p>\n<p>⚠️ À ne pas confondre : la même loi 34-09 énonce aussi <b>8 principes régissant l'offre de soins et la carte sanitaire</b> (les 5 précédents + intégration/coordination, globalité, gradation des soins).</p>","qs":[{"q":"« Service de santé » peut désigner :","o":["Uniquement un hôpital","Un établissement de santé ou un ensemble de prestations","Uniquement une loi","Un ministère"],"c":1,"e":"Deux sens possibles : un établissement/institution de santé, ou un ensemble de prestations de santé."},{"q":"Un système reçoit des ___ convertis en ___ par des processus.","o":["outputs / inputs","inputs / outputs","lois / décrets","besoins / offres"],"c":1,"e":"Un système reçoit des inputs (entrées), convertis en outputs (sorties) par des processus."},{"q":"Selon l'OMS (2000), le système de santé regroupe « toutes les activités dont le but essentiel est de… » :","o":["Soigner uniquement les malades","Promouvoir, restaurer ou entretenir la santé","Former le personnel médical","Gérer les hôpitaux publics"],"c":1,"e":"Définition OMS 2000 du système de santé : promouvoir, restaurer ou entretenir la santé."},{"q":"Les 3 objectifs de la nouvelle réforme du système de santé marocain sont : l'accès, la qualité et…","o":["La digitalisation","La répartition égale et équitable de l'offre de soins","La recherche scientifique","La formation continue"],"c":1,"e":"Les 3 objectifs : faciliter l'accès, améliorer la qualité, assurer une répartition égale et équitable de l'offre de soins sur tout le territoire. ⚠️ La digitalisation, elle, est un <b>pilier</b> de la réforme, pas l'un de ces 3 objectifs."},{"q":"Selon la loi-cadre 34-09, le modèle marocain de système de soins est :","o":["Décentralisé et libéral","Pyramidal, intégré, hiérarchisé, fondé sur les SSP","Communiste","Basé uniquement sur le privé"],"c":1,"e":"Le modèle marocain (loi 34-09) est pyramidal, intégré, hiérarchisé, fondé sur les Soins de Santé Primaires."},{"q":"Sur combien de principes le système de santé est-il fondé selon la loi-cadre 34-09 ?","o":["3","4","5","8"],"c":2,"e":"5 principes : solidarité et responsabilisation, égalité d'accès, équité spatiale, complémentarité intersectorielle, approche genre. ⚠️ Piège : la même loi 34-09 énonce par ailleurs <b>8 principes régissant l'offre de soins et la carte sanitaire</b> — d'ou le distracteur « 8 »."},{"q":"Selon la loi-cadre 34-09, à qui incombe principalement la mise en œuvre des principes du système de santé ?","o":["Aux collectivités locales","À l'État","Au secteur privé","Aux organisations internationales"],"c":1,"e":"La mise en œuvre de ces principes incombe principalement à l'État."}],"cards":[{"f":"Définition d'un système","b":"Un organisme composé de multiples éléments qui agissent les uns sur les autres pour un même ensemble d'objectifs (inputs → outputs)"},{"f":"3 objectifs de la réforme marocaine","b":"Accès · qualité · répartition égale et équitable de l'offre de soins sur tout le territoire"},{"f":"5 principes du système de santé selon la loi-cadre 34-09","b":"Solidarité <b>et responsabilisation de la population</b>, égalité d'accès, équité spatiale, complémentarité intersectorielle, approche genre. ⚠️ La même loi énonce aussi 8 principes pour l'offre de soins et la carte sanitaire."},{"f":"Modèle marocain de système de soins (loi 34-09)","b":"Pyramidal, intégré, hiérarchisé, fondé sur les Soins de Santé Primaires (SSP)"},{"f":"À qui incombe la mise en œuvre des principes de la loi 34-09 ?","b":"Principalement à l'État"}]},{"t":"Le SNS — principes et objectifs","ic":"📌","pages":"p.6-7","lesson":"<h3>📌 Le système national de santé (loi 06-22)</h3>\n<p><b>8 principes</b> : égalité d'accès, continuité, équité spatiale, bonne gouvernance, approche genre, gestion par résultats, mutualisation des moyens, mobilisation de tous.</p>\n<p><b>10 objectifs</b> de l'État en santé : accès/qualité, répartition, territorialisation, souveraineté du médicament, prévention des risques, digitalisation, encadrement sanitaire, ressources humaines, partenariat public-privé, recherche.</p>\n<h3>👥 Acteurs d'un système de santé</h3>\n<p>Communautés/familles · prestataires de soins · administration sanitaire · agences de financement et de contrôle.</p>","qs":[{"q":"Combien de principes régissent le système national de santé selon la loi-cadre 06-22 ?","o":["5","6","8","10"],"c":2,"e":"La loi-cadre 06-22 fixe 8 principes du système national de santé."},{"q":"Combien d'objectifs l'État marocain s'est-il fixé en matière de santé (loi-cadre 06-22) ?","o":["4","8","10","12"],"c":2,"e":"La loi-cadre 06-22 fixe 10 objectifs de l'État en matière de santé."},{"q":"Parmi les acteurs d'un système de santé, lesquels financent et contrôlent ?","o":["Les communautés","Les prestataires de soins","Les agences de financement et de contrôle","L'administration sanitaire seule"],"c":2,"e":"Les agences de financement et de contrôle (gouvernement, ONG, privé, organisations internationales) sont l'un des 4 acteurs."},{"q":"Lequel de ces principes appartient à la loi-cadre 34-09 (et non aux 8 principes de la loi 06-22) ?","o":["Bonne gouvernance","Complémentarité intersectorielle","Approche genre","Continuité des prestations"],"c":1,"e":"« Complémentarité intersectorielle » est un principe de la loi 34-09 (5 principes), pas de la liste des 8 principes de la loi 06-22."},{"q":"Un des 10 objectifs de la loi-cadre 06-22 concerne la souveraineté du :","o":["Médicament","Territoire","Personnel médical","Budget"],"c":0,"e":"Objectif n°4 : souveraineté et sécurité du médicament."}],"cards":[{"f":"Nombre de principes du SNS (loi 06-22)","b":"8 principes"},{"f":"Nombre d'objectifs de l'État en santé (loi 06-22)","b":"10 objectifs"},{"f":"4 acteurs d'un système de santé","b":"Communautés/familles · prestataires de soins · administration sanitaire · agences de financement et de contrôle"}]},{"t":"Fonctions, valeurs et qualités du système","ic":"🌍","pages":"p.7-9","lesson":"<h3>🌍 Objectifs et fonctions selon l'OMS (2000)</h3>\n<p>🎯 <b>4 objectifs</b> : amélioration de la santé, réceptivité, protection financière, efficience.</p>\n<p>⚙️ <b>6 fonctions</b> : prestations, ressources, information, médicaments, financement, gouvernance.</p>\n<h3>🧩 Composantes, valeurs, moyens et qualités</h3>\n<p>⚠️ Ces trois listes ne sont <b>pas</b> attribuées à l'OMS dans le cours.</p>\n<p>🧩 <b>5 composantes</b> : développement des ressources sanitaires, organisation des ressources, ressources financières, offre de soins, gouvernance.</p>\n<p>💎 <b>4 valeurs</b> : couverture universelle, accès équitable, qualité, protection financière.</p>\n<p>🛠️ <b>4 moyens</b> : restauration, prévention, promotion, éducation pour la santé.</p>\n<p>✅ <b>7 qualités</b> : global, efficace, accessible, acceptable, équitable, planifiable/évaluable, souple.</p>","qs":[{"q":"Selon l'OMS (2000), combien d'objectifs a un système de santé ?","o":["3","4","5","6"],"c":1,"e":"4 objectifs : amélioration de la santé, réceptivité, protection financière/sociale, efficience."},{"q":"Combien de fonctions du système de santé selon l'OMS (2000) ?","o":["4","5","6","7"],"c":2,"e":"6 fonctions : prestations, ressources, information, médicaments, financement, gouvernance."},{"q":"Combien de valeurs un système de santé doit-il porter ?","o":["3","4","5","7"],"c":1,"e":"4 valeurs : couverture universelle, accès équitable, qualité, protection financière."},{"q":"Combien de qualités doit avoir un système de santé ?","o":["4","5","6","7"],"c":3,"e":"7 qualités : global, efficace, accessible, acceptable, équitable, planifiable/évaluable, souple. ⚠️ Cette liste n'est pas attribuée à l'OMS dans le cours."},{"q":"Parmi les 4 moyens du système de santé, lequel n'en fait PAS partie ?","o":["Restauration de la santé","Prévention","Promotion de la santé","Sanction administrative"],"c":3,"e":"Les 4 moyens sont : restauration, prévention, promotion, éducation pour la santé — pas de « sanction »."},{"q":"Parmi les 5 composantes du système de santé, laquelle n'en fait PAS partie ?","o":["Développement des ressources sanitaires","Organisation des ressources","Ressources financières","Éducation pour la santé"],"c":3,"e":"Les 5 composantes : développement des ressources sanitaires, organisation des ressources, ressources financières, offre de soins, gouvernance. L'éducation pour la santé est l'un des 4 <b>moyens</b>, pas une composante."}],"cards":[{"f":"4 objectifs du système de santé (OMS 2000)","b":"Amélioration de la santé, réceptivité, protection financière/sociale, efficience"},{"f":"6 fonctions du système de santé (OMS)","b":"Prestations, ressources, information, médicaments, financement, gouvernance"},{"f":"4 valeurs d'un système de santé","b":"Couverture universelle, accès équitable, qualité, protection financière"},{"f":"7 qualités d'un système de santé","b":"Global, efficace, accessible, acceptable, équitable, planifiable/évaluable, souple"},{"f":"5 composantes du système de santé","b":"Développement des ressources sanitaires · organisation des ressources · ressources financières · offre de soins · gouvernance"}]},{"t":"Santé publique et communautaire","ic":"🏘️","pages":"p.10-13","lesson":"<h3>🌍 Santé publique (OMS, 1952)</h3>\n<p>« L'art et la science de <b>prévenir les maladies</b>, de <b>prolonger la vie</b>, d'<b>améliorer la santé physique et mentale</b> des individus <b>par le moyen d'actions collectives</b> » (principalement <b>hygiène du milieu</b> et <b>lutte contre les maladies transmissibles</b>).</p>\n<h3>🎯 Les 5 objectifs de la santé publique</h3>\n<p><b>1.</b> <b>Assainir le milieu</b><br>\n<b>2.</b> <b>Lutter contre les maladies</b><br>\n<b>3.</b> <b>Enseigner les règles d'hygiène personnelle</b><br>\n<b>4.</b> <b>Organiser des services médicaux et infirmiers</b> en vue d'un <b>diagnostic précoce</b> et du <b>traitement préventif</b> des maladies<br>\n<b>5.</b> Mettre en œuvre des <b>mesures sociales</b> propres à assurer à chaque membre de la collectivité un <b>niveau de vie compatible avec le maintien de la santé</b></p>\n<h3>🧭 Les 6 approches en santé publique</h3>\n<p><b>1. Verticale</b> — <b>par problème de santé</b> : le problème est défini et les services sont organisés pour le résoudre.<br>\n<b>2. Horizontale</b> — <b>par méthodes ou services</b> : un service est organisé pour répondre aux divers problèmes pour lesquels il est requis.<br>\n<b>3. Pluridisciplinaire</b> — santé environnementale, professionnelle, mentale ; éducation à la santé, organisation des soins, nutrition ; sciences sociales et éthique ; surveillance épidémiologique, économie, information, formation, gestion, démographie.<br>\n<b>4. Multisectorielle</b> — logements insalubres · pollution de l'eau, de l'air et des aliments · tabac, alcool, drogues · conditions de travail · urbanisme, bruit, promiscuité et stress.<br>\n<b>5. Genre</b> — Constitution de <b>2011</b> (parité hommes-femmes) et <b>loi-cadre 34-09</b> (adoption de l'approche genre).<br>\n<b>6. Droit</b> — la santé comme droit.</p>\n<h3>⚙️ Les 8 fonctions de la santé publique (4 essentielles + 4 d'appui)</h3>\n<p><b>Les 4 fonctions essentielles</b><br>\n<b>1.</b> <b>Surveillance et évaluation</b> des indicateurs sanitaires<br>\n<b>2.</b> <b>Préparation et riposte</b> aux flambées de maladies, catastrophes naturelles et autres situations d'urgence<br>\n<b>3.</b> <b>Protection de la santé</b> : salubrité de l'environnement, sécurité sanitaire des aliments, sécurité toxicologique et au travail<br>\n<b>4.</b> <b>Promotion de la santé et prévention</b> par des interventions en milieu communautaire, y compris l'action sur les <b>déterminants sociaux</b> et les <b>inégalités</b></p>\n<p><b>Les 4 fonctions d'appui</b><br>\n<b>5.</b> Garantir l'efficacité de la <b>gouvernance</b>, une <b>législation</b> de santé publique, un <b>financement</b> et un <b>soutien institutionnel</b><br>\n<b>6.</b> Garantir un <b>personnel suffisant et compétent</b><br>\n<b>7.</b> <b>Communication et mobilisation sociale</b> pour la santé<br>\n<b>8.</b> Faire avancer la <b>recherche</b> en santé publique pour influencer politiques et pratiques</p>\n<div class=\"tip\">En santé publique, on évalue la <b>pertinence</b> de l'action, son <b>impact</b> et sa <b>cohérence</b>.</div>\n<h3>🏘️ Santé communautaire</h3>\n<p><b>OMS</b> : processus par lequel les membres d'une collectivité, <b>géographique ou sociale</b>, <b>conscients d'appartenir à un même groupe</b>, <b>réfléchissent en commun</b> sur leurs problèmes de santé, <b>expriment leurs besoins prioritaires</b> et <b>participent activement</b> à la mise en place, au déroulement et à l'évaluation des activités.</p>\n<p>C'est l'approche <b>locale</b> des problèmes de santé d'une communauté, mise en œuvre par un groupe <b>associant professionnels et population</b>, dont la priorité est la <b>promotion de la santé</b>. Elle représente l'« <b>horizontalisation</b> » des priorités <b>verticales</b> fixées par la santé publique.</p>\n<h3>🧩 Système intégré (SSI)</h3>\n<p>Pas de « <b>trous</b> » dans la couverture, pas de <b>chevauchement</b> des fonctions.</p>","qs":[{"q":"La définition OMS de la santé publique date de :","o":["1946","1948","1952","1978"],"c":2,"e":"Définition OMS de la santé publique : 1952."},{"q":"Combien d'objectifs a la santé publique ?","o":["3","5","6","8"],"c":1,"e":"5 objectifs : assainir le milieu, lutter contre les maladies, enseigner l'hygiène, organiser les services, mesures sociales."},{"q":"Combien d'approches existe-t-il en santé publique ?","o":["4","5","6","8"],"c":2,"e":"6 approches : verticale, horizontale, pluridisciplinaire, multisectorielle, genre, droit."},{"q":"Les fonctions de santé publique se répartissent en 4 essentielles et combien d'appui ?","o":["2","3","4","5"],"c":2,"e":"8 fonctions au total = 4 essentielles + 4 d'appui."},{"q":"Le système intégré des services de santé (SSI) ne doit avoir ni « trous » ni :","o":["Chevauchement des fonctions","Personnel qualifié","Budget suffisant","Locaux adaptés"],"c":0,"e":"Le SSI vise l'absence de trous dans la couverture ET l'absence de chevauchement des fonctions."},{"q":"La santé communautaire est une approche plutôt :","o":["Individuelle et hospitalière","Locale et populationnelle","Nationale et centralisée","Privée et payante"],"c":1,"e":"La santé communautaire est locale et populationnelle : la collectivité participe à toutes les étapes."},{"q":"Parmi les 5 objectifs de la santé publique figure :","o":["Assainir le milieu","Former les médecins spécialistes","Financer les hôpitaux","Créer des cliniques privées"],"c":0,"e":"Les 5 objectifs : assainir le milieu · lutter contre les maladies · enseigner les règles d'hygiène personnelle · organiser des services médicaux et infirmiers (diagnostic précoce et traitement préventif) · mesures sociales pour un niveau de vie compatible avec la santé."},{"q":"Le 4e objectif de la santé publique consiste à organiser des services médicaux et infirmiers en vue :","o":["D'un diagnostic précoce et du traitement préventif des maladies","De la formation continue","De la recherche scientifique","Du contrôle des professions"],"c":0,"e":"Diagnostic précoce ET traitement préventif : c'est ce couple qui est attendu."},{"q":"Le 5e objectif de la santé publique porte sur :","o":["Des mesures sociales assurant un niveau de vie compatible avec le maintien de la santé","La vaccination obligatoire","La construction d'hôpitaux","La gratuité des soins"],"c":0,"e":"Seul objectif de nature sociale : garantir à chaque membre de la collectivité un niveau de vie compatible avec le maintien de la santé."},{"q":"La surveillance et l'évaluation des indicateurs sanitaires est :","o":["La 1re fonction essentielle de la santé publique","Une fonction d'appui","Un objectif","Une approche"],"c":0,"e":"Fonctions essentielles (1 à 4) : surveillance et évaluation · préparation et riposte aux urgences · protection de la santé · promotion et prévention."},{"q":"Faire avancer la recherche en santé publique est :","o":["Une fonction d'appui (la 8e)","Une fonction essentielle","Un objectif de la santé publique","Une approche pluridisciplinaire"],"c":0,"e":"Fonctions d'appui (5 à 8) : gouvernance/législation/financement · personnel suffisant et compétent · communication et mobilisation sociale · recherche."},{"q":"Laquelle de ces fonctions est une fonction d'APPUI ?","o":["La protection de la santé","La communication et la mobilisation sociale","La préparation et la riposte aux urgences","La promotion de la santé et la prévention"],"c":1,"e":"Les trois autres sont des fonctions essentielles."},{"q":"L'approche qui organise un service pour répondre aux divers problèmes de santé pour lesquels il est requis est :","o":["Verticale","Horizontale","Multisectorielle","Pluridisciplinaire"],"c":1,"e":"Verticale = par problème de santé · Horizontale = par méthodes ou services."},{"q":"Le tabac, l'alcool et les drogues relèvent de quelle approche ?","o":["Multisectorielle","Verticale","Genre","Droit"],"c":0,"e":"Approche multisectorielle : logements insalubres, pollution, tabac/alcool/drogues, conditions de travail, urbanisme et stress."},{"q":"En santé publique, on évalue :","o":["La pertinence, l'impact et la cohérence de l'action","Le coût, le délai et la qualité","L'efficacité, l'efficience et l'équité","La structure, le processus et le résultat"],"c":0,"e":"Formule exacte du cours : pertinence, impact, cohérence de l'action."},{"q":"La santé communautaire représente, par rapport à la santé publique :","o":["L'« horizontalisation » des priorités verticales fixées par la santé publique","Une verticalisation des priorités","Un abandon des programmes nationaux","Une approche purement hospitalière"],"c":0,"e":"Approche locale, mise en œuvre par un groupe associant professionnels et population, dont la priorité est la promotion de la santé."}],"cards":[{"f":"Définition OMS de la santé publique (1952)","b":"« L'art et la science de prévenir les maladies, de prolonger la vie, d'améliorer la santé physique et mentale <b>des individus par le moyen d'actions collectives</b> » (principalement hygiène du milieu et lutte contre les maladies transmissibles)"},{"f":"6 approches en santé publique","b":"Verticale, horizontale, pluridisciplinaire, multisectorielle, genre, droit"},{"f":"Le SSI (système intégré) évite quoi ?","b":"Les « trous » dans la couverture ET le chevauchement des fonctions"},{"f":"Santé communautaire — définition OMS","b":"Processus par lequel les membres d'une collectivité réfléchissent, expriment leurs besoins et participent activement à la mise en place et à l'évaluation des actions"},{"f":"Les 5 objectifs de la santé publique","b":"<b>Assainir le milieu</b> · <b>lutter contre les maladies</b> · <b>enseigner les règles d'hygiène personnelle</b> · <b>organiser des services médicaux et infirmiers</b> (diagnostic précoce et traitement préventif) · <b>mesures sociales</b> pour un niveau de vie compatible avec la santé"},{"f":"Les 4 fonctions ESSENTIELLES de la santé publique","b":"<b>Surveillance et évaluation</b> des indicateurs · <b>préparation et riposte</b> (flambées, catastrophes, urgences) · <b>protection de la santé</b> (environnement, aliments, toxicologie, travail) · <b>promotion et prévention</b> en milieu communautaire"},{"f":"Les 4 fonctions d'APPUI de la santé publique","b":"<b>Gouvernance, législation, financement</b> et soutien institutionnel · <b>personnel suffisant et compétent</b> · <b>communication et mobilisation sociale</b> · <b>recherche</b> en santé publique"},{"f":"Approche verticale vs horizontale","b":"<b>Verticale</b> : par <b>problème de santé</b> · <b>Horizontale</b> : par <b>méthodes ou services</b>"},{"f":"Que évalue-t-on en santé publique ?","b":"La <b>pertinence</b> de l'action, son <b>impact</b> et sa <b>cohérence</b>"}]},{"t":"Prévention et offre de soins","ic":"🛡️","pages":"p.14-15","lesson":"<h3>🛡️ Les types de prévention</h3>\n<p>1️⃣ <b>Primaire</b> : diminue l'<b>incidence</b> (nouveaux cas), sujets sains — ex. vaccination.<br>\n2️⃣ <b>Secondaire</b> : diminue la <b>prévalence</b>, dépistage précoce.<br>\n3️⃣ <b>Tertiaire</b> : réduit les incapacités chroniques, réadaptation.<br>\n4️⃣ <b>Quaternaire</b> : protège contre la <b>surmédicalisation</b> — l'OMS n'en reconnaît que <b>3</b>.</p>\n<h3>🏥 Offre de soins (loi 06-22)</h3>\n<p><b>4 éléments</b> : ressources humaines, infrastructures (public/privé), installations fixes/mobiles, <b>moyens mis en œuvre pour la fourniture des soins et des prestations de santé</b>.</p>\n<h3>💊 Les 3 catégories de soins de santé</h3>\n<p><b>Préventifs</b> (primaire/secondaire/tertiaire) · <b>curatifs</b> (dépistage, instauration d'un traitement) · <b>palliatifs</b> (soulager la souffrance).</p>\n<h3>🌍 Soins de santé primaires (Alma-Ata, 1978)</h3>\n<p>Soins de santé <b>essentiels</b> = actions de <b>promotion et prévention</b>, <b>soins curatifs</b> et de <b>réadaptation</b>. Ils représentent le <b>premier niveau de contact</b> des individus, de la famille et de la communauté avec le SNS. Universellement accessibles, par des moyens acceptables, avec leur pleine participation, à un coût abordable pour la communauté et le pays.</p>","qs":[{"q":"La prévention primaire vise à diminuer :","o":["L'incidence (nouveaux cas)","La prévalence","Les incapacités chroniques","La surmédicalisation"],"c":0,"e":"La prévention primaire s'adresse aux sujets sains et diminue l'incidence (ex. vaccination)."},{"q":"La prévention secondaire vise à diminuer :","o":["L'incidence","La prévalence","La mortalité infantile","Les récidives"],"c":1,"e":"La prévention secondaire diminue la prévalence par le dépistage précoce."},{"q":"Combien de types de prévention l'OMS reconnaît-elle officiellement ?","o":["2","3","4","5"],"c":1,"e":"Il existe 4 types (dont la quaternaire), mais l'OMS n'en reconnaît officiellement que 3."},{"q":"La prévention quaternaire protège le patient contre :","o":["Le manque de soins","La surmédicalisation","Les épidémies","Le manque d'accès"],"c":1,"e":"La prévention quaternaire protège d'un risque de surmédicalisation et d'interventions invasives."},{"q":"La déclaration d'Alma-Ata sur les soins de santé primaires date de :","o":["1959","1976","1978","1980"],"c":2,"e":"La déclaration d'Alma-Ata (OMS, URSS) sur les SSP date de 1978."},{"q":"Les soins curatifs sont associés à :","o":["La vaccination","Le dépistage et l'instauration d'un traitement","Le soulagement de la souffrance","L'éducation à la santé"],"c":1,"e":"Les soins curatifs = dépistage + instauration d'un traitement (TTT). ⚠️ Le mot « dépistage » sert aussi à définir la prévention secondaire : ici c'est le couple dépistage + traitement qui compte."},{"q":"Selon la loi-cadre 06-22, l'offre de soins comporte combien d'éléments ?","o":["3","4","5","6"],"c":1,"e":"4 éléments : ressources humaines, infrastructures, installations fixes/mobiles, moyens de production des soins."},{"q":"Que comprennent les soins de santé primaires selon Alma-Ata ?","o":["Soins préventifs, curatifs et palliatifs","Promotion, prévention, soins curatifs et réadaptation","Uniquement la vaccination et le dépistage","Uniquement les soins hospitaliers"],"c":1,"e":"Les SSP = actions de promotion et prévention, soins curatifs et réadaptation. ⚠️ Préventifs/curatifs/palliatifs sont les 3 <b>catégories de soins</b>, une autre liste."},{"q":"Les soins de santé primaires représentent :","o":["Le dernier recours du patient","Le premier niveau de contact avec le SNS","Le niveau hospitalier spécialisé","Le secteur privé uniquement"],"c":1,"e":"Les SSP représentent le premier niveau de contact des individus, de la famille et de la communauté avec le SNS."}],"cards":[{"f":"Prévention primaire — cible et effet","b":"Sujets sains → diminue l'incidence (nouveaux cas). Ex : vaccination"},{"f":"Prévention secondaire — effet","b":"Diminue la prévalence par un dépistage précoce"},{"f":"Prévention quaternaire","b":"Protège contre la surmédicalisation et les interventions invasives (non comptée parmi les 3 types reconnus par l'OMS)"},{"f":"4 éléments de l'offre de soins (loi 06-22)","b":"Ressources humaines · infrastructures sanitaires (public/privé) · installations fixes ou mobiles · <b>moyens mis en œuvre pour la fourniture des soins et des prestations de santé</b>"},{"f":"Soins de santé primaires — définition Alma-Ata (1978)","b":"Soins de santé <b>essentiels</b> (promotion, prévention, curatif, réadaptation) · <b>premier niveau de contact</b> des individus, de la famille et de la communauté avec le SNS · universellement accessibles · par des moyens acceptables · avec leur pleine participation · à un coût abordable pour la communauté et le pays"}]},{"t":"Promotion et déterminants de la santé","ic":"📣","pages":"p.16-17","lesson":"<h3>📣 La promotion de la santé</h3>\n<p>Processus qui confère aux populations les moyens d'assurer un plus grand contrôle sur leur propre santé et de l'améliorer — un processus <b>social et politique global</b>.</p>\n<h3>🧬 Les déterminants de la santé</h3>\n<p>Selon l'OMS : facteurs <b>personnels, sociaux, économiques et environnementaux</b>.</p>\n<p>Selon <b>Evans et Stoddart (1991)</b> — un <b>2e</b> apport différent de leur critique de la définition de la santé — <b>4 catégories</b> : endogènes (biologie), environnementaux, mode de vie, système de santé.</p>","qs":[{"q":"Selon Evans et Stoddart (1991), combien de catégories de déterminants de la santé existe-t-il ?","o":["3","4","5","6"],"c":1,"e":"4 catégories : facteurs endogènes, environnementaux, mode de vie, système de santé."},{"q":"Lequel n'est PAS une catégorie de déterminants selon Evans et Stoddart ?","o":["Facteurs endogènes","Facteurs environnementaux","Facteurs économiques mondiaux","Facteurs liés au système de santé"],"c":2,"e":"Les 4 catégories sont : endogènes, environnementaux, mode de vie, système de santé. ⚠️ Ne pas confondre avec la liste de l'OMS (personnels, sociaux, économiques, environnementaux), qui contient bien une catégorie économique."},{"q":"Les facteurs « endogènes » de la santé relèvent de :","o":["La biologie et la génétique","L'environnement","Le système de soins","Le mode de vie"],"c":0,"e":"Les facteurs endogènes = biologie, génétique."},{"q":"La promotion de la santé est avant tout un processus :","o":["Purement médical","Social et politique global","Administratif","Réservé aux hôpitaux"],"c":1,"e":"La promotion de la santé est un processus social et politique global, avec participation de la population."}],"cards":[{"f":"4 catégories de déterminants (Evans et Stoddart, 1991)","b":"Facteurs endogènes, environnementaux, mode de vie, système de santé — ≠ leur critique de la définition OMS de la santé, même année"},{"f":"Déterminants sociaux — définition OMS","b":"Les circonstances dans lesquelles les individus naissent, grandissent, vivent, travaillent et vieillissent, ainsi que les systèmes mis en place <b>pour faire face</b> à la maladie"}]},{"t":"Carte sanitaire et SROS","ic":"🗺️","pages":"p.17-18","lesson":"<h3>🗺️ La carte sanitaire (loi 34-09)</h3>\n<p>Fixe le découpage sanitaire du territoire. Réalisée par l'<b>administration centrale</b>, durée <b>maximum 10 ans</b>.</p>\n<h3>📐 Le SROS</h3>\n<p>Planification régionale, par préfecture/province. Établi par la <b>direction régionale de la santé</b>, durée <b>5 ans</b>.</p>\n<p>⚠️ Piège : 10 ans (carte) ≠ 5 ans (SROS).</p>\n<h3>⚖️ Loi 06-22</h3>\n<p>Carte sanitaire nationale (orientations générales) → carte sanitaire régionale (par groupement sanitaire territorial), durée déterminée.</p>","qs":[{"q":"La carte sanitaire (loi 34-09) est établie pour une durée maximum de :","o":["5 ans","8 ans","10 ans","15 ans"],"c":2,"e":"La carte sanitaire est réalisée pour une durée maximum de 10 ans."},{"q":"Le SROS (schéma régional de l'offre de soins) est établi pour une durée de :","o":["3 ans","5 ans","7 ans","10 ans"],"c":1,"e":"Le SROS est établi par la direction régionale de la santé pour une durée de 5 ans."},{"q":"Qui réalise la carte sanitaire selon la loi 34-09 ?","o":["La direction régionale","L'administration centrale","Le groupement sanitaire territorial","Le Ministre seul"],"c":1,"e":"La carte sanitaire est réalisée par l'administration centrale, après avis de la commission nationale de l'offre de soins."},{"q":"Le SROS détermine l'offre de soins par :","o":["Préfecture ou province","Commune uniquement","Pays entier","Quartier"],"c":0,"e":"Le SROS est déterminé par préfecture ou province, selon le découpage sanitaire intra-régional."},{"q":"La carte sanitaire nationale (loi 06-22) donne lieu, au niveau régional, à :","o":["Le SROS uniquement","Une carte sanitaire régionale","Aucun document régional","Un simple rapport"],"c":1,"e":"Chaque groupement sanitaire territorial établit une carte sanitaire régionale, dans le cadre de la carte nationale."}],"cards":[{"f":"Durée de la carte sanitaire (loi 34-09)","b":"Maximum 10 ans, réalisée par l'administration centrale"},{"f":"Durée du SROS","b":"5 ans, établi par la direction régionale de la santé"},{"f":"Qui établit la carte sanitaire régionale (loi 06-22) ?","b":"Chaque groupement sanitaire territorial"}]},{"t":"Systèmes de santé dans le monde","ic":"🌐","pages":"p.19-20","lesson":"<h3>🌍 Les 2 modèles fondateurs</h3>\n<p><b>Beveridge (1942)</b> — « 3U » : Universalité, Unique, Uniforme. Gestion État, financé par l'impôt. Ex : Angleterre, Suède.</p>\n<p><b>Bismarck (fin 19e s.)</b> — réservé aux salariés · cotisations proportionnelles aux salaires <b>et prestations proportionnelles aux cotisations</b> · gestion décentralisée <b>par les salariés et les employeurs</b>. Ex : Allemagne, France, Pays-Bas.</p>\n<p>⚠️ Le cours annonce <b>4 principes</b> pour Bismarck mais n'en détaille que <b>3</b> — si la question tombe, la réponse attendue est 4.</p>\n<h3>🗂️ 6 types de systèmes dans le monde</h3>\n<p>Universel (Beveridge) · professionnel (Bismarck) · hyper libéral (USA, Liban) · communiste (Cuba) · socialiste en mutation · rentier (Golfe).</p>","qs":[{"q":"Le modèle Beveridge repose sur les « 3U » : Universalité, Unique et :","o":["Uniforme","Universel","Urgent","Unilatéral"],"c":0,"e":"Les 3U : Universalité, système Unique, prestations Uniformes."},{"q":"Le système Beveridge est financé principalement par :","o":["Les cotisations salariales","L'impôt","Les assurances privées","Le pétrole"],"c":1,"e":"Beveridge : gestion par l'État, financement par l'impôt."},{"q":"Le système Bismarck est réservé aux :","o":["Fonctionnaires uniquement","Salariés (activité salariée)","Retraités","Étudiants"],"c":1,"e":"Bismarck : protection sociale sous réserve d'une activité salariée."},{"q":"Le modèle Bismarck est né :","o":["En 1942","Fin du 19e siècle","En 1978","Après 2000"],"c":1,"e":"Le modèle Bismarck date de la fin du 19e siècle (Allemagne)."},{"q":"Cuba est un exemple de système de santé :","o":["Hyper libéral","Communiste","Rentier","Beveridgien"],"c":1,"e":"Cuba illustre le système communiste."},{"q":"Les USA et le Liban illustrent un système :","o":["Communiste","Rentier","Hyper libéral","Socialiste en mutation"],"c":2,"e":"USA et Liban sont des exemples de système hyper libéral."},{"q":"Le système « rentier » est financé par :","o":["L'impôt","Les cotisations salariales","Une ressource naturelle","Les dons internationaux"],"c":2,"e":"Le système rentier (quelques pays du Golfe) est financé par une ressource naturelle."}],"cards":[{"f":"Beveridge — les « 3U »","b":"Universalité, système Unique, prestations Uniformes — financé par l'impôt (1942, Grande-Bretagne)"},{"f":"Bismarck — principes clés","b":"Réservé aux salariés · cotisations proportionnelles aux salaires <b>et prestations proportionnelles aux cotisations</b> · gestion décentralisée <b>par les salariés et les employeurs</b> (fin 19e s., Allemagne)"},{"f":"6 types de systèmes de santé dans le monde","b":"Universel (Beveridge), professionnel (Bismarck), hyper libéral, communiste, socialiste en mutation, rentier"}]},{"t":"Historique et réformes du SNS","ic":"🕰️","pages":"p.20-21","lesson":"<h3>🕰️ Histoire du SNS marocain</h3>\n<p><b>Avril 1959</b> : 1ère Conférence nationale sur la santé (Mohammed V) — naissance du SNS. Deux orientations : <b>la santé de la nation incombe à l'État</b> et <b>le Ministère de la santé publique en assure la conception et la réalisation</b>.<br>\n<b>1959-1981</b> : 1ère période — mise en place et développement du SNS (infrastructures, nationalisation des ressources, lutte contre les épidémies).<br>\n<b>1976</b> : Charte communale (collectivités locales).<br>\n<b>1978</b> : Déclaration d'Alma-Ata (SSP).<br>\n<b>1980</b> : Arrêté — organiser la couverture sanitaire, <b>renforcer les structures centrales</b> et <b>définir l'organisation et les attributions des services extérieurs</b>.<br>\n<b>1981-1995</b> : « 1ère réforme » — renforcement du RSSB.<br>\n<b>1995-2000</b> : « 2ème réforme » — stratégie sectorielle.<br>\n<b>Juillet 2013</b> : 2e Conférence nationale (Marrakech) — « 3ème réforme ».<br>\n<b>Aujourd'hui</b> : « 4ème réforme » — les mêmes <b>4 piliers</b> que la loi 06-22 (G-R-O-D).</p>","qs":[{"q":"La 1ère Conférence nationale sur la santé au Maroc a eu lieu en :","o":["Avril 1959","1976","1978","1980"],"c":0,"e":"Avril 1959, sous la présidence effective de feu S.M. Mohammed V — naissance du SNS marocain."},{"q":"La Charte communale de 1976 a responsabilisé :","o":["Le Ministère de la santé","Les collectivités locales","Les hôpitaux privés","Les ONG internationales"],"c":1,"e":"La Charte communale (1976) responsabilise les collectivités locales sur l'hygiène et l'assainissement."},{"q":"La 2ème Conférence nationale sur la santé (Marrakech) correspond à :","o":["La 1ère réforme","La 2ème réforme","La 3ème réforme","La 4ème réforme"],"c":2,"e":"La 2e Conférence nationale (Marrakech, juillet 2013) correspond à la 3ème réforme du SNS."},{"q":"La 2ème Conférence nationale sur la santé a eu lieu en :","o":["2011","2013","2018","2022"],"c":1,"e":"Marrakech, 1-3 juillet 2013."},{"q":"La « 1ère réforme » du SNS (1981-1995) est marquée par le renforcement de :","o":["La digitalisation","Le RSSB (réseau des soins de santé de base)","La carte sanitaire","Le secteur privé"],"c":1,"e":"Deuxième période (1981-1995) : développement de l'offre et des programmes, renforcement du RSSB — « 1ère réforme »."},{"q":"La 4ème réforme du SNS s'inscrit dans le cadre de la généralisation de :","o":["La digitalisation","La protection sociale","La médecine privée","La recherche scientifique"],"c":1,"e":"La 4ème réforme est inscrite dans le cadre de la généralisation de la protection sociale (4 piliers : G-R-O-D)."},{"q":"L'arrêté de 1980 visait à organiser la couverture sanitaire, renforcer les structures centrales et :","o":["Créer les CHU","Définir l'organisation et les attributions des services extérieurs","Instaurer l'AMO","Privatiser les hôpitaux"],"c":1,"e":"Arrêté de 1980 : organiser la couverture sanitaire, renforcer les structures centrales, définir l'organisation et les attributions des services extérieurs."}],"cards":[{"f":"Naissance du SNS marocain","b":"1ère Conférence nationale sur la santé, avril 1959, présidence effective de Mohammed V"},{"f":"Déclaration d'Alma-Ata","b":"1978 — soins de santé primaires, accès de tous à un niveau de santé acceptable"},{"f":"2ème Conférence nationale sur la santé","b":"Marrakech, 1-3 juillet 2013 — correspond à la « 3ème réforme » du SNS"},{"f":"4 piliers de la « 4ème réforme » du SNS","b":"Bonne gouvernance, valorisation des ressources humaines, mise à niveau de l'offre de soins, digitalisation (identiques à la loi 06-22)"},{"f":"Arrêté de 1980 — 3 objets","b":"Organiser la couverture sanitaire · renforcer les structures centrales · définir l'organisation et les attributions des services extérieurs"},{"f":"1ère Conférence nationale (1959) — les 2 orientations","b":"La santé de la nation incombe à l'État · le Ministère de la santé publique en assure la conception et la réalisation"}]},{"t":"Les 4 secteurs du SNS","ic":"🧩","pages":"p.21-24","lesson":"<h3>🧩 Le grand piège : 4 secteurs ≠ 3 secteurs</h3>\n<p>Le <b>SNS marocain</b> compte <b>4 secteurs</b> : public, privé non lucratif, privé lucratif, <b>traditionnel</b>.</p>\n<p>L'<b>offre de soins</b> n'en compte que <b>3</b> : elle exclut le secteur traditionnel !</p>\n<h3>🏥 Détails</h3>\n<p><b>CNOPS</b> : finance les prestations des adhérents. <b>CNSS</b> : conseil d'administration <b>tripartite de 24 membres</b> (État, travailleurs, employeurs). Secteur traditionnel : Kablas, herboristes — <b>13,4 %</b> des accouchements ont lieu à domicile.</p>","qs":[{"q":"Combien de secteurs compose le SNS marocain ?","o":["3","4","5","6"],"c":1,"e":"Le SNS marocain compte 4 secteurs : public, privé non lucratif, privé lucratif, traditionnel."},{"q":"Combien de secteurs compose l'offre de soins marocaine ?","o":["2","3","4","5"],"c":1,"e":"L'offre de soins ne compte que 3 secteurs : elle exclut le secteur traditionnel."},{"q":"Quel secteur fait partie du SNS mais PAS de l'offre de soins ?","o":["Le secteur public","Le secteur privé lucratif","Le secteur traditionnel","Le secteur privé non lucratif"],"c":2,"e":"Piège classique : le secteur traditionnel (Kablas, herboristes) est compté dans le SNS mais pas dans l'offre de soins."},{"q":"Le conseil d'administration de la CNSS compte combien de membres ?","o":["12","18","24","30"],"c":2,"e":"Conseil d'administration tripartite de 24 membres (État, travailleurs, employeurs, à parts égales)."},{"q":"Le conseil d'administration de la CNSS est :","o":["Uniquement étatique","Tripartite","Uniquement privé","Bipartite"],"c":1,"e":"Tripartite = représentants de l'État, des travailleurs et des employeurs, à parts égales."},{"q":"L'accouchement à domicile représente environ quel pourcentage des accouchements totaux ?","o":["3,4 %","8 %","13,4 %","25 %"],"c":2,"e":"Environ 13,4 % des accouchements totaux ont lieu à domicile, souvent avec des Kablas."},{"q":"La CNOPS relève de quel type de secteur ?","o":["Public étatique","Privé à but non lucratif","Privé à but lucratif","Traditionnel"],"c":1,"e":"La CNOPS (Caisse Nationale des Œuvres de Prévoyance Sociale) relève du secteur privé à but non lucratif."},{"q":"RISUM et REMS désignent respectivement :","o":["Deux hôpitaux militaires","Le réseau d'urgence médicale et le réseau médico-social","Deux lois de santé","Deux directions financières"],"c":1,"e":"RISUM = Réseau Intégré des Soins d'Urgence Médicale ; REMS = Réseau des Établissements Médico-Sociaux."},{"q":"La CNSS est un établissement public doté de :","o":["La personnalité civile","Aucun statut juridique","Un statut privé lucratif","Un statut associatif"],"c":0,"e":"La CNSS est un établissement public doté de la personnalité civile, administré par un conseil tripartite de 24 membres."}],"cards":[{"f":"4 secteurs du SNS marocain","b":"Public, privé à but non lucratif, privé à but lucratif, traditionnel"},{"f":"3 secteurs de l'offre de soins","b":"Les mêmes que le SNS, SAUF le secteur traditionnel"},{"f":"CNSS — conseil d'administration","b":"Tripartite, 24 membres (État, travailleurs, employeurs, à parts égales)"},{"f":"% d'accouchements à domicile","b":"Environ 13,4 % des accouchements totaux"},{"f":"RISUM / REMS","b":"Réseau Intégré des Soins d'Urgence Médicale / Réseau des Établissements Médico-Sociaux"},{"f":"Statut juridique de la CNSS","b":"Établissement public doté de la personnalité civile — conseil d'administration tripartite de 24 membres"},{"f":"Les 4 réseaux du Ministère de la Santé","b":"Réseau des hôpitaux · réseau des soins de santé primaires · RISUM (urgence médicale) · REMS (établissements médico-sociaux)"}]},{"t":"Organisation du Ministère","ic":"🏛️","pages":"p.25-30","lesson":"<h3>🏛️ Les 3 composantes du Ministère</h3>\n<p>Un <b>cabinet du ministre</b> · une <b>administration centrale</b> (services <b>concentrés</b>) · des <b>services périphériques ou extérieurs</b> (services <b>déconcentrés</b> : <b>directions régionales</b> et <b>délégations provinciales</b>).</p>\n<h3>🎯 Les 8 missions de l'administration centrale</h3>\n<p><b>1.</b> Définition des <b>priorités sanitaires nationales</b> et élaboration de la <b>politique gouvernementale</b> de santé<br>\n<b>2.</b> <b>Planification de l'offre de soins</b> (curatifs, prévention, promotion)<br>\n<b>3.</b> <b>Régulation du financement</b>, <b>allocation des ressources aux régions</b> et coordination du développement du secteur<br>\n<b>4.</b> <b>Contrôle de l'exercice</b> des professions médicales, paramédicales et pharmaceutiques<br>\n<b>5.</b> <b>Monitoring de la performance</b> des institutions et processus de leur <b>accréditation</b><br>\n<b>6.</b> <b>Tutelle</b> sur les <b>établissements publics rattachés</b> (CHU, Institut Pasteur…)<br>\n<b>7.</b> <b>Développement de la législation sanitaire</b><br>\n<b>8.</b> Élaboration d'une politique de <b>recherche et développement</b></p>\n<h3>🏢 Les 10 directions centrales</h3>\n<p>1. Direction de la <b>Population</b> · 2. Direction de l'<b>Épidémiologie et de la lutte contre les maladies</b> · 3. Direction des <b>Hôpitaux et des soins ambulatoires</b> · 4. Direction des <b>Médicaments et de la pharmacie</b> · 5. Direction des <b>Équipements et de la maintenance</b> · 6. Direction de la <b>Réglementation et du contentieux</b> · 7. Direction des <b>Ressources humaines</b> · 8. Direction de la <b>Planification et des ressources financières (DPRF)</b> · 9. Direction de l'<b>Approvisionnement en médicaments et produits de santé</b> · 10. Direction de la <b>Protection sociale des travailleurs</b>.</p>\n<p>S'y ajoutent le <b>secrétariat général</b>, l'<b>inspection générale</b> et <b>3 divisions</b> : <b>Parc-auto et affaires générales</b> · <b>Informatique et méthodes</b> · <b>Communication et informatique</b>.</p>\n<div class=\"warn\">⚠️ Piège : la <b>Direction des médicaments et de la pharmacie</b> et la <b>Direction de l'approvisionnement en médicaments et produits de santé</b> sont <b>deux directions différentes</b>.</div>\n<h3>🔬 Les services assimilés à des services centraux</h3>\n<p><b>Institut National d'Hygiène (INH)</b> · <b>Centre national de radioprotection</b> · <b>Centre national de transfusion sanguine et d'hématologie</b> · <b>Institut Pasteur du Maroc</b> · <b>École nationale de santé publique (ENSP)</b>.</p>\n<h3>👤 Ministre, secrétaire général et cabinet</h3>\n<p>Le <b>Ministre est nommé par le Roi</b> sur proposition du Chef du gouvernement ; il assure l'entière direction des services, prépare et présente le <b>budget</b> de la santé.<br>\nLe <b>secrétaire général</b> est nommé par <b>Dahir</b> : c'est le « <b>2e responsable</b> » après le Ministre.<br>\nLe <b>cabinet du ministre</b> n'a <b>aucune autorité</b> sur le personnel ni sur les affaires techniques du Ministère.</p>","qs":[{"q":"Le Ministre de la santé est nommé par :","o":["Le chef de gouvernement","Le Roi, sur proposition du chef de gouvernement","Le Parlement","Le Secrétaire général"],"c":1,"e":"Le Ministre est nommé par le Roi, sur proposition du chef de gouvernement."},{"q":"Le Secrétaire général du Ministère de la santé est nommé par :","o":["Décret","Arrêté ministériel","Dahir","Circulaire"],"c":2,"e":"Le secrétaire général est nommé par Dahir — considéré comme le « 2e responsable » après le Ministre."},{"q":"Combien de missions a l'administration centrale du Ministère de la santé ?","o":["5","6","8","10"],"c":2,"e":"L'administration centrale a 8 missions (définition des priorités, planification, régulation du financement…)."},{"q":"Combien de directions centrales compte l'administration centrale ?","o":["6","8","10","12"],"c":2,"e":"10 directions centrales (population, épidémiologie, hôpitaux, médicaments, ressources humaines…)."},{"q":"Qui est considéré comme le « 2e responsable » après le Ministre ?","o":["Le chef de cabinet","Le Secrétaire général","L'inspecteur général","Le directeur des ressources humaines"],"c":1,"e":"Le Secrétaire général assure la continuité de l'administration sanitaire et la coordination des structures."},{"q":"Le cabinet du ministre a-t-il une autorité sur le personnel administratif et technique du Ministère ?","o":["Oui, entièrement","Non, aucune autorité","Seulement sur les cadres","Seulement en région"],"c":1,"e":"Le cabinet n'a aucune attribution technique/administrative ni autorité sur le personnel — seulement les dossiers politiques."},{"q":"La DPRF comprend 3 divisions : Planification et études, Coopération et :","o":["Division financière","Division juridique","Division informatique","Division communication"],"c":0,"e":"La DPRF (Direction de la Planification et des Ressources Financières) comprend : Planification et études, Division financière, Coopération."},{"q":"Qui assure l'inspection administrative et médicale des formations et établissements de santé ?","o":["Le cabinet du ministre","L'Inspection générale","Le Secrétariat général","La DPRF"],"c":1,"e":"L'Inspection générale, sous l'autorité du Ministre, assure le contrôle et l'inspection administrative/médicale."},{"q":"Le Secrétaire général coordonne toutes les structures du Ministère, SAUF :","o":["La DPRF","L'Inspection générale","La direction des hôpitaux","Le cabinet du ministre"],"c":1,"e":"Le SG assure le contrôle et la coordination des directions, divisions et services — à l'exception de l'Inspection Générale, rattachée directement au Ministre."},{"q":"Parmi les 8 missions de l'administration centrale figure :","o":["Le monitoring de la performance des institutions et le processus de leur accréditation","La gestion des hôpitaux régionaux","Le recrutement des infirmiers","La construction des centres de santé"],"c":0,"e":"Les 8 missions vont de la définition des priorités nationales à la politique de recherche et développement."},{"q":"Quelle direction centrale est chargée de l'approvisionnement en médicaments et produits de santé ?","o":["La Direction des médicaments et de la pharmacie","La Direction de l'approvisionnement en médicaments et produits de santé","La Direction des équipements et de la maintenance","La DPRF"],"c":1,"e":"Piège classique : ce sont deux directions distinctes, celle « des médicaments et de la pharmacie » et celle « de l'approvisionnement en médicaments et produits de santé »."},{"q":"Laquelle N'EST PAS une direction centrale du Ministère ?","o":["La Direction de la population","La Direction de la protection sociale des travailleurs","La Division de l'informatique et des méthodes","La Direction de la réglementation et du contentieux"],"c":2,"e":"C'est une DIVISION : l'administration centrale compte 10 directions et 3 divisions (parc-auto et affaires générales, informatique et méthodes, communication et informatique)."},{"q":"Com {t:`Le directeur et l'organisation administrative`,ic:`🧑‍💼`,pages:`I`,
lesson:`<h3>📜 Le texte</h3>
<p><b>Arrêté de la ministre de la Santé n° 456-11</b> du <b>23 Rejeb 1431 (6 juillet 2010)</b> portant règlement intérieur des hôpitaux, pris conformément au <b>décret n° 2-06-656</b>.</p>
<h3>🧑‍💼 Le directeur</h3>
<p>Chaque <b>centre hospitalier régional, préfectoral ou provincial</b>, ou hôpital, est dirigé par un <b>directeur nommé par le ministre de la Santé</b>. Il consacre <b>l'intégralité de son temps de travail</b> à la gestion et à l'administration.</p>
<p>Dérogation possible <b>uniquement</b> par décision du <b>ministre de la Santé</b>, sur proposition du <b>directeur régional et du délégué</b>, et dans le <b>seul cas de nécessité de service</b>, notamment pour combler un <b>manque en personnel médical</b>.</p>
<h3>📋 Ses 3 gestions et ses attributions</h3>
<p>Il assure la gestion <b>technique</b>, <b>administrative</b> et <b>financière</b> de l'établissement, et il est responsable de sa <b>conduite générale</b> ainsi que de la <b>mise en œuvre de la politique sanitaire</b>.</p>
<p>Il est notamment chargé de : planifier les actions dans le cadre du <b>Projet d'Établissement Hospitalier (PEH)</b> · faire respecter les <b>normes et procédures</b> de gestion · <b>coordonner</b> les plans d'action des départements et services · <b>s'assurer</b> que les unités évaluent la qualité des actes de façon systématique et continue · veiller à l'exécution des <b>recommandations du comité d'établissement</b> · <b>approuver les listes de garde et d'astreinte</b> · élaborer une <b>stratégie de communication</b> interne et externe · <b>représenter</b> l'établissement <b>en concertation avec le délégué</b> · <b>informer la hiérarchie de tout incident important ou grave</b> · établir le <b>rapport annuel</b> d'activités · gérer les relations avec les <b>instances syndicales locales</b> · <b>mettre à jour annuellement les inventaires</b> · élaborer le <b>projet de budget annuel</b> et les <b>budgets-programmes</b>.</p>
<p>👉 Les directeurs des <b>centres hospitaliers</b> assurent en outre le <b>secrétariat du comité de gestion</b>. Le directeur a <b>autorité sur l'ensemble du personnel</b> de l'établissement.</p>`,
qs:[
{q:`Le règlement intérieur des hôpitaux résulte de l'arrêté :`,o:[`n° 456-11 du 6 juillet 2010`,`n° 2-06-656`,`n° 43-13`,`n° 34-09`],c:0,e:`Arrêté de la ministre de la Santé n° 456-11 du 23 Rejeb 1431 (6 juillet 2010) ; le décret 2-06-656 en est le fondement.`},
{q:`Le directeur de l'hôpital est nommé par :`,o:[`Le ministre de la Santé`,`Le wali`,`Le directeur régional`,`Le délégué`],c:0,e:`Nomination par le ministre de la Santé.`},
{q:`La dérogation à l'exclusivité du temps de travail du directeur est décidée :`,o:[`Par le ministre de la Santé, sur proposition du directeur régional et du délégué, en cas de nécessité de service`,`Par le directeur lui-même`,`Par le comité d'établissement`,`Par le gouverneur`],c:0,e:`Uniquement pour nécessité de service, notamment pour combler un manque en personnel médical.`},
{q:`Le directeur assure la gestion :`,o:[`Technique, administrative et financière`,`Médicale et infirmière`,`Financière seulement`,`Technique seulement`],c:0,e:`Trois gestions confiées au directeur.`},
{q:`Qui approuve les listes de garde et d'astreinte ?`,o:[`Le directeur`,`Le chef de pôle des affaires médicales seul`,`Le comité d'établissement`,`Le délégué`],c:0,e:`Le directeur les approuve ; les chefs de pôle les valident après élaboration par les chefs de département.`},
{q:`Le secrétariat du comité de gestion est assuré par :`,o:[`Le directeur du centre hospitalier`,`Le délégué`,`Le chef du pôle administratif`,`Le responsable du SAA`],c:0,e:`Les directeurs des centres hospitaliers assurent le secrétariat du comité de gestion.`},
{q:`En cas d'incident important ou grave dans l'établissement, le directeur doit :`,o:[`En informer la hiérarchie`,`Saisir la police`,`Réunir le comité d'établissement`,`Attendre le rapport annuel`],c:0,e:`Obligation expresse d'informer la hiérarchie.`},
{q:`Les inventaires de l'hôpital sont mis à jour :`,o:[`Annuellement`,`Chaque trimestre`,`Tous les 5 ans`,`À chaque changement de directeur`],c:0,e:`Mise à jour annuelle des inventaires par le directeur.`}

/* U2 */
{t:`Les 3 pôles de gestion`,ic:`🏗️`,pages:`II`,
lesson:`<h3>🏗️ Chaque hôpital est organisé en 3 pôles</h3>
<p><b>1. Pôle des affaires médicales (PAM)</b> — sous la responsabilité d'un <b>médecin</b><br>
<b>2. Pôle des soins infirmiers (PSI)</b> — sous la responsabilité d'un <b>cadre titulaire du diplôme d'État d'infirmier</b><br>
<b>3. Pôle des affaires administratives (PAA)</b> — sous la responsabilité d'un <b>cadre administratif</b></p>
<p>Chaque pôle est organisé en <b>deux ou plusieurs bureaux</b> (ou unités pour le PAA) <b>en fonction du volume des activités</b>.</p>
<h3>🩺 Missions du PAM</h3>
<p>Coordination et planification des activités et programmes de soins et services médicaux, y compris l'<b>éducation sanitaire</b> · <b>évaluation de la qualité et de la performance</b> des soins hospitaliers · <b>formation continue du personnel médical</b> · <b>contribution</b> à la formation continue du personnel paramédical · <b>contribution</b> à la prévention des infections et à l'hygiène · <b>planification et gestion des ressources</b> destinées au personnel médical.</p>
<h3>💉 Missions du PSI</h3>
<p>Veiller à la <b>bonne gestion des unités de soins et de services paramédicaux</b> : coordination et planification des activités paramédicales · évaluation de leur <b>qualité et performance</b> · <b>contribution à la prévention des infections nosocomiales</b> · planification et gestion des ressources destinées au personnel paramédical · contribution à l'<b>éducation sanitaire</b> · contribution au <b>développement de la recherche en soins infirmiers</b>.</p>
<h3>🗂️ Missions du PAA</h3>
<p><b>RH</b> : gestion administrative du personnel, <b>plan de développement des RH</b>, stratégies de mobilisation et de motivation, <b>système d'appréciation du rendement</b>, plan de formation continue du pôle.<br>
<b>Finances</b> : gestion budgétaire, financière et comptable · <b>approvisionnement</b> en médicaments, fongibles et matériel et leur distribution · <b>recouvrement des créances</b> · <b>archives administratives</b>.<br>
<b>Technique et soutien</b> : <b>alimentation</b> des patients et du personnel de garde · <b>nettoyage, sécurité</b> des bâtiments et <b>blanchissage du linge</b> · <b>télécommunication</b> interne · <b>gestion des déchets hospitaliers</b> · plan de <b>maintenance</b> des équipements, installations, bâtiments, mobiliers et <b>parc automobile</b>.</p>`,
qs:[
{q:`Le pôle des soins infirmiers est placé sous la responsabilité :`,o:[`D'un médecin`,`D'un cadre titulaire du diplôme d'État d'infirmier`,`D'un cadre administratif`,`Du directeur`],c:1,e:`PAM = médecin · PSI = cadre titulaire du diplôme d'État d'infirmier · PAA = cadre administratif.`},
{q:`La gestion des déchets hospitaliers relève :`,o:[`Du pôle des affaires administratives`,`Du pôle des affaires médicales`,`Du pôle des soins infirmiers`,`Du CLIN`],c:0,e:`Volet « services techniques et de soutien » du PAA.`},
{q:`La contribution au développement de la recherche en soins infirmiers est une mission :`,o:[`Du PSI`,`Du PAM`,`Du PAA`,`Du CMDP`],c:0,e:`Mission du pôle des soins infirmiers.`},
{q:`Les pôles sont organisés en bureaux :`,o:[`En fonction du volume des activités`,`Toujours en trois bureaux`,`Selon le nombre de lits`,`Par décision du délégué`],c:0,e:`Deux ou plusieurs bureaux selon le volume des activités.`},
{q:`L'alimentation des patients et du personnel de garde relève :`,o:[`Du PAA`,`Du PSI`,`Du PAM`,`De la pharmacie`],c:0,e:`Services techniques et de soutien du pôle des affaires administratives.`},
{q:`La formation continue du personnel médical est assurée par :`,o:[`Le PAM`,`Le PSI`,`Le PAA`,`Le CII`],c:0,e:`Le PAM assure la formation continue du personnel médical et contribue à celle du paramédical.`},
{q:`Le recouvrement des créances de l'établissement relève :`,o:[`Du PAA`,`Du SAA`,`Du directeur seul`,`Du comité de gestion`],c:0,e:`Volet gestion administrative et financière du PAA.`}
],
