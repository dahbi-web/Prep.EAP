lesson:`<h3>👨‍💼 Le directeur général</h3>
<p>Il dispose de <b>tous les pouvoirs et compétences nécessaires</b> pour gérer le groupe et <b>agit en son nom</b>. Il peut <b>déléguer, sous sa responsabilité</b>, une partie de ses pouvoirs aux agents placés sous son autorité.</p>
<h3>📝 Ses attributions</h3>
<p>• <b>Exécuter les décisions</b> du CA et des comités qu'il crée<br>
• <b>Préparer les projets</b> soumis au CA : plan de travail annuel, <b>carte sanitaire régionale</b>, <b>programme médical régional</b>, budget annuel, structure organisationnelle, statut particulier du personnel, système de passation des contrats, règlement intérieur, rapport annuel d'activité<br>
• <b>Gérer</b> toutes les composantes du groupe et coordonner leurs activités<br>
• Gérer les <b>ressources humaines</b> et procéder aux <b>nominations</b><br>
• Réaliser ou autoriser toute action liée aux missions<br>
• <b>Représenter</b> le groupe devant l'État, les administrations publiques ou privées et les tiers, et prendre les mesures conservatoires<br>
• <b>Représenter le groupe devant les tribunaux</b> et intenter les actions en justice, <b>en informant immédiatement le président du CA</b></p>
<h3>💰 Le budget du GST</h3>
<p><b>Ressources</b> : revenus générés par ses <b>activités</b> · revenus des <b>fonds mobiliers et immobiliers</b> · <b>subventions</b> de l'État, des collectivités territoriales et de toute autorité publique ou privée · <b>dons et legs</b> · toute autre ressource prévue par les textes.</p>

{t:`Professionnels de santé et transferts`,ic:`👩‍⚕️`,pages:`p.11`,
lesson:`<h3>👥 Les 5 catégories de professionnels du GST</h3>
<p>1. Professionnels <b>recrutés</b> selon le statut du groupe<br>
2. Fonctionnaires et agents <b>transférés</b> au groupe<br>
3. Fonctionnaires <b>détachés</b> auprès du groupe<br>
4. <b>Experts engagés</b> pour des tâches spécifiques à durée déterminée<br>
5. <b>Contractuels ou volontaires</b></p>
<h3>🔄 Les 5 règles du transfert</h3>
<p>• Les <b>fonctionnaires titulaires et stagiaires</b> et les <b>agents contractuels</b> des services déconcentrés et des <b>CHU</b> situés sur le territoire d'un groupement <b>y sont transférés</b><br>
• Ils sont <b>intégrés selon le statut du groupement</b><br>
• Ils continuent de <b>bénéficier de leur cadre d'origine</b> à partir de la date du transfert et <b>conservent leurs droits et prérogatives</b><br>
• Leurs <b>prestations antérieures</b> sont reconnues comme réalisées dans le groupement<br>
• Ils <b>restent affiliés aux caisses de retraite</b> auxquelles ils cotisaient avant le transfert</p>
<h3>📌 Dispositions finales et transitoires</h3>
<p>• Les groupements <b>reprennent les contrats et engagements</b> des CHU et des services déconcentrés de l'État<br>
• Les <b>biens mobiliers, immobiliers, archives et dossiers</b> leur sont transférés <b>gratuitement</b><br>
• Le terme <b>« GST » remplace</b> les termes « administration » et « autorité gouvernementale compétente »</p>

{t:`Organigramme, comités et valeurs`,ic:`🏗️`,pages:`p.12-15`,
lesson:`<h3>🏗️ Les 3 branches du GST</h3>
<p><b>1. Le pôle de gouvernance générale</b> : le <b>directeur général</b> + directions et services transversaux — Direction Stratégie et Santé Publique · Direction Recherche, Formation et Innovation · Direction des Systèmes d'Information · Division Audit, Qualité et Contrôle de Gestion · Service Communication · Service Appui à l'Inspection et au Contrôle des établissements.</p>
<p><b>2. La branche administrative</b> (soutien et fonctionnement institutionnel) : un <b>DG adjoint</b> + Direction du Capital Humain · Direction des Affaires Financières · Direction des Achats, de l'Approvisionnement et de la Logistique · Direction du Patrimoine, de l'Ingénierie et de la Maintenance.</p>
<p><b>3. La branche sanitaire</b> : un <b>DG adjoint</b> + les établissements de santé selon 3 niveaux —<br>
• <b>Tertiaire</b> : établissements hospitaliers universitaires<br>
• <b>Secondaire</b> : espaces sanitaires et districts sanitaires, organisés par sous-territoire<br>
• <b>Primaire</b> : ESSP (établissements de soins de santé primaires), EMS (établissements médico-sociaux) et structures spécialisées d'appui</p>
<h3>🗣️ Les comités auprès du DG</h3>
<p><b>Comité consultatif et de suivi</b> : composé des directeurs des organes de direction, des établissements hospitaliers universitaires et des espaces sanitaires ; le DG peut y adjoindre tout cadre utile. Il se réunit sur convocation du DG <b>au moins une fois par mois</b> et émet des avis sur : le projet des établissements et le <b>contrat pluriannuel d'objectifs et de moyens</b>, les programmes d'investissement, le budget et le rapport d'orientation budgétaire, les critères de répartition des ressources, les créations/suppressions/transformations de structures, les centres de responsabilité, les conditions et l'organisation du travail, les règles d'emploi des personnels, la politique de formation et le bilan social, les actions de coopération.</p>
<p><b>Comités médico-techniques</b> : constitués <b>en cas de besoin</b> par le DG, composés de responsables ou de personnes qualifiées.</p>
<h3>💎 Les 5 valeurs</h3>
<p><b>Innovation · Intégrité · Éthique · Engagement · Qualité</b> — mnémo <b>2I-2E-Q</b>.</p>`,

{q:`Les 5 valeurs du GST sont :`,o:[`Innovation, Intégrité, Éthique, Engagement, Qualité`,`Équité, Égalité, Efficacité, Économie, Éthique`,`Qualité, Sécurité, Rapidité, Proximité, Équité`,`Solidarité, Responsabilité, Transparence, Qualité, Innovation`],c:0,e:`Mnémo 2I-2E-Q : Innovation, Intégrité, Éthique, Engagement, Qualité.`},

{t:`Concepts de base`,ic:`📚`,pages:`p.2`,
lesson:`<h3>📖 Les définitions à connaître mot pour mot</h3>
<p><b>Santé (OMS)</b> : état de complet bien-être physique, mental et social — <b>ce n'est ni un bien ni un produit marchand</b>.<br>
<b>Économie</b> : science qui étudie la façon dont les personnes et la société <b>produisent et emploient les ressources</b>.<br>
<b>Agent économique</b> : personne ou groupe qui <b>participe réellement</b> à l'activité économique.<br>
<b>Activité économique</b> : production de biens et services pour <b>satisfaire des besoins</b>.<br>
<b>Sciences économiques</b> : lois qui régissent la <b>production, la distribution et la consommation</b> de B&amp;S.</p>
<h3>⚖️ Le compromis santé / économie</h3>
<p>L'économie de la santé appelle un compromis entre : la <b>santé</b>, dont la finalité est de <b>toujours mieux soigner</b>, et l'<b>économie</b>, dont la finalité est de <b>toujours mieux dépenser</b>.</p>
<p><b>Définition retenue</b> : la branche de l'économie qui traite de la <b>production de biens et services médicaux</b>, de leur <b>répartition</b> (accès aux soins) et de la <b>formation des prix</b>.</p>
<h3>🔬 Micro et macro</h3>
<p><b>Microéconomie</b> : comportement économique d'<b>entités individuelles</b> (un consommateur, un vendeur, le prix d'un produit déterminé sur le marché).<br>
<b>Macroéconomie</b> : fonctionnement d'<b>ensemble</b> de l'économie, par les <b>agrégats</b> (PIB, dépenses de santé) et leurs relations (chômage, inflation).<br>
<b>Agrégat économique</b> : somme ou soustraction de plusieurs données économiques (valeur ajoutée d'une entreprise, PIB…).</p>
<h3>4️⃣ Les 4 concepts fondamentaux</h3>
<p>1. La <b>rareté des ressources</b> — dimension sociale<br>
2. Le <b>choix / la décision</b> — allocation du disponible entre différents usages<br>
3. Le <b>coût d'opportunité</b> — meilleur usage des ressources <b>sacrifiées</b><br>
4. L'<b>efficience économique</b> — faire des choix pour que les <b>bénéfices soient supérieurs aux coûts</b></p>`,
qs:[
{q:`Selon l'OMS, la santé est :`,o:[`Un bien marchand comme un autre`,`Un état de complet bien-être physique, mental et social, qui n'est ni un bien ni un produit marchand`,`Un service public payant`,`Un investissement financier`],c:1,e:`La santé n'est pas un bien ou un produit marchand : c'est le point de départ de tout le module.`},
{q:`Le compromis de l'économie de la santé oppose :`,o:[`Toujours mieux soigner / toujours mieux dépenser`,`Public / privé`,`Prévention / curatif`,`État / citoyens`],c:0,e:`Celui de la santé : toujours mieux soigner. Celui de l'économie : toujours mieux dépenser.`},
{q:`Le coût d'opportunité correspond :`,o:[`Au coût le plus faible`,`Au meilleur usage des ressources sacrifiées`,`Au coût de production`,`Au prix du marché`],c:1,e:`Coût d'opportunité : la valeur du meilleur usage auquel on renonce en affectant la ressource ailleurs.`},
{q:`Combien de concepts fondamentaux structurent l'économie ?`,o:[`3`,`4`,`5`,`6`],c:1,e:`4 : rareté des ressources, choix/décision, coût d'opportunité, efficience économique.`},
{q:`L'étude du prix d'un produit déterminé sur un marché relève de :`,o:[`La microéconomie`,`La macroéconomie`,`Un agrégat`,`La comptabilité nationale`],c:0,e:`Microéconomie : entités individuelles (consommateur, vendeur, prix d'un produit).`},
{q:`Le PIB et les dépenses de santé sont étudiés par :`,o:[`La microéconomie`,`La macroéconomie, à travers les agrégats`,`La comptabilité analytique`,`L'économétrie individuelle`],c:1,e:`Macroéconomie : fonctionnement d'ensemble via les agrégats économiques et leurs relations.`},
{q:`L'activité économique se définit comme :`,o:[`La production de biens et services pour satisfaire des besoins`,`L'échange de monnaie`,`La consommation des ménages`,`L'épargne`],c:0,e:`Production de B&S pour satisfaire des besoins.`},
{q:`L'efficience économique consiste à faire des choix pour que :`,o:[`Les coûts soient nuls`,`Les bénéfices soient supérieurs aux coûts`,`La production soit maximale`,`Les prix baissent`],c:1,e:`4e concept fondamental : bénéfices > coûts.`}
],
cards:[
{f:`Définition de l'économie de la santé`,b:`Branche de l'économie qui traite de la <b>production</b> de biens et services médicaux, de leur <b>répartition</b> (accès aux soins) et de la <b>formation des prix</b>`},
{f:`Les 4 concepts fondamentaux en économie`,b:`<b>Rareté</b> des ressources · <b>choix / décision</b> · <b>coût d'opportunité</b> · <b>efficience économique</b>`},
{f:`Micro vs macroéconomie`,b:`<b>Micro</b> : entités individuelles (consommateur, vendeur, prix d'un produit) · <b>Macro</b> : ensemble de l'économie via les <b>agrégats</b> (PIB, dépenses de santé)`},
{f:`Le compromis de l'économie de la santé`,b:`La santé veut <b>toujours mieux soigner</b> · l'économie veut <b>toujours mieux dépenser</b>`}
]},

/* U2 */
{t:`Performance : efficience et équité`,ic:`⚖️`,pages:`p.2-3`,
lesson:`<h3>📏 Les 2 critères de performance chez l'économiste</h3>
<p>L'<b>efficience</b> et l'<b>équité</b>.</p>
<h3>1️⃣ L'efficience — 3 dimensions imbriquées</h3>
<p><b>Efficacité médicale</b> : met en relation <b>santé et soins de santé</b>, <b>sans dimension de coût</b> — quelle est la contribution des soins à l'amélioration de la santé ?<br>
<b>Efficience technique</b> : met en relation les <b>inputs</b> et les <b>outputs</b> (facteur travail et facteur capital avec la production de soins).<br>
<b>Efficience économique</b> : met en relation l'<b>amélioration de l'état de santé</b> et les <b>coûts</b>.</p>
<h3>2️⃣ L'équité — 2 formes</h3>
<p><b>Équité verticale</b> : des capacités contributives <b>inégales</b> donnent une participation <b>inégale</b> au <b>financement</b> — ceux qui ont les revenus les plus élevés contribuent selon leurs moyens.<br>
<b>Équité horizontale</b> : <b>égalité de traitement</b> pour ceux qui ont des <b>besoins de santé égaux</b> (des ressources égales pour des régions ayant le même état de santé).</p>
<div class="warn">⚠️ Piège récurrent : <b>verticale = financement</b> (capacités contributives inégales) · <b>horizontale = soins et état de santé</b> (besoins égaux, traitement égal).</div>
<div class="tip">Seule l'<b>efficacité médicale</b> ignore le coût. Dès qu'un coût entre en jeu, on parle d'<b>efficience</b>.</div>`,
qs:[
{q:`Les deux critères de performance chez l'économiste sont :`,o:[`L'efficience et l'équité`,`La rentabilité et la qualité`,`Le coût et le prix`,`L'offre et la demande`],c:0,e:`Efficience et équité.`},
{q:`L'équité verticale porte sur :`,o:[`Le financement du système de santé`,`L'égalité de traitement à besoins égaux`,`La répartition des hôpitaux`,`La qualité des soins`],c:0,e:`Équité verticale : capacités contributives inégales → participation inégale au financement.`},
{q:`L'équité horizontale signifie :`,o:[`Payer selon ses moyens`,`Une égalité de traitement pour des besoins de santé égaux`,`Un accès gratuit pour tous`,`Une même dépense par habitant`],c:1,e:`Égalité de traitement pour ceux qui ont des besoins de santé égaux (mêmes ressources pour des régions au même état de santé).`},
{q:`Quelle dimension de l'efficience ne comporte PAS de dimension de coût ?`,o:[`L'efficacité médicale`,`L'efficience technique`,`L'efficience économique`,`Toutes comportent un coût`],c:0,e:`L'efficacité médicale met en relation santé et soins, sans dimension de coût.`},
{q:`L'efficience technique met en relation :`,o:[`Les inputs et les outputs`,`La santé et les coûts`,`Les revenus et les cotisations`,`L'offre et la demande`],c:0,e:`Inputs (travail, capital) et outputs (production de soins de santé).`},
{q:`L'efficience économique met en relation :`,o:[`L'amélioration de l'état de santé et les coûts`,`Les inputs et les outputs`,`Le PIB et la population`,`Les recettes et les dépenses de l'État`],c:0,e:`C'est la dimension qui rapporte le résultat de santé au coût engagé.`},
{q:`« Ceux qui ont les revenus les plus élevés contribuent en fonction de leurs moyens » décrit :`,o:[`L'équité horizontale`,`L'équité verticale`,`L'efficience technique`,`La solidarité nationale`],c:1,e:`Définition même de l'équité verticale.`}
],
cards:[
{f:`Les 3 dimensions de l'efficience`,b:`<b>Efficacité médicale</b> (santé ↔ soins, <b>sans coût</b>) · <b>efficience technique</b> (inputs ↔ outputs) · <b>efficience économique</b> (état de santé ↔ coûts)`},
{f:`Équité verticale vs horizontale`,b:`<b>Verticale</b> : <b>financement</b> — capacités contributives inégales, participation inégale · <b>Horizontale</b> : <b>soins</b> — traitement égal à besoins égaux`}
]},

/* U3 */
{t:`Principes et objectifs de l'économie de la santé`,ic:`🎯`,pages:`p.3-4`,
lesson:`<h3>📌 Les 3 principes de base</h3>
<p>1. La plupart des règles de l'<b>économie de marché</b> ne sont <b>pas applicables telles quelles</b> aux soins de santé : la santé est un <b>bien particulier</b> car le patient est <b>incapable de décider seul</b> de son traitement et il <b>ne paie pas souvent le prix réel</b> des prestations.<br>
2. La <b>demande de soins est infinie</b> et les <b>ressources limitées</b> (limites des budgets santé par pays).<br>
3. Avant d'allouer une ressource, <b>toutes les alternatives doivent être évaluées</b>.</p>
<h3>🎯 Les 3 objectifs</h3>
<p>• Rechercher la <b>meilleure utilisation des ressources</b><br>
• <b>Évaluer en termes de coûts et d'efficience</b> la production de soins et services alloués à une population, et surtout <b>proposer des solutions</b> aux problèmes économiques et financiers de la santé<br>
• Atteindre les <b>objectifs du développement humain</b> dans un cadre de <b>ressources limitées</b></p>`,
qs:[
{q:`Pourquoi les règles du marché ne s'appliquent-elles pas telles quelles aux soins ?`,o:[`Parce que les soins sont gratuits`,`Parce que le patient ne décide pas seul de son traitement et ne paie pas souvent le prix réel`,`Parce que l'État fixe tous les prix`,`Parce qu'il n'y a pas de concurrence`],c:1,e:`La santé est un bien particulier : asymétrie d'information et prix rarement supporté réellement par le patient.`},
{q:`Le deuxième principe de base pose que :`,o:[`La demande de soins est infinie et les ressources limitées`,`L'offre crée sa propre demande`,`Les prix s'ajustent automatiquement`,`Les besoins sont mesurables`],c:0,e:`Demande infinie, ressources limitées : d'où la nécessité de choisir.`},
{q:`Avant d'allouer une ressource, il faut :`,o:[`Évaluer toutes les alternatives`,`Consulter le ministère`,`Attendre le budget`,`Faire un appel d'offres`],c:0,e:`3e principe de base de l'économie de la santé.`},
{q:`Parmi les objectifs de l'économie de la santé figure :`,o:[`Proposer des solutions aux problèmes économiques et financiers de la santé`,`Fixer le salaire des soignants`,`Réduire le nombre de patients`,`Augmenter les recettes fiscales`],c:0,e:`Évaluer coûts et efficience, et surtout proposer des solutions aux problèmes économiques et financiers.`},
{q:`L'économie de la santé vise à atteindre :`,o:[`Les objectifs du développement humain dans un cadre de ressources limitées`,`La croissance du PIB`,`L'équilibre budgétaire seul`,`La privatisation du secteur`],c:0,e:`3e objectif énoncé.`}
],
cards:[
{f:`Les 3 principes de base en économie de la santé`,b:`Les règles du marché ne s'appliquent pas telles quelles (bien particulier) · demande <b>infinie</b> / ressources <b>limitées</b> · <b>évaluer toutes les alternatives</b> avant d'allouer`},
{f:`Pourquoi la santé est un « bien particulier »`,b:`Le patient est <b>incapable de décider seul</b> de son traitement et <b>ne paie pas souvent le prix réel</b> des prestations`}
]},

/* U4 */
{t:`PIB, PNB, valeur ajoutée et IDH`,ic:`📈`,pages:`p.4-5`,
lesson:`<h3>🏭 Produit intérieur brut (PIB)</h3>
<p>Valeur totale de la production interne de biens et services dans un pays donné, au cours d'une <b>année</b>, par les <b>agents résidents à l'intérieur du territoire national</b>. C'est aussi la <b>mesure du revenu</b> provenant de la production.</p>
<p>⚠️ La <b>production</b> n'est pas une bonne mesure : beaucoup de biens servent à en fabriquer d'autres et le prix incorpore celui des <b>consommations intermédiaires</b> → <b>double comptage</b>. D'où le recours à la <b>valeur ajoutée</b>.</p>
<p><b>VA = production – consommations intermédiaires</b> (augmentation de valeur résultant du processus de production).<br>
<b>PIB = somme des valeurs ajoutées + impôts sur les produits – subventions à l'importation</b></p>
<h3>🌍 Produit national brut (PNB)</h3>
<p>Le PIB mesure la richesse produite <b>sur le territoire</b> ; or des entreprises étrangères y produisent et <b>rapatrient</b> une partie des revenus. D'où :</p>
<p><b>PNB = PIB + revenus des facteurs en provenance du reste du monde – revenus des facteurs versés au reste du monde</b></p>
<h3>📊 L'Indicateur de Développement Humain (IDH)</h3>
<p>Trois séries de facteurs :</p>
<p><b>1. Niveau de santé</b> → <b>espérance de vie à la naissance</b><br>
<b>2. Niveau d'éducation</b> → <b>taux d'alphabétisation des adultes</b> et <b>nombre moyen d'années d'études</b><br>
<b>3. Revenu moyen</b> → <b>PIB par tête</b>, corrigé par la non-prise en compte des revenus les plus élevés</p>`,
qs:[
{q:`Le PIB mesure la production réalisée :`,o:[`Par les agents résidents à l'intérieur du territoire national`,`Par les nationaux, où qu'ils soient`,`Par les seules entreprises publiques`,`Par les entreprises étrangères`],c:0,e:`PIB = critère territorial ; le PNB, lui, corrige par les revenus échangés avec le reste du monde.`},
{q:`La valeur ajoutée se calcule :`,o:[`Production – consommations intermédiaires`,`Production + impôts`,`Production – salaires`,`Chiffre d'affaires – bénéfice`],c:0,e:`VA = production – consommations intermédiaires ; elle évite le double comptage.`},
{q:`Pourquoi utilise-t-on la valeur ajoutée plutôt que la production ?`,o:[`Pour éviter le double comptage`,`Pour simplifier les calculs`,`Pour inclure les importations`,`Pour mesurer l'emploi`],c:0,e:`Le prix de chaque bien incorpore celui des consommations intermédiaires : sans la VA, on compte deux fois.`},
{q:`La formule du PIB est :`,o:[`Somme des VA + impôts sur les produits – subventions à l'importation`,`Somme des productions`,`PNB + importations`,`VA – salaires`],c:0,e:`PIB = Σ VA + impôts sur les produits – subventions à l'importation.`},
{q:`Le PNB s'obtient à partir du PIB en :`,o:[`Ajoutant les revenus des facteurs venant du reste du monde et retranchant ceux versés au reste du monde`,`Ajoutant les importations`,`Retranchant les exportations`,`Ajoutant les subventions`],c:0,e:`PNB = PIB + revenus reçus du reste du monde – revenus versés au reste du monde.`},
{q:`L'IDH repose sur combien de séries de facteurs ?`,o:[`2`,`3`,`4`,`5`],c:1,e:`3 : niveau de santé, niveau d'éducation, revenu moyen.`},
{q:`Dans l'IDH, le niveau de santé est mesuré par :`,o:[`L'espérance de vie à la naissance`,`Le taux de mortalité infantile`,`Le nombre de médecins`,`Les dépenses de santé`],c:0,e:`Espérance de vie à la naissance.`},
{q:`Dans l'IDH, le niveau d'éducation est mesuré par :`,o:[`Le taux d'alphabétisation des adultes et le nombre moyen d'années d'études`,`Le taux de scolarisation seul`,`Le budget de l'éducation`,`Le nombre d'universités`],c:0,e:`Deux composantes pour l'éducation ; le revenu est mesuré par le PIB par tête corrigé.`}
],
cards:[
{f:`Formule de la valeur ajoutée et du PIB`,b:`<b>VA = production – consommations intermédiaires</b> · <b>PIB = Σ VA + impôts sur les produits – subventions à l'importation</b>`},
{f:`Formule du PNB`,b:`<b>PNB = PIB + revenus des facteurs venant du reste du monde – revenus des facteurs versés au reste du monde</b>`},
{f:`Les 3 composantes de l'IDH`,b:`<b>Santé</b> : espérance de vie à la naissance · <b>Éducation</b> : alphabétisation des adultes + années moyennes d'études · <b>Revenu</b> : PIB par tête corrigé`}
]},

/* U5 */
{t:`Prix, tarif et typologie des coûts`,ic:`🏷️`,pages:`p.5-6`,
lesson:`<h3>🏷️ Trois notions à ne pas confondre</h3>
<p><b>Prix</b> : résultante de la confrontation de <b>deux forces contraires : l'offre et la demande</b>.<br>
<b>Coût</b> : ensemble des <b>dépenses nécessaires</b> à la production d'un bien ou service, <b>plus l'usure ou l'obsolescence (amortissement)</b> des immobilisations nécessaires.<br>
<b>Tarif</b> : prix <b>fixé institutionnellement par une autorité</b> pour des raisons <b>économiques ou sociales</b>.</p>
<h3>💸 Les types de coûts</h3>
<table><tr><th>Coût</th><th>Définition</th></tr>
<tr><td><b>Direct</b></td><td>Valeur des B&amp;S <b>directement imputables</b> à la production d'une prestation</td></tr>
<tr><td><b>Indirect</b></td><td>Valeur des <b>conséquences</b> liées à un phénomène ou programme (<b>pertes de production</b> du malade incapable de travailler)</td></tr>
<tr><td><b>Intangible</b></td><td><b>Psychologique</b> : pertes d'activités domestiques et de loisir, <b>souffrance physique et morale</b></td></tr>
<tr><td><b>Fixe</b></td><td>Ne varie <b>pas</b> avec la quantité produite <b>à court terme</b></td></tr>
<tr><td><b>Variable</b></td><td>Varie <b>en fonction de la quantité</b> produite</td></tr>
<tr><td><b>Moyen</b></td><td>Coût <b>par unité de résultat</b> = coût total / nombre total d'unités produites</td></tr>
<tr><td><b>Marginal</b></td><td>Coût <b>supplémentaire</b> de la production d'<b>une unité supplémentaire</b> par le même programme</td></tr></table>
<div class="warn">⚠️ Piège classique : <b>coût indirect</b> = pertes de production (le malade ne travaille pas) · <b>coût intangible</b> = souffrance et perte de loisirs. Et <b>moyen</b> = total/nombre, <b>marginal</b> = l'unité suivante.</div>`,
qs:[
{q:`Le tarif se définit comme :`,o:[`Le prix fixé institutionnellement par une autorité pour des raisons économiques ou sociales`,`Le prix du marché`,`Le coût de production`,`La moyenne des prix pratiqués`],c:0,e:`Tarif ≠ prix : il est fixé par une autorité.`},
{q:`Le prix résulte :`,o:[`De la confrontation de l'offre et de la demande`,`D'une décision de l'État`,`Du coût de production seul`,`Du pouvoir d'achat`],c:0,e:`Résultante de deux forces contraires : offre et demande.`},
{q:`Les pertes de production d'un malade incapable de travailler constituent un coût :`,o:[`Direct`,`Indirect`,`Intangible`,`Marginal`],c:1,e:`Coût indirect : valeur des conséquences liées au phénomène.`},
{q:`La souffrance physique et morale relève d'un coût :`,o:[`Direct`,`Indirect`,`Intangible`,`Fixe`],c:2,e:`Coût intangible : psychologique, pertes d'activités domestiques et de loisir, souffrance.`},
{q:`Le coût moyen est :`,o:[`Le coût total divisé par le nombre total d'unités de résultat produites`,`Le coût de l'unité suivante`,`Le coût qui ne varie pas`,`La moyenne des prix`],c:0,e:`Coût par unité de résultat produite.`},
{q:`Le coût marginal est :`,o:[`Le coût supplémentaire d'une unité supplémentaire produite`,`Le coût total`,`Le coût minimal`,`Le coût par patient`],c:0,e:`Coût de production d'une unité supplémentaire de résultat par le même programme.`},
{q:`Le coût qui ne varie pas avec la quantité produite à court terme est :`,o:[`Le coût fixe`,`Le coût variable`,`Le coût direct`,`Le coût marginal`],c:0,e:`Coût fixe.`},
{q:`Le coût inclut, en plus des dépenses de production :`,o:[`L'usure ou l'obsolescence (amortissement) des immobilisations`,`Les impôts uniquement`,`La marge bénéficiaire`,`Les subventions`],c:0,e:`Définition du coût : dépenses nécessaires + amortissement des immobilisations nécessaires.`}
],
cards:[
{f:`Prix, coût, tarif`,b:`<b>Prix</b> : offre × demande · <b>Coût</b> : dépenses de production + amortissement · <b>Tarif</b> : prix fixé par une <b>autorité</b> pour raisons économiques ou sociales`},
{f:`Coût direct / indirect / intangible`,b:`<b>Direct</b> : imputable à la prestation · <b>Indirect</b> : conséquences, <b>pertes de production</b> · <b>Intangible</b> : psychologique, <b>souffrance</b> et perte de loisirs`},
{f:`Coût moyen vs coût marginal`,b:`<b>Moyen</b> : coût total / nombre d'unités produites · <b>Marginal</b> : coût de l'<b>unité supplémentaire</b>`}
]},

/* U6 */
{t:`Consommation et facteurs de consommation des soins`,ic:`🛒`,pages:`p.6-8`,
lesson:`<h3>🛒 La consommation</h3>
<p>Acte d'un agent économique (le <b>consommateur</b>) qui <b>utilise</b> (consommation finale) ou <b>transforme</b> (consommation intermédiaire) des biens et services. Cette utilisation provoque la <b>destruction immédiate</b> (biens non durables) ou <b>progressive</b> (biens durables) des éléments consommés. La consommation, <b>destructrice de valeur</b>, s'oppose à la production, <b>créatrice de valeur</b>.</p>
<p><b>Consommation finale</b> : par les <b>ménages</b> pour leur propre usage (alimentation, vêtements, logement, transports, loisirs).<br>
<b>Consommation intermédiaire</b> : par les <b>entreprises</b> pour produire d'autres biens (matières premières, main-d'œuvre, services professionnels).<br>
<b>Biens durables</b> : utilisables <b>plus d'un an</b> (voitures, maisons, électroménager, meubles).<br>
<b>Biens non durables</b> : utilisés une seule fois ou <b>moins d'un an</b> (aliments, produits de nettoyage).</p>
<h3>📊 Les facteurs influençant la consommation de soins</h3>
<p><b>Socio-économiques</b> : <b>revenu</b> (les revenus élevés consomment plus), <b>niveau d'éducation</b>, <b>assurance maladie</b>.<br>
<b>Démographiques</b> : <b>âge</b> (la consommation augmente avec l'âge), <b>sexe</b> (les <b>femmes</b> consomment généralement plus), <b>taille de la famille</b>.<br>
<b>Géographiques et environnementaux</b> : <b>accessibilité</b> et transports, <b>densité de population</b>, <b>pollution</b>, conditions de vie et de travail.<br>
<b>Psychologiques</b> : <b>anxiété et dépression</b>.<br>
<b>Technologiques</b> : les <b>progrès technologiques</b> font évoluer quantité et qualité des soins.<br>
<b>Organisationnels</b> : organisation du système de santé, <b>ressources humaines</b>.<br>
<b>Économiques et politiques</b> : <b>ressources financières</b> disponibles, <b>politique de santé</b>.</p>`,
qs:[
{q:`La consommation intermédiaire est le fait :`,o:[`Des ménages pour leur propre usage`,`Des entreprises pour produire d'autres biens et services`,`De l'État`,`Des associations`],c:1,e:`Consommation finale = ménages ; consommation intermédiaire = entreprises.`},
{q:`Un bien durable est utilisable :`,o:[`Moins d'un an`,`Généralement plus d'un an`,`Une seule fois`,`Sans limite`],c:1,e:`Plus d'un an : voitures, maisons, électroménager, meubles.`},
{q:`D'un point de vue économique, la consommation :`,o:[`Est créatrice de valeur`,`S'oppose à la production car elle est destructrice de valeur`,`Est neutre`,`Équivaut à l'épargne`],c:1,e:`La consommation détruit de la valeur, la production en crée.`},

{q:`Selon le sexe, la consommation de soins est généralement plus élevée chez :`,o:[`Les hommes`,`Les femmes`,`Aucune différence`,`Les adolescents`],c:1,e:`Les femmes consomment généralement plus de soins que les hommes.`},
{q:`L'anxiété et la dépression sont classées parmi les facteurs :`,o:[`Psychologiques`,`Démographiques`,`Organisationnels`,`Technologiques`],c:0,e:`Facteurs psychologiques : les personnes anxieuses ou dépressives consomment plus de soins.`},

{q:`Une densité de population élevée peut :`,o:[`Diminuer la consommation de soins`,`Augmenter la consommation (propagation des maladies, accès plus facile)`,`N'avoir aucun effet`,`Supprimer les besoins`],c:1,e:`Facteur géographique et environnemental.`}
],

{f:`Consommation finale vs intermédiaire`,b:`<b>Finale</b> : les <b>ménages</b>, pour leur propre usage · <b>Intermédiaire</b> : les <b>entreprises</b>, pour produire d'autres biens et services`},
{f:`Les 7 familles de facteurs de consommation des soins`,b:`Socio-économiques · démographiques · géographiques et environnementaux · psychologiques · technologiques · organisationnels · économiques et politiques`},
{f:`Biens durables / non durables`,b:`<b>Durables</b> : plus d'un an (voiture, meubles) · <b>Non durables</b> : une seule fois ou moins d'un an (aliments, produits de nettoyage)`}
]},

{t:`L'évaluation économique`,ic:`🧮`,pages:`p.8`,
lesson:`<h3>🧮 Définition</h3>
<p><b>Étude comparative des coûts et/ou des effets</b> des interventions ou stratégies mises en œuvre, <b>en vue d'opérer un choix</b>.</p>
<p>Ses tâches principales : <b>identifier, comparer et mesurer</b> les coûts et les conséquences des alternatives étudiées.</p>
<h3>🔀 Les 2 types d'évaluation</h3>
<p><b>Évaluation partielle</b> : étudie les <b>coûts OU les conséquences</b> de programmes de santé, ou encore les coûts <b>et</b> conséquences d'<b>un seul programme</b>.<br>
<b>Évaluation complète</b> : observe les coûts <b>et</b> les conséquences de <b>plusieurs programmes</b> et les <b>compare</b>.</p>
<h3>📋 Les 4 analyses de l'évaluation complète</h3>
<p>1. Analyse <b>coût-minimisation</b><br>
2. Analyse <b>coût-efficacité</b><br>
3. Analyse <b>coût-utilité</b><br>
4. Analyse <b>coût-bénéfice</b></p>
<div class="tip">Ce qui fait qu'une évaluation est <b>complète</b> : deux conditions réunies — <b>coûts ET conséquences</b>, et <b>au moins deux programmes comparés</b>.</div>`,
qs:[
{q:`L'évaluation économique est une étude comparative :`,o:[`Des coûts et/ou des effets des interventions, en vue d'opérer un choix`,`Des budgets hospitaliers`,`Des salaires du personnel`,`Des prix du marché`],c:0,e:`Elle sert à choisir entre des interventions ou stratégies.`},
{q:`Une évaluation économique est dite complète lorsqu'elle :`,o:[`Étudie les coûts d'un seul programme`,`Observe coûts ET conséquences de plusieurs programmes et les compare`,`Mesure les conséquences seules`,`Est réalisée par un économiste`],c:1,e:`Deux conditions : coûts et conséquences, et comparaison d'au moins deux programmes.`},
{q:`Combien d'analyses relèvent de l'évaluation complète ?`,o:[`2`,`3`,`4`,`5`],c:2,e:`4 : coût-minimisation, coût-efficacité, coût-utilité, coût-bénéfice.`},
{q:`Laquelle N'EST PAS une analyse d'évaluation économique complète ?`,o:[`Coût-minimisation`,`Coût-utilité`,`Coût-bénéfice`,`Coût-rendement`],c:3,e:`Les quatre sont : minimisation, efficacité, utilité, bénéfice.`},
{q:`Les tâches principales d'une évaluation économique sont :`,o:[`Identifier, comparer et mesurer les coûts et conséquences des alternatives`,`Contrôler les dépenses`,`Fixer les tarifs`,`Auditer les comptes`],c:0,e:`Identifier, comparer, mesurer.`},
{q:`Une étude qui n'observe que les conséquences d'un programme est :`,o:[`Une évaluation partielle`,`Une évaluation complète`,`Une analyse coût-utilité`,`Une analyse coût-bénéfice`],c:0,e:`L'évaluation partielle étudie les coûts OU les conséquences, ou un seul programme.`}
],

{t:`Définition et types d'indicateurs`,ic:`📐`,pages:`p.2-3`,
lesson:`<h3>🔍 Mesurer l'état de santé</h3>
<p>La mesure de l'état de santé d'une population implique deux connaissances : celle de la <b>population</b> et celle des <b>outils</b>.</p>
<p>Son appréciation permet de : <b>identifier</b> les problèmes de santé (épidémie, hausse d'une pathologie) · <b>orienter la recherche étiologique</b> · <b>préciser les priorités</b> (fréquence, gravité, impact social) · <b>évaluer les résultats</b> des actions (campagne de vaccination, ouverture d'un hôpital).</p>
<h3>📏 Définition</h3>
<p>Un <b>indicateur en santé</b> est un <b>outil de mesure</b> d'un état de santé, d'une pratique ou de la <b>survenue d'un événement</b>. C'est un « instrument qui fournit une indication », un critère d'appréciation de l'état d'un phénomène <b>à un moment donné</b>.</p>
<p>Un <b>indicateur de santé</b> est une variable <b>qualitative ou quantitative</b> permettant d'évaluer l'état de santé, de décrire l'état de santé des individus d'une population, de <b>suivre et évaluer les effets</b>, de mesurer <b>performances et résultats</b>.</p>
<h3>🧩 Les 3 types d'indicateurs</h3>
<p><b>Structure</b> : évaluent la gestion des <b>ressources</b> humaines, matérielles et financières nécessaires aux processus de soins.<br>
<b>Processus</b> : évaluent la <b>mise en œuvre</b> d'une activité de soins dans la prise en charge du patient.<br>
<b>Résultats</b> : évaluent, à l'issue du processus, les <b>bénéfices ou risques</b> pour le patient en termes d'<b>efficacité, satisfaction et sécurité</b>.</p>
<div class="tip">Mnémo <b>S-P-R</b> : Structure (les moyens) → Processus (l'action) → Résultats (l'effet).</div>`,
qs:[
{q:`Un indicateur en santé est défini comme :`,o:[`Un objectif de santé publique`,`Un outil de mesure d'un état de santé, d'une pratique ou de la survenue d'un événement`,`Une norme réglementaire`,`Un programme de prévention`],c:1,e:`Indicateur = outil de mesure d'un état de santé, d'une pratique ou de la survenue d'un événement.`},
{q:`Les indicateurs qui évaluent la gestion des ressources humaines, matérielles et financières sont dits :`,o:[`De structure`,`De processus`,`De résultats`,`D'impact`],c:0,e:`Indicateurs de structure = ressources nécessaires à la mise en œuvre des processus de soins.`},
{q:`Les indicateurs évaluant l'efficacité, la satisfaction et la sécurité pour le patient sont :`,o:[`De structure`,`De processus`,`De résultats`,`D'exposition`],c:2,e:`Indicateurs de résultats : bénéfices ou risques générés pour le patient à l'issue du processus de soins.`},
{q:`Les indicateurs de processus évaluent :`,o:[`Les ressources disponibles`,`La mise en œuvre d'une activité de soins dans la prise en charge`,`La mortalité`,`Le budget de l'hôpital`],c:1,e:`Ils évaluent la mise en œuvre d'une activité de soins du processus de prise en charge d'un patient.`},
{q:`La mesure de l'état de santé d'une population implique la connaissance :`,o:[`De la population et des outils`,`Du budget et du personnel`,`Des lois et des règlements`,`Des hôpitaux et des cliniques`],c:0,e:`Deux notions : connaissance de la population et connaissance des outils.`},
{q:`L'appréciation de l'état de santé permet notamment :`,o:[`De fixer les salaires`,`D'orienter la recherche étiologique`,`De construire des hôpitaux`,`De réduire les impôts`],c:1,e:`Elle permet d'identifier les problèmes, d'orienter la recherche étiologique, de préciser les priorités et d'évaluer les résultats des actions.`},
{q:`Les priorités de santé sont précisées en fonction de :`,o:[`La fréquence, la gravité et l'impact social`,`Le coût et la rentabilité`,`L'âge et le sexe`,`La région et la saison`],c:0,e:`Priorités selon la fréquence, la gravité et l'impact social du problème.`},
{q:`Un indicateur de santé est une variable :`,o:[`Uniquement quantitative`,`Uniquement qualitative`,`Qualitative ou quantitative`,`Toujours binaire`],c:2,e:`Il s'agit de mesures quantitatives ou non d'une dimension particulière de l'état de santé.`}
],
cards:[
{f:`Définition d'un indicateur en santé`,b:`Outil de mesure d'un <b>état de santé</b>, d'une <b>pratique</b> ou de la <b>survenue d'un événement</b>`},
{f:`Les 3 types d'indicateurs`,b:`<b>Structure</b> (ressources) · <b>Processus</b> (mise en œuvre des soins) · <b>Résultats</b> (efficacité, satisfaction, sécurité)`},
{f:`À quoi sert l'appréciation de l'état de santé ?`,b:`Identifier les problèmes · orienter la recherche étiologique · préciser les priorités (fréquence, gravité, impact social) · évaluer les résultats des actions`},
{f:`Que mesure un indicateur de résultats ?`,b:`Les bénéfices ou risques pour le patient en termes d'<b>efficacité</b>, de <b>satisfaction</b> et de <b>sécurité</b>`}

/* U2 */
{t:`Proportion, ratio, indice, taux`,ic:`➗`,pages:`p.3, 8`,
lesson:`<h3>🔢 Comment s'expriment les indicateurs</h3>
<p>En <b>nombre</b> (nombre absolu dans une zone ou une population) · en <b>taux</b> (par unité de temps ou de population) · en <b>proportion</b> (à un temps t) · en <b>moyenne</b> (à un temps t) · en <b>catégorie</b> (variable qualitative à un temps t).</p>
<h3>📊 Les 4 mesures à ne pas confondre</h3>
<table><tr><th>Mesure</th><th>Définition</th></tr>
<tr><td><b>Proportion</b></td><td>Rapport des effectifs d'une <b>même variable</b>, le <b>numérateur est compris dans le dénominateur</b>. Mesure <b>statique</b>, exprimée en % ou de 0 à 1.</td></tr>
<tr><td><b>Ratio</b></td><td>Rapport des effectifs de <b>2 modalités d'une même variable</b>, numérateur et dénominateur <b>mutuellement exclusifs</b> (ex. sexe H/F). <b>Pas d'unité</b>.</td></tr>
<tr><td><b>Indice</b></td><td>Rapport des effectifs de <b>deux variables différentes</b>.</td></tr>
<tr><td><b>Taux</b></td><td>Une proportion qui <b>inclut la notion de temps</b>.</td></tr></table>
<h3>🌍 Critères de choix selon l'OMS</h3>
<p><b>Utilité · Accessibilité · Aspect éthique · Solidité · Représentativité · Compréhensibilité</b> (6 critères).</p>
<div class="warn">⚠️ Piège fréquent : <b>ratio</b> = 2 modalités d'une même variable (exclusives) ; <b>indice</b> = 2 variables différentes ; <b>taux</b> = proportion + temps.</div>`,
qs:[
{q:`Dans une proportion :`,o:[`Le numérateur est compris dans le dénominateur`,`Numérateur et dénominateur sont exclusifs`,`Il s'agit de deux variables différentes`,`Elle inclut toujours le temps`],c:0,e:`Proportion : rapport des effectifs d'une même variable, le numérateur étant compris dans le dénominateur ; mesure statique exprimée en % ou de 0 à 1.`},
{q:`Le rapport des effectifs de deux modalités mutuellement exclusives d'une même variable est :`,o:[`Une proportion`,`Un ratio`,`Un indice`,`Un taux`],c:1,e:`Ratio (ex. hommes / femmes) : pas d'unité, numérateur et dénominateur mutuellement exclusifs.`},
{q:`Le rapport des effectifs de deux variables différentes est :`,o:[`Un ratio`,`Un indice`,`Une proportion`,`Une moyenne`],c:1,e:`Un indice met en rapport deux variables différentes.`},
{q:`Qu'est-ce qui distingue un taux d'une proportion ?`,o:[`Le taux inclut une notion de temps`,`Le taux n'a pas d'unité`,`Le taux compare deux variables`,`Rien, ce sont des synonymes`],c:0,e:`Le taux est une proportion qui inclut la notion de temps.`},
{q:`Selon l'OMS, le choix d'un indicateur repose sur combien de critères ?`,o:[`4`,`5`,`6`,`8`],c:2,e:`6 critères : utilité, accessibilité, aspect éthique, solidité, représentativité, compréhensibilité.`},
{q:`Parmi les critères OMS de choix d'un indicateur figure :`,o:[`La rentabilité`,`L'aspect éthique`,`La rapidité de calcul`,`Le coût minimal`],c:1,e:`Utilité, accessibilité, aspect éthique, solidité, représentativité, compréhensibilité.`},
{q:`Une variable qualitative mesurée à un temps t s'exprime en :`,o:[`Taux`,`Catégorie`,`Moyenne`,`Ratio`],c:1,e:`Les indicateurs s'expriment en nombre, taux, proportion, moyenne ou catégorie (variable qualitative à un temps t).`},
{q:`Un ratio s'exprime :`,o:[`En pourcentage obligatoirement`,`Sans unité`,`En années`,`Pour 1000 habitants`],c:1,e:`Le ratio n'a pas d'unité.`}
],
cards:[
{f:`Proportion vs ratio`,b:`<b>Proportion</b> : même variable, numérateur inclus dans le dénominateur (%) · <b>Ratio</b> : 2 modalités exclusives d'une même variable, sans unité`},
{f:`Indice`,b:`Rapport des effectifs de <b>deux variables différentes</b>`},
{f:`Taux`,b:`Une <b>proportion</b> qui inclut en plus une <b>notion de temps</b>`},
{f:`Les 6 critères OMS de choix d'un indicateur`,b:`Utilité · accessibilité · aspect éthique · solidité · représentativité · compréhensibilité`},
{f:`Les 5 formes d'expression d'un indicateur`,b:`Nombre · taux · proportion · moyenne · catégorie`}
]},

/* U3 */
{t:`Qualités d'un bon indicateur (SMART)`,ic:`⭐`,pages:`p.4-5`,
lesson:`<h3>🎯 Un bon indicateur est SMART</h3>
<p><b>S</b>pécifique : mesure claire et précise de ce qu'il est censé mesurer<br>
<b>M</b>esurable : erreur de mesure minimale<br>
<b>A</b>daptable : valeurs existantes dans différents groupes de population<br>
<b>R</b>éalisable : disponibilité des valeurs de l'indicateur<br>
<b>T</b>emporel : mesure à intervalles réguliers et appropriés</p>
<h3>🔬 Les 4 qualités d'un indicateur de santé</h3>
<p><b>1. Validité</b> : aptitude à mesurer la dimension de l'état de santé visée.<br>
<b>2. Sensibilité au changement</b> : capacité à rendre compte <b>rapidement</b> des variations réelles de l'état de santé au cours du temps.<br>
<b>3. Spécificité</b> : capacité à varier <b>lorsque le phénomène mesuré varie lui-même</b>.<br>
<b>4. Fiabilité (précision)</b> : capacité à caractériser l'importance des <b>erreurs de mesure aléatoires</b>.</p>
<h3>🔁 La fiabilité s'apprécie par…</h3>
<p>La <b>reproductibilité</b> (dispersion des mesures répétées à brève échéance) · la <b>concordance inter-observateurs</b> · la <b>cohérence interne</b> (homogénéité du questionnaire ou d'un indice complexe).</p>
<p>En plus, l'indicateur doit être : construit selon un <b>but précis</b>, <b>facile à obtenir</b>, <b>facile à comprendre</b>, <b>accessible</b>, <b>simple</b>, <b>acceptable</b> et <b>quantitatif</b>.</p>`,
qs:[
{q:`Dans l'acronyme SMART appliqué aux indicateurs, le « A » signifie :`,o:[`Accessible`,`Adaptable`,`Acceptable`,`Analysable`],c:1,e:`S : Spécifique, M : Mesurable, A : Adaptable, R : Réalisable, T : Temporel.`},
{q:`Le « R » de SMART correspond à :`,o:[`Rapide`,`Réalisable (disponibilité des valeurs)`,`Reproductible`,`Représentatif`],c:1,e:`Réalisable : les valeurs de l'indicateur sont disponibles.`},
{q:`La capacité d'un indicateur à mesurer effectivement la dimension visée est :`,o:[`La validité`,`La fiabilité`,`La sensibilité`,`La spécificité`],c:0,e:`Validité = aptitude à mesurer la dimension de l'état de santé visée.`},
{q:`La capacité à rendre compte rapidement des variations réelles de l'état de santé est :`,o:[`La spécificité`,`La sensibilité au changement`,`La validité`,`La reproductibilité`],c:1,e:`Sensibilité au changement : rendre compte rapidement et de façon importante des variations réelles au cours du temps.`},
{q:`La fiabilité d'un indicateur peut être appréciée par :`,o:[`La reproductibilité, la concordance inter-observateurs et la cohérence interne`,`Le coût et la rapidité`,`La validité et la spécificité`,`Le nombre de mesures`],c:0,e:`Trois approches : reproductibilité, concordance inter-observateurs, cohérence interne.`},
{q:`La capacité d'un indicateur à varier lorsque le phénomène mesuré varie s'appelle :`,o:[`La sensibilité`,`La spécificité`,`La fiabilité`,`La validité`],c:1,e:`Spécificité : l'indicateur varie lorsque le phénomène mesuré varie lui-même.`},
{q:`Combien de qualités principales définit-on pour un indicateur de santé ?`,o:[`3`,`4`,`5`,`6`],c:1,e:`4 qualités : validité, sensibilité au changement, spécificité, fiabilité (précision).`},
{q:`La cohérence interne évalue :`,o:[`L'homogénéité d'un questionnaire ou d'un indice complexe`,`L'accord entre deux observateurs`,`La stabilité dans le temps`,`Le coût de l'enquête`],c:0,e:`Cohérence interne = homogénéité du questionnaire ou d'un indice complexe.`}
],
cards:[
{f:`SMART pour un indicateur`,b:`<b>S</b>pécifique · <b>M</b>esurable · <b>A</b>daptable · <b>R</b>éalisable · <b>T</b>emporel`},
{f:`Les 4 qualités d'un indicateur de santé`,b:`Validité · sensibilité au changement · spécificité · fiabilité (précision)`},
{f:`Comment apprécie-t-on la fiabilité ?`,b:`<b>Reproductibilité</b> · <b>concordance inter-observateurs</b> · <b>cohérence interne</b>`},
{f:`Validité vs spécificité`,b:`<b>Validité</b> : aptitude à mesurer ce qui est visé · <b>Spécificité</b> : varier quand le phénomène mesuré varie`}
]},

/* U4 */
{t:`Indicateurs de mortalité`,ic:`⚰️`,pages:`p.6`,
lesson:`<h3>⚰️ Taux brut de mortalité (TBM)</h3>
<p><b>TBM = (nombre de décès pendant une période définie / effectif moyen de la population exposée au risque pour la même période) × 100</b></p>
<p>C'est un <b>bon indicateur quantitatif</b> de l'évolution d'un état de santé, mais il <b>ne tient pas compte de la structure par âge</b> : il ne permet donc <b>pas de comparer</b> la mortalité d'un endroit à l'autre, ni dans un même endroit sur une longue période.</p>
<h3>☠️ Taux de létalité (TL)</h3>
<p><b>TL = (nombre de décès par la maladie X / nombre de cas de la maladie X) × 100</b> → mesure la <b>gravité</b> d'une maladie.</p>
<h3>📉 Taux de mortalité proportionnel (TMP)</h3>
<p><b>TMP = (nombre de décès par une cause donnée pendant une période / nombre total de décès pendant cette même période) × 100</b> → poids d'une cause dans l'ensemble des décès.</p>
<div class="warn">⚠️ Piège classique : le <b>dénominateur</b>. Létalité → <b>les malades</b>. Mortalité → <b>la population</b>. Mortalité proportionnelle → <b>l'ensemble des décès</b>.</div>`,
qs:[
{q:`Le dénominateur du taux de létalité est :`,o:[`La population moyenne`,`Le nombre de cas de la maladie`,`Le nombre total de décès`,`Les personnes-années`],c:1,e:`Létalité = décès dus à la maladie X / nombre de cas de la maladie X × 100. Elle mesure la gravité de la maladie.`},
{q:`Le taux brut de mortalité présente quelle limite majeure ?`,o:[`Il est difficile à calculer`,`Il ne tient pas compte de la structure par âge de la population`,`Il ne s'applique qu'aux enfants`,`Il nécessite un registre des cancers`],c:1,e:`Ne tenant pas compte de la structure par âge, il ne permet pas de comparer deux lieux ni un même lieu sur une longue période.`},
{q:`Le taux de mortalité proportionnel rapporte les décès par une cause donnée :`,o:[`À la population moyenne`,`Au nombre total de décès de la période`,`Aux malades de cette cause`,`Aux naissances vivantes`],c:1,e:`TMP = décès par une cause / nombre total de décès pendant la même période × 100.`},
{q:`Quel indicateur mesure le mieux la gravité d'une maladie ?`,o:[`Le taux d'incidence`,`Le taux de létalité`,`Le taux de prévalence`,`Le taux brut de mortalité`],c:1,e:`La létalité rapporte les décès aux malades : c'est l'indicateur de gravité.`},
{q:`Le dénominateur du taux brut de mortalité est :`,o:[`L'effectif moyen de la population exposée au risque`,`Le nombre de malades`,`Le nombre de décès`,`Le nombre de naissances`],c:0,e:`TBM = décès de la période / effectif moyen de la population exposée au risque pour la même période × 100.`},
{q:`Les indicateurs de mortalité sont considérés comme :`,o:[`De mauvais indicateurs`,`De bons indicateurs quantitatifs de l'évolution d'un état de santé`,`Des indicateurs qualitatifs`,`Des indicateurs de structure`],c:1,e:`Bon indicateur quantitatif permettant de mesurer l'évolution d'un état de santé.`}
],
cards:[
{f:`Formule du taux brut de mortalité`,b:`Décès de la période / <b>effectif moyen de la population exposée</b> × 100 — ne tient pas compte de la <b>structure par âge</b>`},
{f:`Formule du taux de létalité`,b:`Décès par la maladie X / <b>nombre de cas de la maladie X</b> × 100 → mesure la <b>gravité</b>`},
{f:`Formule du taux de mortalité proportionnel`,b:`Décès par une cause donnée / <b>nombre total de décès</b> de la période × 100`},
{f:`Limite du TBM`,b:`Ne permet pas de <b>comparer</b> deux lieux ni un même lieu sur une longue période (structure par âge ignorée)`}
]},

/* U5 */
{t:`Indicateurs de morbidité`,ic:`🦠`,pages:`p.6-7`,
lesson:`<h3>📈 Prévalence</h3>
<p><b>Taux de prévalence = (cas d'une maladie à un moment donné ou sur une période / population moyenne sur la même période) × 100.</b><br>
<b>Prévalence instantanée</b> : cas à un <b>instant</b> donné / population moyenne. <b>Prévalence périodique</b> : cas pendant une <b>période</b> donnée / population moyenne.</p>
<p>👉 La prévalence permet de <b>planifier les services de soins</b> car elle mesure la <b>charge</b> que représente une maladie pour la collectivité.</p>
<h3>🆕 Incidence</h3>
<p><b>Taux d'incidence = nouveaux cas apparaissant sur une période définie / nombre de personnes-temps susceptibles d'être atteintes pour la même période.</b></p>
<p>👉 L'incidence évalue l'efficacité d'une <b>prévention primaire</b> : celle-ci limite l'apparition de nouveaux cas et fait donc <b>baisser l'incidence</b>.</p>
<p><b>Densité d'incidence</b> = nouveaux cas au cours d'une période / <b>nombre de personnes-années exposées au risque</b>. Utile pour les maladies <b>aiguës et chroniques</b>, les besoins en soins préventifs et l'évaluation des mesures de contrôle d'une maladie de masse.</p>
<h3>⚡ Taux d'attaque</h3>
<p><b>Taux d'attaque = (nouveaux cas sur une période définie / sujets susceptibles d'être atteints) × 100</b> → très utile <b>lors d'une épidémie</b>.</p>
<div class="tip">Prévalence = <b>stock</b> de malades (planification). Incidence = <b>flux</b> de nouveaux cas (prévention primaire). Taux d'attaque = incidence <b>en situation d'épidémie</b>.</div>`,
qs:[
{q:`La prévalence permet surtout :`,o:[`D'évaluer la prévention primaire`,`De planifier les services de soins car elle mesure la charge de la maladie`,`De mesurer la gravité`,`De détecter une épidémie`],c:1,e:`La prévalence mesure la charge que représente une maladie pour la collectivité : elle sert à planifier les services de soins.`},
{q:`Le taux d'incidence permet d'évaluer l'efficacité :`,o:[`De la prévention primaire`,`De la prévention secondaire`,`De la prévention tertiaire`,`Du traitement curatif`],c:0,e:`La prévention primaire limite l'apparition de nouveaux cas, donc diminue l'incidence.`},
{q:`Le dénominateur de la densité d'incidence est :`,o:[`La population moyenne`,`Le nombre de personnes-années exposées au risque`,`Le nombre de malades`,`Le nombre total de décès`],c:1,e:`Densité d'incidence = nouveaux cas / personnes-années exposées au risque.`},
{q:`Quel indicateur est le plus utile lors d'une épidémie ?`,o:[`Le taux de prévalence`,`Le taux d'attaque`,`Le taux de mortalité proportionnel`,`L'espérance de vie`],c:1,e:`Le taux d'attaque = nouveaux cas / sujets susceptibles d'être atteints × 100, très utile en situation épidémique.`},
{q:`La prévalence instantanée se calcule à partir :`,o:[`Des cas à un instant donné`,`Des nouveaux cas de la période`,`Des décès`,`Des sujets exposés`],c:0,e:`Prévalence instantanée : ensemble des cas à un instant donné / population moyenne × 100.`},
{q:`Le taux d'incidence mesure :`,o:[`Tous les cas existants`,`Les nouveaux cas apparaissant sur une période définie`,`Les décès`,`Les guérisons`],c:1,e:`Incidence = nouveaux cas sur une période / personnes-temps susceptibles d'être atteintes.`},
{q:`La densité d'incidence est utile :`,o:[`Uniquement pour les maladies aiguës`,`Pour les maladies aiguës et chroniques`,`Uniquement pour les maladies chroniques`,`Uniquement en épidémie`],c:1,e:`Elle est utile pour les maladies aiguës et chroniques, les besoins en soins préventifs et l'évaluation des mesures de contrôle d'une maladie de masse.`},
{q:`Prévalence et incidence : quelle affirmation est exacte ?`,o:[`La prévalence est un flux, l'incidence un stock`,`La prévalence est un stock de cas, l'incidence un flux de nouveaux cas`,`Les deux mesurent les nouveaux cas`,`Les deux mesurent la mortalité`],c:1,e:`Prévalence = stock (tous les cas) ; incidence = flux (nouveaux cas seulement).`}
],
cards:[
{f:`Formule du taux de prévalence`,b:`Cas d'une maladie (instant ou période) / <b>population moyenne</b> × 100 — sert à <b>planifier les services de soins</b>`},
{f:`Formule du taux d'incidence`,b:`<b>Nouveaux cas</b> sur une période / <b>personnes-temps susceptibles</b> d'être atteintes — évalue la <b>prévention primaire</b>`},
{f:`Densité d'incidence`,b:`Nouveaux cas / <b>personnes-années exposées au risque</b>`},
{f:`Taux d'attaque`,b:`Nouveaux cas / <b>sujets susceptibles d'être atteints</b> × 100 — indicateur des <b>épidémies</b>`},
{f:`Prévalence vs incidence`,b:`Prévalence = <b>stock</b> de cas (charge, planification) · Incidence = <b>flux</b> de nouveaux cas (prévention primaire)`}
]},

/* U6 */
{t:`Indicateurs démographiques et catégories`,ic:`👥`,pages:`p.5, 7`,
lesson:`<h3>👶 Natalité et fécondité</h3>
<p><b>Taux brut de natalité = (naissances vivantes sur une période / population moyenne pour la même période) × 100.</b> Il <b>ne tient pas compte de la structure par âge</b> et doit être complété par l'étude de la <b>fécondité</b>.</p>
<p><b>Taux global de fécondité = naissances vivantes sur une période / nombre moyen de femmes d'un âge donné pour cette même période.</b></p>
<h3>⏳ Espérance de vie à la naissance (EVN)</h3>
<p>Nombre <b>probable d'années à vivre</b> de la naissance à la mort. C'est l'un des indicateurs d'état de santé <b>les plus fréquemment utilisés</b>, exprimé <b>en années</b>, présenté globalement et <b>par sexe</b>. Son augmentation s'explique par : élévation du <b>niveau de vie</b>, amélioration du <b>mode de vie</b>, hausse du <b>niveau d'instruction</b>, meilleur <b>accès à des services de santé de qualité</b>.</p>
<h3>🗂️ Les 4 catégories d'indicateurs</h3>
<table><tr><th>Catégorie</th><th>Exemples</th></tr>
<tr><td><b>Exposition</b></td><td>Facteurs de risque, facteurs intrinsèques, comportements individuels et habitudes de vie, environnement</td></tr>
<tr><td><b>Morbidité</b></td><td>Taux de prévalence, taux d'incidence</td></tr>
<tr><td><b>Mortalité</b></td><td>Taux brut, taux spécifiques, taux de létalité</td></tr>
<tr><td><b>Démographiques</b></td><td><b>D'état</b> : indice de vieillissement, rapport de dépendance, chômage, nuptialité/divortialité, CSP, alphabétisation, scolarisation, pauvreté — <b>De mouvement</b> : natalité, fécondité, mortalité, espérance de vie, taux d'accroissement</td></tr></table>
<p>Les indicateurs d'<b>état</b> sont de deux types : <b>épidémiologiques</b> et <b>démographiques</b>. On distingue aussi les indicateurs de <b>moyens</b>, d'<b>environnement</b>, <b>socio-économiques</b> et de <b>production</b>.</p>`,
qs:[
{q:`Le taux brut de natalité doit être complété par :`,o:[`L'étude de la mortalité`,`L'étude de la fécondité`,`Le taux d'attaque`,`Le taux de létalité`],c:1,e:`Ne tenant pas compte de la structure par âge, il doit être complété par l'étude de la fécondité.`},
{q:`Le dénominateur du taux global de fécondité est :`,o:[`La population moyenne`,`Le nombre moyen de femmes d'un âge donné`,`Le nombre de naissances`,`Le nombre de ménages`],c:1,e:`Taux global de fécondité = naissances vivantes / nombre moyen de femmes d'un âge donné pour la même période.`},
{q:`L'espérance de vie à la naissance est exprimée :`,o:[`En pourcentage`,`En années`,`Pour 1000 habitants`,`Sans unité`],c:1,e:`Elle correspond au nombre probable d'années à vivre, exprimé en années, globalement et par sexe.`},
{q:`L'indice de vieillissement est un indicateur démographique :`,o:[`D'état`,`De mouvement`,`De morbidité`,`D'exposition`],c:0,e:`Indicateurs d'état : indice de vieillissement, rapport de dépendance, chômage, nuptialité, CSP, alphabétisation, scolarisation, pauvreté.`},
{q:`Le taux d'accroissement est un indicateur démographique :`,o:[`D'état`,`De mouvement`,`De structure`,`De processus`],c:1,e:`Indicateurs de mouvement : natalité, fécondité, mortalité, espérance de vie, taux d'accroissement.`},
{q:`Les facteurs de risque et les habitudes de vie relèvent des indicateurs :`,o:[`D'exposition`,`De morbidité`,`De mortalité`,`Démographiques`],c:0,e:`Indicateurs d'exposition : facteurs de risque, facteurs intrinsèques, comportements individuels et habitudes de vie, environnement.`},
{q:`Les deux types d'indicateurs d'état sont :`,o:[`Épidémiologiques et démographiques`,`Structure et processus`,`Publics et privés`,`Quantitatifs et qualitatifs`],c:0,e:`Indicateurs d'état = épidémiologiques et démographiques ; s'y ajoutent moyens, environnement, socio-économiques et production.`},
{q:`L'augmentation de l'espérance de vie s'explique notamment par :`,o:[`L'élévation du niveau de vie et d'instruction et un meilleur accès aux soins`,`L'augmentation de la natalité`,`La baisse de la population active`,`L'urbanisation seule`],c:0,e:`Niveau de vie, mode de vie, niveau d'instruction et accès plus large à des services de santé de qualité.`}
],
cards:[
{f:`Formule du taux brut de natalité`,b:`Naissances vivantes / <b>population moyenne</b> de la période × 100 — à compléter par la <b>fécondité</b>`},
{f:`Espérance de vie à la naissance`,b:`Nombre <b>probable d'années à vivre</b> de la naissance à la mort ; exprimée en <b>années</b>, globalement et par sexe`},

{f:`Les 4 catégories d'indicateurs`,b:`Exposition · morbidité · mortalité · démographiques (état et mouvement)`}
]}

{t:`Cadre de référence et raisons de la refonte`,ic:`🧭`,pages:`p.3-4`,
lesson:`<h3>📚 Les 6 cadres de référence</h3>
<p>1. <b>Directives royales</b> pour une refonte du système national · 2. <b>Constitution 2011</b> (la santé, droit humain fondamental — art. 31) · 3. <b>Conventions internationales</b> (OMD / ODD) · 4. <b>Loi 09-21</b> relative à la protection sociale · 5. <b>Programme de l'action gouvernementale</b> · 6. Recommandations du <b>Nouveau Modèle de Développement</b>.</p>
<h3>❗ Les 5 raisons de la refonte</h3>
<p>1. Succession de réformes <b>sans réel changement</b> · 2. <b>Pénurie chronique</b> et carence aiguë en ressources humaines · 3. <b>Iniquité</b> dans la répartition de l'offre de soins et non-respect des normes de la carte sanitaire · 4. <b>Faible gouvernance</b> du système · 5. <b>Absence de complémentarité</b> public / privé.</p>
<h3>📄 Articles constitutionnels mobilisés</h3>
<p><b>Article 31</b> : l'État, les établissements publics et les collectivités territoriales mobilisent tous les moyens pour faciliter l'<b>égal accès</b> aux soins. <b>Article 71</b> (2e alinéa) : fondement du recours à la <b>loi-cadre</b>.</p>
<div class="tip">Retenir la distinction : <b>art. 20</b> = droit à la vie · <b>art. 21</b> = sécurité et protection de la santé · <b>art. 31</b> = égal accès aux soins · <b>art. 71</b> = domaine de la loi / loi-cadre.</div>`,
qs:[
{q:`Quel article de la Constitution fonde l'égal accès des citoyens aux soins de santé ?`,o:[`Article 20`,`Article 21`,`Article 31`,`Article 71`],c:2,e:`Article 31 : mobilisation de tous les moyens pour faciliter l'égal accès aux soins de santé. (20 = droit à la vie, 21 = sécurité/protection de la santé, 71 = domaine de la loi.)`},
{q:`En application de quel article la loi-cadre 06-22 a-t-elle été prise ?`,o:[`Article 31`,`2e alinéa de l'article 71`,`Article 21`,`Article 1er`],c:1,e:`Le 2e alinéa de l'article 71 de la Constitution permet au législateur d'adopter des lois-cadres fixant les objectifs fondamentaux de l'action de l'État.`},
{q:`Parmi ces éléments, lequel N'EST PAS un cadre de référence de la loi 06-22 ?`,o:[`Les directives royales`,`La loi 09-21 sur la protection sociale`,`Le plan Santé 2025`,`Le Nouveau Modèle de Développement`],c:2,e:`Les 6 cadres : directives royales, Constitution 2011, conventions internationales (OMD/ODD), loi 09-21, programme de l'action gouvernementale, recommandations du NMD.`},

{t:`Objectif général et 10 objectifs de l'État`,ic:`🎯`,pages:`p.4-5`,
lesson:`<h3>🎯 L'objectif général — 4 actions de l'État</h3>
<p>L'action de l'État dans le domaine de la santé tend à réaliser : <b>1.</b> la <b>sécurité sanitaire</b> · <b>2.</b> <b>protéger la santé</b> de la population · <b>3.</b> <b>prémunir</b> les individus contre les maladies, épidémies et risques menaçant leur vie · <b>4.</b> leur garantir la vie dans un <b>environnement sain</b>.</p>
<h3>🔟 Les 10 objectifs spécifiques</h3>
<p>1. Faciliter l'<b>accès</b> et améliorer la <b>qualité</b> des prestations<br>
2. Répartition <b>équilibrée et équitable</b> de l'offre de soins sur le territoire<br>
3. <b>Territorialisation</b> de l'offre publique et gouvernance via les <b>GST</b><br>
4. <b>Souveraineté</b> en médicaments : disponibilité, sécurité, qualité<br>
5. Développer la <b>détection</b> et la <b>prévention</b> des risques<br>
6. Réorganiser le <b>parcours de soins</b> et <b>digitaliser</b><br>
7. Renforcer l'<b>encadrement sanitaire</b> vers les normes OMS : <b>1,6 → 4,51 pour 1000</b> habitants<br>
8. Valoriser les RH via une <b>fonction sanitaire</b><br>
9. Mécanismes de <b>partenariat public-privé</b><br>
10. Encourager la <b>recherche scientifique et l'innovation</b></p>
<div class="warn">⚠️ Le chiffre <b>1,6 → 4,51 professionnels pour 1000 habitants</b> tombe très souvent : c'est la norme OMS d'encadrement sanitaire visée.</div>`,

{q:`La norme d'encadrement sanitaire de l'OMS visée par la réforme est de :`,o:[`1,6 pour 1000`,`4,51 pour 1000`,`2,5 pour 1000`,`10 pour 1000`],c:1,e:`Passer de 1,6 à 4,51 professionnels de santé pour 1000 habitants (norme OMS).`},
{q:`Quel objectif porte sur la territorialisation de l'offre de soins publique ?`,o:[`Créer des cliniques privées`,`Créer les groupements sanitaires territoriaux (GST)`,`Créer la HAS`,`Créer le dossier médical partagé`],c:1,e:`Objectif 3 : asseoir la territorialisation de l'offre publique et améliorer sa gouvernance par la création des GST.`},
{q:`« Garantir la souveraineté en matière de médicaments » signifie assurer :`,o:[`Uniquement la baisse des prix`,`La disponibilité, la sécurité et la qualité des médicaments et produits de santé`,`L'exportation des médicaments`,`La gratuité des médicaments`],c:1,e:`Objectif 4 : souveraineté = disponibilité + sécurité + qualité des médicaments et produits de santé.`},

{t:`Les 8 principes du SNS`,ic:`⚖️`,pages:`p.5-6`,
lesson:`<h3>⚖️ Les 8 principes du système national de santé</h3>
<p>1. <b>Égalité</b> de l'offre de soins et des prestations de santé<br>
2. <b>Bonne gouvernance</b><br>
3. <b>Continuité</b> des prestations de santé<br>
4. <b>Mutualisation</b> des moyens<br>
5. <b>Équité et équilibre</b> dans la répartition spatiale des ressources, structures et prestations<br>
6. <b>Approche genre</b> dans l'élaboration des politiques, programmes et stratégies<br>
7. <b>Gestion axée sur les résultats</b> + corrélation responsabilité / reddition des comptes<br>
8. <b>Mobilisation de tous</b> : citoyens, institutions, organismes publics et privés, associations de la société civile</p>
<div class="tip">Mnémo <b>É-B-C-M-É-A-G-M</b> → « <b>Égalité</b>, <b>Bonne</b> gouvernance, <b>Continuité</b>, <b>Mutualisation</b>, <b>Équité</b> spatiale, <b>Approche</b> genre, <b>Gestion</b> par résultats, <b>Mobilisation</b> ».</div>
<div class="warn">⚠️ Ne pas confondre avec les <b>5 principes</b> de l'ancienne loi-cadre <b>34-09</b> (solidarité et responsabilisation, égalité d'accès, équité spatiale, complémentarité intersectorielle, approche genre) ni avec ses <b>8 principes de l'offre de soins</b>.</div>`,
qs:[
{q:`Combien de principes régissent le SNS selon la loi-cadre 06-22 ?`,o:[`5`,`6`,`8`,`10`],c:2,e:`8 principes. ⚠️ La loi 34-09 en énonçait 5 pour le système de santé.`},

{q:`Le principe qui lie la responsabilité à la reddition des comptes est :`,o:[`La bonne gouvernance`,`La gestion basée sur les résultats`,`La mutualisation`,`La continuité`],c:1,e:`Principe 7 : gestion basée sur les résultats et corrélation entre responsabilité et reddition des comptes.`},
{q:`La « mutualisation des moyens » signifie :`,o:[`Mettre en commun les ressources`,`Privatiser les hôpitaux`,`Créer des mutuelles de santé`,`Fusionner les ministères`],c:0,e:`Mise en commun / partage des moyens entre structures, principe n° 4 du SNS.`},
{q:`Le principe n° 8 vise la mobilisation :`,o:[`Des seuls professionnels de santé`,`Des citoyens, institutions, organismes publics et privés et associations`,`Des seuls services de l'État`,`Des bailleurs internationaux`],c:1,e:`Mobilisation de l'ensemble des citoyennes et citoyens, institutions, organismes publics et privés et associations de la société civile pour la prévention et l'amélioration de la situation sanitaire.`},
{q:`L'approche genre doit être adoptée dans :`,o:[`Le recrutement uniquement`,`L'élaboration des politiques, programmes et stratégies de santé`,`Les seuls programmes de maternité`,`La formation continue`],c:1,e:`Principe 6 : approche genre dans l'élaboration des politiques, des programmes et des stratégies de santé.`},

{t:`Droits et devoirs de la population (Ch. II)`,ic:`🧑‍⚖️`,pages:`p.6-8`,
lesson:`<h3>🛡️ Les 4 domaines de droits</h3>
<p><b>1.</b> Santé publique · <b>2.</b> Santé de l'individu · <b>3.</b> Politique du sang · <b>4.</b> Politique pharmaceutique.</p>
<h3>👤 Santé de l'individu — 5 mesures de l'État</h3>
<p>1. <b>Information</b> de la population sur les risques sanitaires et les mesures de précaution<br>
2. <b>Protection de la santé</b> et accès aux soins appropriés disponibles<br>
3. Garantie de la protection de l'<b>intégrité physique et morale</b><br>
4. Respect du <b>droit du patient à l'information</b> sur sa maladie et sa prise en charge<br>
5. Lutte contre toute <b>discrimination ou stigmatisation</b> liée à la maladie, au handicap ou aux caractéristiques génétiques</p>
<h3>💊 Politique pharmaceutique — 4 objectifs</h3>
<p><b>Disponibilité</b> du médicament · amélioration de sa <b>qualité</b> · <b>réduction de son prix</b> · disponibilité des produits et <b>dispositifs médicaux</b>.<br>
L'État œuvre en outre à : développer l'<b>industrie pharmaceutique locale</b> et les <b>génériques</b> ; fixer les règles de sécurité et qualité (fabrication, importation, distribution, dispensation) ; fixer les conditions de sécurité des produits non médicamenteux et dispositifs ; encourager la <b>recherche</b>.</p>
<h3>🩸 Politique du sang</h3>
<p>Assurer la <b>disponibilité du sang et de ses dérivés</b> par tous les moyens possibles, en garantissant leur <b>sécurité et qualité</b>.</p>
<h3>📋 Les 4 devoirs de la population</h3>
<p>1. <b>Respect des règles de santé publique</b> établies par les services publics · 2. Obligations en cas de <b>maladie transmissible</b> dangereuse pour la communauté · 3. Acceptation des <b>soins et mesures prophylactiques</b>, y compris les mesures visant les <b>personnes contacts</b> · 4. <b>Conformité</b> aux dispositions législatives et réglementaires en vigueur.</p>`,
qs:[
{q:`Les droits de la population dans la loi 06-22 couvrent 4 domaines. Lequel est correct ?`,o:[`Santé publique, santé de l'individu, politique du sang, politique pharmaceutique`,`Prévention, soins, réadaptation, palliatif`,`Accès, qualité, équité, gouvernance`,`Public, privé, mutualiste, militaire`],c:0,e:`4 domaines : santé publique · santé de l'individu · politique du sang · politique pharmaceutique.`},
{q:`Combien de mesures l'État doit-il prendre au titre de la « santé de l'individu » ?`,o:[`3`,`4`,`5`,`6`],c:2,e:`5 mesures, de l'information de la population à la lutte contre la discrimination et la stigmatisation.`},
{q:`La lutte contre la stigmatisation liée aux caractéristiques génétiques relève :`,o:[`Des devoirs de la population`,`De la santé de l'individu`,`De la politique du sang`,`De la carte sanitaire`],c:1,e:`5e mesure de la santé de l'individu : lutte contre toute discrimination ou stigmatisation liée à la maladie, au handicap ou aux caractéristiques génétiques.`},
{q:`Parmi les objectifs de la politique pharmaceutique figure :`,o:[`L'augmentation du prix des médicaments`,`La réduction du prix du médicament`,`L'interdiction des génériques`,`La distribution exclusive par l'État`],c:1,e:`4 objectifs : disponibilité, qualité, réduction du prix, disponibilité des produits et dispositifs médicaux.`},
{q:`Pour la politique pharmaceutique, l'État encourage particulièrement :`,o:[`L'importation exclusive`,`L'industrie pharmaceutique locale et les médicaments génériques`,`Les médicaments de marque`,`La vente libre`],c:1,e:`Renforcement de l'industrie pharmaceutique locale et encouragement des génériques.`},
{q:`La politique du sang vise à assurer :`,o:[`La gratuité du don`,`La disponibilité, la sécurité et la qualité du sang et de ses dérivés`,`L'exportation du plasma`,`Le monopole du secteur privé`],c:1,e:`Assurer la disponibilité du sang et de ses dérivés par tous les moyens, en garantissant sécurité et qualité.`},
{q:`En cas de maladie transmissible dangereuse pour la communauté, les services publics peuvent prendre des mesures :`,o:[`Uniquement à l'égard du malade`,`À l'égard du malade et des personnes en contact avec lui`,`Uniquement à l'égard de la famille`,`Aucune mesure contraignante`],c:1,e:`Soins appropriés et mesures prophylactiques pour le malade, et mesures possibles à l'égard des personnes contacts, conformément aux textes en vigueur.`},
{q:`Le premier devoir de la population est :`,o:[`Payer les soins`,`Respecter les règles et mesures de protection générale de la santé`,`S'affilier à l'AMO`,`Se faire vacciner chaque année`],c:1,e:`Toute personne est tenue d'observer les règles et mesures de protection générale de la santé établies par les services publics de santé.`}
],
cards:[
{f:`Les 4 domaines de droits (Ch. II, loi 06-22)`,b:`Santé publique · santé de l'individu · politique du sang · politique pharmaceutique`},
{f:`Les 5 mesures « santé de l'individu »`,b:`Information sur les risques · protection de la santé et accès aux soins · intégrité physique et morale · droit du patient à l'information · lutte contre discrimination et stigmatisation`},
{f:`Les 4 objectifs de la politique pharmaceutique`,b:`Disponibilité · qualité · <b>réduction du prix</b> · disponibilité des produits et dispositifs médicaux`},
{f:`Les 4 devoirs de la population`,b:`Respect des règles de santé publique · obligations en cas de maladie transmissible · acceptation des soins et mesures prophylactiques (y compris pour les contacts) · conformité aux textes en vigueur`}
]},

{t:`L'offre de soins et les établissements (Ch. III-IV)`,ic:`🏥`,pages:`p.8-11`,
lesson:`<h3>🧱 Composition de l'offre de soins (4 éléments)</h3>
<p>1. Les <b>ressources humaines</b> · 2. L'ensemble de l'<b>infrastructure sanitaire</b> publique et privée · 3. Toutes autres <b>installations fixes ou mobiles</b> · 4. Les <b>moyens</b> mis en œuvre pour fournir les soins et prestations.</p>
<h3>🗺️ Répartition et organisation</h3>
<p>Répartition <b>équilibrée et équitable</b> selon les particularités et besoins de chaque région. Public et privé (lucratif ou non) organisés de façon <b>synergique</b> : offre <b>complémentaire, intégrée et cohérente</b>.</p>
<p>L'offre est organisée au niveau de <b>chaque région</b> selon la <b>carte sanitaire régionale</b>, dans le respect du <b>parcours de soins</b>, qui commence par : les <b>établissements de soins de santé de base</b> (public) ou un <b>médecin généraliste</b> (privé).</p>
<h3>🏛️ Système national de santé — définition</h3>
<p>Ensemble des <b>institutions, organismes, actions et ressources</b> intervenant dans la protection de la santé, public comme privé, aux niveaux <b>national et régional</b>, organisés pour réaliser les objectifs de l'État.</p>
<h3>🏥 Les 4 missions des établissements de santé</h3>
<p><b>Prévention · Diagnostic · Soins · Réadaptation</b> — que cela nécessite ou non une hospitalisation.</p>
<p>Chaque établissement doit : assurer les <b>conditions de sécurité sanitaire optimales</b>, <b>accueillir</b> les patients dans des conditions adaptées (y compris l'urgence), les <b>orienter</b> le cas échéant vers l'établissement approprié.</p>
<h3>📏 Les 8 normes d'organisation et de gestion</h3>
<p>Droits fondamentaux des personnes · sécurité des usagers · sécurité des personnels · sécurité des installations et équipements · règles de déontologie · normes et standards de qualité · règles d'hygiène et de salubrité · règles de bonne pratique clinique.</p>
<h3>🤝 Missions complémentaires</h3>
<p><b>Formation</b> initiale et continue · <b>recherche scientifique</b> · <b>partenariats</b> (institutions de formation, organisations professionnelles, sociétés savantes, associations, société civile) · contribution aux actions d'<b>IEC</b> (information, éducation, communication).</p>`,
qs:[
{q:`L'offre de soins comprend :`,o:[`Uniquement les hôpitaux publics`,`RH, infrastructure publique et privée, installations fixes ou mobiles, moyens de fourniture des soins`,`Uniquement les établissements privés`,`Les seuls équipements lourds`],c:1,e:`4 composantes : ressources humaines, infrastructure sanitaire publique et privée, autres installations fixes ou mobiles, moyens mis en œuvre.`},
{q:`Le parcours de soins commence par :`,o:[`L'hôpital universitaire`,`Les ESSB (public) ou un médecin généraliste (privé)`,`Les urgences`,`Le spécialiste de son choix`],c:1,e:`Le parcours de soins débute par les établissements de soins de santé de base dans le public, ou par un médecin généraliste dans le privé.`},
{q:`L'offre de soins est organisée au niveau de chaque région conformément :`,o:[`À la carte sanitaire nationale`,`À la carte sanitaire régionale de l'offre de soins`,`Au SROS de 2011`,`Au plan Santé 2025`],c:1,e:`Organisation régionale conforme à la carte sanitaire régionale de l'offre de soins.`},
{q:`Les 4 missions des établissements de santé sont :`,o:[`Prévention, diagnostic, soins, réadaptation`,`Prévention, promotion, soins, recherche`,`Accueil, tri, soins, sortie`,`Soins, formation, recherche, gestion`],c:0,e:`Prévention, diagnostic, soins, réadaptation — qu'il y ait hospitalisation ou non.`},
{q:`Les secteurs public et privé doivent être organisés de manière :`,o:[`Concurrentielle`,`Synergique, avec une offre complémentaire, intégrée et cohérente`,`Séparée et étanche`,`Hiérarchique`],c:1,e:`Organisation synergique afin de répondre avec efficacité aux besoins : offre complémentaire, intégrée et cohérente.`},
{q:`Parmi les normes d'organisation des établissements figure :`,o:[`La rentabilité financière`,`Les règles de bonne pratique clinique`,`Le nombre de lits par médecin`,`Le taux d'occupation minimal`],c:1,e:`Les 8 normes incluent droits fondamentaux, sécurités (usagers, personnels, installations), déontologie, qualité, hygiène et salubrité, bonne pratique clinique.`},
{q:`En plus des soins, les établissements de santé contribuent :`,o:[`À la formation, à la recherche et aux partenariats`,`Uniquement à la formation`,`À la seule production de médicaments`,`À rien d'autre`],c:0,e:`Formation initiale et continue, recherche scientifique, partenariats et actions d'IEC.`},
{q:`Le sigle IEC signifie :`,o:[`Information, Éducation, Communication`,`Institut d'Études Cliniques`,`Investissement, Équipement, Contrôle`,`Inspection, Évaluation, Certification`],c:0,e:`Information, Éducation, Communication — les établissements y contribuent au service des objectifs du SNS.`}
],

{t:`Carte sanitaire nationale et régionale (Ch. V-VI)`,ic:`🗺️`,pages:`p.12-13`,
lesson:`<h3>🗺️ Carte sanitaire NATIONALE</h3>
<p><b>Établie par :</b> l'<b>administration centrale</b>.<br>
<b>Contenu :</b> les <b>orientations générales</b> de la répartition de l'offre de soins.<br>
<b>Base d'analyse :</b> offre de soins <b>existante</b> · données <b>géo-démographiques</b> · données <b>épidémiologiques</b>.</p>
<h3>📍 Carte sanitaire RÉGIONALE</h3>
<p><b>Établie par :</b> le <b>groupement sanitaire territorial (GST)</b>, pour une <b>période déterminée</b> (révisable si les orientations générales changent).<br>
<b>Contenu :</b> inventaire global de l'offre publique et privée ; prévisions en RH, établissements, <b>lits, places, spécialités</b>, installations fixes et mobiles, <b>équipements lourds</b> et leur répartition spatiale.</p>
<p><b>Ses 4 objectifs :</b> répondre aux besoins régionaux · assurer <b>cohérence et équité</b> dans la répartition des ressources humaines et financières · <b>réduire les inégalités intrarégionales</b> · être établie pour une période donnée et révisable.</p>
<div class="warn">⚠️ Piège majeur : <b>nationale = administration centrale</b> (orientations générales) ; <b>régionale = GST</b> (inventaire + prévisions chiffrées).</div>
<h3>🤝 Partenariat public-privé (Ch. VI)</h3>
<p>Fondé sur la <b>complémentarité</b> et la <b>mutualisation des ressources</b>. <b>Article 21</b> : l'État met en place les mécanismes de <b>coordination</b> des soins entre public et privé. <b>Article 22</b> : les établissements publics peuvent <b>solliciter des professionnels du secteur privé</b> pour des missions spécifiques, selon des conditions réglementaires.</p>`,
qs:[
{q:`Qui établit la carte sanitaire nationale ?`,o:[`Le groupement sanitaire territorial`,`L'administration centrale`,`La Haute Autorité de Santé`,`Le conseil régional`],c:1,e:`La carte sanitaire nationale est établie par l'administration centrale et fixe les orientations générales de la répartition de l'offre de soins.`},
{q:`Qui établit la carte sanitaire régionale de l'offre de soins ?`,o:[`L'administration centrale`,`Le groupement sanitaire territorial (GST)`,`Le CHU`,`Le ministère de l'Intérieur`],c:1,e:`Depuis la loi 06-22, c'est le GST qui établit la carte sanitaire régionale, pour une période déterminée.`},
{q:`Sur quelles bases d'analyse repose la carte sanitaire nationale ?`,o:[`Offre existante, données géo-démographiques, données épidémiologiques`,`Budget, personnel, matériel`,`Population, PIB, inflation`,`Mortalité, natalité, migration`],c:0,e:`Trois bases : l'offre de soins existante, les données géo-démographiques et les données épidémiologiques.`},
{q:`La carte sanitaire régionale contient notamment :`,o:[`Uniquement les hôpitaux publics`,`Un inventaire global de l'offre publique ET privée`,`Les seuls équipements lourds`,`Le budget du ministère`],c:1,e:`Inventaire global de l'offre de soins dans les secteurs public et privé, puis prévisions pour le secteur public.`},
