/* U3 */
{t:`Les chefs de pôle`,ic:`👔`,pages:`II`,
lesson:`<h3>🩺 Le chef du pôle des affaires médicales</h3>
<p>Sous l'autorité du directeur, il assure la gestion du pôle et <b>coordonne l'activité professionnelle et scientifique</b> de l'établissement. Il est chargé de :</p>
<p>• mettre en place des mécanismes favorisant la <b>promotion des bonnes pratiques de soins</b><br>
• veiller à la <b>cohérence de l'ensemble des activités cliniques</b><br>
• établir les <b>besoins en médicaments et dispositifs médicaux</b><br>
• <b>valider les listes de garde et d'astreinte</b> des médecins et des étudiants en médecine<br>
• élaborer le <b>programme de formation continue</b> des médecins et médecins dentistes<br>
• mettre en œuvre les <b>recommandations du CMDP</b>, après approbation par le directeur<br>
• veiller à la <b>bonne tenue des dossiers d'hospitalisation</b><br>
• <b>contribuer à l'élaboration du PEH</b></p>
<h3>💉 Le chef du pôle des soins infirmiers</h3>
<p>Il coordonne l'activité professionnelle des infirmiers et du personnel infirmier en général :</p>
<p>• veiller à la <b>cohérence des activités paramédicales</b> avec l'ensemble des activités cliniques<br>
• <b>valider les listes de garde et d'astreinte des infirmiers</b><br>
• élaborer le <b>programme de formation continue des infirmiers en concertation avec le PAM</b> et participer à l'<b>encadrement des infirmiers stagiaires</b><br>
• mettre en œuvre les <b>recommandations du CII</b>, après approbation par le directeur</p>
<h3>🗂️ Le chef du pôle des affaires administratives</h3>
<p>• assurer le <b>suivi et l'évaluation</b> des activités du pôle et veiller à leur <b>cohérence avec la mission de l'établissement</b><br>
• mettre en œuvre les <b>recommandations des instances de concertation et d'appui</b> relevant de son pôle, après approbation par le directeur</p>
<div class="tip">Constante du texte : les chefs de pôle <b>valident</b> les listes de garde, le <b>directeur les approuve</b> ; les recommandations des conseils ne s'appliquent qu'<b>après approbation du directeur</b>.</div>`,
qs:[
{q:`Qui valide les listes de garde et d'astreinte des médecins ?`,o:[`Le chef du pôle des affaires médicales`,`Le directeur`,`Le chef de département`,`Le CMDP`],c:0,e:`Élaborées par les chefs de département/service, validées par le chef du PAM, approuvées par le directeur.`},
{q:`Le programme de formation continue des infirmiers est élaboré :`,o:[`Par le chef du PSI, en concertation avec le PAM`,`Par le directeur`,`Par le CII seul`,`Par le PAA`],c:0,e:`En concertation avec le pôle des affaires médicales.`},
{q:`Les recommandations du CMDP sont mises en œuvre :`,o:[`Par le chef du PAM, après approbation par le directeur`,`Directement par le CMDP`,`Par le comité de gestion`,`Par le délégué`],c:0,e:`Mise en œuvre par le chef du PAM après approbation du directeur.`},
{q:`La bonne tenue des dossiers d'hospitalisation est de la responsabilité :`,o:[`Du chef du pôle des affaires médicales`,`Du SAA`,`Du PAA`,`Du CII`],c:0,e:`Il veille à la bonne tenue des dossiers d'hospitalisation.`},
{q:`Qui établit les besoins en médicaments et dispositifs médicaux pour les activités hospitalières ?`,o:[`Le chef du PAM`,`Le pharmacien seul`,`Le directeur`,`Le PAA`],c:0,e:`Le chef du PAM les établit pour les départements, services et unités ; le pharmacien arrête ensuite la liste avec le CMDP.`},
{q:`L'encadrement des infirmiers stagiaires relève :`,o:[`Du chef du pôle des soins infirmiers`,`Du chef du PAM`,`Du directeur`,`Du CLIN`],c:0,e:`Il participe à l'encadrement des infirmiers stagiaires.`}
],

{t:`Comité d'établissement et comité de suivi`,ic:`🏛️`,pages:`III`,
lesson:`<h3>📋 Les 6 instances de concertation et d'appui</h3>
<p>1. Le <b>comité d'établissement</b> · 2. Le <b>comité de suivi et d'évaluation</b> · 3. Le <b>CMDP</b> (conseil des médecins, dentistes et pharmaciens) · 4. Le <b>CII</b> (conseil des infirmiers et infirmières) · 5. Le <b>CLIN</b> (comité de lutte contre les infections nosocomiales) · 6. Le <b>comité de gestion du centre hospitalier</b>.</p>
<h3>1️⃣ Le comité d'établissement</h3>
<p><b>Présidé par le directeur.</b> Composition : les <b>3 chefs de pôle</b> · le <b>responsable de la pharmacie</b> · le <b>responsable du service d'accueil et d'admission</b> · le <b>président du CMDP</b> · le <b>président du CII</b> · un <b>représentant du délégué</b> du ministère de la Santé à la préfecture ou province chef-lieu. Il peut s'adjoindre <b>à titre consultatif</b> toute personne utile.</p>
<p><b>Mission : définir les orientations stratégiques de l'hôpital.</b> Il se prononce sur : le <b>PEH et le plan d'action annuel</b> · le <b>projet de budget</b> et les <b>contrats-programmes</b> · les <b>programmes d'investissement</b> · les <b>plans de formation continue</b> · l'<b>allocation des ressources</b> et les mécanismes de synergie · les actions de <b>coopération hospitalière intrarégionale et interrégionale</b> · les <b>rapports et recommandations du comité de suivi et d'évaluation</b> · le <b>rapport d'activités</b> et l'analyse de la performance et de la qualité.</p>
<p>Il est <b>consulté</b> sur les projets de <b>création, scission ou regroupement</b> des départements, services ou unités. Il se réunit <b>une fois par trimestre</b> et autant que de besoin.</p>
<h3>2️⃣ Le comité de suivi et d'évaluation</h3>
<p><b>Présidé par le directeur.</b> Composition : un <b>représentant de chacun des 3 pôles</b> · le <b>responsable du SAA</b> · le <b>responsable de la pharmacie hospitalière</b>.</p>
<p><b>Secrétariat : le responsable du service d'accueil et d'admission.</b> Réunion : <b>une fois par trimestre</b>.</p>
<p><b>Missions</b>, sur la base des orientations du comité d'établissement : <b>suivi des activités</b> (clinique, informationnel, gestion des ressources humaines, matérielles et financières) · <b>examen des données</b> sur l'activité hospitalière · <b>analyse de la performance et de la qualité des soins</b>.</p>
<p>👉 Il procède à l'<b>analyse mensuelle des indicateurs</b> et propose au directeur des <b>axes d'amélioration</b> servant d'éléments indicatifs à la planification stratégique.</p>`,
qs:[
{q:`Combien d'instances de concertation et d'appui compte l'hôpital ?`,o:[`4`,`5`,`6`,`8`],c:2,e:`6 : comité d'établissement, comité de suivi et d'évaluation, CMDP, CII, CLIN, comité de gestion.`},
{q:`Le comité d'établissement a pour mission :`,o:[`De définir les orientations stratégiques de l'hôpital`,`De gérer le budget`,`De soigner les patients`,`De contrôler les infections`],c:0,e:`Définir les orientations stratégiques ; il se prononce sur le PEH, le budget, les investissements, la formation, l'allocation des ressources.`},
{q:`Le comité d'établissement se réunit :`,o:[`Une fois par mois`,`Une fois par trimestre et autant que de besoin`,`Deux fois par an`,`Une fois par an`],c:1,e:`Une fois par trimestre, à l'initiative de son président.`},
{q:`Le secrétariat du comité de suivi et d'évaluation est assuré par :`,o:[`Le responsable du service d'accueil et d'admission`,`Le chef du PAA`,`Le directeur`,`Le pharmacien`],c:0,e:`Responsable du SAA, qui est aussi membre du comité.`},
{q:`Le comité de suivi et d'évaluation procède à l'analyse des indicateurs :`,o:[`Mensuelle`,`Trimestrielle`,`Semestrielle`,`Annuelle`],c:0,e:`Analyse mensuelle des indicateurs et résultats obtenus, même s'il se réunit une fois par trimestre.`},
{q:`Qui préside le comité d'établissement et le comité de suivi et d'évaluation ?`,o:[`Le directeur`,`Le délégué`,`Le président du CMDP`,`Le chef du PAM`],c:0,e:`Les deux sont présidés par le directeur de l'hôpital.`},
{q:`Le représentant du délégué du ministère siège :`,o:[`Au comité d'établissement`,`Au comité de suivi et d'évaluation`,`Au CII`,`Au CLIN`],c:0,e:`Il est membre du comité d'établissement.`},
{q:`Les projets de création, scission ou regroupement de départements :`,o:[`Font l'objet d'une consultation du comité d'établissement`,`Sont décidés par le CMDP`,`Relèvent du comité de gestion seul`,`Sont interdits`],c:0,e:`Le comité d'établissement est consulté, en fonction des besoins des usagers et des capacités de l'hôpital.`}
],
cards:[
{f:`Les 6 instances de concertation et d'appui`,b:`Comité d'<b>établissement</b> · comité de <b>suivi et d'évaluation</b> · <b>CMDP</b> · <b>CII</b> · <b>CLIN</b> · comité de <b>gestion</b> du centre hospitalier`},
{f:`Comité d'établissement`,b:`Présidé par le <b>directeur</b> · <b>1 fois par trimestre</b> · définit les <b>orientations stratégiques</b> (PEH, budget, investissements, formation, ressources, coopération)`},
{f:`Comité de suivi et d'évaluation`,b:`Présidé par le <b>directeur</b> · <b>1 fois par trimestre</b> mais <b>analyse mensuelle</b> des indicateurs · secrétariat : <b>responsable du SAA</b>`}
]},

{t:`Le CMDP et le CII`,ic:`👥`,pages:`III`,
lesson:`<h3>3️⃣ Le conseil des médecins, des dentistes et des pharmaciens (CMDP)</h3>
<p><b>Composition</b> : des <b>représentants élus</b> des médecins, médecins dentistes et pharmaciens en fonction à l'hôpital, à raison de <b>deux représentants par département ou service clinique ou médico-technique</b>, et <b>deux représentants des autres services</b> ne relevant pas des départements. Le <b>directeur</b> et le <b>chef du PAM</b> en font partie <b>d'office</b>.</p>
<p>Les membres élisent parmi eux un <b>président sur la base de sa notoriété clinique</b>.</p>
<p><b>Attributions</b> : contribuer à l'élaboration du <b>projet d'établissement</b> · proposer au comité d'établissement des actions améliorant la <b>prise en charge des malades</b> · <b>émettre un avis</b> sur toute question clinique ou médico-technique soumise par le directeur · proposer des <b>plans de formation continue et de recherche</b> et l'encadrement des étudiants faisant fonction d'internes · <b>définir les besoins</b> en médicaments, produits pharmaceutiques non médicamenteux et dispositifs médicaux · proposer le <b>plan d'amélioration de la qualité et de la sécurité des soins</b>.</p>
<p>Réunion : <b>une fois par trimestre</b> et autant que nécessaire.</p>
<h3>4️⃣ Le conseil des infirmiers et infirmières (CII)</h3>
<p><b>Composition, par moitié</b> :</p>
<p>• <b>une moitié</b> : le <b>responsable du PSI</b>, les <b>infirmier(e)s chefs de départements</b> et les <b>infirmier(e)s chefs de services</b><br>
• <b>une moitié</b> : des <b>représentants élus</b> du personnel infirmier, des techniciens et des assistants médicaux lorsqu'ils existent</p>
<p>Les membres élisent parmi eux un <b>président sur la base de sa notoriété professionnelle</b>.</p>
<p><b>Attributions</b> : <b>apprécier la qualité et la pertinence des soins infirmiers</b> · <b>contribuer à la formation continue</b> · <b>donner son avis</b> sur les questions relatives aux soins infirmiers soumises par le directeur.</p>
<p>Réunion : <b>une fois par trimestre</b>. <b>Secrétariat : le chef du pôle des soins infirmiers.</b></p>
<div class="warn">⚠️ Piège : président du <b>CMDP</b> élu sur la <b>notoriété clinique</b> · président du <b>CII</b> élu sur la <b>notoriété professionnelle</b>.</div>`,
qs:[
{q:`Le président du CMDP est élu sur la base de :`,o:[`Sa notoriété clinique`,`Son ancienneté`,`Son grade`,`Sa notoriété professionnelle`],c:0,e:`CMDP : notoriété clinique. CII : notoriété professionnelle.`},
{q:`Le président du CII est élu sur la base de :`,o:[`Sa notoriété clinique`,`Sa notoriété professionnelle`,`Son diplôme`,`Son ancienneté`],c:1,e:`Notoriété professionnelle.`},
{q:`Le CMDP comprend, par département ou service clinique ou médico-technique :`,o:[`Un représentant`,`Deux représentants`,`Trois représentants`,`Tous les praticiens`],c:1,e:`Deux représentants par département ou service, plus deux représentants des autres services ne relevant pas des départements.`},
{q:`Qui fait partie d'office du CMDP ?`,o:[`Le directeur et le chef du pôle des affaires médicales`,`Le délégué`,`Le chef du PSI`,`Le pharmacien seul`],c:0,e:`Membres de droit du conseil.`},
{q:`Le CII est composé :`,o:[`Pour moitié de responsables et d'infirmiers chefs, pour moitié de représentants élus`,`Uniquement d'élus`,`Uniquement de chefs`,`Des seuls infirmiers du privé`],c:0,e:`Moitié responsable du PSI + infirmiers chefs de départements et services ; moitié représentants élus du personnel infirmier, techniciens et assistants médicaux.`},
{q:`Le secrétariat du CII est assuré par :`,o:[`Le chef du pôle des soins infirmiers`,`Le directeur`,`Le président élu`,`Le responsable du SAA`],c:0,e:`Chef du PSI.`},
{q:`Qui définit les besoins en médicaments et dispositifs médicaux au sein des instances ?`,o:[`Le CMDP`,`Le CII`,`Le CLIN`,`Le comité de gestion`],c:0,e:`Attribution expresse du CMDP ; la liste est ensuite arrêtée par le pharmacien en étroite collaboration avec le CMDP.`},
{q:`Le CII est notamment chargé :`,o:[`D'apprécier la qualité et la pertinence des soins infirmiers`,`De gérer les stocks`,`D'établir les factures`,`De nommer les infirmiers chefs`],c:0,e:`Qualité et pertinence des soins infirmiers, contribution à la formation continue, avis sur les questions soumises par le directeur.`}
],

{t:`Le CLIN et le comité de gestion`,ic:`🦠`,pages:`III`,
lesson:`<h3>5️⃣ Le comité de lutte contre les infections nosocomiales (CLIN)</h3>
<p><b>Composition</b> : outre le <b>directeur</b> et les <b>chefs de pôles</b> — le <b>président du CMDP</b> · les responsables du <b>laboratoire</b> et de la <b>pharmacie hospitalière</b> · <b>un médecin de chacune des spécialités</b> disponibles · l'<b>épidémiologiste</b> en fonction à l'hôpital lorsqu'il existe · un <b>ingénieur biomédical</b> · le représentant de l'<b>équipe opérationnelle d'hygiène</b>.</p>
<p><b>Le président est désigné par et parmi les membres du comité.</b> Réunion : <b>au moins une fois par trimestre</b>. <b>Secrétariat : le chef du pôle des affaires médicales.</b></p>
<p><b>Missions</b> : proposer le <b>programme d'actions</b> de lutte · proposer des <b>mécanismes de coordination</b> entre services · <b>participer à la formation</b> des professionnels en hygiène hospitalière · proposer un <b>dispositif de surveillance</b> · promouvoir les <b>recommandations de bonnes pratiques</b> · <b>évaluer périodiquement</b> les actions · organiser des <b>campagnes de sensibilisation</b> au profit des usagers. Il établit un <b>rapport périodique de situation</b> et veille à sa diffusion, et est <b>consulté</b> sur toute question d'hygiène hospitalière, d'infections nosocomiales et de <b>sécurité du patient</b>.</p>
<h3>6️⃣ Le comité de gestion du centre hospitalier</h3>
<p>Créé dans chaque centre hospitalier régional, préfectoral ou provincial, il est <b>présidé par le délégué</b> du ministère de la Santé à la préfecture ou province chef-lieu.</p>
<p>Membres : le <b>directeur du centre hospitalier</b> · les <b>directeurs des hôpitaux</b> le composant · les <b>chefs des 3 pôles</b> de chaque hôpital · le <b>médecin chef du SIAAP</b> · les <b>présidents du CMDP et du CII</b> des hôpitaux composant le centre.</p>
<p>Si le centre hospitalier est <b>régional</b> : présidence par le délégué à la préfecture ou province <b>chef-lieu de la région</b>, avec en plus les <b>délégués</b> des préfectures et provinces de la région, les <b>médecins chefs des SIAAP</b>, les <b>directeurs des centres hospitaliers préfectoraux et provinciaux</b> et les <b>chefs de pôles</b> concernés.</p>
<p><b>Mission générale de concertation, de coordination et de suivi</b> : veiller à la mise en œuvre de la <b>politique nationale d'hospitalisation</b> · analyser le <b>rapport d'activité</b> et évaluer la performance · <b>examiner et approuver le plan d'action annuel</b> · donner un <b>avis sur l'allocation des ressources</b> entre les hôpitaux · donner un <b>avis sur le projet d'établissement</b> · définir les actions de <b>coopération interhospitalière</b> et avec les ESSB.</p>
<div class="tip">📅 Réunions : <b>au moins deux fois par an</b> — <b>avant le 15 février</b> (bilan de l'exercice écoulé et examen du plan d'action de l'année) et <b>avant le 15 juillet</b> (état d'avancement et ajustements). <b>Quorum : la moitié des membres</b> ; décisions à la <b>majorité des voix</b> ; <b>secrétariat assuré par le directeur du centre hospitalier</b>.</div>`,
qs:[
{q:`Le président du CLIN est :`,o:[`Le directeur d'office`,`Désigné par et parmi les membres du comité`,`Le chef du PAM`,`L'épidémiologiste`],c:1,e:`Désignation interne, par et parmi les membres.`},
{q:`Le secrétariat du CLIN est assuré par :`,o:[`Le chef du pôle des affaires médicales`,`Le chef du PSI`,`Le pharmacien`,`Le responsable du SAA`],c:0,e:`Chef du PAM.`},
{q:`Le comité de gestion du centre hospitalier est présidé par :`,o:[`Le directeur du centre hospitalier`,`Le délégué du ministère de la Santé`,`Le wali`,`Le président du CMDP`],c:1,e:`Présidé par le délégué ; le directeur du centre hospitalier en assure le secrétariat.`},
{q:`Le comité de gestion se réunit au moins :`,o:[`Une fois par an`,`Deux fois par an, avant le 15 février et avant le 15 juillet`,`Une fois par trimestre`,`Une fois par mois`],c:1,e:`Avant le 15 février : bilan de l'exercice écoulé + plan d'action de l'année. Avant le 15 juillet : état d'avancement et ajustements.`},
{q:`Le comité de gestion délibère valablement lorsque :`,o:[`Au moins la moitié de ses membres sont présents`,`Les deux tiers sont présents`,`Tous les membres sont présents`,`Le délégué est présent`],c:0,e:`Quorum de la moitié, décisions à la majorité des voix.`},
{q:`Parmi les membres du CLIN figure :`,o:[`Un ingénieur biomédical`,`Le gouverneur`,`Un représentant des usagers`,`Le trésorier`],c:0,e:`Outre le directeur et les chefs de pôles : président du CMDP, laboratoire, pharmacie, un médecin par spécialité, épidémiologiste s'il existe, ingénieur biomédical, représentant de l'équipe opérationnelle d'hygiène.`},
{q:`Le sigle SIAAP désigne :`,o:[`Le service du réseau d'infrastructure et d'actions ambulatoires provincial ou préfectoral`,`Le service d'information et d'accueil`,`Le système d'archivage`,`Le service d'inspection`],c:0,e:`Son médecin chef siège au comité de gestion.`},
{q:`Le CLIN se réunit :`,o:[`Au moins une fois par trimestre`,`Une fois par an`,`Chaque mois`,`Deux fois par an`],c:0,e:`À l'initiative de son président, au moins une fois par trimestre et chaque fois que de besoin.`}
],
cards:[
{f:`CLIN : présidence et secrétariat`,b:`Président <b>désigné par et parmi les membres</b> · secrétariat assuré par le <b>chef du PAM</b> · réunion <b>au moins 1 fois par trimestre</b>`},
{f:`Comité de gestion : présidence et dates`,b:`Présidé par le <b>délégué</b>, secrétariat par le <b>directeur du centre hospitalier</b> · au moins <b>2 fois par an</b> : avant le <b>15 février</b> et avant le <b>15 juillet</b> · quorum <b>1/2</b>, décisions à la <b>majorité</b>`}
]},

{t:`Organisation des soins selon la capacité litière`,ic:`🛏️`,pages:`IV`,
lesson:`<h3>🏗️ Départements et services</h3>
<p>Le <b>département ou service médical</b> réunit les unités de soins et de services d'une <b>même spécialité ou de spécialités différentes</b> qui partagent le <b>même plateau technique</b>, s'adressent à la <b>même population cible</b>, ou nécessitent une <b>organisation commune</b>.</p>
<p>Un service médical peut être <b>médical</b>, <b>chirurgical</b> ou <b>médico-technique</b>. Les unités de soins sont créées <b>sur proposition du comité d'établissement</b>.</p>
<h3>🛏️ Moins de 120 lits → 8 services</h3>
<p>1. Service d'<b>accueil et d'admission (SAA)</b> · 2. Service des <b>urgences</b> · 3. Service <b>mère-enfant</b> · 4. Service de <b>médecine</b> · 5. Service de <b>chirurgie</b> (<b>y compris le bloc opératoire</b>) · 6. Service d'<b>imagerie médicale</b> · 7. Service de <b>biologie médicale</b> · 8. Service de la <b>pharmacie hospitalière</b>.</p>
<h3>🛏️ De 120 à 240 lits → 6 départements cliniques et 3 services</h3>
<p><b>Services</b> : SAA · urgences · pharmacie hospitalière.<br>
<b>Départements</b> : mère-enfant (DME) · médecine (DM) · chirurgie (DC) · traumato-orthopédie et neurochirurgie lorsqu'elle existe · ophtalmo-ORL-stomato · <b>médico-technique (DMT)</b> regroupant l'<b>imagerie médicale</b>, la <b>biologie médicale</b> et l'<b>exploration fonctionnelle</b>.</p>
<h3>🛏️ Plus de 240 lits → au maximum 8 départements cliniques</h3>
<p>Les <b>urgences doivent être intégrées dans un département clinique</b>, dans le respect de la cohérence des activités médicales et chirurgicales. L'hôpital comprend en outre le <b>service d'accueil et d'admission</b> et la <b>pharmacie hospitalière</b>.</p>
<p>Toutes les spécialités sont intégrées dans les départements correspondants <b>par décision du directeur après avis du comité d'établissement</b>. Le <b>bloc opératoire</b> est rattaché à <b>l'un des départements de chirurgie</b>, désigné par le directeur <b>après avis du comité d'établissement</b>.</p>`,
qs:[
{q:`Un hôpital général de moins de 120 lits est organisé en :`,o:[`6 départements`,`8 services`,`3 pôles`,`8 départements`],c:1,e:`8 services, dont le service de chirurgie qui inclut le bloc opératoire.`},

{q:`Les hôpitaux de 120 à 240 lits sont organisés en :`,o:[`6 départements cliniques et 3 services`,`8 services`,`8 départements`,`4 départements et 4 services`],c:0,e:`6 départements cliniques et 3 services (SAA, urgences, pharmacie hospitalière).`},
{q:`Les hôpitaux de plus de 240 lits ne peuvent dépasser :`,o:[`6 départements cliniques`,`8 départements cliniques`,`10 départements`,`12 services`],c:1,e:`Maximum 8 départements cliniques.`},
{q:`Dans un hôpital de plus de 240 lits, les urgences :`,o:[`Constituent un service autonome`,`Doivent être intégrées dans un département clinique`,`Relèvent du SAA`,`Sont externalisées`],c:1,e:`Intégration obligatoire dans un département clinique.`},
{q:`Le département médico-technique regroupe notamment :`,o:[`L'imagerie médicale, la biologie médicale et l'exploration fonctionnelle`,`La pharmacie et les urgences`,`Le bloc et la réanimation`,`Les archives et l'accueil`],c:0,e:`Trois unités médico-techniques dans le DMT des hôpitaux de 120 à 240 lits.`},
{q:`Le bloc opératoire d'un hôpital de plus de 240 lits est rattaché :`,o:[`À l'un des départements de chirurgie, désigné par le directeur après avis du comité d'établissement`,`Au département médico-technique`,`Au SAA`,`Directement au directeur`],c:0,e:`Décision du directeur après avis du comité d'établissement.`},

],

/* U8 */
{t:`Chefs de département, pharmacie et SAA`,ic:`💊`,pages:`IV`,
lesson:`<h3>🩺 Le chef de département</h3>
<p>Chaque département est placé sous l'autorité d'un <b>médecin chef assisté par un infirmier chef</b>. Il organise le fonctionnement de la structure <b>dans le respect de la responsabilité médicale de chaque praticien</b> : planifier et gérer les ressources · coordonner l'élaboration <b>multidisciplinaire</b> de la programmation · assurer la <b>présence des ressources médicales</b> et établir les <b>listes de garde et d'astreinte</b> · veiller aux règles d'<b>éthique et de déontologie</b> · <b>encadrer les étudiants et stagiaires</b>.</p>
<p><b>Conjointement</b> avec l'infirmier chef de département et les chefs d'unités : <b>évaluer périodiquement la qualité</b> des soins · évaluer les <b>besoins de formation continue</b> · s'assurer du respect des règles d'<b>hygiène et d'asepsie</b> · élaborer les <b>protocoles cliniques généraux</b> et les <b>chemins thérapeutiques</b>.</p>
<h3>👩‍⚕️ Les infirmiers chefs d'unités</h3>
<p>Ils <b>organisent et supervisent</b> le travail des infirmiers, techniciens et personnel de soutien · <b>évaluent les besoins des patients</b> et s'assurent que les prestations sont dispensées <b>conformément aux prescriptions médicales</b> · veillent à la <b>qualité des soins infirmiers</b> · assurent l'<b>encadrement des stagiaires</b>.</p>
<h3>💊 La pharmacie hospitalière</h3>
<p>La pharmacie hospitalière et le SAA sont deux <b>services médico-techniques placés sous l'autorité directe du directeur</b>.</p>
<p><b>Mission</b> : assurer la <b>préparation, le contrôle, la détention, la distribution et la dispensation</b> des médicaments et dispositifs médicaux, et veiller à la <b>préservation de leur qualité</b>. Elle est placée sous la responsabilité d'un <b>pharmacien</b>.</p>
<p>Le pharmacien : concourt à la <b>pharmacovigilance et à la matériovigilance</b> · <b>arrête la liste</b> des médicaments et dispositifs à partir de la <b>nomenclature nationale</b>, en <b>étroite collaboration avec le CMDP</b> · supervise la <b>réception</b> · gère les <b>stocks</b> en évitant gaspillage, <b>stocks morts</b> et <b>péremptions</b> · assure la <b>traçabilité</b> · met à jour le <b>registre des stupéfiants</b> · participe à la <b>surveillance des infections nosocomiales</b> par le suivi de la consommation des anti-infectieux · assure la <b>dispensation nominative sur ordonnance</b> des <b>médicaments onéreux et des ALD</b> · assure la <b>disponibilité des médicaments et dispositifs vitaux aux urgences</b>.</p>
<h3>🚪 Le service d'accueil et d'admission (SAA)</h3>
<p><b>Géré par un médecin.</b> Il gère l'<b>accueil et l'orientation</b> · organise les <b>admissions, sorties et rendez-vous</b> · gère les <b>effectifs et mouvements</b> de patients · enregistre les <b>actes médicaux légaux</b> et gère la <b>morgue hospitalière</b> · établit les <b>statistiques</b> et l'<b>information hospitalière</b> · établit la <b>facturation</b> · organise la <b>communication interne et externe</b> · assure l'<b>assistance sociale</b> · organise et gère les <b>archives médicales et dossiers des patients</b>.</p>`,
qs:[
{q:`La pharmacie hospitalière et le SAA sont placés :`,o:[`Sous l'autorité directe du directeur de l'hôpital`,`Sous l'autorité du chef du PAM`,`Sous l'autorité du chef du PAA`,`Sous l'autorité du comité d'établissement`],c:0,e:`Deux services médico-techniques rattachés directement au directeur.`},
{q:`Le service d'accueil et d'admission est géré par :`,o:[`Un médecin`,`Un administrateur`,`Un infirmier chef`,`Un technicien`],c:0,e:`« Il est géré par un médecin. »`},
{q:`La gestion de la morgue hospitalière relève :`,o:[`Du service d'accueil et d'admission`,`Du PAA`,`De la pharmacie`,`Du service des urgences`],c:0,e:`Le SAA enregistre les actes médicaux légaux et assure la gestion de la morgue.`},
{q:`Qui arrête la liste des médicaments nécessaires au fonctionnement de l'hôpital ?`,o:[`Le pharmacien, à partir de la nomenclature nationale et en étroite collaboration avec le CMDP`,`Le directeur seul`,`Le chef du PAA`,`Le comité de gestion`],c:0,e:`Le pharmacien responsable, en collaboration étroite avec le CMDP.`},
{q:`Chaque département est placé sous l'autorité :`,o:[`D'un médecin chef assisté d'un infirmier chef`,`D'un cadre administratif`,`D'un infirmier chef seul`,`Du chef de pôle`],c:0,e:`Médecin chef + infirmier chef.`},
{q:`Les protocoles cliniques et chemins thérapeutiques sont élaborés :`,o:[`Par le chef de département avec l'infirmier chef et les chefs d'unités`,`Par le directeur`,`Par le CMDP seul`,`Par le pharmacien`],c:0,e:`Élaboration conjointe, pour les départements ou services cliniques.`},
{q:`La dispensation nominative sur ordonnance concerne :`,o:[`Les médicaments onéreux et ceux des affections de longue durée`,`Tous les médicaments`,`Les seuls antibiotiques`,`Les dispositifs médicaux`],c:0,e:`Obligation particulière du pharmacien hospitalier.`},
{q:`Le pharmacien participe à la surveillance des infections nosocomiales par :`,o:[`Le suivi de l'évolution de la consommation des produits anti-infectieux`,`Les prélèvements bactériologiques`,`L'isolement des patients`,`Le nettoyage des locaux`],c:0,e:`Suivi de la consommation des médicaments, notamment anti-infectieux.`},
{q:`Les infirmiers chefs d'unités s'assurent que les prestations sont dispensées :`,o:[`Conformément aux prescriptions médicales`,`Selon leur propre appréciation`,`Selon le budget`,`Selon les horaires du service`],c:0,e:`Ils évaluent les besoins des patients et veillent au respect des prescriptions médicales.`}
],
cards:[
{f:`Rattachement de la pharmacie et du SAA`,b:`Deux services <b>médico-techniques</b> placés sous l'<b>autorité directe du directeur</b> ; le SAA est <b>géré par un médecin</b>`},
{f:`Les 5 verbes de la pharmacie hospitalière`,b:`<b>Préparation · contrôle · détention · distribution · dispensation</b> des médicaments et dispositifs médicaux, avec préservation de leur qualité`},

/* U9 */
{t:`L'admission ordinaire`,ic:`🚪`,pages:`V`,
lesson:`<h3>🚪 Les 5 modes d'utilisation des prestations</h3>
<p>1. L'<b>hospitalisation</b>, y compris l'<b>hôpital de jour</b>, en admission <b>ordinaire</b> ou en <b>urgence</b><br>
2. Les prestations et services de <b>diagnostic</b> rendus à titre externe<br>
3. Les <b>consultations spécialisées</b> à titre externe<br>
4. Les <b>consultations et soins d'urgence</b><br>
5. Les prestations de <b>rééducation et de réadaptation fonctionnelle</b></p>
<h3>📋 L'admission ordinaire</h3>
<p>Toute hospitalisation <b>complète ou de jour, programmée en dehors des urgences</b>. Les modalités s'effectuent au <b>service d'accueil et d'admission</b>.</p>
<p>• <b>Tout refus d'admission doit être motivé par écrit.</b><br>
• Aucune admission ordinaire <b>sans décision médicale</b> prise par un <b>médecin en fonction à l'hôpital</b>, sur la base de l'examen du patient ou de son dossier en cas de référence.<br>
• Le médecin délivre une <b>ordonnance médicale d'admission</b> mentionnant : l'<b>identité du patient</b>, le <b>motif d'hospitalisation</b>, le <b>département ou service</b> et la <b>date</b>.<br>
• Il établit une <b>demande d'accord de prise en charge (PEC)</b> pour les patients assurés.<br>
• L'ordonnance et la demande doivent porter <b>lisiblement le nom et la signature du médecin</b>.<br>
• <b>L'admission ordinaire ne peut se faire que pendant les heures et jours ouvrables de la semaine.</b></p>
<h3>🎫 Le billet d'entrée</h3>
<p>Aucun patient ne peut être hospitalisé en admission ordinaire <b>sans établissement d'un billet d'entrée par le SAA</b>. Tout manquement est <b>passible de sanctions disciplinaires</b> ; le <b>médecin chef et l'infirmier chef</b> veillent au respect de cette règle et informent immédiatement le directeur.</p>
<p>En cas d'<b>indisponibilité de lits</b>, l'hospitalisation peut être <b>programmée avec un rendez-vous</b> après avis du médecin ayant décidé l'hospitalisation. <b>En aucun cas</b> elle ne peut être différée si l'état de santé <b>risque de s'aggraver</b> ou de <b>compromettre le pronostic vital</b>.</p>
<h3>👨‍👩‍👦 Les accompagnants</h3>
<p><b>À titre exceptionnel</b>, si l'état de santé l'exige et si la <b>disponibilité en lits le permet</b>, le <b>directeur</b> peut autoriser l'admission d'un <b>parent</b> du patient, <b>après avis du médecin traitant</b>. L'accompagnant accomplit les formalités auprès du SAA et <b>ne peut se prévaloir de son maintien</b> si le lit qu'il occupe devient nécessaire.</p>`,
qs:[
{q:`Le refus d'admission doit être :`,o:[`Motivé par écrit`,`Verbal`,`Validé par le délégué`,`Sans justification`],c:0,e:`« Tout refus d'admission doit être motivé par écrit. »`},
{q:`L'admission ordinaire peut avoir lieu :`,o:[`À tout moment`,`Uniquement pendant les heures et jours ouvrables de la semaine`,`La nuit également`,`Le week-end`],c:1,e:`Restriction expresse aux heures et jours ouvrables.`},
{q:`Sans quel document aucun patient ne peut être hospitalisé en admission ordinaire ?`,o:[`Le billet d'entrée établi par le SAA`,`La carte AMO`,`Le bulletin de sortie`,`Le certificat médical`],c:0,e:`Manquement passible de sanctions disciplinaires.`},
{q:`L'ordonnance médicale d'admission mentionne notamment :`,o:[`L'identité du patient, le motif d'hospitalisation, le département ou service et la date`,`Le tarif`,`Le numéro de lit`,`La durée du séjour`],c:0,e:`Quatre mentions, avec nom et signature lisibles du médecin.`},
{q:`En cas d'indisponibilité de lits, l'hospitalisation :`,o:[`Est toujours reportée`,`Peut être programmée avec rendez-vous, sauf si l'état risque de s'aggraver ou de compromettre le pronostic vital`,`Est refusée définitivement`,`Se fait dans le privé`],c:1,e:`Le report est impossible dès qu'il y a risque d'aggravation ou pronostic vital engagé.`},
{q:`L'admission d'un accompagnant est autorisée :`,o:[`Par le directeur, à titre exceptionnel, après avis du médecin traitant et si les lits le permettent`,`Automatiquement`,`Par l'infirmier chef`,`Sur paiement`],c:0,e:`Trois conditions cumulatives.`},
{q:`Qui décide de l'admission ordinaire ?`,o:[`Un médecin en fonction à l'hôpital`,`L'agent du SAA`,`L'infirmier chef`,`Le directeur`],c:0,e:`Décision médicale, sur examen du patient ou de son dossier en cas de référence.`},
{q:`Le patient non couvert et sans exonération est informé :`,o:[`De l'obligation de payer directement l'intégralité des frais d'hospitalisation`,`Qu'il sera soigné gratuitement`,`Qu'il doit changer d'hôpital`,`Qu'il sera transféré`],c:0,e:`Information sur le paiement direct selon la tarification en vigueur ; sinon, sa famille en cas d'incapacité.`}
],
cards:[
{f:`Les 5 modes d'utilisation des prestations hospitalières`,b:`Hospitalisation (complète ou de jour, ordinaire ou en urgence) · diagnostic externe · consultations spécialisées externes · consultations et soins d'urgence · rééducation et réadaptation fonctionnelle`},
{f:`Règles d'or de l'admission ordinaire`,b:`Décision d'un <b>médecin de l'hôpital</b> · <b>ordonnance d'admission</b> + demande de PEC · <b>billet d'entrée</b> obligatoire · <b>jours et heures ouvrables</b> · refus <b>motivé par écrit</b>`},
{f:`Admission d'un accompagnant`,b:`<b>À titre exceptionnel</b>, autorisée par le <b>directeur</b>, après <b>avis du médecin traitant</b> et si la <b>disponibilité en lits</b> le permet`}
]},

/* U10 */
{t:`L'admission en urgence et les mineurs`,ic:`🚨`,pages:`V`,
lesson:`<h3>🚨 L'admission en urgence</h3>
<p>Tout patient, blessé ou parturiente se présentant en situation d'urgence <b>doit être reçu, examiné et admis</b> en hospitalisation si son état l'exige, <b>même en cas d'indisponibilité de lits</b>. <b>La procédure de facturation n'est entamée qu'après engagement de la prise en charge médicale.</b></p>
<p>Si l'état n'est <b>pas jugé médicalement urgent</b> : référence vers la structure appropriée, ou prise en charge directe <b>sous réserve de s'acquitter préalablement des frais</b>. Le patient admis aux urgences dont l'état n'exige pas l'hospitalisation doit, <b>avant sa sortie</b>, s'acquitter des frais auprès du SAA.</p>
<p><b>Qui ordonne l'hospitalisation d'urgence ?</b> Le <b>médecin des urgences</b> ou le <b>spécialiste de garde ou d'astreinte</b>. Pour les <b>parturientes</b>, la décision peut être prise par la <b>sage-femme</b> ou, le cas échéant, l'<b>infirmière accoucheuse</b>, <b>sous l'encadrement du médecin ou du gynécologue obstétricien de garde</b>, qui établit l'ordonnance d'admission.</p>
<h3>🧾 Le patient inconscient</h3>
<p>L'<b>infirmier de garde</b> procède à l'<b>inventaire contradictoire</b> des effets, objets et sommes d'argent et dresse un <b>procès-verbal</b> signé conjointement avec un accompagnant, ou à défaut par la <b>personne l'ayant transporté</b> ou par <b>deux témoins</b>. Les objets sont remis à l'administration et conservés par l'<b>agent responsable des biens des patients</b> désigné par le directeur ; ils ne sont restitués qu'<b>au patient lors de sa sortie</b> ou à un <b>membre de sa famille devant témoins</b>.</p>
<h3>⚰️ Personne décédée et transfert</h3>
<p>L'admission d'une <b>personne décédée est interdite</b>. En l'absence de morgue municipale, l'hôpital peut, <b>à titre exceptionnel</b>, recevoir le corps <b>à la demande des autorités compétentes</b> ; un constat portant la mention « <b>arrivé mort à l'hôpital</b> » est établi.</p>
<p><b>Transfert d'un patient admis en urgence</b> : le médecin des urgences prodigue les <b>premiers secours</b> et ordonne le transfert vers l'établissement approprié, via le <b>centre de régulation médicale</b> quand il existe. La <b>famille est informée</b>. Le patient doit être <b>informé préalablement</b> et, <b>sauf extrême urgence, le transfert exige son consentement écrit</b> ; s'il est dans l'impossibilité de le donner, mention est portée au dossier, le transfert est effectué et la famille informée dans les meilleurs délais.</p>
<h3>🧒 Les patients mineurs</h3>
<p>Admission à la demande du <b>père, de la mère, du représentant légal</b> ou du représentant de l'établissement qui héberge l'enfant. L'agent du SAA <b>vérifie l'identité de l'accompagnant</b> et inscrit <b>noms, prénoms et numéro de CIN</b> au formulaire.</p>
<p>La <b>mère d'un mineur de moins de 5 ans</b> (ou son représentant légal de sexe féminin) peut être autorisée à rester auprès de l'enfant ; la <b>maman qui allaite doit obligatoirement être retenue</b> auprès de son enfant.</p>
<p>Mineur non accompagné : l'hôpital <b>prodigue les soins requis</b> et informe le représentant légal ou, à défaut, les <b>autorités de police judiciaire</b>.</p>
<p><b>Mineurs de moins de 12 ans</b> : hors hôpitaux d'enfants, ils <b>ne peuvent être admis dans les services pour adultes</b>, sauf si leur cas relève d'une discipline non pratiquée en pédiatrie ; le directeur doit alors les <b>séparer des adultes dans un lieu protégé</b>.</p>
<h3>🎒 Scolarisation</h3>
<p>Lorsqu'<b>au moins cinq enfants</b> en âge de scolarisation sont hospitalisés pour une maladie de <b>moyenne ou longue durée</b>, l'hôpital peut demander à l'<b>Académie régionale de l'éducation et de la formation</b> des enseignants. Ceux-ci bénéficient de la <b>protection juridique</b> ; en cas de manquement, le médecin chef adresse un <b>rapport motivé</b> au directeur, qui demande des <b>explications écrites</b>, peut diligenter une <b>enquête</b>, adresser un <b>rappel à l'ordre</b> et transmettre le dossier disciplinaire à l'Académie <b>sous couvert du délégué</b>, en en conservant une copie.</p>`,
qs:[
{q:`Un patient en situation d'urgence doit être admis :`,o:[`Même en cas d'indisponibilité de lits`,`Seulement s'il y a un lit`,`Après paiement`,`Après accord du directeur`],c:0,e:`Reçu, examiné et admis si son état l'exige, même sans lit disponible.`},
{q:`En urgence, la procédure de facturation est entamée :`,o:[`Avant les soins`,`Après engagement de la prise en charge médicale`,`À l'arrivée`,`Jamais`],c:1,e:`Les soins passent avant la facturation.`},
{q:`L'hospitalisation d'une parturiente peut être décidée par :`,o:[`La sage-femme ou l'infirmière accoucheuse, sous l'encadrement du médecin ou du gynécologue de garde`,`La sage-femme seule et sans encadrement`,`L'infirmier chef`,`Le SAA`],c:0,e:`Sous encadrement du médecin ou gynécologue obstétricien de garde, qui établit l'ordonnance d'admission.`},
{q:`Si le patient admis en urgence est inconscient, l'inventaire de ses effets est réalisé par :`,o:[`L'infirmier de garde, de façon contradictoire, avec procès-verbal`,`Le directeur`,`La police`,`Le médecin des urgences`],c:0,e:`PV signé avec un accompagnant, ou la personne l'ayant transporté, ou deux témoins.`},
{q:`L'admission à l'hôpital d'une personne décédée est :`,o:[`Interdite, sauf réception exceptionnelle du corps à la demande des autorités en l'absence de morgue municipale`,`Autorisée`,`Soumise à paiement`,`Décidée par le médecin`],c:0,e:`Constat portant la mention « arrivé mort à l'hôpital ».`},
{q:`Sauf extrême urgence, le transfert d'un patient exige :`,o:[`Son consentement écrit`,`L'accord du délégué`,`L'avis du CMDP`,`Rien`],c:0,e:`À défaut, mention au dossier, transfert effectué et famille informée dans les meilleurs délais.`},
{q:`Hors hôpitaux d'enfants, les mineurs ne peuvent être admis dans les services pour adultes avant :`,o:[`5 ans`,`12 ans`,`16 ans`,`18 ans`],c:1,e:`Moins de 12 ans, sauf discipline non pratiquée en pédiatrie, avec séparation dans un lieu protégé.`},
{q:`La mère peut être autorisée à rester auprès de son enfant hospitalisé, en particulier s'il a moins de :`,o:[`3 ans`,`5 ans`,`10 ans`,`12 ans`],c:1,e:`Moins de 5 ans ; la maman qui allaite doit obligatoirement être retenue auprès de son enfant.`},
{q:`À partir de combien d'enfants hospitalisés l'hôpital peut-il demander des enseignants ?`,o:[`3`,`5`,`10`,`15`],c:1,e:`Au moins cinq enfants en âge de scolarisation, hospitalisés pour une maladie de moyenne ou longue durée.`},
{q:`Le transfert d'un patient des urgences se fait, quand il existe, par le biais :`,o:[`Du centre de régulation médicale`,`De la protection civile`,`De la police`,`Du SAA`],c:0,e:`Transfert sécurisé via le centre de régulation médicale.`}
],
cards:[
{f:`Urgence : les 3 règles`,b:`Admission <b>même sans lit</b> · <b>facturation après</b> l'engagement de la prise en charge · hospitalisation ordonnée par le <b>médecin des urgences</b> ou le <b>spécialiste de garde ou d'astreinte</b>`},
{f:`Les âges à retenir`,b:`<b>&lt; 5 ans</b> : la mère peut rester (allaitement : <b>obligatoire</b>) · <b>&lt; 12 ans</b> : pas d'admission en service adulte · <b>≥ 5 enfants</b> : demande d'enseignants à l'Académie régionale`},
{f:`Patient inconscient aux urgences`,b:`<b>Inventaire contradictoire</b> par l'<b>infirmier de garde</b> + <b>PV</b> signé avec un accompagnant, la personne l'ayant transporté ou <b>deux témoins</b> ; objets remis à l'administration`},
{f:`Personne décédée`,b:`Admission <b>interdite</b> ; réception exceptionnelle du corps à la demande des <b>autorités compétentes</b> en l'absence de morgue municipale, avec la mention « <b>arrivé mort à l'hôpital</b> »`}
]},

/* U11 */
{t:`Les admissions particulières et le consentement`,ic:`⚖️`,pages:`V`,
lesson:`<h3>🧠 Les malades mentaux</h3>
<p>Hospitalisation <b>à leur demande ou à la demande de toute autre personne</b> publique ou privée, ou <b>mise en observation</b>. Lorsqu'elle est demandée par un tiers, la demande doit être faite <b>par écrit au directeur</b>.</p>
<p>Dans tous les cas, l'hospitalisation ne peut être décidée qu'<b>au vu d'un certificat délivré par un médecin psychiatre</b>. Ce certificat <b>ne peut être délivré par un médecin parent ou allié</b> du malade ni par la personne qui demande l'hospitalisation.</p>
<p>L'<b>hospitalisation d'office</b> n'intervient que : <b>par décision du gouverneur</b> de la préfecture ou province, <b>sur avis conforme du médecin traitant</b>, lorsque la sortie constituerait un <b>danger pour sa vie, ses proches ou l'ordre public</b> — <b>ou sur ordonnance du juge</b>.</p>
<h3>🔒 Les détenus</h3>
<p>Admission à l'<b>hôpital le plus proche</b>, sur <b>demande écrite du médecin de l'établissement pénitentiaire</b>, lorsque les soins ne peuvent être dispensés sur place ou en cas d'<b>affection épidémique</b>. Le détenu est examiné sous la responsabilité du <b>médecin chef de département</b>, qui peut à tout moment ordonner son <b>renvoi</b>. En urgence, hospitalisation possible <b>en attendant la demande écrite</b>, le directeur étant <b>informé dans tous les cas</b>.</p>
<p>Les détenus sont admis dans des <b>chambres spécialement aménagées</b> lorsqu'elles existent, ou dans des lits permettant la surveillance sans gêner le service. <b>La surveillance incombe exclusivement à l'établissement pénitentiaire.</b> Les <b>interrogatoires</b> par des autorités extérieures exigent l'<b>autorisation expresse du directeur après avis du médecin traitant</b>.</p>
<h3>🎖️ Les militaires (FAR)</h3>
<p>Hors urgence, admis <b>dans les mêmes conditions que les civils</b>, à leur demande ou à celle de l'autorité militaire. En urgence, le directeur <b>informe l'autorité militaire</b> ou, à défaut, la <b>gendarmerie royale</b>. Dès que l'état le permet, évacuation possible vers l'<b>hôpital militaire</b> à leur demande ou à celle de l'autorité militaire.</p>
<h3>🦠 Maladies transmissibles · AT/MP · étrangers</h3>
<p><b>Maladie transmissible à déclaration obligatoire confirmée</b> : le directeur <b>informe le délégué</b>, remplit les <b>formalités de déclaration</b>, prend les <b>mesures prophylactiques</b> et l'<b>isolement immédiat</b> le cas échéant. <b>L'hospitalisation ne peut être différée</b> et doit être prononcée <b>même sans lit disponible</b>. En cas de <b>danger grave pour la santé publique</b>, le délégué prend les mesures nécessaires <b>en concertation avec les autorités locales</b>.</p>
<p><b>Accidents du travail et maladies professionnelles</b> : mêmes conditions et formalités ; les certificats sont établis par les <b>médecins désignés au niveau de l'unité chargée des accidents de travail</b>.</p>
<p><b>Étrangers</b> : admis <b>quels que soient leurs statuts, dans les mêmes conditions que les nationaux</b> ; la facturation suit les mêmes règles, <b>sauf convention de soins</b> entre le Maroc et leur pays.</p>
<h3>✍️ Le consentement préalable</h3>
<p>Quel que soit le mode d'admission, un <b>formulaire de consentement</b> est signé par le patient ou son représentant légal pour les actes de diagnostic, de soins ou de services.</p>
<p>Pour un <b>mineur</b> dont le représentant légal est injoignable, l'intervention est possible si : l'<b>urgence est constatée</b> et l'intervention décidée par le <b>médecin hospitalier</b> · elle est pratiquée <b>par lui ou sous sa supervision</b> · la décision est <b>portée à la connaissance du représentant légal</b>. Elle fait l'objet d'un <b>protocole contresigné par le médecin et le directeur</b>, conservé au dossier.</p>
<p>En cas de <b>refus d'autorisation</b> ou d'impossibilité de recueillir le consentement, l'intervention n'a lieu qu'en <b>cas d'urgence</b> et seulement si la <b>vie de l'enfant est en péril</b> ou son <b>intégrité corporelle menacée</b> ; un <b>procès-verbal de refus</b> est dressé et signé par le représentant de l'administration et la personne responsable de l'enfant ou, à défaut, par <b>deux témoins</b>.</p>`,
qs:[
{q:`Le certificat justifiant l'hospitalisation d'un malade mental doit être délivré par :`,o:[`Un médecin psychiatre, qui ne peut être parent ou allié du malade ni le demandeur`,`Le médecin traitant habituel`,`Un généraliste`,`Le directeur`],c:0,e:`Double garantie : psychiatre, et absence de lien de parenté ou d'intérêt.`},
{q:`L'hospitalisation d'office d'un malade mental intervient :`,o:[`Par décision du gouverneur sur avis conforme du médecin traitant, ou sur ordonnance du juge`,`Par décision du directeur`,`À la demande de la famille`,`Par le délégué`],c:0,e:`Deux voies : décision du gouverneur sur avis conforme du médecin traitant (danger pour sa vie, ses proches ou l'ordre public), ou ordonnance du juge.`},
{q:`La surveillance des détenus hospitalisés incombe :`,o:[`Exclusivement à l'établissement pénitentiaire`,`À l'hôpital`,`Au SAA`,`À la police`],c:0,e:`Règle expresse du règlement intérieur.`},
{q:`Les interrogatoires d'un patient par des autorités extérieures exigent :`,o:[`L'autorisation expresse du directeur après avis du médecin traitant`,`Une réquisition seule`,`L'accord du patient uniquement`,`Rien`],c:0,e:`Double filtre : directeur + avis du médecin traitant.`},
{q:`En cas d'admission urgente d'un militaire, le directeur informe :`,o:[`L'autorité militaire ou, à défaut, la gendarmerie royale`,`Le gouverneur`,`Le délégué`,`Le ministère public`],c:0,e:`Information de l'autorité militaire, à défaut la gendarmerie royale.`},
{q:`L'hospitalisation d'un patient atteint d'une maladie transmissible à déclaration obligatoire :`,o:[`Peut être différée en cas de manque de lits`,`Ne peut être différée et est prononcée même sans lit disponible`,`Nécessite l'accord du gouverneur`,`Se fait en clinique privée`],c:1,e:`Interdiction absolue de différer, avec isolement immédiat le cas échéant.`},
{q:`Les patients étrangers sont admis :`,o:[`Dans les mêmes conditions que les nationaux, quels que soient leurs statuts`,`Après paiement d'une caution`,`Seulement en urgence`,`Avec l'accord du consulat`],c:0,e:`Facturation identique, sauf convention de soins entre le Maroc et leur pays.`},
{q:`En cas de refus d'autorisation pour un mineur, l'intervention n'a lieu que si :`,o:[`La vie de l'enfant est en péril ou son intégrité corporelle menacée`,`Le médecin l'estime utile`,`Le directeur l'ordonne`,`Jamais`],c:0,e:`Un procès-verbal de refus est dressé, signé par le représentant de l'administration et la personne responsable ou deux témoins.`},
{q:`Le protocole d'intervention sur un mineur sans consentement joignable est contresigné par :`,o:[`Le médecin hospitalier et le directeur de l'hôpital`,`Le médecin seul`,`Deux témoins`,`Le juge`],c:0,e:`Il est conservé dans le dossier d'hospitalisation du mineur.`}
],
cards:[
{f:`Hospitalisation d'office d'un malade mental`,b:`Décision du <b>gouverneur</b> sur <b>avis conforme du médecin traitant</b> (danger pour sa vie, ses proches ou l'ordre public) <b>ou ordonnance du juge</b>`},
{f:`Détenus hospitalisés`,b:`Admission à l'<b>hôpital le plus proche</b> sur <b>demande écrite du médecin pénitentiaire</b> · surveillance <b>exclusivement</b> à la charge de l'établissement pénitentiaire · interrogatoires soumis à l'<b>autorisation du directeur après avis du médecin traitant</b>`},
{f:`Maladie transmissible à déclaration obligatoire`,b:`Information du <b>délégué</b> · formalités de <b>déclaration</b> · <b>mesures prophylactiques et isolement</b> · hospitalisation <b>jamais différée</b>, même sans lit`},
{f:`Intervention sur mineur sans consentement joignable`,b:`<b>Urgence constatée</b> + décision du médecin hospitalier + intervention par lui ou sous sa supervision + information du représentant légal + <b>protocole contresigné médecin/directeur</b> au dossier`}
]},

/* U12 */
{t:`Le dossier d'hospitalisation et les transferts`,ic:`📁`,pages:`VI`,
lesson:`<h3>📁 Le dossier d'hospitalisation</h3>
<p>Constitué <b>pour chaque patient hospitalisé</b>, il est la <b>propriété de l'hôpital</b>, qui en assure la conservation. <b>Dès la sortie</b>, il est transmis au <b>service en charge des archives médicales</b> ; le directeur peut accorder un <b>délai supplémentaire</b> de conservation dans les unités de soins selon les besoins du service.</p>
<p>Sous la responsabilité du <b>chef de département ou de service</b> et du <b>chef d'unité</b>, <b>praticiens et infirmiers</b> sont tenus de le remplir <b>au quotidien, exhaustivement et lisiblement</b>. Le personnel doit sauvegarder le <b>caractère confidentiel</b> des renseignements.</p>
<h3>👁️ Qui peut le consulter ?</h3>
<p>Le <b>patient</b>, son <b>représentant légal</b>, ou ses <b>ayants droit en cas de décès</b>, <b>par l'intermédiaire de son médecin traitant externe</b>. La consultation se fait <b>sur place, en présence du médecin hospitalier traitant</b>.</p>
<p>Le patient peut obtenir, <b>par l'intermédiaire de son médecin hospitalier traitant</b>, une <b>copie du dossier</b> et/ou un <b>compte rendu détaillé</b>, sur <b>demande présentée au directeur</b>.</p>
<p>Le dossier peut être communiqué <b>dans un but scientifique</b> à tout membre du corps médical, pour <b>consultation sur place</b>, <b>sur autorisation du directeur</b>.</p>
<h3>🔀 Le transfert vers un autre hôpital</h3>
<p>En l'absence d'unités pouvant assurer la prise en charge, le <b>médecin traitant établit une ordonnance médicale de transfert</b> vers la structure publique la plus appropriée ou, en cas de nécessité, vers un centre hospitalier créé en vertu de la <b>loi n° 37-80</b>. Le <b>directeur</b> prend les mesures nécessaires et <b>informe la famille</b>.</p>
<p><b>Transfert vers une clinique</b> : uniquement <b>à la demande écrite du patient ou de sa famille</b>, ou en cas de <b>convention de soins</b> entre l'hôpital public et l'établissement privé.</p>
<p>L'<b>infirmier chef de l'unité</b> prend le rendez-vous et organise le transport à temps ; le patient est informé du jour du rendez-vous. Le transport se fait par les <b>moyens de l'hôpital</b> ou par une <b>ambulance privée aux frais du patient</b> ; dans les deux cas, il est <b>assisté par un personnel soignant</b> et accompagné d'une <b>fiche de liaison</b> et de son dossier, ou à défaut d'un <b>résumé clinique</b>.</p>
<p>En cas de transfert définitif, le <b>compte rendu détaillé</b> et la <b>copie du dossier</b>, listés sur un <b>bordereau de transmission</b>, sont remis à l'établissement d'accueil, qui en <b>accuse réception</b> en signant une copie.</p>
<h3>ℹ️ L'information du patient</h3>
<p>Les patients sont informés du <b>nom et de la qualité</b> des personnes contribuant à leur prise en charge, ainsi que de la <b>nature des risques et des conséquences</b> des actes médicaux et chirurgicaux. Ces informations sont communiquées à la famille par les médecins traitants <b>s'ils le jugent utile</b> et <b>sous réserve de l'accord préalable du patient</b> s'il peut l'exprimer.</p>
<p><b>Le personnel infirmier</b> participe à cette information <b>dans son domaine de compétence</b> et <b>s'abstient de donner des informations sur le diagnostic, le pronostic et l'évolution de l'état de santé</b>.</p>
<p>Le patient est informé du règlement intérieur (dont copie peut lui être remise à sa demande) et du fait que <b>l'hôpital n'est pas responsable de la perte ou du vol des objets qu'il conserve sur lui</b>.</p>`,
qs:[
{q:`Le dossier d'hospitalisation est la propriété :`,o:[`De l'hôpital`,`Du patient`,`Du médecin traitant`,`Du ministère`],c:0,e:`L'hôpital en est propriétaire et en assure la conservation.`},
{q:`La consultation du dossier par le patient a lieu :`,o:[`Sur place, en présence du médecin hospitalier traitant`,`À domicile`,`Par courrier`,`Sans condition`],c:0,e:`Consultation sur place, en présence du médecin hospitalier traitant, par l'intermédiaire de son médecin traitant externe.`},
{q:`En cas de décès du patient, ses ayants droit peuvent consulter le dossier :`,o:[`Par l'intermédiaire de son médecin traitant externe à l'hôpital`,`Librement`,`Sur ordonnance du juge`,`Jamais`],c:0,e:`Même canal que pour le patient : le médecin traitant externe.`},
{q:`Le transfert vers une clinique privée n'est possible que :`,o:[`À la demande écrite du patient ou de sa famille, ou en cas de convention de soins`,`Sur décision du médecin`,`En urgence uniquement`,`Jamais`],c:0,e:`Deux hypothèses limitativement prévues.`},
{q:`Le transport du patient transféré se fait :`,o:[`Par les moyens de l'hôpital ou par ambulance privée aux frais du patient, avec assistance d'un soignant`,`Par ses propres moyens`,`Uniquement par ambulance publique`,`Sans accompagnement`],c:0,e:`Dans les deux cas, assistance d'un personnel soignant et fiche de liaison + dossier ou résumé clinique.`},
{q:`Le personnel infirmier, dans l'information du patient :`,o:[`S'abstient de donner des informations sur le diagnostic, le pronostic et l'évolution`,`Doit tout expliquer`,`Ne parle jamais au patient`,`Informe la famille en priorité`],c:0,e:`Il participe dans son domaine de compétence, mais s'abstient sur diagnostic, pronostic et évolution.`},
{q:`Le dossier peut être communiqué dans un but scientifique :`,o:[`À tout membre du corps médical, pour consultation sur place, sur autorisation du directeur`,`À tout étudiant`,`Sans autorisation`,`Uniquement au CMDP`],c:0,e:`Consultation sur place et autorisation du directeur.`},
{q:`L'hôpital est-il responsable de la perte des objets conservés par le patient sur lui ?`,o:[`Oui, toujours`,`Non, et le patient en est informé`,`Oui, s'ils sont déclarés`,`Uniquement pour l'argent`],c:1,e:`Information expresse donnée au patient lors de l'admission ordinaire.`},
{q:`Le transfert vers un centre hospitalier peut se faire en vertu de la loi :`,o:[`n° 37-80`,`n° 65-00`,`n° 43-13`,`n° 34-09`],c:0,e:`Loi n° 37-80 relative aux centres hospitaliers.`}
],
cards:[
{f:`Dossier d'hospitalisation : propriété et accès`,b:`Propriété de l'<b>hôpital</b> · consultation <b>sur place</b> en présence du <b>médecin hospitalier traitant</b>, par l'intermédiaire du <b>médecin traitant externe</b> · copie sur <b>demande au directeur</b>`},
{f:`Transfert vers le privé`,b:`Seulement sur <b>demande écrite du patient ou de sa famille</b>, ou en cas de <b>convention de soins</b> entre l'hôpital public et l'établissement privé`},
{f:`Information : la limite du rôle infirmier`,b:`Le personnel infirmier informe <b>dans son domaine de compétence</b> et <b>s'abstient</b> sur le <b>diagnostic, le pronostic et l'évolution</b> de l'état de santé`}
]},

/* U13 */
{t:`Les sorties`,ic:`🚶`,pages:`VII`,
lesson:`<h3>🚶 Les motifs de sortie</h3>
<p>Le patient peut quitter l'hôpital <b>sur indication du médecin traitant</b>, lors d'un <b>transfert médicalement motivé</b>, ou <b>à sa demande</b>.</p>
<h3>1️⃣ Sortie pour fin de traitement</h3>
<p>Le médecin traitant prononce la <b>sortie ordinaire</b> lorsque l'état ne nécessite plus le maintien à l'hôpital. Lors de la <b>visite médicale journalière</b>, il désigne les sortants <b>suffisamment à l'avance</b> pour informer la famille et préparer les documents.</p>
<p>La sortie ordinaire a lieu <b>tous les jours ouvrables, de préférence avant midi</b>, et <b>ne peut avoir lieu après 18 h</b>, sauf <b>transfert urgent</b>.</p>
<p>La sortie d'un <b>mineur</b> ne peut se faire qu'entre les mains du <b>représentant légal</b>, de la personne qui l'a accompagné à l'admission, ou de toute personne autorisée par les parents <b>avec justification</b>. La sortie des <b>malades mentaux hospitalisés d'office</b> se fait <b>en concertation avec les autorités</b> qui l'ont ordonnée.</p>
<p>En cas de <b>refus du patient de quitter l'hôpital</b>, le cas est porté au directeur, qui prend les mesures nécessaires, <b>y compris le recours aux services de police</b>.</p>
<h3>2️⃣ Sortie pour aggravation</h3>
<p>Lorsque l'état est <b>particulièrement grave</b>, que le patient est <b>agonisant ou au-dessus de toute ressource thérapeutique</b>, les médecins peuvent, <b>après accord du médecin chef de département</b>, consentir à son <b>transfert à domicile</b> si lui-même ou sa famille en exprime la volonté <b>par écrit</b>. À défaut, et si les moyens le permettent, il est <b>transporté discrètement dans une chambre individuelle</b>, ses proches pouvant rester auprès de lui.</p>
<h3>3️⃣ Sortie volontaire avec accord médical</h3>
<p>Hors mineurs, hospitalisés d'office et incapables, le patient peut sortir à sa demande après les <b>formalités administratives</b>. Si le chef de département estime la sortie <b>prématurée et dangereuse</b>, il exige la <b>signature d'une attestation</b> ; en cas de refus, un <b>procès-verbal</b> est établi et signé <b>en présence de deux témoins</b>.</p>
<h3>4️⃣ Sortie contre avis médical</h3>
<p>Lorsque le patient <b>refuse les examens, traitements ou soins</b>, un <b>procès-verbal contradictoire</b> est dressé et signé par le représentant de l'administration et le patient ; en cas de refus, il est fait appel à des <b>témoins</b>. La sortie est prononcée par le <b>chef de département ou de service</b>, <b>sur rapport du médecin traitant</b>, sauf si l'état nécessite des soins urgents. Le <b>bulletin de sortie</b> porte la mention « <b>sortie contre avis médical</b> ».</p>
<h3>5️⃣ Sortie par mesure disciplinaire</h3>
<p>En cas de <b>manquement grave</b> au règlement ou de <b>troubles perturbant le fonctionnement</b> du service, le directeur peut, <b>sur rapport du médecin traitant</b>, prononcer la sortie disciplinaire — <b>sauf si l'état de santé ne le permet pas</b>. L'administration informe alors <b>par écrit et dans les meilleurs délais</b> les <b>autorités de police judiciaire</b>.</p>
<h3>📄 Les formalités de sortie</h3>
<p><b>Médicales</b> : indiquer le besoin de <b>consultations externes</b>, établir les <b>certificats médicaux</b> et les <b>ordonnances</b> de continuité des soins avec la date de la prochaine consultation ; l'<b>infirmier chef</b> donne les informations et conseils et remet les documents ; la sortie est enregistrée sur une <b>fiche spéciale versée au dossier</b>.</p>
<p><b>Administratives</b>, auprès du SAA : <b>enregistrement</b> au registre des sortants · <b>facturation et règlement</b> ou signature des documents de prise en charge · <b>restitution des effets personnels</b> sur présentation de l'<b>attestation de dépôt</b> · <b>délivrance du billet de sortie</b>.</p>
<h3>🕵️ Disparition et permission</h3>
<p><b>Sortie à l'insu du personnel</b> : le chef de département ou, à défaut, le <b>médecin de garde</b> établit un <b>procès-verbal de disparition</b> transmis au directeur, qui informe <b>immédiatement les autorités de police judiciaire</b>, la <b>famille</b> et le <b>délégué</b>. Le patient est porté <b>sortant</b> aux registres.</p>
<p><b>Permission de sortie</b> : établie par l'<b>infirmier chef de l'unité</b> sur formulaire, <b>signée par le médecin traitant</b>, enregistrée dans un <b>registre spécifique au SAA</b> (nom du patient, médecin ayant autorisé, date et durée) et versée au dossier. Si le patient ne rentre pas à l'issue du délai, il est <b>porté sortant</b> et ne pourra être réhospitalisé que <b>lorsque la disponibilité en lits le permettra</b>.</p>`,
qs:[
{q:`La sortie ordinaire a lieu les jours ouvrables :`,o:[`De préférence avant midi et jamais après 18 h, sauf transfert urgent`,`À toute heure`,`Uniquement le matin`,`Après 18 h`],c:0,e:`De préférence avant midi ; pas après 18 h sauf transfert urgent.`},
{q:`Le bulletin de sortie d'un patient qui refuse les soins porte la mention :`,o:[`« Sortie contre avis médical »`,`« Sortie disciplinaire »`,`« Sortie volontaire »`,`« Fin de traitement »`],c:0,e:`Mention obligatoire, la sortie étant prononcée par le chef de département sur rapport du médecin traitant.`},
{q:`La sortie par mesure disciplinaire est prononcée :`,o:[`Par le directeur, sur rapport du médecin traitant, sauf si l'état de santé ne le permet pas`,`Par le chef de service`,`Par la police`,`Par le comité d'établissement`],c:0,e:`Et l'administration informe par écrit les autorités de police judiciaire.`},
{q:`Le transfert à domicile d'un patient agonisant suppose :`,o:[`L'accord du médecin chef de département et la volonté écrite du patient ou de sa famille`,`La seule décision du médecin`,`L'accord du directeur`,`Une ordonnance du juge`],c:0,e:`Double condition : accord du médecin chef de département + volonté exprimée par écrit.`},
{q:`En cas de sortie volontaire jugée prématurée, le patient doit :`,o:[`Signer une attestation ; à défaut, un PV est établi en présence de deux témoins`,`Payer une pénalité`,`Rester hospitalisé`,`Obtenir l'accord du directeur`],c:0,e:`Attestation certifiant qu'il persiste après avoir pris connaissance des dangers.`},
{q:`En cas de disparition d'un patient, qui établit le procès-verbal ?`,o:[`Le chef de département ou, à défaut, le médecin de garde`,`L'infirmier chef`,`Le SAA`,`Le directeur`],c:0,e:`PV transmis au directeur, qui informe la police judiciaire, la famille et le délégué.`},
{q:`La permission de sortie est établie par :`,o:[`L'infirmier chef de l'unité, sur formulaire signé par le médecin traitant`,`Le directeur`,`Le SAA seul`,`Le patient`],c:0,e:`Enregistrée dans un registre spécifique au SAA et versée au dossier.`},
{q:`Si le patient ne revient pas à l'issue de sa permission :`,o:[`Il est porté sortant et ne sera réhospitalisé que si la disponibilité en lits le permet`,`Il perd tout droit aux soins`,`Il est poursuivi`,`Rien ne change`],c:0,e:`Disposition finale du règlement intérieur.`},

{t:`Le GST : définition et finalités`,ic:`🧭`,pages:`p.2`,
lesson:`<h3>🏘️ Qu'est-ce que le GST ?</h3>
<p>Le <b>Groupement Sanitaire Territorial</b> est un <b>établissement public</b> constituant un <b>nouveau modèle d'organisation sanitaire</b> au Maroc. Il <b>remplace les Directions Régionales de la Santé (DRS)</b>, dispose d'une <b>autonomie financière et administrative</b>, et <b>regroupe tous les établissements de santé publics d'une région</b> tout en restant sous la <b>tutelle de l'État</b>.</p>
<p>Un GST est créé <b>dans chaque région</b> ; un texte réglementaire fixe son <b>siège</b> et les établissements qui le composent.</p>
<h3>🌱 Origine</h3>
<p>La proposition vient du <b>rapport général sur le Nouveau Modèle de Développement</b> : regrouper le <b>CHU</b> et l'ensemble des unités hospitalières régionales en <b>un seul établissement public autonome</b> chargé des <b>soins hospitaliers, de la formation et de la recherche scientifique</b>.</p>
<h3>🎯 Les 4 visées du GST</h3>
<p>1. Améliorer l'<b>autonomie des hôpitaux</b> pour maximiser les décisions managériales<br>
2. Créer une <b>entité économique à part entière</b> garantissant une meilleure performance des services publics de soins<br>
3. <b>Refondre le modèle de financement</b> et l'organisation des services publics de soins<br>
4. <b>Consolider l'ancrage des hôpitaux</b> dans l'écosystème politico-économique</p>
<h3>⚙️ Les 5 principes d'opérationnalisation</h3>
<p><b>Fusion</b> des instances de prestation des soins · <b>autonomie de gestion</b> · <b>autonomie de financement</b> (assurances + modèle hybride de facturation) · création d'un <b>établissement régional de santé autonome capitalisant sur le CHU</b> · <b>changement du statut du personnel et de sa rémunération</b>.</p>
<div class="tip">L'objectif principal : <b>régionaliser la santé marocaine</b> pour assurer une meilleure coordination entre établissements, une meilleure gestion des ressources humaines et matérielles, un <b>parcours de soins plus fluide</b> et un renforcement de la santé publique.</div>`,
qs:[
{q:`Le GST remplace :`,o:[`Les CHU`,`Les Directions Régionales de la Santé (DRS)`,`Les délégations provinciales uniquement`,`L'ANAM`],c:1,e:`Le GST remplace les Directions Régionales de la Santé et regroupe tous les établissements de santé publics de la région.`},
{q:`Le GST est doté :`,o:[`D'une autonomie financière et administrative`,`D'aucune autonomie`,`De la seule autonomie administrative`,`D'un statut de société anonyme`],c:0,e:`Établissement public doté de la personnalité morale et de l'autonomie financière, sous tutelle de l'État.`},
{q:`Combien de GST sont créés ?`,o:[`Un par province`,`Un dans chaque région`,`Un par CHU`,`Un au niveau national`],c:1,e:`Un groupement sanitaire territorial est créé dans chaque région, son siège étant fixé par texte réglementaire.`},
{q:`Quelle proposition du Nouveau Modèle de Développement fonde le GST ?`,o:[`La privatisation des hôpitaux`,`Le regroupement du CHU et des unités hospitalières régionales en un établissement public autonome`,`La création d'un ministère régional`,`La suppression des CHU`],c:1,e:`Un seul établissement public autonome chargé des soins hospitaliers, de la formation et de la recherche scientifique.`},
{q:`Parmi les principes d'opérationnalisation du GST figure :`,o:[`L'autonomie de financement basée sur les assurances et un modèle hybride de facturation`,`La gratuité totale`,`Le financement exclusif par l'impôt`,`La suppression des budgets`],
c:0,e:`5 principes : fusion des instances de prestation, autonomie de gestion, autonomie de financement (assurances + facturation hybride), établissement régional autonome capitalisant sur le CHU, changement du statut et de la rémunération du personnel.`},
{q:`L'objectif principal du GST est de :`,o:[`Régionaliser la santé marocaine`,`Centraliser les décisions`,`Réduire le nombre d'hôpitaux`,`Fusionner public et privé`],c:0,e:`Régionaliser la santé pour une meilleure coordination, une meilleure gestion des ressources, un parcours de soins plus fluide et un renforcement de la santé publique.`},
{q:`Le GST vise à créer :`,o:[`Une entité économique à part entière`,`Une association`,`Une société privée`,`Une mutuelle`],c:0,e:`Créer une entité économique à part entière garantissant une meilleure performance des services de soins publics.`}
],
cards:[

{f:`Les 4 visées du GST`,b:`Autonomie des hôpitaux · entité économique à part entière · refonte du modèle de financement · ancrage des hôpitaux dans l'écosystème politico-économique`},
{f:`Les 5 principes d'opérationnalisation`,b:`Fusion des instances de prestation · autonomie de gestion · autonomie de financement (assurances, facturation hybride) · établissement régional autonome capitalisant sur le CHU · changement du statut et de la rémunération du personnel`}

/* U2 */
{t:`Création, tutelle et exclusions`,ic:`🏛️`,pages:`p.3`,
lesson:`<h3>🚫 Les 3 exclusions</h3>
<p>Le GST comprend <b>tous les établissements de santé publics</b> de sa compétence territoriale, <b>SAUF</b> :</p>
<p>1. Les établissements soumis à des <b>dispositions législatives ou réglementaires particulières</b><br>
2. Les <b>établissements hospitaliers militaires (FAR)</b><br>
3. Les <b>bureaux municipaux et communaux d'hygiène</b></p>
<h3>🏢 Établissement public : les 3 attributs</h3>
<p><b>Personnalité morale</b> : personne juridique distincte, qui peut contracter, poursuivre et être poursuivie en justice, posséder des biens.<br>
<b>Autonomie financière</b> : gestion de ses propres ressources sans dépendre directement du budget général de l'État ; chaque GST est soumis au <b>contrôle financier de l'État</b>.<br>
<b>Tutelle de l'État</b> : surveillance et orientation pour le respect des règles.</p>
<h3>👁️ Les 3 objets de la tutelle</h3>
<p>Assurer le respect : <b>de la loi 08-22</b> par les organes du GST · <b>des missions</b> du GST · <b>des textes réglementaires</b> organisant ce GST.</p>`,
qs:[
{q:`Quels établissements ne font PAS partie du GST ?`,o:[`Les hôpitaux régionaux`,`Les hôpitaux militaires (FAR)`,`Les centres de santé`,`Les CHU`],c:1,e:`3 exclusions : établissements à dispositions particulières, hôpitaux militaires (FAR), bureaux municipaux/communaux d'hygiène.`},
{q:`Les bureaux communaux d'hygiène :`,o:[`Font partie du GST`,`Sont exclus du GST`,`Deviennent des CHU`,`Sont supprimés`],c:1,e:`Ils font partie des 3 exclusions prévues par la loi 08-22.`},
{q:`La tutelle de l'État sur le GST a pour objet d'assurer le respect :`,o:[`De la loi 08-22, des missions du GST et des textes réglementaires l'organisant`,`Du budget uniquement`,`Des seules décisions du wali`,`De la carte sanitaire nationale uniquement`],c:0,e:`Trois objets de tutelle : respect de la loi 08-22, respect des missions, respect des textes réglementaires.`},
{q:`L'autonomie financière du GST signifie :`,o:[`Aucun contrôle de l'État`,`Gérer ses ressources sans dépendre du budget général, tout en restant soumis au contrôle financier de l'État`,`Un financement exclusivement privé`,`L'absence de budget`],c:1,e:`Autonomie de gestion des ressources, mais contrôle financier de l'État conformément à la législation sur les établissements publics.`},
{q:`La personnalité morale permet au GST :`,o:[`De contracter, ester en justice et posséder des biens`,`De légiférer`,`De créer des impôts`,`De nommer des ministres`],c:0,e:`Personne juridique distincte : contrats, actions en justice (actives et passives), propriété de biens.`},
{q:`Les établissements soumis à des dispositions législatives particulières :`,o:[`Sont intégrés au GST`,`Sont exclus du GST`,`Sont dissous`,`Deviennent privés`],c:1,e:`Première des 3 exclusions.`}
],
cards:[

{f:`Les 3 objets de la tutelle de l'État sur le GST`,b:`Respect de la <b>loi 08-22</b> par ses organes · respect de ses <b>missions</b> · respect des <b>textes réglementaires</b> qui l'organisent`},

{t:`Les 6 missions : offre de soins, soins, santé publique`,ic:`🩺`,pages:`p.4-5`,
lesson:`<h3>🗂️ Les 6 domaines de missions</h3>
<p><b>1. Offre de soins · 2. Soins · 3. Santé publique · 4. Formation · 5. Administration · 6. Recherche, expertise et innovation.</b></p>
<h3>🗺️ 1) En matière d'offre de soins (6 missions)</h3>
<p>• Élaborer et <b>mettre à jour la carte sanitaire régionale</b> conformément aux orientations de la carte sanitaire nationale<br>
• Concevoir et mettre en œuvre un <b>programme médical régional (PMR)</b> : renforcer l'offre, mutualiser les ressources, garantir la <b>continuité des soins</b><br>
• <b>Créer de nouveaux établissements</b> conformément à la carte sanitaire régionale<br>
• Organiser les <b>parcours et filières de soins</b> de manière cohérente<br>
• Assurer l'offre régionale et s'appuyer sur le <b>système d'information sanitaire national intégré</b> (loi 06-22)<br>
• Mettre en place un <b>système d'information sanitaire régional</b>, dans le respect de la <b>protection des données à caractère personnel</b></p>
<h3>💉 2) En matière de soins (4 missions)</h3>
<p>• <b>Diagnostic, traitement et rééducation</b>, avec ou sans hébergement<br>• Diagnostic et traitement des <b>maladies bucco-dentaires</b><br>• Prise en charge des <b>patients, blessés et femmes enceintes</b> et suivi de leur état<br>• Mesures garantissant la <b>sécurité des patients et la qualité</b> de leur prise en charge</p>
<h3>🛡️ 3) En matière de santé publique (6 missions)</h3>
<p>• <b>Promotion</b> de la santé et <b>prévention des risques</b>, sécurité sanitaire, selon les programmes nationaux<br>• <b>Surveillance sanitaire</b> et organisation de la <b>surveillance des épidémies</b><br>• <b>Éducation sanitaire</b> des bénéficiaires et encouragement de l'<b>éducation thérapeutique</b><br>• Organisation et <b>supervision médicale des urgences hospitalières</b><br>• <b>Participation</b> à l'organisation et à la supervision des urgences <b>préhospitalières</b><br>• Surveillance des <b>épidémies émergentes</b></p>
<div class="warn">⚠️ Nuance : le GST <b>organise et supervise</b> les urgences <b>hospitalières</b>, mais <b>participe</b> seulement à celles <b>préhospitalières</b>.</div>`,

{q:`Qui élabore et met à jour la carte sanitaire régionale ?`,o:[`Le GST`,`L'administration centrale`,`Le wali`,`La commission nationale`],c:0,e:`Première mission en matière d'offre de soins : élaborer et mettre à jour la CSR conformément aux orientations de la carte sanitaire nationale.`},

{q:`Concernant les urgences, le GST :`,o:[`Organise et supervise les urgences hospitalières et participe aux urgences préhospitalières`,`Organise uniquement les urgences préhospitalières`,`Ne s'occupe pas des urgences`,`Supervise uniquement le privé`],c:0,e:`Organisation et supervision médicale des urgences hospitalières ; participation à l'organisation et à la supervision des urgences préhospitalières.`},

{q:`Parmi les missions de soins figure :`,o:[`Le diagnostic et le traitement des maladies bucco-dentaires`,`La délivrance des diplômes`,`La fixation des prix`,`Le contrôle fiscal`],c:0,e:`4 missions de soins dont les services de diagnostic et traitement des maladies bucco-dentaires.`},

{t:`Missions : formation, administration, recherche`,ic:`🎓`,pages:`p.5-6`,
lesson:`<h3>🎓 4) Formation</h3>
<p>• Formation <b>pratique de base</b> des étudiants en <b>médecine, pharmacie et odontologie</b> dans le secteur public (et si nécessaire dans le privé)<br>
• Formation pratique de base des étudiants des établissements de formation publique : <b>infirmiers, sages-femmes, kinésithérapeutes, rééducateurs et techniciens de santé</b><br>
• Formation <b>professionnelle</b> des étudiants des professions de santé<br>
• <b>Formation continue</b> des professionnels, avec les secteurs concernés, les organismes professionnels et les associations</p>
<h3>📋 5) Administration (7 missions)</h3>
<p>• <b>Délivrer les licences</b> d'exercice dans le <b>privé</b> pour : sage-femme, métiers infirmiers, kinésithérapeutes/rééducateurs/réadaptateurs fonctionnels, et pour <b>créer et exploiter des cliniques</b> et institutions similaires<br>
• <b>Coordonner</b> les activités des établissements du groupement<br>
• Veiller à la <b>disponibilité des médicaments</b> et produits de santé, en assurer la gestion et faciliter l'accès<br>
• Contribuer à la <b>surveillance et l'inspection</b> financières, administratives et médicales<br>
• <b>Évaluer les performances</b> des établissements du groupe<br>
• Encourager la <b>collaboration</b> avec les acteurs régionaux (administrations, collectivités, privé, société civile)<br>
• <b>Coordonner par accords de partenariat</b> entre établissements publics du groupe et établissements privés</p>
<h3>🔬 6) Recherche, expertise et innovation (7 missions)</h3>
<p>• Contribuer à la <b>recherche scientifique</b> en santé<br>• Participer aux recherches en <b>santé publique, économie de la santé et gestion de la santé</b><br>• Réaliser des <b>expertises médico-légales, biomédicales et techniques</b><br>• Contribuer à l'<b>évaluation des technologies médicales</b><br>• Établir des <b>pôles d'excellence et centres de référence</b><br>• Développer la <b>technologie médicale</b><br>• <b>Exploiter les brevets</b> dans le domaine de la santé</p>`,

{q:`La disponibilité des médicaments dans les établissements du groupe relève :`,o:[`Des missions administratives`,`Des missions de soins`,`Des missions de santé publique`,`Des missions de recherche`],c:0,e:`Mission administrative : veiller à la disponibilité des médicaments et produits de santé, en assurer la gestion et faciliter l'accès.`},

/* U5 */
{t:`Le conseil d'administration`,ic:`👔`,pages:`p.7-9`,
lesson:`<h3>🏛️ Gouvernance</h3>
<p>Le GST est <b>dirigé par un conseil d'administration (CA)</b> et <b>géré par un directeur général (DG)</b>.</p>
<h3>👤 Composition du CA</h3>
<p><b>Président : le Chef du gouvernement</b> ; <b>secrétariat : le directeur général</b>.<br>
Membres : représentants du <b>Premier ministre</b>, des <b>Finances</b>, de la <b>Santé</b>, de la <b>Formation professionnelle</b>, de l'<b>Enseignement supérieur et de la Recherche</b>, de l'<b>Inspection du service de santé militaire des FAR</b> ; le <b>président du conseil régional</b> ; le <b>wali</b> de la région ; le <b>doyen de la FMPMD</b> publique de la région ; <b>3 représentants des enseignants-chercheurs</b> (médecine, pharmacie, dentisterie) ; <b>3 représentants des autres professionnels de santé</b> (1 du corps des médecins, dentistes et pharmaciens + <b>2 du corps des infirmiers et techniciens de santé</b>) ; le <b>directeur de l'ISPITS</b> de la région ; <b>1 représentant de chaque organisme gestionnaire de l'AMO</b> ; <b>1 représentant du conseil régional de l'Ordre national des médecins</b> ; <b>3 membres indépendants</b> experts en santé. Le président peut inviter toute personne utile <b>à titre consultatif</b>.</p>
<h3>📌 Les 16 attributions du CA</h3>
<p>Valider le <b>plan d'action annuel</b> · approuver la <b>carte sanitaire régionale</b> · approuver le <b>PMR</b> · délibérer sur la gestion des établissements · arrêter le <b>budget</b> et les plans pluriannuels · arrêter les <b>comptes annuels</b> · approuver l'<b>organigramme</b> (avec structures sanitaire et administrative/financière indépendantes) · approuver le <b>statut des professionnels</b> · approuver le règlement des <b>marchés</b> · approuver le <b>règlement intérieur</b> · décider de l'<b>acquisition, location et cession d'immeubles</b> · décider des <b>brevets et inventions</b> · décider des <b>participations au capital d'entreprises privées</b> (missions en rapport) · prendre les dispositions d'<b>audit et d'évaluation</b> · approuver le <b>rapport annuel d'activités</b> · se concerter sur toute question relative aux missions.</p>
<h3>📅 Réunions</h3>
<p>Le CA se réunit sur convocation de son président chaque fois que nécessaire, et <b>au moins 2 fois par an</b> : pour dresser le <b>bilan des réalisations</b> et les bilans financiers de l'année précédente, et pour établir le <b>programme prévisionnel et le budget</b> de l'exercice. Il peut donner une <b>dérogation au directeur général</b> pour régler des affaires spécifiques.</p>`,
