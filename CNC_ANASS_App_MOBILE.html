{t:`Contexte institutionnel et état des lieux`,ic:`🏗️`,pages:`p.8-11`,
lesson:`<h3>🏛️ Les 8 éléments du contexte institutionnel</h3>
<p>1. La <b>Constitution</b> de 2011 · 2. Le <b>message de Sa Majesté le Roi Mohammed VI</b> · 3. Le <b>discours royal du 14 octobre 2016</b> · 4. Le <b>discours royal du 29 juillet 2018</b> · 5. Le <b>programme gouvernemental (avril 2017)</b> · 6. Le <b>partenariat public-privé (PPP)</b> · 7. La <b>réforme de la loi organique des finances</b> · 8. La <b>régionalisation avancée</b>.</p>
<h3>📚 Les 3 niveaux du cadre de référence</h3>
<p>1. Les <b>Hautes Orientations Royales</b> · 2. Les <b>tendances sanitaires mondiales actuelles</b> · 3. Les <b>engagements « santé » du Programme gouvernemental 2016-2021</b>.</p>
<h3>🏥 Les infrastructures — 5 dysfonctionnements</h3>
<p>La desserte est passée d'<b>un ESSP pour 14 600 habitants en 1990</b> à <b>un ESSP pour 12 238 habitants en 2018</b>. Malgré cela :</p>
<p>1. <b>Répartition inéquitable</b> entre urbain et rural et entre régions<br>2. <b>Desserte insuffisante</b> au regard des besoins<br>3. <b>Retard dans la mise en place de la carte sanitaire</b><br>4. <b>Vétusté et manque de maintenance</b> du patrimoine immobilier et des équipements médico-techniques<br>5. <b>Faible complémentarité</b> entre service public et secteur libéral</p>
<h3>👩‍⚕️ Les ressources humaines</h3>
<p>Le déficit est <b>quantitatif et qualitatif</b>, <b>structurel</b>, aggravé par une <b>distribution régionale déséquilibrée</b>. L'OMS classe le Maroc parmi les <b>57 pays</b> présentant une <b>pénurie aiguë</b> en personnel soignant.</p>
<p>Effectifs du secteur public : <b>47 364 professionnels</b> (médecins, dentistes, pharmaciens, sages-femmes, infirmiers), soit <b>7,3 médecins pour 10 000 habitants</b> et <b>9,2 infirmiers et techniciens de santé pour 10 000 habitants</b>.</p>
<p><b>Concentration</b> : <b>40 % des professionnels du public</b> et <b>60 % des professionnels des deux secteurs</b> sont dans <b>Casablanca-Settat et Rabat-Salé-Kénitra</b>, où vit <b>34 % de la population</b>. Tanger-Tétouan-Al Hoceima : <b>11 %</b> du public et <b>8 %</b> des deux secteurs · Béni Mellal-Khénifra <b>5 %</b> · Souss-Massa <b>6 %</b> · Drâa-Tafilalet <b>3 %</b> · Laâyoune-Sakia Al Hamra <b>2 %</b>.</p>
<p><b>Formation infirmière</b> : depuis 2008, <b>24 294 lauréats</b> sont sortis des instituts publics ; capacité actuelle <b>3 000 étudiants par an</b>, portée à <b>8 600 en 2025</b>.</p>`,
qs:[
{q:`La desserte du service public est passée d'un ESSP pour 14 600 habitants en 1990 à :`,o:[`Un ESSP pour 12 238 habitants en 2018`,`Un ESSP pour 10 000 habitants`,`Un ESSP pour 15 000 habitants`,`Un ESSP pour 8 000 habitants`],c:0,e:`Évolution favorable mais desserte encore insuffisante.`},
{q:`L'OMS classe le Maroc parmi les :`,o:[`57 pays présentant une pénurie aiguë en personnel soignant`,`20 pays les mieux dotés`,`100 pays en développement`,`10 pays en crise sanitaire`],c:0,e:`Pénurie aiguë en personnel soignant.`},
{q:`Le ratio de médecins dans le secteur public est de :`,o:[`7,3 pour 10 000 habitants`,`9,2 pour 10 000 habitants`,`4,51 pour 1 000 habitants`,`1,6 pour 1 000 habitants`],c:0,e:`7,3 médecins et 9,2 infirmiers et techniciens de santé pour 10 000 habitants.`},
{q:`Quelle part des professionnels des deux secteurs est concentrée à Casablanca-Settat et Rabat-Salé-Kénitra ?`,o:[`34 %`,`40 %`,`60 %`,`11 %`],c:2,e:`60 % des professionnels des deux secteurs (40 % pour le seul public), alors que ces régions abritent 34 % de la population.`},

{t:`Médicament, couverture et réglementation`,ic:`💊`,pages:`p.11-13`,
lesson:`<h3>💊 Le médicament</h3>
<p>Politique pharmaceutique nationale mise en place <b>depuis les années 60</b>. Le <b>Code de la pharmacie</b> a été publié en <b>2005</b>, suivi d'un arsenal de <b>20 textes</b> : <b>3 lois, 4 décrets et 13 arrêtés</b>.</p>
<p><b>Les 4 contraintes du secteur</b> : <b>prix élevés</b> par rapport au pouvoir d'achat · <b>protocoles thérapeutiques non généralisés</b> · <b>système d'approvisionnement et de gestion défaillant</b> dans le public · <b>faible pénétration du générique</b>.</p>
<h3>🪪 La couverture médicale</h3>
<p><b>66 %</b> de la population dispose d'une couverture médicale de base : <b>AMO 31 %</b> (y compris les étudiants) et <b>RAMED 35 %</b> ; en <b>2025, l'AMO couvre plus de 86 %</b> de la population. Le panier de soins, élargi, permet la prise en charge des <b>affections lourdes et coûteuses</b> (greffe d'organe, chirurgie à cœur ouvert, dialyse). Le <b>tiers payant</b> a été élargi aux <b>médicaments prescrits en ambulatoire dans les maladies cancéreuses</b>.</p>
<h3>⚖️ La production législative de la décennie</h3>
<p><b>Loi 34-09</b> système de santé et offre de soins · <b>loi 65-00</b> code de la CMB · <b>loi 08-12</b> Ordre national des médecins · <b>loi 84-12</b> dispositifs médicaux · <b>loi 109-13</b> complétant l'article 11 de la <b>loi 16-98</b> (don, prélèvement et transplantation d'organes) · <b>loi 131-13</b> exercice de la médecine · <b>loi 28-13</b> protection des personnes participant aux <b>recherches biomédicales</b> · <b>loi 70-13</b> centres hospitalo-universitaires · <b>loi 43-13</b> exercice des professions infirmières.</p>
<p><b>Décrets</b> : <b>2-13-852</b> (18 décembre 2013) prix public de vente des médicaments · <b>2-12-198</b> (12 juin 2012) <b>bioéquivalence des génériques</b> · <b>2-14-562</b> (24 juillet 2015) application de la loi-cadre 34-09 pour l'<b>organisation de l'offre de soins, la carte sanitaire et les SROS</b>.</p>`,
qs:[
{q:`Le Code de la pharmacie a été publié en :`,o:[`2000`,`2005`,`2011`,`2013`],c:1,e:`2005, suivi de 20 textes : 3 lois, 4 décrets et 13 arrêtés.`},
{q:`L'arsenal juridique du médicament compte :`,o:[`3 lois, 4 décrets et 13 arrêtés`,`5 lois et 10 décrets`,`20 lois`,`13 lois et 3 arrêtés`],c:0,e:`20 textes au total.`},
{q:`Au moment du plan, la couverture médicale de base concerne :`,o:[`66 % de la population (AMO 31 %, RAMED 35 %)`,`56 % de la population`,`86 % de la population`,`50 % de la population`],c:0,e:`66 % en CMB ; la couverture sociale tous régimes privés confondus atteignait 56 %.`},
{q:`Quelle loi porte sur les centres hospitalo-universitaires ?`,o:[`La loi 70-13`,`La loi 131-13`,`La loi 84-12`,`La loi 28-13`],c:0,e:`Loi 70-13 relative aux CHU ; 131-13 = exercice de la médecine ; 84-12 = dispositifs médicaux ; 28-13 = recherches biomédicales.`},
{q:`La loi 28-13 est relative :`,o:[`À la protection des personnes participant aux recherches biomédicales`,`Aux dispositifs médicaux`,`À l'Ordre des médecins`,`Au don d'organes`],c:0,e:`Protection des personnes participant aux recherches biomédicales.`},
{q:`Le décret 2-12-198 du 12 juin 2012 porte sur :`,o:[`La bioéquivalence des médicaments génériques`,`Le prix public de vente`,`La carte sanitaire`,`Les dispositifs médicaux`],c:0,e:`Bioéquivalence des génériques ; le 2-13-852 fixe le prix public de vente.`},
{q:`Parmi les contraintes du secteur du médicament figure :`,o:[`La faible pénétration du générique`,`L'excès de pharmacies`,`Le trop grand nombre de génériques`,`La surproduction locale`],c:0,e:`4 contraintes : prix élevés, protocoles non généralisés, approvisionnement public défaillant, faible pénétration du générique.`},
{q:`Le décret 2-14-562 du 24 juillet 2015 applique la loi-cadre 34-09 en ce qui concerne :`,o:[`L'organisation de l'offre de soins, la carte sanitaire et les SROS`,`Le prix des médicaments`,`Les professions infirmières`,`La couverture médicale`],c:0,e:`Texte d'application clé pour la carte sanitaire et les schémas régionaux de l'offre de soins.`}
],

{t:`Les programmes de santé : l'état des lieux`,ic:`🩺`,pages:`p.13-17`,
lesson:`<h3>🤰 Santé de la mère et de l'enfant</h3>
<p>Mortalité maternelle : <b>72,6 pour 100 000 NV</b> (ENPSF 2017). <b>Causes évitables prédominantes</b> : <b>hémorragie du post-partum 43 %</b> · <b>troubles hypertensifs (prééclampsie/éclampsie) 19 %</b> · <b>infection 7,2 %</b> · <b>complications de l'avortement 1,3 %</b>.</p>
<p>Réduction annuelle de la mortalité maternelle : <b>7,9 % en urbain</b> contre <b>4,7 % en rural</b> · accouchement en milieu surveillé : <b>96,6 % en urbain</b> contre <b>74,2 % en rural</b> · soins en post-partum : <b>22 % des femmes seulement</b>.</p>
<p>Mortalité néonatale : <b>−38 % entre 2011 et 2018</b>, de <b>21,7 à 13,6</b> pour 1 000 NV — elle concerne les <b>trois quarts des décès des moins de 5 ans</b>. Causes principales (étude 4 CHU, 2009) : <b>détresses respiratoires 29,53 %</b>, <b>infections 25 %</b>, <b>prématurité 19,65 %</b>.</p>
<p>Vaccination : <b>tétanos néonatal éliminé (certifié OMS en 2002)</b> · aucun cas de <b>poliomyélite depuis 1987</b> ni de <b>diphtérie depuis 1998</b> · <b>−85 % de méningites à Haemophilus influenzae b</b> depuis 2007 · rougeole : <b>phase de pré-élimination</b>.</p>
<p>Prévalence contraceptive (femmes mariées 15-49 ans) : <b>70,8 % en 2018</b>, dont <b>58 % de méthodes modernes</b> ; besoins non satisfaits <b>11,3 % en 2018</b> contre 19,7 % en 1992.</p>
<p>Cancers féminins : <b>sein 45,5</b> et <b>col de l'utérus 14,1</b> nouveaux cas pour 100 000 femmes. Détection précoce du sein <b>généralisée depuis 2012</b> (participation de <b>6 % en 2010 à 36 % en 2017</b>) ; col de l'utérus effectif dans <b>42 provinces et préfectures</b>.</p>
<h3>🫀 Les MNT — enquête STEPwise 2017</h3>
<p><b>Diabète 10,6 %</b> · <b>pré-diabète 10,4 %</b> · <b>HTA 29,3 %</b> · <b>obésité 20 %</b> · <b>hypercholestérolémie 10,5 %</b>.<br>
<b>Tabac</b> : <b>13,4 %</b> (hommes 26,9 %, femmes 0,4 %) contre 18 % en 2006 ; chez les <b>13-15 ans</b> : <b>6,4 % en 2016</b> contre 11,7 % en 2006 (programme « <b>Collège, Lycée et Entreprise sans tabac</b> », lancé en <b>2007</b>).<br>
<b>Cancers</b> : <b>40 000 nouveaux cas par an</b> (Registre du Grand Casablanca, 2012).<br>
<b>Maladie rénale chronique</b> : prévalence proche de <b>3 %</b>, soit environ <b>1 million de personnes</b> (enquête <b>Maremar</b>, 2011).<br>
<b>Respiratoire</b> : asthme <b>3,7 % chez l'adulte</b> et <b>4,4 % chez l'enfant</b>, BPCO <b>3,9 %</b>.</p>
<h3>🦠 Les maladies transmissibles — 3 groupes</h3>
<p><b>1. Éliminées ou en cours d'élimination</b> (consolider les acquis) : paludisme, trachome cécitant, schistosomiase, lèpre, poliomyélite et maladies-cibles du PNI.<br>
<b>2. Encore problèmes de santé publique</b> (intensifier) : tuberculose, VIH, hépatites virales, méningite, anthropozoonoses (rage, leishmanioses, charbon).<br>
<b>3. Émergentes ou menaces d'urgences</b> (veille et riposte) : fièvres hémorragiques, infections respiratoires à nouveaux agents, maladies à transmission vectorielle.</p>
<h3>🧠 La santé mentale au Maroc</h3>
<p>Enquête <b>ENPTM3</b> : près d'<b>une personne interrogée sur deux</b> présente au moins un trouble mental. <b>34 structures</b> de soins psychiatriques et addictologiques pour plus de <b>34 millions d'habitants</b>, <b>2 209 lits</b>, soit <b>0,65 lit pour 10 000 habitants</b> (moyenne EMRO : <b>1 lit/10 000</b>). Deux régions sans structure : <b>Dakhla-Oued Eddahab</b> et <b>Guelmim-Oued Noun</b>.</p>`,
qs:[
{q:`La première cause de mortalité maternelle au Maroc est :`,o:[`L'hémorragie du post-partum (43 %)`,`Les troubles hypertensifs (19 %)`,`L'infection (7,2 %)`,`Les complications de l'avortement (1,3 %)`],c:0,e:`Hémorragie du post-partum 43 %, puis troubles hypertensifs 19 %, infection 7,2 %, avortement 1,3 %.`},
{q:`Selon l'enquête STEPwise 2017, la prévalence de l'HTA est de :`,o:[`10,6 %`,`20 %`,`29,3 %`,`13,4 %`],c:2,e:`HTA 29,3 % · diabète 10,6 % · obésité 20 % · hypercholestérolémie 10,5 %.`},
{q:`La prévalence du diabète chez les adultes de plus de 18 ans est de :`,o:[`10,6 %`,`20 %`,`29,3 %`,`3 %`],c:0,e:`Diabète 10,6 % et pré-diabète 10,4 %.`},
{q:`La capacité litière psychiatrique est de :`,o:[`0,65 lit pour 10 000 habitants`,`1 lit pour 10 000 habitants`,`2 lits pour 10 000 habitants`,`0,2 lit pour 10 000 habitants`],c:0,e:`2 209 lits pour plus de 34 millions d'habitants, contre une moyenne EMRO de 1 lit/10 000.`},
{q:`Quelles régions ne disposent d'aucune structure psychiatrique ou addictologique ?`,o:[`Dakhla-Oued Eddahab et Guelmim-Oued Noun`,`Drâa-Tafilalet et Souss-Massa`,`Béni Mellal et Fès-Meknès`,`Oriental et Marrakech-Safi`],c:0,e:`Deux régions dépourvues de structure.`},
{q:`La mortalité néonatale représente :`,o:[`Les trois quarts des décès des enfants de moins de 5 ans`,`La moitié`,`Un quart`,`Un dixième`],c:0,e:`13,6 décès pour 1 000 NV en 2018, soit les trois quarts des décès des moins de 5 ans.`},
{q:`La première cause de mortalité néonatale selon l'étude des 4 CHU est :`,o:[`La détresse respiratoire (29,53 %)`,`L'infection (25 %)`,`La prématurité (19,65 %)`,`Les malformations`],c:0,e:`Détresses respiratoires 29,53 %, infections 25 %, prématurité 19,65 %.`},
{q:`L'incidence des cancers est estimée à :`,o:[`40 000 nouveaux cas par an`,`10 000 par an`,`100 000 par an`,`4 000 par an`],c:0,e:`Registre des cancers du Grand Casablanca, année 2012.`},
{q:`La prévalence de la maladie rénale chronique avoisine :`,o:[`3 %, soit environ 1 million de personnes`,`10 %`,`0,5 %`,`20 %`],c:0,e:`Enquête Maremar 2011.`},
{q:`Le tétanos néonatal a été certifié éliminé par l'OMS en :`,o:[`1998`,`2002`,`2007`,`2012`],c:1,e:`Élimination certifiée en 2002 ; pas de poliomyélite depuis 1987 ni de diphtérie depuis 1998.`},
{q:`La prévalence contraceptive chez les femmes mariées de 15-49 ans atteint en 2018 :`,o:[`58 %`,`70,8 %`,`80 %`,`11,3 %`],c:1,e:`70,8 %, dont 58 % de méthodes modernes ; besoins non satisfaits 11,3 %.`}
],

{f:`Enquête STEPwise 2017`,b:`Diabète <b>10,6 %</b> · pré-diabète 10,4 % · <b>HTA 29,3 %</b> · <b>obésité 20 %</b> · hypercholestérolémie 10,5 % · <b>tabac 13,4 %</b> (H 26,9 % / F 0,4 %)`},

{f:`Santé mentale au Maroc`,b:`<b>1 personne sur 2</b> avec au moins un trouble (ENPTM3) · <b>34 structures</b> · <b>2 209 lits</b> = <b>0,65/10 000</b> (EMRO : 1/10 000) · 2 régions sans structure`}

{t:`Les populations à besoins spécifiques`,ic:`🤝`,pages:`p.17-19`,
lesson:`<h3>👥 Les 4 groupes</h3>
<p><b>1. Les personnes en situation de handicap</b> — près de <b>7 % de la population</b>, dont <b>33,7 % âgées de 60 ans et plus</b>.<br>
<b>2. Les personnes âgées</b> — <b>64,4 %</b> atteintes d'au moins une maladie chronique en 2017 (contre 57,5 % en 2011) ; <b>diabète 20 %</b> (22,9 % urbain / 15,3 % rural) contre 14,8 % en 2011 ; <b>HTA 34 %</b> (36,4 % urbain / 30,1 % rural) contre 28 % en 2011.<br>
<b>3. La population carcérale</b> — <b>83 203 personnes</b> (mars 2018), <b>97,75 % d'hommes</b>, <b>80 % de moins de 40 ans</b> ; vulnérabilité accrue (précarité, faible accès aux soins, surpopulation et promiscuité).<br>
<b>4. La population immigrée</b> — bénéficiaire de la <b>nouvelle stratégie du Maroc (2014)</b>, fondée sur les valeurs de <b>solidarité, d'accueil et d'intégration</b>.</p>
<h3>🎯 Les objectifs spécifiques à l'horizon 2025</h3>
<table><tr><th>Population</th><th>Objectifs 2025</th></tr>
<tr><td><b>Handicap</b></td><td>Réduire de <b>25 %</b> (par rapport à 2014) la proportion de personnes ayant des difficultés d'accès aux soins · porter à <b>90 %</b> la proportion couverte par l'assurance maladie</td></tr>
<tr><td><b>Personnes âgées</b></td><td>Créer des <b>services hospitaliers</b> de prise en charge · <b>augmenter de 100 %</b> l'effectif des <b>médecins gériatres</b> · former des <b>auxiliaires de vie</b> et développer les <b>soins à domicile</b></td></tr>
<tr><td><b>Population carcérale</b></td><td>Doter <b>tous les établissements pénitentiaires</b> de <b>centres médicaux</b> · améliorer l'accès aux soins hospitaliers de <b>2e et 3e niveaux</b> · garantir la <b>continuité des soins pour les détenus libérés</b></td></tr>
<tr><td><b>Population immigrée</b></td><td>Disposer de <b>connaissances et de données</b> sur les défis liés aux flux migratoires · réduire les problèmes de santé les plus fréquents · assurer une <b>prise en charge médicale adéquate</b> · instaurer des <b>procédures de gestion</b> de la réponse nationale</td></tr></table>`,
qs:[
{q:`Les personnes en situation de handicap représentent :`,o:[`Près de 7 % de la population`,`11 %`,`3 %`,`20 %`],c:0,e:`Près de 7 %, dont 33,7 % âgées de 60 ans et plus.`},
{q:`Quelle proportion des personnes âgées est atteinte d'au moins une maladie chronique en 2017 ?`,o:[`57,5 %`,`64,4 %`,`34 %`,`20 %`],c:1,e:`64,4 % en 2017 contre 57,5 % en 2011.`},

{q:`Chez les personnes âgées, la prévalence de l'HTA est de :`,o:[`20 %`,`28 %`,`34 %`,`14,8 %`],c:2,e:`HTA 34 % (36,4 % urbain / 30,1 % rural) et diabète 20 %.`},
{q:`Pour les personnes en situation de handicap, l'objectif 2025 de couverture par l'assurance maladie est de :`,o:[`75 %`,`86 %`,`90 %`,`100 %`],c:2,e:`Et réduction de 25 % de la proportion de personnes ayant des difficultés d'accès aux soins, par rapport à 2014.`},

{t:`Pilier 1 — l'offre de soins`,ic:`🏥`,pages:`Pilier 1`,
lesson:`<h3>🧭 Les 3 domaines et 8 axes</h3>
<p><b>Domaines</b> : les <b>établissements de soins de santé primaires</b> · l'<b>hôpital public</b> · les <b>médicaments et dérivés sanguins</b>. Déclinaison : <b>8 axes, 34 actions, 178 mesures</b>.</p>
<h3>🏘️ Les ESSP</h3>
<p><b>Objectif principal : réhabiliter la première ligne pour la rendre attractive et réactive.</b><br>
Objectifs spécifiques : disposer de <b>centres de santé</b> capables de répondre à la majorité des problèmes (réduire les <b>références</b> vers les spécialistes et les <b>délais de rendez-vous</b>) · faire fonctionner les <b>urgences médicales de proximité</b> pour <b>éviter l'encombrement des urgences hospitalières</b>.</p>
<p><b>Axe 1</b> — Organiser l'offre de soins nationale : mettre en place la <b>carte sanitaire</b> · valider et mettre en œuvre les <b>SROS</b> · créer des <b>synergies public-privé</b>, notamment à but non lucratif.<br>
<b>Axe 2</b> — Renforcer le réseau des ESSP, des EMS et de la <b>santé mobile</b> : <b>ouvrir les structures fermées</b> · <b>mettre à niveau</b> dans le cadre du partenariat DRS / collectivités territoriales · développer la <b>stratégie mobile</b> · étendre le <b>réseau des établissements médico-sociaux</b> · renforcer la <b>circonscription sanitaire</b> comme <b>territoire le plus décentralisé</b> de planification.<br>
<b>Axe 3</b> — Développer la <b>médecine de proximité et de famille</b> : réhabiliter la <b>médecine générale</b> · développer des <b>soins intégrés centrés sur le patient</b> · adopter le régime de « <b>médecine de famille, santé de famille et de la communauté</b> » · multiplier les <b>caravanes sanitaires</b> · développer la <b>médecine solidaire</b>.</p>
<h3>🏥 L'hôpital public — 6 objectifs spécifiques</h3>
<p>Accessibilité (<b>géographique, financière et culturelle</b>) · offre <b>équitable et équilibrée</b> entre régions et milieux · <b>gouvernance</b> (performance, efficience, équilibre financier, compétitivité) · <b>sécurité et qualité</b> avec <b>obligation d'accréditation</b> des hôpitaux · <b>coordination ambulatoire / hospitalier</b> (référence et contre-référence) · prise en charge <b>régionale et interrégionale des urgences</b>.</p>
<p><b>Axe 4</b> — Développer le réseau hospitalier : augmenter la <b>capacité litière</b> · <b>optimiser</b> l'existant par les modes non conventionnels (<b>hôpital de jour, hôpital de semaine, hospitalisation à domicile</b>) · renforcer le <b>plateau technique</b> (veille technologique) · politique nationale de <b>maintenance</b>.<br>
<b>Axe 5</b> — Renforcer l'accès : <b>soins tertiaires</b> et médecine hospitalo-universitaire · <b>humanisation</b> et accueil · <b>rendez-vous à distance</b> · respect des <b>filières de soins</b>.<br>
<b>Axe 6</b> — Appuyer le plan national des urgences : <b>SAMU / SMUR / HéliSMUR</b> et <b>SAMU social</b> · étudier le déploiement d'<b>avions sanitaires</b> · transport sanitaire <b>pédiatrique et psychiatrique</b> · mise à niveau des urgences et de la <b>réanimation</b> · <b>unités régionales de grands brûlés dans les CHR</b>.</p>
<h3>💊 Médicaments et sang</h3>
<p><b>Axe 7</b> — Améliorer l'accès au médicament : mettre en œuvre la <b>Politique pharmaceutique nationale</b> · réadapter le <b>cycle d'approvisionnement</b> · optimiser la gestion · poursuivre le <b>contrôle des prix</b> · améliorer le <b>taux de pénétration du générique</b>.<br>
<b>Axe 8</b> — Améliorer l'accès aux <b>produits sanguins sécurisés</b> : promouvoir le <b>don et la collecte</b> · améliorer l'efficience, la qualité et la sécurité des prestations du <b>CNTSH</b> et des centres de transfusion.</p>

{t:`Pilier 2 — les programmes nationaux`,ic:`🛡️`,pages:`Pilier 2`,
lesson:`<h3>🧭 Les 5 domaines et 8 axes</h3>
<p><b>Domaines</b> : maladies transmissibles · maladies non transmissibles · <b>santé de la reproduction, de la mère, du nouveau-né, de l'enfant et de l'adolescent (SRMNEA)</b> · santé mentale · <b>populations à besoins spécifiques</b>. Déclinaison : <b>8 axes, 41 actions, 211 mesures</b>.</p>
<h3>🫀 MNT (axes 9, 10, 11)</h3>
<p><b>Objectif principal</b> : réduire morbidité, mortalité et incapacités liées aux MNT par une <b>action multisectorielle</b>.<br>
<b>Lignes de force de la gouvernance</b> : système de <b>suivi-évaluation</b> · mise à jour de la <b>législation</b> · <b>approche multisectorielle</b> · <b>partenariat public-privé</b> · mobilisation de <b>fonds extrabudgétaires</b>.<br>
<b>Nouveaux programmes</b> (axe 10) : plan « <b>Maroc sans hépatite virale C</b> » · prévention et contrôle des <b>maladies cardiovasculaires</b> · lutte contre la <b>surdité chez l'enfant</b> · lutte contre l'<b>obésité de l'enfant</b> · <b>procréation médicalement assistée (PMA)</b> · lutte contre l'<b>insuffisance rénale chronique</b> · promotion du <b>don et de la greffe d'organes</b> · programmes <b>maladies rares, inflammatoires et respiratoires chroniques</b>.<br>
<b>Modes de vie sains</b> (axe 11) : plan national <b>multisectoriel</b> · stratégie nationale de <b>nutrition</b> · <b>éducation sanitaire</b> · lancement de la « <b>chaîne santé publique</b> » numérique · développement de la <b>e-santé</b>.</p>
<h3>🦠 MT (axes 12, 13)</h3>
<p>Converger vers la <b>cible 3.3 des ODD en 2030</b> et améliorer la <b>sécurité sanitaire</b>. Actions : riposte au <b>VIH-sida</b> · riposte à la <b>tuberculose</b> · <b>anthropozoonoses</b> · plan contre la <b>résistance aux antimicrobiens (RAM)</b>. Veille : <b>plan national de sécurité sanitaire</b> · capacités de <b>détection, d'alerte et de riposte aux urgences de santé publique</b> · <b>contrôle sanitaire aux frontières</b> · restructuration du <b>réseau des laboratoires nationaux de référence</b>.</p>
<h3>🤰 SRMNEA (axe 14) — les 3 cibles chiffrées 2025</h3>
<p>• Ratio de mortalité maternelle : <b>72,6 → 48</b> pour 100 000 NV<br>
• Taux de mortalité néonatale : <b>13 → au moins 10</b> pour 1 000 NV<br>
• Taux de mortalité des moins de 5 ans : <b>21 → au moins 15</b> pour 1 000 NV</p>
<p>Actions : politique nationale de <b>santé de l'enfant</b> · <b>programme de surveillance de la grossesse et de l'accouchement (PSGA)</b> · <b>pôles d'excellence régionaux</b> · <b>PNI</b> avec introduction du <b>vaccin anti-HPV pour les filles de 9 à 13 ans</b> · généralisation du <b>dépistage précoce à la naissance</b>.</p>
<h3>🧠 Santé mentale (axe 15) — 4 principes directeurs</h3>
<p><b>Rétablissement</b> (partage du pouvoir avec les usagers et leurs familles, reconnaissance des droits fondamentaux) · <b>diversification</b> de la palette de soins · <b>implication de la famille</b> · <b>équité</b> dans l'accès et la répartition des ressources.</p>
<p><b>Cibles 2025</b> : atteindre au moins <b>1 lit psychiatrique pour 10 000 habitants</b> · rendre disponibles les <b>psychotropes essentiels pour traiter au moins 80 % des troubles diagnostiqués au niveau des ESSP</b> · lutter contre la <b>stigmatisation</b>.</p>`,
qs:[
{q:`L'objectif 2025 pour le ratio de mortalité maternelle est de le ramener de 72,6 à :`,o:[`60 pour 100 000 NV`,`48 pour 100 000 NV`,`30 pour 100 000 NV`,`15 pour 1 000 NV`],c:1,e:`De 72,6 (2018) à 48 pour 100 000 naissances vivantes.`},
{q:`L'objectif 2025 pour la mortalité des moins de 5 ans est :`,o:[`Au moins 15 pour 1 000 NV`,`10 pour 1 000 NV`,`22,6 pour 1 000 NV`,`48 pour 100 000 NV`],c:0,e:`De 21 à au moins 15 pour 1 000 NV ; la mortalité néonatale passant de 13 à au moins 10 pour 1 000.`},

{t:`Pilier 3 — gouvernance et ressources`,ic:`⚙️`,pages:`Pilier 3`,
lesson:`<h3>🧭 Les 4 domaines et 9 axes</h3>
<p><b>Domaines</b> : la <b>couverture médicale de base</b> · les <b>ressources humaines</b> · la <b>réglementation et le partenariat</b> · le <b>système d'information, la performance et la qualité</b>. Déclinaison : <b>9 axes, 50 actions, 253 mesures</b>.</p>
<h3>🪪 Axe 17 — Élargir la CMB vers la CSU</h3>
<p>Couvrir progressivement <b>toutes les populations</b>, dont les <b>travailleurs indépendants non salariés</b> et les <b>migrants</b> · renforcer le <b>leadership du ministère</b> et le <b>rôle régulateur de l'ANAM</b> · créer un <b>organisme gestionnaire spécifique du RAMED</b> · consolider l'<b>AMO</b> par la refonte de la <b>convention nationale</b> et un <b>panier de soins minimal universel</b> · <b>réduire le reste à charge</b> par un <b>parcours et un suivi médical coordonnés</b> · réviser la <b>NGAP</b> et la <b>NABM</b>.</p>
<h3>👩‍⚕️ Axes 18 et 19 — Les ressources humaines</h3>
<p>Pallier la pénurie : capacités de <b>planification et de normalisation des effectifs</b> · programme de <b>rattrapage du déficit en aides-soignants</b> et métiers émergents · <b>conventionnement</b> (collectivités territoriales, privé) pour <b>rouvrir en priorité les centres de santé ruraux fermés</b> · adaptation du <b>système de formation</b> · <b>création de la fonction publique sanitaire</b>.</p>
<p>Améliorer les conditions de travail : <b>dialogue social</b> · <b>modernisation de la GRH</b> · <b>stratégie sectorielle de formation continue</b> · formation en <b>médecine de famille et santé communautaire via e-learning</b> · <b>régulation de la formation publique et privée</b> · <b>prime de rendement</b> et mesures incitatives · programme national <b>Santé et sécurité au travail (SST)</b>.</p>
<h3>⚖️ Axes 20, 21, 22 — Réglementation et partenariat</h3>
<p>Créer les <b>instances de concertation prévues par la loi 34-09</b> · inscrire l'<b>investissement en santé dans la charte nationale d'investissement</b> · réorganiser le ministère au regard de la <b>régionalisation avancée</b> et créer des <b>inspections régionales</b> · créer l'<b>Agence nationale de santé publique</b>, l'<b>Agence nationale du médicament et des produits de santé</b> et l'<b>Établissement marocain du sang</b> · promouvoir le <b>partenariat avec les collectivités territoriales</b> · encourager le <b>tourisme médical</b> · <b>régionaliser le traitement des plaintes</b> des usagers.</p>
<h3>💻 Axes 23, 24, 25 — Système d'information, performance et qualité</h3>
<p><b>Axe 23</b> : <b>schéma directeur informatique</b> · système d'information décisionnel de la <b>carte sanitaire</b> · <b>intégration du secteur privé</b> · <b>dossier médical partagé</b> · <b>datacenter</b> du ministère · <b>politique de sécurité</b> du SI · informatisation du <b>cycle d'approvisionnement en médicaments</b>.<br>
<b>Axe 24</b> : <b>facturation hospitalière</b> moderne · <b>autonomie hospitalière</b> et statut de « <b>groupement hospitalier régional ou de territoire (GHR / GHT)</b> » · organisation par <b>spécialité et pôles d'excellence</b> · <b>refonte du règlement intérieur des hôpitaux</b> · <b>audit et contrôle de gestion</b>.<br>
<b>Axe 25</b> : <b>système d'évaluation des établissements</b> · création de l'<b>Agence de performance et d'évaluation hospitalières</b> · outils d'<b>accréditation et de certification</b> · <b>politique nationale de sécurité des soins</b>.</p>`,

{t:`Le secteur privé et le financement`,ic:`💼`,pages:`Secteur privé · Financement`,
lesson:`<h3>🏢 La composition du système de santé</h3>
<p>Un <b>secteur public</b> · un <b>secteur privé à but lucratif</b> · un <b>secteur privé à but non lucratif</b> (Fondation Cheikh Zayed, Fondation Cheikh Khalifa, <b>Croissant rouge marocain</b>) · et un <b>secteur de santé militaire</b>.</p>
<h3>📊 Le poids du secteur privé</h3>
<p>Plus de <b>356 cliniques</b> et environ <b>9 719 lits</b> · <b>9 475 cabinets</b> de consultation médicale · <b>276 cabinets de radiologie</b> · <b>3 121 cabinets dentaires</b> · <b>4 624 médecins généralistes</b> et <b>7 518 médecins spécialistes</b> · plus de <b>8 914 officines</b> · <b>531 cabinets et laboratoires</b> de biologie.</p>
<h3>📈 Les 4 facteurs de son développement</h3>
<p>1. L'<b>attractivité</b> du secteur privé pour les professionnels<br>
2. La <b>liberté du choix des lieux de travail</b> — <b>60 % des médecins privés</b> sont installés à <b>Rabat ou Casablanca</b><br>
3. La <b>détérioration de la qualité des soins</b> dans le public<br>
4. L'<b>augmentation de la demande</b> de services privés — <b>70 % des 20 % de la population la plus pauvre</b> utilise les services privés</p>
<h3>🚧 Les 6 entraves</h3>
<p>Absence de <b>stratégie globale</b> associant le privé comme partenaire · absence de <b>régulation de l'implantation spatiale</b> (carte sanitaire inappliquée) · <b>inexistence d'outils d'évaluation</b> et de système d'information fiable · <b>dualité des pratiques</b> public-privé · <b>déficience de gouvernance</b> · <b>faible culture partenariale</b>.</p>
<h3>💰 Le financement</h3>
<p>Selon les <b>comptes nationaux de la santé 2013</b> (rapport 2015) : <b>dépense totale de santé = 52 milliards de dirhams</b>, soit <b>1 578 dirhams par habitant</b> ; <b>+4,2 milliards</b> entre 2010 et 2013, mais la part dans le PIB <b>baisse de 6,2 % (2010) à 5,8 % (2013)</b>.</p>
<p>Le <b>financement collectif et solidaire</b> gagne <b>3 points</b> entre 2010 et 2013 (<b>47 % contre 44 %</b>), grâce à la couverture médicale passée de <b>18,8 % à 22,4 %</b>, tandis que les <b>ressources fiscales</b> reculent de <b>25,2 % à 24,4 %</b>.</p>
<h3>💡 Les pistes de diversification du financement</h3>
<p>Principe <b>pollueur-payeur</b> · restructuration de la <b>configuration financière</b> · <b>mécanismes solidaires</b> · <b>partenariat public-privé</b> · partenariat avec le <b>secteur privé</b> · création de <b>groupements hospitaliers régionaux (GHR)</b> · création d'une <b>société publique de droit privé</b> · activation des <b>dons et legs</b> · affectation d'une part des produits des <b>waqf et habous</b> au financement du <b>RAMED</b> · régularité de la <b>mobilisation des transferts</b> destinés au RAMED.</p>`,

{t:`La carte sanitaire : objet et contenu`,ic:`🗺️`,pages:`p.3-4`,
lesson:`<h3>🎯 Objet commun CS + SROS</h3>
<p><b>Prévoir et susciter</b> les évolutions nécessaires de l'offre de soins <b>publique et privée</b>, en vue de :</p>
<p>1. <b>Satisfaire de manière optimale</b> les besoins en soins et services de la population<br>
2. Réaliser l'<b>harmonie et l'équité</b> dans la répartition spatiale des ressources <b>matérielles et humaines</b><br>
3. <b>Corriger les déséquilibres</b> régionaux et intrarégionaux<br>
4. <b>Maîtriser la croissance</b> de l'offre</p>
<h3>📦 Ce que définit la carte sanitaire</h3>
<p>Aux niveaux <b>national et régional</b> : les <b>types d'infrastructures et d'installations sanitaires</b> ainsi que les <b>normes et modalités de leur implantation territoriale</b>.</p>
<p>Elle détermine aux niveaux national, <b>interrégional</b> et pour chaque région :</p>
<p>• l'<b>agrégat de l'infrastructure sanitaire existante</b><br>
• l'<b>importance, la nature et le bassin de desserte</b> des infrastructures et installations fixes et mobiles publiques et privées <b>à prévoir</b><br>
• les <b>normes, critères et modalités d'implantation</b><br>
• les <b>réseaux de prise en charge</b> de problèmes et risques particuliers de santé, ainsi que les <b>ressources humaines</b> selon les besoins et les spécialités.</p>
<h3>🧮 Bases d'élaboration</h3>
<p>• l'<b>analyse globale de l'offre de soins existante</b><br>• les données <b>géo-démographiques et épidémiologiques</b><br>• le <b>progrès technologique médical</b></p>
<div class="tip">🔑 <b>Qui, combien de temps ?</b> La carte sanitaire est établie par l'<b>administration centrale</b>, <b>après avis de la commission nationale de l'offre de soins</b>, pour une durée <b>maximale de 10 ans</b>, <b>évaluée tous les 5 ans</b> et révisée le cas échéant en cas de changements majeurs.</div>`,
qs:[
{q:`La carte sanitaire est établie par :`,o:[`La direction régionale de la santé`,`L'administration centrale`,`Le GST`,`La commission régionale`],c:1,e:`Par l'administration centrale, après avis de la commission nationale de l'offre de soins.`},

{q:`La carte sanitaire doit être évaluée :`,o:[`Tous les ans`,`Tous les 3 ans`,`Tous les 5 ans`,`Tous les 10 ans`],c:2,e:`Évaluation tous les 5 ans, révision en cas de changements majeurs des données ayant servi à son élaboration.`},
{q:`L'avis de quelle instance est requis avant l'établissement de la carte sanitaire ?`,o:[`La commission régionale de l'offre de soins`,`La commission nationale de l'offre de soins`,`Le conseil de l'Ordre`,`Le Parlement`],c:1,e:`La commission nationale de l'offre de soins pour la CS ; la commission régionale pour le SROS.`},

{t:`Composantes, objectifs et justification de la CS`,ic:`🏗️`,pages:`p.4-5`,
lesson:`<h3>🧩 Les 4 composantes de la carte sanitaire</h3>
<p><b>1. Un contenant : le territoire sanitaire</b> — la CS fixe le <b>découpage sanitaire</b> du territoire national selon le bassin de desserte et les caractéristiques <b>épidémiologiques, géographiques, démographiques, socio-économiques et administratives</b>.<br>
<b>2. Un contenu : les prestations de soins et services</b> — types d'infrastructures et d'installations, aux niveaux national et régional.<br>
<b>3. Une organisation des soins : réseaux et filières</b> — réseaux de prise en charge de problèmes et risques particuliers.<br>
<b>4. Des critères et normes d'implantation</b> — normes, critères et modalités d'implantation.</p>
<h3>🎯 Les 5 objectifs de la carte sanitaire</h3>
<p>1. Assurer une meilleure <b>disponibilité</b> des services · 2. Améliorer l'<b>accès</b> et <b>réduire les inégalités</b> · 3. <b>Rationaliser</b> le développement sanitaire du pays · 4. Déterminer le <b>cadre adéquat</b> pour le développement des infrastructures, équipements lourds et RH · 5. Disposer d'un <b>instrument efficace de régulation</b> de l'offre de soins.</p>
<h3>❗ Les 5 principes justificatifs</h3>
<p>1. Des <b>disparités dans l'état de santé</b> · 2. Des <b>inégalités dans la couverture sanitaire</b> · 3. Des <b>déficits patents dans l'offre de soins</b> · 4. Des <b>mutations importantes</b> (transition démographique…) · 5. Une <b>mesure d'accompagnement</b> du projet de loi <b>131-13</b> relative à l'exercice de la médecine.</p>`,
qs:[
{q:`Le « contenant » de la carte sanitaire est :`,o:[`Le territoire sanitaire`,`Les prestations de soins`,`Les réseaux et filières`,`Les normes d'implantation`],c:0,e:`4 composantes : contenant (territoire sanitaire), contenu (prestations), organisation (réseaux et filières), critères et normes d'implantation.`},
{q:`Le découpage sanitaire du territoire tient compte :`,o:[`Du bassin de desserte et des caractéristiques épidémiologiques, géographiques, démographiques, socio-économiques et administratives`,`Des seules limites administratives`,`De la densité médicale seulement`,`Du budget régional`],c:0,e:`La CS fixe le découpage en fonction du bassin de desserte et de ces cinq familles de caractéristiques.`},

{q:`Combien d'objectifs la carte sanitaire poursuit-elle ?`,o:[`3`,`4`,`5`,`6`],c:2,e:`5 objectifs, de la disponibilité des services à la régulation de l'offre de soins.`},
{q:`Parmi les objectifs de la CS figure :`,o:[`Disposer d'un instrument efficace de régulation de l'offre de soins`,`Fixer les tarifs hospitaliers`,`Recruter du personnel étranger`,`Créer des mutuelles`],c:0,e:`5e objectif : disposer d'un instrument efficace de régulation de l'offre de soins.`},
{q:`Les principes justificatifs de la CS incluent :`,o:[`Les déficits patents dans l'offre de soins`,`L'excès de médecins`,`Le surcoût des médicaments`,`La baisse des naissances`],c:0,e:`Disparités de l'état de santé, inégalités de couverture, déficits de l'offre, mutations importantes, accompagnement de la loi 131-13.`},

{t:`Le SROS : définition et contenu`,ic:`📍`,pages:`p.6`,
lesson:`<h3>🔗 Rôle du SROS</h3>
<p>Le <b>schéma régional de l'offre de soins</b> constitue la base de l'organisation des <b>liens fonctionnels</b> : entre secteurs <b>public et privé</b>, entre <b>régions</b>, et entre les <b>préfectures et provinces</b> qui les composent.</p>
<h3>📄 Ce que détermine le SROS (par préfecture ou province)</h3>
<p>Eu égard à la carte sanitaire, selon le découpage sanitaire intrarégional et sur la base de l'analyse des besoins :</p>
<p><b>1.</b> L'<b>inventaire</b> de l'infrastructure sanitaire existante<br>
<b>2.</b> La <b>projection</b> des établissements de santé, des <b>lits et places</b>, des <b>spécialités</b>, des installations fixes et mobiles publiques et privées et des <b>équipements lourds</b>, ainsi que leur répartition territoriale<br>
<b>3.</b> La <b>répartition territoriale et les projections des effectifs</b> des ressources humaines</p>
<p>Le SROS peut porter sur un <b>domaine sanitaire spécifique</b> ou sur l'organisation de <b>ressources rares</b>.</p>
<h3>🏛️ Élaboration</h3>
<p>Établi par la <b>direction régionale de la santé</b> concernée, pour une période de <b>5 ans</b>, <b>après avis de la commission régionale de l'offre de soins</b>.</p>
<h3>💡 Caractéristiques</h3>
<p>Référence pour une meilleure <b>allocation des ressources</b> · outil de détermination des <b>objectifs prioritaires</b> · <b>inexistence d'un cadre juridique</b> (contrairement à la carte sanitaire) · moyen de <b>découpage et d'aménagement du territoire</b> · <b>vision globale centrée sur le patient</b> et ses besoins · <b>levier de changement</b>.</p>
<div class="warn">⚠️ Le SROS n'a <b>pas de cadre juridique</b>, alors que la carte sanitaire en a un. Question piège classique !</div>`,
qs:[
{q:`Le SROS est établi par :`,o:[`L'administration centrale`,`La direction régionale de la santé`,`La commission nationale`,`Le CHU régional`],c:1,e:`Par la direction régionale de la santé concernée, après avis de la commission régionale de l'offre de soins.`},
{q:`Pour quelle durée le SROS est-il établi ?`,o:[`3 ans`,`5 ans`,`10 ans`,`Illimitée`],c:1,e:`Le SROS est établi pour une période de 5 ans (la CS pour 10 ans maximum).`},
{q:`Quelle est la particularité juridique du SROS ?`,o:[`Il a un cadre juridique renforcé`,`Il n'existe pas de cadre juridique pour lui, contrairement à la carte sanitaire`,`Il est adopté par décret`,`Il est voté par le Parlement`],c:1,e:`Inexistence d'un cadre juridique pour le SROS, à la différence de la carte sanitaire.`},
{q:`L'avis de quelle commission précède l'établissement du SROS ?`,o:[`La commission nationale de l'offre de soins`,`La commission régionale de l'offre de soins`,`Le conseil régional`,`La commission d'hygiène`],c:1,e:`La commission régionale de l'offre de soins.`},
{q:`Le SROS détermine ses éléments :`,o:[`Par région`,`Par préfecture ou province`,`Par commune`,`Au niveau national`],c:1,e:`Le SROS détermine par préfecture ou province, selon le découpage sanitaire intrarégional.`},
{q:`Le SROS constitue la base des liens fonctionnels :`,o:[`Entre public et privé, entre régions et entre préfectures/provinces`,`Entre l'État et les bailleurs`,`Entre les CHU uniquement`,`Entre les ministères`],c:0,e:`Liens fonctionnels entre secteurs public et privé, entre régions, et entre les préfectures et provinces les composant.`},
{q:`Le SROS peut porter sur :`,o:[`Un domaine sanitaire spécifique ou l'organisation de ressources rares`,`Uniquement l'ensemble de l'offre`,`Uniquement les équipements lourds`,`Uniquement le secteur privé`],c:0,e:`En fonction des besoins, il peut cibler un domaine sanitaire spécifique ou l'organisation de ressources rares.`},
{q:`Le SROS est décrit comme une vision :`,o:[`Centrée sur l'établissement`,`Globale centrée sur le patient et ses besoins en soins`,`Budgétaire`,`Purement administrative`],c:1,e:`C'est une vision globale centrée sur le patient et ses besoins, et un levier de changement.`}
],

{f:`Les 3 déterminations du SROS`,b:`<b>Inventaire</b> de l'infrastructure existante · <b>projection</b> des établissements, lits et places, spécialités, installations et équipements lourds · <b>répartition et projections des effectifs RH</b>`},

/* U5 */
{t:`Principes, objectifs et composants du SROS`,ic:`🧭`,pages:`p.7`,
lesson:`<h3>⚖️ Les 6 principes du SROS</h3>
<p><b>Globalité · Intégration · Viabilité · Proximité · Équité · Souplesse</b>.<br>Mnémo : <b>G-I-V-P-E-S</b>.</p>
<h3>🎯 Les 5 objectifs du SROS</h3>
<p>1. Développer la <b>planification stratégique régionale</b><br>
2. Développer la <b>concertation</b><br>
3. Favoriser l'<b>intégration</b> du système de soins<br>
4. Apporter une <b>réponse adaptée</b><br>
5. Offrir un <b>cadre de référence formel</b></p>
<h3>🧱 Les 6 composants du SROS</h3>
<p>1. Un <b>plan stratégique régional</b> · 2. Un <b>plan de couverture sanitaire</b> · 3. Un <b>plan thématique</b> · 4. Un <b>plan de déploiement des effectifs</b> · 5. Un <b>plan de mobilisation des ressources</b> · 6. Un <b>plan de communication et de concertation</b>.</p>
<h3>🔄 Les 4 étapes d'élaboration</h3>
<p><b>1. Identification des problèmes et fixation des orientations</b> (diagnostic de la situation sanitaire par rapport aux besoins → identification des problèmes → fixation des orientations)<br>
<b>2. Mobilisation des ressources</b><br>
<b>3. Détermination des mesures à prendre</b><br>
<b>4. Programmation et évaluation</b> (dispositif de mise en œuvre, indicateurs d'évaluation…)</p>`,
qs:[

{t:`CS vs SROS · CSN et CSR (loi 06-22)`,ic:`⚖️`,pages:`p.8-10`,
lesson:`<h3>🔀 Planifier ou réguler ?</h3>
<table><tr><th></th><th>Planifier l'offre de soins</th><th>Réguler le SNS</th></tr>
<tr><td>Dimension</td><td><b>Technique</b></td><td><b>Politique</b></td></tr>
<tr><td>Contenu</td><td>Méthodes, faits, analyses, projections, cartographies</td><td>Aménagement du territoire, redistribution des ressources, maîtrise des dépenses, atténuation des inégalités</td></tr>
<tr><td>Mission</td><td><b>Décentralisée</b></td><td><b>Centralisée</b></td></tr></table>
<h3>📐 Répartition des rôles</h3>
<p>La <b>carte sanitaire</b> détermine aux niveaux national, interrégional et pour chaque région l'<b>agrégat de l'infrastructure sanitaire existante</b>.<br>
Le <b>SROS</b> détermine <b>par préfecture ou province</b> l'inventaire de l'existant + les <b>projections</b> (établissements, lits et places, spécialités, installations fixes et mobiles publiques et privées, équipements lourds) et les <b>projections d'effectifs RH</b>.</p>
<h3>🏗️ Création des établissements</h3>
<p>• Tout <b>établissement de santé public</b> : création et implantation <b>conformément</b> à la CS et au SROS.<br>
• <b>Cliniques et assimilés, cabinets de radiologie, laboratoires d'analyses de biologie médicale</b> : création et implantation <b>par référence aux orientations</b> de la CS et du SROS.</p>
<div class="warn">⚠️ Nuance décisive : <b>« conformément à »</b> pour le public, <b>« par référence aux orientations de »</b> pour le privé.</div>
<h3>⚖️ Les 8 principes régissant l'offre de soins et la CS</h3>
<p>1. Solidarité et responsabilisation · 2. Égalité d'accès aux soins et services · 3. Équité dans la répartition spatiale des ressources · 4. Complémentarité intersectorielle · 5. Approche genre · 6. Intégration et coordination · 7. Globalité · 8. Graduation des soins.</p>
<h3>🆕 CSN et CSR selon la loi-cadre 06-22</h3>
<p>Chaque <b>GST</b> établit, dans le cadre des orientations générales de la <b>carte sanitaire nationale (CSN)</b>, une <b>carte sanitaire régionale (CSR)</b> de l'offre de soins comportant un <b>inventaire global public et privé</b>, et déterminant pour le <b>secteur public</b> les mesures garantissant :</p>
<p>• la <b>satisfaction optimale des besoins</b> régionaux (projections : RH, établissements, lits et places, spécialités, installations fixes et mobiles, équipements lourds et répartition spatiale)<br>
• l'<b>harmonie et l'équité</b> dans la répartition des ressources humaines et matérielles au niveau régional<br>
• la <b>réduction des disparités</b> au sein de la région</p>
<p>Chaque CSR est établie pour une <b>durée déterminée</b> et peut être <b>mise à jour</b> en cas de changement des orientations générales de la CSN.</p>`,

{q:`Selon la loi 06-22, qui établit la carte sanitaire régionale ?`,o:[`La direction régionale de la santé`,`Chaque groupement sanitaire territorial (GST)`,`L'administration centrale`,`La commission régionale`],c:1,e:`Chaque GST établit la CSR dans le cadre des orientations générales de la carte sanitaire nationale.`},

/* ---------------------------------------------------------- vue RÉVISION */
/* Une séance n'est pas un tirage au hasard. Ordre de priorité :
   1) les têtues (ratées ≥ 3 fois)  2) les erreurs  3) les autres items dus
   4) du jamais-vu pris dans les unités les plus faibles — 35 % de la séance
   réservés au neuf tant que la banque n'est pas couverte à 60 %. */
function coverage() {
  var tot = allQuestions(null).length + allCards(null).length, seen = 0;
  for (var k in S.srs) if (k.slice(0, 2) !== 'cq') seen++;
  return tot ? seen / tot : 1;
}
function weakUnitScore(did, ui) {
  var s = ust(did, ui), n = s.ok + s.ko;
  return n ? s.ok / n : 0.5;                 // jamais travaillée : priorité moyenne
}
function freshItems(n) {
  if (n <= 0) return [];
  var pool = allQuestions(null).filter(function (x) { return !S.srs[x.k]; });
  if (!pool.length) return [];
  pool.sort(function (a, b) { return weakUnitScore(a.d, a.u) - weakUnitScore(b.d, b.u); });
  return shuffle(pool.slice(0, Math.max(n * 4, 40))).slice(0, n).map(function (x) {
    return { type: 'q', q: x.q, k: x.k, d: x.d, u: x.u };
  });
}
function buildSession(n) {
  var stub = [], errs = [], rest = [];
  dueList().forEach(function (k) {
    (isStubborn(k) ? stub : (S.srs[k].lap ? errs : rest)).push(k);
  });
  var ordered = shuffle(stub).concat(shuffle(errs), shuffle(rest)).map(resolveKey).filter(Boolean);
  var quota = coverage() < 0.6 ? Math.round(n * 0.35) : Math.max(0, n - ordered.length);
  var old = ordered.slice(0, Math.max(0, n - quota));
  var neuf = freshItems(Math.min(quota, n - old.length));
  var out = [], oi = 0, ni = 0;              // on intercale le neuf : 2 anciens, 1 nouveau
  while (oi < old.length || ni < neuf.length) {
    if (oi < old.length) out.push(old[oi++]);
    if (oi < old.length) out.push(old[oi++]);
    if (ni < neuf.length) out.push(neuf[ni++]);
  }
  return { items: out, due: ordered.length, stub: stub.length, neuf: neuf.length };
}
function vReview() {

}

    '<div class="row3"><button class="btn ghost sm nsel" data-n="20">20</button><button class="btn ghost sm nsel" data-n="40">40</button><button class="btn ghost sm nsel" data-n="60">60</button></div>' +
    '<div class="spacer"></div><label class="row"><input type="checkbox" id="chrono" checked> <span>Chronomètre (45 s / question)</span></label>' +
    '<div class="spacer"></div><button class="btn gold" data-act="startexam">Lancer l\'examen</button></div>';
  if (S.exams.length) {
    h += '<h2>Historique</h2>';
    S.exams.slice(-10).reverse().forEach(function (e) {
      h += '<div class="card tight row"><div style="flex:1"><b>' + e.pct + '%</b> <span class="sub">· ' + e.n + ' Q · ' + esc(e.scope) + '</span>' +
        '<div class="sub">' + e.date + ' · ' + Math.floor(e.secs / 60) + ' min</div></div>' +
        '<span class="badge ' + (e.pct >= 70 ? 'ok' : 'hot') + '">' + (e.pct >= 70 ? 'admis' : 'à travailler') + '</span></div>';
    });
  }
  h += '</div>';
  return h;
}
var EXN = 40, EXTIMER = null;
function startExam() {
  var scope = +(el('scope') ? el('scope').value : 0);
  var chrono = el('chrono') ? el('chrono').checked : true;
  var pool = allQuestions(scope || null);
  if (pool.length < 5) { toast('Pas assez de questions'); return; }
  var n = Math.min(EXN, pool.length);
  RUN = {
    mode: 'exam', items: shuffle(pool).slice(0, n), i: 0, ok: 0, ko: 0, combo: 0, maxCombo: 0, xp: 0, wrong: [],
    t0: Date.now(), back: 'exam', did: null, ui: null,
    scope: scope ? doc(scope).code + '. ' + doc(scope).title : 'Tous les modules',
    end: chrono ? Date.now() + n * 45000 : 0
  };
  ROOT.innerHTML = quizFrame() + navBar('exam'); bind(); tickExam();
}
function tickExam() {
  clearInterval(EXTIMER);
  if (!RUN || RUN.mode !== 'exam' || !RUN.end) return;
  EXTIMER = setInterval(function () {
    var t = el('tm'); if (!t) return;
    var left = Math.max(0, RUN.end - Date.now());
    var m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    t.textContent = m + ':' + pad(s);
    if (left < 60000) t.classList.add('warn');
    if (left <= 0) { clearInterval(EXTIMER); RUN.i = RUN.items.length; ROOT.innerHTML = examEnd() + navBar('exam'); bind(); }
  }, 500);
}
function examEnd() {
  clearInterval(EXTIMER);
  var R = RUN, tot = R.items.length, pct = tot ? Math.round(R.ok / tot * 100) : 0;
  var secs = Math.round((Date.now() - R.t0) / 1000);
  addXP(R.xp + 25);
  S.exams.push({ date: today(), n: tot, pct: pct, secs: secs, scope: R.scope });
  save();
  if (pct >= 70) { beep('up'); confetti(); }
  var h = bar('Résultat examen', 'exam') + '<div class="wrap center">' +
    '<div style="font-size:56px;margin:14px 0 2px">' + (pct >= 80 ? '🥇' : pct >= 70 ? '🎓' : pct >= 50 ? '📈' : '📚') + '</div>' +
    '<h1>' + pct + '% · ' + R.ok + '/' + tot + '</h1>' +
    '<div class="sub">' + esc(R.scope) + ' · ' + Math.floor(secs / 60) + ' min ' + pad(secs % 60) + ' s</div>' +
    '<div class="row3" style="margin:16px 0">' +
    '<div class="stat"><div class="v">' + R.ok + '</div><div class="l">justes</div></div>' +
    '<div class="stat"><div class="v">' + R.ko + '</div><div class="l">faux</div></div>' +
    '<div class="stat"><div class="v">' + Math.round(secs / Math.max(1, tot)) + 's</div><div class="l">/question</div></div></div>';
  if (R.wrong.length) {
    h += '<div class="card" style="text-align:left"><b>Correction des erreurs</b>';
    R.wrong.forEach(function (it) {
      h += '<div class="hr"></div><div style="font-size:13.6px"><div style="font-weight:700">' + rich(it.q.q) + '</div>' +
        '<div style="color:var(--green-dk);margin:3px 0"><b>➜ ' + rich(it.q.o[it.q.c]) + '</b></div>' +
        (it.q.e ? '<div class="sub">' + rich(it.q.e) + '</div>' : '') +
        '<div class="sub" style="margin-top:3px">' + esc(doc(it.d).code + ' · ' + unit(it.d, it.u).t) + '</div></div>';
    });
    h += '</div>';
  }
  h += '<button class="btn" data-go="exam">Retour</button></div>';
  return h;
}

/* ------------------------------------------------------------- vue STATS */
function vStats() {
  var days = [], t = today();
  for (var i = 6; i >= 0; i--) { var d = dayShift(t, -i); days.push([d, d === t ? S.xpDay : (S.hist[d] || 0)]); }
  var max = Math.max(10, Math.max.apply(null, days.map(function (x) { return x[1]; })));
  var totQ = 0, okQ = 0, koQ = 0, crowns = 0, maxc = 0;
  DOCS.forEach(function (d) {
    d.units.forEach(function (u, i) { var s = ust(d.id, i); totQ += u.qs.length; okQ += s.ok; koQ += s.ko; crowns += s.crowns; maxc += CROWN_MAX; });
  });
  var h = bar('Statistiques', '') + '<div class="wrap">';
  h += '<div class="row3">' +
    '<div class="stat"><div class="v">' + S.xp + '</div><div class="l">XP total</div></div>' +
    '<div class="stat"><div class="v">' + S.streak + '</div><div class="l">série (record ' + S.best + ')</div></div>' +
    '<div class="stat"><div class="v">' + Math.round(crowns / Math.max(1, maxc) * 100) + '%</div><div class="l">maîtrise</div></div></div>';
  h += '<h2>7 derniers jours</h2><div class="card"><div class="bars">' +
    days.map(function (x) {
      var n = ['D', 'L', 'M', 'M', 'J', 'V', 'S'][new Date(x[0]).getDay()];
      return '<div class="b" style="height:' + Math.max(3, x[1] / max * 100) + '%;' + (x[1] === 0 ? 'background:var(--line)' : '') + '"><span>' + n + '</span></div>';
    }).join('') + '</div><div style="height:24px"></div>' +
    '<div class="sub center">' + days.reduce(function (a, x) { return a + x[1]; }, 0) + ' XP cette semaine</div></div>';
  h += '<h2>Réponses</h2><div class="row3">' +
    '<div class="stat"><div class="v">' + okQ + '</div><div class="l">justes</div></div>' +
    '<div class="stat"><div class="v">' + koQ + '</div><div class="l">fausses</div></div>' +
    '<div class="stat"><div class="v">' + (okQ + koQ ? Math.round(okQ / (okQ + koQ) * 100) : 0) + '%</div><div class="l">réussite</div></div></div>';
  h += '<h2>Points faibles</h2>';
  var weak = [];
  DOCS.forEach(function (d) {
    d.units.forEach(function (u, i) { var s = ust(d.id, i); if (s.ok + s.ko >= 4) weak.push({ d: d, u: u, i: i, r: s.ok / (s.ok + s.ko), n: s.ok + s.ko }); });
  });
  weak.sort(function (a, b) { return a.r - b.r; });
  if (!weak.length) h += '<div class="card sub">Fais quelques quiz : tes unités les plus fragiles apparaîtront ici.</div>';
  weak.slice(0, 8).forEach(function (w) {
    h += '<div class="mod" data-go="lesson/' + w.d.id + '/' + w.i + '"><div class="bub">' + (w.u.ic || '📘') + '</div>' +
      '<div class="info"><div class="t">' + esc(w.u.t) + '</div><div class="p">' + esc(w.d.code + '. ' + w.d.title) + '</div></div>' +
      '<span class="badge ' + (w.r < .6 ? 'hot' : '') + '">' + Math.round(w.r * 100) + '%</span></div>';
  });
  h += '<h2>Révision espacée</h2>';
  var due = dueList().length, tot = Object.keys(S.srs).length;
  var stub = Object.keys(S.srs).filter(isStubborn).length;
  h += '<div class="card"><div class="row"><div style="flex:1"><b>' + due + '</b> item' + (due > 1 ? 's' : '') + ' à revoir aujourd\'hui' +
    '<div class="sub">' + tot + ' items suivis · ' + Math.round(coverage() * 100) + ' % de la banque vue' +
    (stub ? ' · 🔥 ' + stub + ' têtue(s)' : '') + '</div></div>' +
    '<button class="btn blue sm" style="width:auto;padding:10px 16px" data-go="review">Réviser</button></div></div>';
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------- vue RÉGLAGES */
function vSettings() {
  var h = bar('Réglages', '') + '<div class="wrap">';
  h += '<div class="card"><b>Objectif quotidien</b><div class="sub">XP à gagner chaque jour pour garder ta série</div>' +
    '<div class="spacer"></div><div class="row3">' +
    [20, 50, 100].map(function (g) { return '<button class="btn ' + (S.goal === g ? '' : 'ghost') + ' sm" data-goal="' + g + '">' + g + ' XP</button>'; }).join('') +
    '</div></div>';
  h += '<div class="card"><b>Thème</b><div class="spacer"></div><div class="row3">' +
    [['auto', '🌗 Auto'], ['light', '☀️ Mode diurne'], ['dark', '🌙 Sombre']].map(function (t) {
      return '<button class="btn ' + (S.theme === t[0] ? '' : 'ghost') + ' sm" data-theme="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div></div>';
  h += '<div class="card"><label class="row" style="justify-content:space-between"><span><b>🔊 Le son est activé</b><div class="sub">Retour audio juste / faux</div></span>' +
    '<input type="checkbox" id="snd"' + (S.sound ? ' checked' : '') + ' style="width:22px;height:22px"></label>' +
    '<div class="hr"></div><label class="row" style="justify-content:space-between"><span><b>Cœurs illimités</b><div class="sub">Ne jamais être bloqué par les erreurs</div></span>' +
    '<input type="checkbox" id="unl"' + (S.unlimited ? ' checked' : '') + ' style="width:22px;height:22px"></label>' +
    '<div class="hr"></div><label class="row" style="justify-content:space-between"><span><b>Mise en forme des leçons</b><div class="sub">Couleurs (définition, date, chiffre, loi) et émojis comme les documents source</div></span>' +
    '<input type="checkbox" id="hlx"' + (S.hl ? ' checked' : '') + ' style="width:22px;height:22px"></label></div>';
  h += '<div class="card"><b>🔔 Rappels du concours</b><div class="sub">Autoriser les rappels de l’application sur cet appareil.</div><div class="spacer"></div><button class="btn blue sm" data-act="notify">' + (S.notify ? '✅ Rappels activés' : 'Activer les notifications') + '</button></div>';
  h += '<div class="card"><b>📲 Installation hors ligne</b><div class="sub">Si le bouton ne s’ouvre pas : menu du navigateur → « Ajouter à l’écran d’accueil ».</div><div class="spacer"></div><button class="btn blue sm" data-act="install">⬇️ Installer l’application</button></div>';
  h += '<div class="card"><b>Sauvegarde</b><div class="sub">Ta progression est stockée sur cet appareil. Exporte-la pour la transférer sur un autre (PC ↔ téléphone).</div>' +
    '<div class="spacer"></div><div class="row2"><button class="btn blue sm" data-act="export">⬇️ Exporter</button>' +
    '<button class="btn ghost sm" data-act="import">⬆️ Importer</button></div>' +
    '<div class="spacer"></div><button class="btn red sm" data-act="reset">🗑️ Réinitialiser la progression</button></div>';
  var nq = 0, nc = 0; DOCS.forEach(function (d) { d.units.forEach(function (u) { nq += u.qs.length; nc += u.cards.length; }); });
  h += '<div class="card sub center">CNC ANASS · ' + DOCS.length + ' modules · ' + nq + ' QCM · ' + nc + ' flashcards<br>Contenu généré à partir des résumés « Prépare mon concours » (ANASS SLIT).</div>';
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------- vue RECHERCHE */
var SQ = '';
function vSearch() {
  var q = SQ.toLowerCase().trim();
  var h = bar('Recherche', '') + '<div class="wrap">' +
    '<input class="search" id="q2" placeholder="🔎 Chercher…" value="' + esc(SQ) + '"><div class="spacer"></div>';
  if (q.length < 2) { h += '<div class="card sub">Tape au moins 2 caractères.</div></div>'; return h; }
  var res = [];
  DOCS.forEach(function (d) {
    d.units.forEach(function (u, ui) {
      var score = 0;
      if ((u.t || '').toLowerCase().indexOf(q) >= 0) score += 3;
      if ((u.lesson || '').toLowerCase().indexOf(q) >= 0) score += 2;
      var hits = u.qs.filter(function (x) { return (x.q + ' ' + x.o.join(' ') + ' ' + (x.e || '')).toLowerCase().indexOf(q) >= 0; });
      var chits = u.cards.filter(function (c) { return (c.f + ' ' + c.b).toLowerCase().indexOf(q) >= 0; });
      score += hits.length + chits.length;
      if (score) res.push({ d: d, u: u, ui: ui, n: hits.length + chits.length, score: score, sample: (chits[0] ? chits[0].f + ' → ' + chits[0].b : hits[0] ? hits[0].q : '') });
    });
  });
  res.sort(function (a, b) { return b.score - a.score; });
  h += '<div class="sub">' + res.length + ' unité(s) trouvée(s)</div><div class="spacer"></div>';
  res.slice(0, 30).forEach(function (r) {
    h += '<div class="mod" data-go="lesson/' + r.d.id + '/' + r.ui + '"><div class="bub">' + (r.u.ic || '📘') + '</div>' +
      '<div class="info"><div class="t">' + esc(r.u.t) + '</div><div class="p">' + esc(r.d.code + '. ' + r.d.title) + ' · ' + r.n + ' occurrence(s)</div>' +
      (r.sample ? '<div class="p" style="opacity:.8">' + esc(String(r.sample).replace(/<[^>]+>/g, '').slice(0, 90)) + '…</div>' : '') +
      '</div></div>';
  });
  h += '</div>';
  return h;
}

/* ------------------------------------------------------------- bindings */
function bind() {
  Array.prototype.forEach.call(ROOT.querySelectorAll('[data-go]'), function (b) {
    b.onclick = function (ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); clearInterval(EXTIMER); go('/' + b.getAttribute('data-go')); };
  });
  Array.prototype.forEach.call(ROOT.querySelectorAll('.opt'), function (b) {
    b.onclick = function () { answer(b.getAttribute('data-opt')); };
  });
  Array.prototype.forEach.call(ROOT.querySelectorAll('[data-act]'), function (b) {
    b.onclick = function () { act(b.getAttribute('data-act'), b); };
  });
  Array.prototype.forEach.call(ROOT.querySelectorAll('.nsel'), function (b) {
    b.onclick = function () {
      EXN = +b.getAttribute('data-n');
      Array.prototype.forEach.call(ROOT.querySelectorAll('.nsel'), function (x) { x.classList.add('ghost'); });
      b.classList.remove('ghost');
    };
    if (+b.getAttribute('data-n') === EXN) b.classList.remove('ghost');
  });
  Array.prototype.forEach.call(ROOT.querySelectorAll('[data-goal]'), function (b) {
    b.onclick = function () { S.goal = +b.getAttribute('data-goal'); save(); render(); };
  });
  Array.prototype.forEach.call(ROOT.querySelectorAll('[data-theme]'), function (b) {
    b.onclick = function () { S.theme = b.getAttribute('data-theme'); save(); applyTheme(); render(); };
  });
  var snd = el('snd'); if (snd) snd.onchange = function () { S.sound = snd.checked; save(); if (snd.checked) beep('ok'); };
  var unl = el('unl'); if (unl) unl.onchange = function () { S.unlimited = unl.checked; save(); toast(unl.checked ? '♾️ Cœurs illimités' : '❤️ Cœurs activés'); render(); };
  var hlx = el('hlx'); if (hlx) hlx.onchange = function () { S.hl = hlx.checked; save(); toast(hlx.checked ? '🖍️ Mise en forme activée' : 'Mise en forme désactivée'); };
  var q = el('q'); if (q) q.onkeyup = function (e) { if (q.value.length >= 2 && (e.key === 'Enter' || q.value.length > 2)) { SQ = q.value; go('/search'); } };
  var q2 = el('q2'); if (q2) { q2.oninput = function () { SQ = q2.value; clearTimeout(q2._t); q2._t = setTimeout(function () { var p = q2.selectionStart; render(); var n = el('q2'); if (n) { n.focus(); n.setSelectionRange(p, p); } }, 350); }; q2.focus(); }
  var flip = el('flip'); if (flip) flip.onclick = function () { doFlip(); };
  if (RUN && RUN.mode === 'exam' && RUN.items[RUN.i]) tickExam();
}
function doFlip() {
  var f = el('flip'); if (!f || f.classList.contains('on')) return;
  f.classList.add('on');
  el('cardbtns').innerHTML = '<div class="srsrow">' +
    '<button class="srsbtn again" data-g="0">Raté</button>' +
    '<button class="srsbtn hard" data-g="3">Dur</button>' +
    '<button class="srsbtn good" data-g="4">Bien</button>' +
    '<button class="srsbtn easy" data-g="5">Facile</button></div>';
  Array.prototype.forEach.call(el('cardbtns').querySelectorAll('[data-g]'), function (b) {
    b.onclick = function () { cardGrade(+b.getAttribute('data-g')); };
  });
}
function anchorSave(text, name) {
  try {
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Sauvegarde exportée');
  } catch (e) { toast('Export impossible sur cet appareil'); }
}
function act(a, b) {
  switch (a) {
    case 'quit':
      clearInterval(EXTIMER);
      if (RUN && RUN.xp > 0) { addXP(RUN.xp); toast('+' + RUN.xp + ' XP conservés'); }
      go('/' + (RUN && RUN.back ? RUN.back : ''));
      break;
    case 'flip': doFlip(); break;
    case 'again': if (RUN) go('/quiz/' + RUN.did + '/' + RUN.ui); break;
    case 'startexam': startExam(); break;
    case 'notify': requestNotifications(); break;
    case 'install': installApp(); break;
    case 'unlimited': S.unlimited = true; save(); toast('♾️ Cœurs illimités activés'); go('/'); break;
    case 'freeplay': {
      var pool = allQuestions(null);
      RUN = { mode: 'review', items: shuffle(pool).slice(0, 15), i: 0, ok: 0, ko: 0, combo: 0, maxCombo: 0, xp: 0, wrong: [], t0: Date.now(), back: '', did: null, ui: null };
      ROOT.innerHTML = quizFrame() + navBar('review'); bind(); break;
    }
    case 'export': {
      var json = JSON.stringify(S), name = 'cnc-anass-progression-' + today() + '.json';
      if (window.claude && typeof window.claude.use === 'function') {
        window.claude.use('downloads').then(function (dl) {
          if (!dl) { anchorSave(json, name); return; }
          dl.save({ filename: name, data: json })
            .then(function () { toast('Sauvegarde enregistrée'); })
            .catch(function (e) {
              if (e && e.code === 'declined') return;
              if (e && (e.code === 'rate_limited')) { toast('Réessaie dans un instant'); return; }
              anchorSave(json, name);
            });
        }).catch(function () { anchorSave(json, name); });
      } else anchorSave(json, name);
      break;
    }
    case 'import': {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          try { var o = JSON.parse(rd.result); if (o && o.v) { S = o; save(); toast('Progression importée'); render(); } else toast('Fichier invalide'); }
          catch (e) { toast('Fichier illisible'); }
        };
        rd.readAsText(f);
      };
      inp.click(); break;
    }
    case 'reset':
      if (confirm('Effacer toute la progression (XP, séries, couronnes, révisions) ?')) { S = blank(); save(); applyTheme(); toast('Progression réinitialisée'); go('/'); render(); }
      break;
  }
}

/* ------------------------------------------------------- fin de session */
var _endWrap = quizEnd;
function quizEndRouter() { return RUN && RUN.mode === 'exam' ? examEnd() : RUN && RUN.mode === 'review' ? reviewEnd() : _endWrap(); }
quizEnd = quizEndRouter;

/* clavier : 1-6 pour répondre, Entrée pour continuer */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { var n = el('next'); if (n) { n.click(); e.preventDefault(); return; } }
  if (/^[1-6]$/.test(e.key)) {
    var opts = ROOT.querySelectorAll('.opt:not([disabled])');
    var i = +e.key - 1; if (opts[i]) opts[i].click();
  }
  if (e.key === ' ') { var f = el('flip'); if (f && !f.classList.contains('on')) { doFlip(); e.preventDefault(); } }
});

/* ------------------------------------------------------------- démarrage */
function boot() {
  ROOT = el('app');
  applyTheme();
  if (!DOCS.length) { ROOT.innerHTML = '<div class="wrap"><div class="card">Aucune donnée chargée. Vérifie que les fichiers du dossier <b>data/</b> sont bien présents à côté de index.html.</div></div>'; return; }
  render();
  dailyReminder();
  setInterval(function () { if ((route()[0] || '') === '' ) { /* rafraîchit les cœurs sur l'accueil */ if (!S.unlimited && S.hearts < HEART_MAX) render(); } }, 60000);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    Promise.resolve().catch(function () { });
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();

</script>
