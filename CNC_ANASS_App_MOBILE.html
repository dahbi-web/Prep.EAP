{t:`RH, formation, digitalisation, accréditation (Ch. VII-IX)`,ic:`💻`,pages:`p.13-15`,
lesson:`<h3>👩‍⚕️ La fonction sanitaire (Ch. VII)</h3>
<p>Création d'une <b>fonction sanitaire</b>, dont le statut est fixé par la <b>loi 09-22</b>. Objectif : valoriser et mettre à niveau les RH du secteur public. Elle détermine : les <b>garanties fondamentales</b> accordées aux RH, leurs <b>droits et devoirs</b>, et le <b>régime de rémunération</b> — en partie fondé sur la <b>corrélation entre rémunération et accomplissement des actes professionnels</b>.</p>
<h3>🎓 Le système de formation — 4 normes</h3>
<p>Formation fondée sur : <b>qualité</b>, <b>efficience</b>, <b>professionnalisme</b>, <b>compétence</b>. Il comprend une <b>formation de base</b> développée, une <b>formation professionnelle</b> et la <b>mise à niveau continue</b> des cadres. Les établissements de formation (public et privé) assurent : formation <b>de base</b>, <b>spécialisée</b> et <b>continue</b>.</p>
<h3>🔬 Recherche</h3>
<p>L'État et les organismes publics et privés encouragent les projets de recherche et les programmes scientifiques spécialisés revêtant un <b>caractère de priorité nationale</b>.</p>
<h3>💻 Digitalisation (Ch. VIII)</h3>
<p><b>1.</b> Création d'un <b>système d'information sanitaire national intégré</b> : suivi et évaluation des performances du système ; collecte des données des établissements publics et privés, de leurs activités et ressources.<br>
<b>2.</b> Création du <b>dossier médical partagé (DMP)</b> au sein de ce système : identification, suivi et évaluation du <b>parcours de soins de chaque patient</b>.</p>
<h3>✅ Accréditation (Ch. IX)</h3>
<p>Institution d'un <b>système d'accréditation des établissements de santé</b> pour l'<b>amélioration continue de la qualité et de la sécurité des soins</b>. Évaluation <b>indépendante</b>, sur la base d'<b>indicateurs, critères et référentiels nationaux</b> établis par la <b>Haute Autorité de Santé</b>.</p>`,

lesson:`<h3>🏢 Deux établissements publics de GESTION</h3>
<p>En application du principe de <b>gestion axée sur les résultats</b> : un établissement chargé des <b>médicaments et produits de santé</b> (loi <b>10-22</b>) et un établissement chargé du <b>sang et de ses dérivés</b> (loi <b>11-22</b>).</p>
<h3>⭐ La Haute Autorité de Santé (HAS) — loi 07-22</h3>
<p>Créée en application du principe de <b>bonne gouvernance</b>. Ses <b>3 missions</b> :</p>
<p>1. <b>Encadrement technique de l'AMO</b> de base (elle <b>remplace l'ANAM</b>)<br>
2. <b>Évaluation de la qualité</b> des prestations des établissements de santé<br>
3. <b>Avis</b> sur les politiques publiques en matière de santé</p>
<h3>🏘️ Les Groupements Sanitaires Territoriaux (GST) — loi 08-22</h3>
<p>Chargés de la <b>mise en œuvre de la politique de l'État</b> en matière de santé <b>au niveau régional</b>. Chaque groupement <b>comprend tous les établissements de santé publics</b> situés dans son ressort territorial. Il établit aussi la <b>carte sanitaire régionale</b>.</p>

{t:`Définitions et concepts de base`,ic:`📖`,pages:`p.2-3`,
lesson:`<h3>📖 Les définitions clés</h3>
<p><b>Mac Mahon</b> (la plus reconnue) : « <b>l'étude de la distribution et des déterminants de la fréquence des maladies chez l'Homme</b> ». Ses <b>3 mots clés</b> — <b>fréquence, distribution, déterminants</b> — englobent toute la démarche épidémiologique.</p>
<p><b>OMS (1968)</b> : « une étude de la <b>distribution des maladies et des invalidités</b> dans les populations humaines, ainsi que des <b>influences qui déterminent cette distribution</b> ».</p>
<p>👉 L'épidémiologie étudie des <b>groupes</b> et non des individus, porte sur les personnes <b>en bonne santé comme malades</b>, et <b>mesure et compare</b>.</p>
<h3>🧪 Les 2 hypothèses de l'épidémiologie moderne</h3>
<p>1. L'état de santé chez l'Homme <b>n'est pas dû au hasard</b>.<br>
2. Les phénomènes de santé ont des <b>facteurs étiologiques et préventifs identifiables</b> par des investigations dans la population générale ou chez des groupes, à des <b>lieux et périodes différents</b>.</p>
<h3>🧩 Les concepts</h3>
<p><b>Fréquence</b> : expression sous forme de taux, ratios, proportions.<br>
<b>Distribution</b> : occurrence des problèmes de santé et variation selon le <b>temps, l'espace et les caractéristiques sociodémographiques</b>.<br>
<b>Déterminant</b> : facteurs <b>environnementaux</b>, liés aux <b>modes de vie</b> ou <b>biologiques</b>.<br>
<b>Événement de santé</b> : maladie ou dysfonctionnement de l'organisme.<br>
<b>Facteur de risque</b> : tout <b>attribut, caractéristique ou exposition</b> qui <b>augmente la probabilité</b> de développer une maladie ou de subir un traumatisme.</p>
<h3>⚠️ Événements indésirables</h3>
<p><b>EI</b> : événement non souhaité pouvant affecter la santé, la sécurité d'une personne ou le bon fonctionnement d'un établissement (les <b>infections associées aux soins</b> en font partie).<br>
<b>EI grave</b> : dysfonctionnement grave de gestion ou d'organisation menaçant la santé, la sécurité ou le bien-être physique ou moral des personnes prises en charge.<br>
<b>EIG associé aux soins</b> : événement <b>inattendu</b> au regard de l'état de santé, dont les conséquences sont le <b>décès</b>, la <b>mise en jeu du pronostic vital</b>, ou la survenue probable d'un <b>déficit fonctionnel permanent</b> (y compris anomalie ou malformation congénitale).</p>`,
qs:[
{q:`La définition la plus reconnue de l'épidémiologie est celle de :`,o:[`L'OMS`,`Mac Mahon`,`Alexander Langmuir`,`Alma-Ata`],c:1,e:`Mac Mahon : « l'étude de la distribution et des déterminants de la fréquence des maladies chez l'Homme ».`},
{q:`Les 3 mots clés de la définition de Mac Mahon sont :`,o:[`Fréquence, distribution, déterminants`,`Personne, lieu, temps`,`Prévention, soins, réadaptation`,`Incidence, prévalence, mortalité`],c:0,e:`Fréquence, distribution et déterminants — ils englobent tous les principes et méthodes de la démarche épidémiologique.`},
{q:`En quelle année l'OMS a-t-elle défini l'épidémiologie comme étude de la distribution des maladies et des invalidités ?`,o:[`1948`,`1963`,`1968`,`1978`],c:2,e:`OMS, 1968.`},
{q:`Une des deux hypothèses fondamentales de l'épidémiologie moderne est :`,o:[`L'état de santé chez l'Homme n'est pas dû au hasard`,`Toutes les maladies sont génétiques`,`Le hasard explique la maladie`,`La santé dépend uniquement des soins`],c:0,e:`Deux hypothèses : l'état de santé n'est pas dû au hasard ; les facteurs étiologiques et préventifs peuvent être identifiés par des investigations.`},
{q:`Un facteur de risque est :`,o:[`Une maladie déclarée`,`Tout attribut, caractéristique ou exposition augmentant la probabilité de développer une maladie`,`Un traitement préventif`,`Un signe clinique`],c:1,e:`Facteur de risque : attribut, caractéristique ou exposition qui augmente la probabilité de développer une maladie ou de souffrir d'un traumatisme.`},
{q:`L'épidémiologie s'intéresse :`,o:[`Aux seuls malades`,`Aux individus en bonne santé et aux individus malades`,`Aux seuls sujets sains`,`Aux seuls professionnels de santé`],c:1,e:`Elle étudie des groupes de personnes : l'analyse porte sur les individus en bonne santé et sur ceux frappés par la maladie.`},
{q:`Les conséquences d'un événement indésirable grave associé aux soins comprennent :`,o:[`Le décès, la mise en jeu du pronostic vital ou un déficit fonctionnel permanent probable`,`Une simple gêne`,`Un retard de rendez-vous`,`Une erreur administrative`],c:0,e:`EIG associé aux soins : événement inattendu dont les conséquences sont le décès, la mise en jeu du pronostic vital ou la survenue probable d'un déficit fonctionnel permanent (y compris malformation congénitale).`},
{q:`Les infections associées aux soins sont considérées comme :`,o:[`Des événements indésirables`,`Des complications normales`,`Des endémies`,`Des facteurs de protection`],c:0,e:`Elles peuvent être considérées comme des événements indésirables.`}
],

/* U2 */
{t:`Fonctions et objectifs de l'épidémiologie`,ic:`🎯`,pages:`p.3-4`,
lesson:`<h3>🖐️ Les 5 fonctions de l'épidémiologie</h3>
<p>1. La <b>surveillance épidémiologique</b><br>
2. La <b>mesure de l'importance</b> des problèmes de santé<br>
3. La <b>recherche étiologique</b><br>
4. L'<b>identification des groupes à risque élevé</b><br>
5. L'<b>évaluation de la santé</b></p>
<h3>🎯 Objectifs</h3>
<p>L'épidémiologie permet de <b>recueillir, interpréter et utiliser</b> l'information sur les problèmes de santé. Ses objectifs généraux : <b>promotion de la santé</b> et <b>réduction des problèmes de santé</b>. Pour cela :</p>
<p>• <b>Surveiller l'état de santé</b> pour : détecter une <b>épidémie</b>, identifier une <b>nouvelle maladie</b>, décrire les <b>risques</b> auxquels une population est exposée<br>
• <b>Rechercher les causes</b> des affections<br>
• <b>Évaluer l'importance</b> d'un problème<br>
• <b>Formuler des hypothèses et les vérifier</b><br>
• <b>Évaluer les soins</b> (techniques diagnostiques et de dépistage, traitements, programmes de santé)<br>
• <b>Évaluer les progrès</b> par la chute de la mortalité ou de la morbidité<br>
• Contribuer à une <b>organisation rationnelle et efficace</b> des services de santé<br>
• Appliquer la <b>médecine préventive</b></p>
<h3>👥 Les 2 approches</h3>
<p><b>Approche clinique</b> : le clinicien s'intéresse au patient <b>individuellement</b>, diagnostique et traite la maladie comme <b>phénomène pathologique</b>. Seule, elle <b>ne suffit pas</b> à contrôler les phénomènes de santé.<br>
<b>Approche épidémiologique</b> : l'épidémiologiste s'intéresse à <b>l'ensemble de la population</b>, avec une approche <b>probabiliste</b> de la maladie comme <b>phénomène de masse</b>.</p>
<div class="tip">Le clinicien pose un <b>diagnostic</b> ; l'épidémiologiste pose une <b>hypothèse</b> — tous deux cherchent ensuite à la confirmer.</div>`,
qs:[
{q:`Combien de fonctions l'épidémiologie remplit-elle ?`,o:[`3`,`4`,`5`,`7`],c:2,e:`5 fonctions : surveillance, mesure de l'importance des problèmes, recherche étiologique, identification des groupes à risque élevé, évaluation de la santé.`},
{q:`L'identification des groupes à risque élevé est :`,o:[`Une fonction de l'épidémiologie`,`Un objectif de la surveillance uniquement`,`Une étape d'investigation`,`Une mesure de fréquence`],c:0,e:`C'est la 4e des 5 fonctions de l'épidémiologie.`},
{q:`Dans l'approche épidémiologique, la maladie est envisagée comme :`,o:[`Un phénomène pathologique individuel`,`Un phénomène de masse, avec une approche probabiliste`,`Un problème administratif`,`Un cas isolé`],c:1,e:`L'épidémiologiste s'intéresse à l'ensemble de la population avec une approche probabiliste de la maladie en tant que phénomène de masse.`},
{q:`Le clinicien pose ___ alors que l'épidémiologiste pose ___ :`,o:[`Une hypothèse / un diagnostic`,`Un diagnostic / une hypothèse`,`Un pronostic / un diagnostic`,`Un traitement / une prévention`],c:1,e:`Le clinicien pose une tentative de diagnostic ; l'épidémiologiste pose une hypothèse.`},
{q:`Les objectifs généraux de l'épidémiologie sont :`,o:[`La promotion de la santé et la réduction des problèmes de santé`,`Le soin et la guérison`,`La formation et la recherche`,`Le financement des soins`],c:0,e:`Recueillir, interpréter et utiliser l'information sur les problèmes de santé, en vue de la promotion de la santé et de la réduction des problèmes de santé.`},
{q:`Surveiller l'état de santé permet notamment :`,o:[`De détecter une épidémie et d'identifier une nouvelle maladie`,`De soigner les patients`,`De fixer les budgets`,`De former le personnel`],c:0,e:`Détecter une épidémie, identifier une nouvelle maladie, décrire les risques auxquels la population est exposée.`},
{q:`L'approche clinique seule :`,o:[`Suffit à contrôler les phénomènes de santé`,`N'est pas suffisante pour contrôler les phénomènes de santé`,`Remplace l'épidémiologie`,`Est interdite`],c:1,e:`Seule, l'approche clinique n'est pas suffisante pour contrôler les phénomènes de santé.`}
],
cards:[
{f:`Les 5 fonctions de l'épidémiologie`,b:`Surveillance épidémiologique · mesure de l'importance des problèmes · recherche étiologique · identification des <b>groupes à risque élevé</b> · évaluation de la santé`},
{f:`Approche clinique vs approche épidémiologique`,b:`<b>Clinique</b> : patient individuel, maladie = phénomène pathologique · <b>Épidémiologique</b> : population entière, approche <b>probabiliste</b>, maladie = phénomène de masse`},
{f:`Objectifs généraux de l'épidémiologie`,b:`<b>Promotion de la santé</b> et <b>réduction des problèmes de santé</b>, en recueillant, interprétant et utilisant l'information`}
]},

/* U3 */
{t:`Épidémie, endémie, pandémie, cas sporadiques`,ic:`🌍`,pages:`p.5`,
lesson:`<h3>🔥 Épidémie</h3>
<p><b>Augmentation inhabituelle et soudaine</b> du nombre de cas d'une maladie dans une population ou une <b>région délimitée</b> ; atteinte <b>brusque et massive</b> par une maladie infectieuse, avec une fréquence <b>clairement en excès</b> par rapport à l'habitude.</p>
<h3>📍 Endémie</h3>
<p>Présence <b>habituelle</b> d'une maladie à une <b>fréquence importante et constante</b> dans une région ou une communauté. Ex. : <b>tuberculose au Maroc</b>, <b>paludisme en Afrique subsaharienne</b>.</p>
<h3>🌐 Pandémie</h3>
<p>Une maladie <b>épidémique sans frontières</b> : épidémie touchant de <b>très larges populations</b> (continentale ou mondiale). Ex. : <b>COVID-19</b>.</p>
<h3>🔹 Cas sporadiques</h3>
<p>Maladie survenant par <b>cas isolés</b>, souvent <b>sans lien entre eux</b>, par opposition aux cas endémiques ou épidémiques.</p>
<h3>🧮 Le tableau qui tombe au concours</h3>
<table><tr><th>Type</th><th>Temps</th><th>Espace</th></tr>
<tr><td><b>Épidémie</b></td><td>Limité</td><td>Limité</td></tr>
<tr><td><b>Endémie</b></td><td><b>Illimité</b></td><td>Limité</td></tr>
<tr><td><b>Pandémie</b></td><td>Limité</td><td><b>Illimité</b></td></tr></table>
<div class="warn">⚠️ Retenir : <b>endémie = temps illimité</b> (elle dure) · <b>pandémie = espace illimité</b> (elle voyage) · <b>épidémie = les deux limités</b>.</div>`,
qs:[
{q:`Une endémie se caractérise par un temps ___ et un espace ___ :`,o:[`Limité / limité`,`Illimité / limité`,`Limité / illimité`,`Illimité / illimité`],c:1,e:`Endémie : temps illimité, espace limité (présence habituelle et constante dans une région).`},
{q:`Une pandémie se caractérise par un temps ___ et un espace ___ :`,o:[`Limité / illimité`,`Illimité / limité`,`Limité / limité`,`Illimité / illimité`],c:0,e:`Pandémie : temps limité, espace illimité — elle ne connaît pas de frontière.`},
{q:`L'épidémie se définit par :`,o:[`Une augmentation inhabituelle et soudaine du nombre de cas`,`Une présence constante et habituelle`,`Des cas isolés sans lien`,`Une extension mondiale`],c:0,e:`Augmentation inhabituelle et soudaine des cas dans une population ou une région délimitée, en excès clair par rapport à la fréquence habituelle.`},
{q:`La tuberculose au Maroc est un exemple de :`,o:[`Épidémie`,`Endémie`,`Pandémie`,`Cas sporadiques`],c:1,e:`Présence habituelle à fréquence importante et constante = endémie.`},
{q:`Le COVID-19 est cité comme exemple de :`,o:[`Endémie`,`Pandémie`,`Cas sporadiques`,`Maladie professionnelle`],c:1,e:`Pandémie : épidémie touchant de très larges populations, à caractère continental ou mondial.`},
{q:`Des cas isolés, souvent sans lien entre eux, sont dits :`,o:[`Épidémiques`,`Endémiques`,`Sporadiques`,`Pandémiques`],c:2,e:`Cas sporadiques : apparition d'un nombre de cas d'une même maladie de temps à autre, sans lien.`},
{q:`Une épidémie se caractérise par :`,o:[`Un temps et un espace tous deux limités`,`Un temps illimité`,`Un espace illimité`,`Aucune limite`],c:0,e:`Épidémie : temps limité et espace limité.`}
],
cards:[
{f:`Tableau temps / espace`,b:`<b>Épidémie</b> : temps limité, espace limité · <b>Endémie</b> : temps <b>illimité</b>, espace limité · <b>Pandémie</b> : temps limité, espace <b>illimité</b>`},
{f:`Définition de l'endémie`,b:`Présence <b>habituelle</b> d'une maladie à une fréquence <b>importante et constante</b> dans une région (ex. tuberculose au Maroc, paludisme en Afrique subsaharienne)`},
{f:`Définition des cas sporadiques`,b:`Maladie survenant par <b>cas isolés</b>, souvent sans lien entre eux`}
]},

{t:`Prophylaxie et niveaux de prévention`,ic:`🛡️`,pages:`p.6`,
lesson:`<h3>🧴 Prophylaxie et prévention</h3>
<p><b>Prophylaxie</b> : ensemble des actions visant à <b>éviter ou diminuer le nombre et la gravité des maladies</b>, à éviter ou diminuer les <b>facteurs de risque</b>, <b>en amont</b> de la médecine curative.<br>
<b>Prévention</b> : ensemble des mesures visant à éviter ou réduire le nombre et la gravité des <b>maladies, accidents et handicaps</b>.</p>
<h3>1️⃣ Prévention primaire</h3>
<p>Réduire l'<b>INCIDENCE</b> : minimiser l'apparition de <b>nouveaux cas</b> dans une population <b>saine</b> en réduisant les causes et facteurs de risque → <b>action de promotion de la santé</b>.</p>
<h3>2️⃣ Prévention secondaire</h3>
<p>Arrêter ou retarder la progression de la maladie par le <b>dépistage précoce</b> et un <b>traitement adapté</b> → réduit la <b>PRÉVALENCE</b> (nombre de cas existants) et le risque de récidive et de chronicité → <b>action de dépistage et de traitement</b>.</p>
<h3>3️⃣ Prévention tertiaire</h3>
<p>Mise en œuvre <b>après l'apparition</b> de la maladie pour <b>minimiser les dommages</b> qu'elle cause → <b>action de réhabilitation</b>.</p>
<h3>4️⃣ Prévention quaternaire</h3>
<p>Repérer les patients et populations à risque de <b>surmédicalisation</b>, les <b>protéger des interventions invasives</b> et leur proposer des procédures de soins <b>éthiques et médicalement appropriées</b>.</p>
<div class="tip">Mnémo : <b>1aire → incidence</b> (promotion) · <b>2aire → prévalence</b> (dépistage) · <b>3aire → séquelles</b> (réhabilitation) · <b>4aire → surmédicalisation</b>.</div>`,
qs:[
{q:`La prévention primaire vise à réduire :`,o:[`La prévalence`,`L'incidence`,`La létalité`,`La mortalité infantile`],c:1,e:`Prévention primaire : réduire l'incidence en minimisant l'apparition de nouveaux cas dans une population saine.`},
{q:`La prévention secondaire repose sur :`,o:[`La promotion de la santé`,`Le dépistage précoce et le traitement adapté`,`La réhabilitation`,`La lutte contre la surmédicalisation`],c:1,e:`Elle arrête ou retarde la progression de la maladie et réduit la prévalence, les récidives et la chronicité.`},
{q:`L'action de réhabilitation correspond à la prévention :`,o:[`Primaire`,`Secondaire`,`Tertiaire`,`Quaternaire`],c:2,e:`Prévention tertiaire : après l'apparition de la maladie, minimiser les dommages — action de réhabilitation.`},
{q:`La prévention quaternaire protège les patients :`,o:[`Des épidémies`,`De la surmédicalisation et des interventions invasives`,`Des accidents du travail`,`Des maladies génétiques`],c:1,e:`Elle repère les patients à risque de surmédicalisation et propose des soins éthiques et médicalement appropriés.`},
{q:`La prophylaxie se situe :`,o:[`En amont de la médecine curative`,`Après le traitement`,`Pendant l'hospitalisation`,`À la place du dépistage`],c:0,e:`Ensemble des actions visant à éviter ou diminuer maladies et facteurs de risque, en amont de la médecine curative.`},
{q:`Quelle prévention est appelée « action de promotion de la santé » ?`,o:[`Primaire`,`Secondaire`,`Tertiaire`,`Quaternaire`],c:0,e:`La prévention primaire est l'action de promotion de la santé.`},
{q:`La prévention secondaire contribue à réduire :`,o:[`Le nombre de cas existants (prévalence)`,`Le nombre de nouveaux cas uniquement`,`La natalité`,`La surmédicalisation`],c:0,e:`Elle réduit le nombre de cas existants et vise à minimiser le risque de récidive et de chronicité.`}
],
cards:[
{f:`Les 4 niveaux de prévention`,b:`<b>1aire</b> : réduire l'<b>incidence</b> (promotion) · <b>2aire</b> : dépistage précoce, réduit la <b>prévalence</b> · <b>3aire</b> : réhabilitation, minimise les dommages · <b>4aire</b> : protéger de la <b>surmédicalisation</b>`},
{f:`Prophylaxie`,b:`Ensemble des actions visant à éviter ou diminuer le nombre et la gravité des maladies et les facteurs de risque, <b>en amont</b> de la médecine curative`}
]},

{t:`Classification des études épidémiologiques`,ic:`🗂️`,pages:`p.6-7`,
lesson:`<h3>🗃️ Trois paramètres de classification</h3>
<p>Selon l'<b>objectif</b> de l'étude · selon le <b>temps</b> · selon l'<b>élément de départ</b>.</p>
<h3>a) Selon l'objectif</h3>
<p><b>Épidémiologie DESCRIPTIVE</b> : mesure la <b>fréquence</b> des phénomènes de santé et leur <b>distribution</b> selon <b>personne, lieu, temps</b> ; permet de <b>formuler des hypothèses</b>.<br>
<b>Épidémiologie ANALYTIQUE</b> : recherche les <b>déterminants</b> (facteurs de risque ou de protection), à partir des hypothèses issues de la descriptive.</p>
<p>👉 La <b>formulation des hypothèses</b> est le <b>passage</b> entre l'épidémiologie descriptive et l'épidémiologie analytique.</p>
<h3>b) Selon le domaine</h3>
<p>Maladies infectieuses · maladies non infectieuses · <b>hospitalière</b> · <b>clinique</b> · <b>évaluative</b> · <b>génétique</b> · <b>environnementale</b>.</p>
<h3>c) Selon la chronologie (le temps)</h3>
<p><b>Rétrospective</b> : s'intéresse aux <b>conditions passées</b> du groupe.<br>
<b>Transversale (ou de prévalence)</b> : conditions du groupe <b>au moment précis</b> de l'étude.<br>
<b>Prospective</b> : le groupe est <b>suivi dans le futur</b>.</p>
<h3>d) Selon l'élément de départ</h3>
<p><b>Cas ou série de cas</b> : études descriptives les plus <b>élémentaires</b>, observation clinique détaillée de patients présentant un phénomène <b>inhabituel</b> — utiles pour formuler des hypothèses et identifier de <b>nouvelles épidémies</b>.<br>
<b>Corrélation (écologique)</b> : données collectées sur la <b>population générale</b>, non sur les individus ; unités d'analyse = <b>populations entières</b> (nations) ou groupes (régions) → on compare des populations.<br>
<b>Cohorte</b> : on part de l'<b>EXPOSITION</b>, puis on cherche l'<b>ISSUE</b>.<br>
<b>Cas-témoins</b> : on part de l'<b>ISSUE</b> (malades / non malades), puis on cherche l'<b>EXPOSITION</b>.</p>
<div class="warn">⚠️ La question tombe presque toujours : <b>cohorte = exposition → issue</b> ; <b>cas-témoins = issue → exposition</b>.</div>`,
qs:[
{q:`Dans une étude de cohorte, on part de :`,o:[`L'issue puis on cherche l'exposition`,`L'exposition puis on cherche l'issue`,`Des populations entières`,`Des cas isolés`],c:1,e:`Cohorte : on détermine d'abord l'EXPOSITION, puis on cherche l'ISSUE.`},
{q:`Dans une étude cas-témoins, on part de :`,o:[`L'exposition puis on cherche l'issue`,`L'issue puis on cherche l'exposition`,`Des données agrégées`,`Une intervention`],c:1,e:`Cas-témoins : on repère d'abord les malades (cas) et les non-malades (témoins), puis on détermine leur exposition.`},
{q:`L'étude dont les unités d'analyse sont des populations entières est l'étude :`,o:[`De cohorte`,`Cas-témoins`,`De corrélation (écologique)`,`De série de cas`],c:2,e:`Étude de corrélation ou écologique : informations collectées sur la population générale, comparaison entre populations et non entre individus.`},
{q:`Le passage entre épidémiologie descriptive et analytique se fait par :`,o:[`La collecte des données`,`La formulation des hypothèses`,`Le traitement statistique`,`La publication`],c:1,e:`La formulation des hypothèses est le passage entre les deux.`},
{q:`L'épidémiologie descriptive mesure la distribution selon :`,o:[`Personne, lieu et temps`,`Cause, effet et risque`,`Exposition et issue`,`Sensibilité et spécificité`],c:0,e:`Fréquence et distribution selon les caractéristiques de personne, de lieu et de temps.`},
{q:`Une étude qui s'intéresse aux conditions du groupe au moment précis de l'étude est dite :`,o:[`Rétrospective`,`Transversale (ou de prévalence)`,`Prospective`,`Longitudinale`],c:1,e:`Étude transversale ou de prévalence.`},
{q:`Les études de série de cas sont utiles pour :`,o:[`Prouver une causalité`,`Formuler des hypothèses et identifier de nouvelles épidémies ou maladies`,`Mesurer un risque relatif`,`Évaluer un traitement`],c:1,e:`Ce sont les études descriptives les plus élémentaires, très utiles pour formuler des hypothèses et identifier de nouvelles épidémies ou maladies.`},
{q:`L'épidémiologie analytique recherche :`,o:[`La fréquence des maladies`,`Les déterminants : facteurs de risque ou de protection`,`La distribution géographique`,`Les caractéristiques de personne`],c:1,e:`Elle recherche les déterminants des phénomènes de santé, à partir des hypothèses issues de l'épidémiologie descriptive.`}
],
cards:[
{f:`Cohorte vs cas-témoins`,b:`<b>Cohorte</b> : EXPOSITION → ISSUE · <b>Cas-témoins</b> : ISSUE → EXPOSITION`},
{f:`Descriptive vs analytique`,b:`<b>Descriptive</b> : fréquence et distribution (personne, lieu, temps), <b>formule</b> les hypothèses · <b>Analytique</b> : recherche les <b>déterminants</b>, teste les hypothèses`},
{f:`Étude écologique (de corrélation)`,b:`Données collectées sur la <b>population générale</b> ; unités d'analyse = populations entières ou groupes de populations — on compare des <b>populations</b>, pas des individus`},
{f:`Classification selon le temps`,b:`<b>Rétrospective</b> (passé) · <b>Transversale</b> = de prévalence (instant) · <b>Prospective</b> (futur)`}
]},

/* U6 */
{t:`Études et enquêtes : cohorte, cas-témoins, enquêtes`,ic:`🔬`,pages:`p.8-11`,
lesson:`<h3>📋 Les 3 grandes familles d'études</h3>
<p><b>Descriptives</b> : décrire l'état sanitaire en quantifiant l'importance des problèmes — mesurer la <b>prévalence</b>, l'<b>incidence</b> ou la <b>mortalité</b>.<br>
<b>Écologiques</b> : données <b>agrégées</b> au niveau d'une population ; variations dans l'<b>espace</b> (étude géographique) ou dans le <b>temps</b> (étude temporelle, dite aussi <b>série chronologique</b>), à des fins de <b>veille sanitaire</b>.<br>
<b>Analytiques</b> : rechercher les excès de maladies et analyser les facteurs influençant l'incidence ; comparaisons exprimées par un <b>risque relatif (RR)</b> ou un <b>odds-ratio (OR)</b>.</p>
<h3>👥 L'étude de cohorte (« exposés / non exposés »)</h3>
<p>Comparer l'<b>incidence</b> d'une pathologie entre un groupe <b>exposé</b> et un groupe <b>non exposé</b>. Elle peut être <b>prospective</b> (suivi de sujets sains) ou <b>rétrospective / historique</b> (recueil a posteriori, registres). La <b>date de point</b> est l'instant « t » où l'équipe décide d'<b>arrêter le suivi</b> pour l'analyse statistique.</p>
<h3>🔍 L'étude cas-témoins (« maladie / non maladie »)</h3>
<p>Comparer la <b>fréquence de l'exposition</b> chez les malades (cas) et chez les non-malades (témoins), <b>après appariement</b>. L'<b>appariement</b> consiste à sélectionner les témoins selon leurs <b>similitudes</b> avec les cas (âge, sexe…) afin que l'association observée ne soit pas due à ces facteurs. C'est une étude <b>rétrospective</b>.</p>
<h3>📝 Les enquêtes</h3>
<p><b>Enquête de prévalence (transversale)</b> : « <b>instantané photographique</b> » d'un facteur ou d'une maladie à un moment précis ; <b>court terme</b>. Permet d'évaluer la fréquence, de <b>définir un groupe à risque</b> et d'orienter les programmes de santé publique.<br>
<b>Enquête d'incidence (longitudinale)</b> : suivi d'une population ou cohorte sur une période, un même individu étant enquêté <b>plusieurs fois</b> ; évalue l'évolution d'une maladie et l'<b>impact des mesures préventives</b> ; <b>long terme</b>.<br>
<b>Enquêtes analytiques (étiologiques)</b> : toujours <b>comparatives, descriptives et longitudinales</b> — exposés/non exposés (<b>prospectives</b>) et cas-témoins (<b>rétrospectives</b>).<br>
<b>Enquêtes évaluatives ou expérimentales</b> : évaluer les interventions de prévention (enquête en <b>aveugle ou double aveugle</b>).</p>`,
qs:[
{q:`La « date de point » dans une étude de cohorte est :`,o:[`Le début du suivi`,`L'instant où l'on arrête de suivre la cohorte pour l'analyse`,`La date du diagnostic`,`La date de publication`],c:1,e:`Date de point : instant « t » où l'équipe de recherche décide d'arrêter le suivi pour mener son analyse statistique.`},
{q:`L'appariement dans une étude cas-témoins consiste à :`,o:[`Sélectionner les témoins selon leurs similitudes avec les cas (âge, sexe…)`,`Doubler l'échantillon`,`Randomiser les traitements`,`Comparer deux périodes`],c:0,e:`Il garantit que l'association observée entre exposition et maladie n'est pas due à ces facteurs.`},
{q:`Les études analytiques expriment la relation exposition-maladie par :`,o:[`Un risque relatif (RR) ou un odds-ratio (OR)`,`Un taux d'attaque`,`Une prévalence`,`Une espérance de vie`],c:0,e:`Les comparaisons reposent sur l'analyse de la relation sous forme de RR ou d'OR.`},
{q:`L'enquête de prévalence est décrite comme :`,o:[`Un instantané photographique`,`Un film continu`,`Une expérimentation`,`Une étude de cohorte`],c:0,e:`Enquête transversale = instantané photographique d'un facteur ou d'une maladie à un moment précis, à court terme.`},
{q:`L'enquête longitudinale (d'incidence) permet notamment :`,o:[`D'évaluer l'évolution d'une maladie et l'impact des mesures préventives`,`De photographier la situation à un instant`,`De comparer deux nations`,`De poser un diagnostic clinique`],c:0,e:`Elle suit une population ou une cohorte, un même individu étant enquêté plusieurs fois ; elle se pratique à long terme.`},
{q:`Une étude de cohorte peut être :`,o:[`Uniquement prospective`,`Prospective ou rétrospective (historique)`,`Uniquement rétrospective`,`Uniquement transversale`],c:1,e:`Prospective (suivi de sujets sains) ou rétrospective/historique (recueil a posteriori, registres).`},
{q:`L'étude écologique par série chronologique analyse les variations :`,o:[`Dans le temps`,`Entre individus`,`Entre cas et témoins`,`Entre traitements`],c:0,e:`Étude temporelle, dite par série chronologique : variations de fréquence dans le temps, mises en relation avec des facteurs environnementaux.`},
{q:`Les enquêtes évaluatives ou expérimentales utilisent notamment :`,o:[`L'aveugle ou le double aveugle`,`L'appariement`,`La date de point`,`La corrélation écologique`],c:0,e:`Elles évaluent les interventions de prévention, par exemple en aveugle ou en double aveugle.`},
{q:`L'étude cas-témoins est par nature :`,o:[`Prospective`,`Rétrospective`,`Transversale`,`Expérimentale`],c:1,e:`La caractérisation de l'exposition se fait une fois le diagnostic connu : c'est une étude rétrospective.`}
],
cards:[
{f:`Étude de cohorte`,b:`Compare l'<b>incidence</b> entre <b>exposés</b> et <b>non exposés</b> ; peut être <b>prospective</b> ou <b>rétrospective (historique)</b> ; <b>date de point</b> = arrêt du suivi pour l'analyse`},
{f:`Appariement (cas-témoins)`,b:`Sélectionner les <b>témoins</b> selon leurs <b>similitudes</b> avec les cas (âge, sexe…) pour que l'association ne soit pas due à ces facteurs`},
{f:`Enquête transversale vs longitudinale`,b:`<b>Transversale</b> (prévalence) : instantané photographique, court terme · <b>Longitudinale</b> (incidence) : suivi répété, long terme, évalue l'impact des mesures préventives`},
{f:`Mesures d'association des études analytiques`,b:`<b>Risque relatif (RR)</b> et <b>odds-ratio (OR)</b>`}
]},

/* U7 */
{t:`Mesures de fréquence et démarche épidémiologique`,ic:`🧮`,pages:`p.12-14`,
lesson:`<h3>🧭 Les 3 notions fondamentales</h3>
<p><b>Fréquence</b> : quantification de la survenue ou de l'existence du phénomène.<br>
<b>Distribution</b> : répond à <b>QUI</b> (personne), <b>OÙ</b> (lieu), <b>QUAND</b> (temps).<br>
<b>Déterminants</b> : répondent à la 4e question, <b>POURQUOI</b> cette distribution → formulation puis test des hypothèses.</p>
<h3>➗ Ratio, proportion, taux</h3>
<p><b>Ratio</b> : rapport de deux classes d'une même variable, le numérateur <b>n'est pas compris</b> dans le dénominateur (x/y).<br>
<b>Proportion</b> : rapport où le numérateur <b>est compris</b> dans le dénominateur, exprimé en % : A/(A+B) × 100.<br>
<b>Taux</b> : proportion particulière renfermant la notion de <b>TEMPS</b> ; il exprime la <b>VITESSE</b> de changement d'un phénomène.</p>
<h3>📊 Morbidité</h3>
<p><b>Prévalence</b> : fréquence des <b>cas existants</b> (récents + anciens) à un <b>moment donné</b>. C'est un indicateur <b>statique</b> et, en réalité, une <b>proportion</b> — l'expression « taux de prévalence » est un <b>abus de langage</b>.<br>
&nbsp;&nbsp;• <b>Prévalence instantanée</b> : cas existants à un instant précis — la mesure <b>la plus utilisée</b>.<br>
&nbsp;&nbsp;• <b>Prévalence de période</b> : cas existants au début de la période <b>+</b> nouveaux cas de la période, sur l'effectif moyen — <b>d'aucune utilité pratique</b>.<br>
<b>Incidence</b> : <b>nouveaux cas</b> survenus dans une population à risque durant un <b>intervalle de temps</b> ; mesure <b>dynamique</b> de la <b>vitesse</b> de survenue.<br>
&nbsp;&nbsp;• <b>Incidence cumulée (IC)</b> : <b>proportion</b> des personnes devenant malades au cours d'une période = <b>probabilité (risque)</b> qu'un sujet sain devienne malade.<br>
&nbsp;&nbsp;• <b>Taux d'incidence (TI) = densité d'incidence (DI)</b> : <b>vitesse</b> de propagation dans une population exposée.<br>
<b>Taux d'attaque</b> : personnes ayant contracté la maladie / personnes <b>à risque</b>.</p>
<h3>⚰️ Mortalité</h3>
<p><b>Taux de létalité</b> = décès dus à la maladie / <b>nombre total de malades</b> de la même période.<br>
<b>Taux brut de mortalité</b> = décès de la période / <b>effectif moyen de la population</b> — c'est une <b>proportion de décès</b>.</p>
<h3>🎲 Le risque</h3>
<p><b>Risque</b> : probabilité qu'un événement de santé survienne dans une population donnée à un moment donné ; les mesures de risque permettent d'évaluer une <b>association</b> entre un facteur de risque et la survenue d'une maladie.</p>`,
qs:[
{q:`« Taux de prévalence » est un abus de langage car la prévalence est :`,o:[`Un ratio`,`Une proportion`,`Un indice`,`Une moyenne`],c:1,e:`La prévalence est un indicateur statique et une proportion : elle n'exprime pas la vitesse de changement dans le temps.`},
{q:`La mesure de prévalence la plus utilisée est :`,o:[`La prévalence de période`,`La prévalence instantanée`,`L'incidence cumulée`,`Le taux d'attaque`],c:1,e:`La prévalence instantanée (cas existants à un instant précis) est la plus utilisée ; la prévalence de période est d'aucune utilité pratique.`},
{q:`L'incidence cumulée correspond :`,o:[`À la vitesse de propagation`,`À la probabilité (risque) qu'un sujet sain devienne malade durant une période`,`Au nombre total de cas`,`Au nombre de décès`],c:1,e:`IC : proportion des personnes qui deviennent malades au cours d'une période = risque individuel.`},
{q:`Le taux d'incidence est aussi appelé :`,o:[`Incidence cumulée`,`Densité d'incidence`,`Taux d'attaque`,`Prévalence de période`],c:1,e:`Taux d'incidence (TI) = densité d'incidence (DI) : vitesse de propagation de la maladie dans une population exposée.`},
{q:`Dans un ratio, le numérateur :`,o:[`Est compris dans le dénominateur`,`N'est pas compris dans le dénominateur`,`Est toujours 1`,`Est un temps`],c:1,e:`Ratio : rapport de deux classes d'une même variable, numérateur non compris dans le dénominateur.`},
{q:`Ce qui distingue le taux de la proportion, c'est :`,o:[`La notion de temps et l'expression d'une vitesse`,`L'absence d'unité`,`La comparaison de deux variables`,`L'usage du pourcentage`],c:0,e:`Le taux est une proportion particulière renfermant la notion de temps ; il exprime la vitesse de changement d'un phénomène.`},
{q:`Les 3 questions auxquelles répond la distribution sont :`,o:[`Qui, où, quand`,`Qui, quoi, comment`,`Où, quand, pourquoi`,`Quoi, pourquoi, combien`],c:0,e:`QUI (personne), OÙ (lieu), QUAND (temps) ; les déterminants répondent au POURQUOI.`},
{q:`La prévalence de période comprend au numérateur :`,o:[`Uniquement les nouveaux cas`,`Les cas existants au début de la période plus les nouveaux cas`,`Uniquement les anciens cas`,`Les décès`],c:1,e:`Numérateur = cas existants au début + nouveaux cas de la période ; dénominateur = effectif moyen de la population.`},
{q:`Le dénominateur du taux de létalité (épidémiologie) est :`,o:[`Le nombre total de malades pendant la période`,`La population totale`,`Le nombre de décès`,`Les personnes à risque`],c:0,e:`Taux de létalité = décès par une maladie / nombre total des malades pendant la même période.`}
],
cards:[
{f:`Prévalence : nature exacte`,b:`Indicateur <b>statique</b>, c'est une <b>proportion</b> (pas un taux) : « taux de prévalence » est un <b>abus de langage</b>`},
{f:`Incidence cumulée vs taux d'incidence`,b:`<b>IC</b> : proportion / <b>probabilité (risque)</b> de devenir malade sur une période · <b>TI = densité d'incidence</b> : <b>vitesse</b> de propagation`},
{f:`Ratio · proportion · taux`,b:`<b>Ratio</b> : numérateur <b>non compris</b> au dénominateur · <b>Proportion</b> : numérateur <b>compris</b> · <b>Taux</b> : proportion + <b>temps</b> = vitesse`},
{f:`Les 3 notions de la démarche épidémiologique`,b:`<b>Fréquence</b> (quantifier) · <b>Distribution</b> (QUI, OÙ, QUAND) · <b>Déterminants</b> (POURQUOI)`},
{f:`Définition du risque`,b:`<b>Probabilité</b> qu'un événement de santé survienne dans une population donnée à un moment donné`}
]},

/* U8 */
{t:`Investigation d'une épidémie et surveillance`,ic:`🔎`,pages:`p.15-17`,
lesson:`<h3>🎯 Buts de l'investigation</h3>
<p>Étudier un phénomène de santé · mesurer la <b>relation entre une maladie et un facteur de risque</b> · prévoir les <b>moyens de lutte</b> · <b>prévenir la continuation de la transmission</b> de l'agent étiologique dans l'immédiat et le futur.</p>
<h3>🔟 Les 10 étapes de l'investigation épidémiologique</h3>
<p>1. <b>Confirmer l'existence de l'épidémie</b><br>2. Établir et <b>vérifier le diagnostic</b><br>3. Établir la <b>définition des cas</b><br>4. <b>Collecte des données</b><br>5. <b>Décrire l'épidémie</b> (épidémiologie descriptive)<br>6. <b>Formuler des hypothèses</b><br>7. <b>Tester les hypothèses</b><br>8. Établir les <b>mesures de contrôle</b><br>9. Préparer le <b>rapport</b> sur l'épidémie<br>10. <b>Continuer la surveillance</b> épidémiologique</p>
<h3>👁️ La surveillance</h3>
<p><b>Langmuir (1963)</b> — surveillance des maladies : « l'<b>observation attentive et continue</b> de leurs distributions et de leurs tendances par la collecte systématique, la compilation et l'analyse des données de morbidité et de mortalité, ainsi que la <b>dissémination régulière et à temps</b> à ceux qui ont besoin de savoir ».<br>
<b>OMS, 21e assemblée (1968)</b> — surveillance en santé publique : collecte continue et systématique, analyse et interprétation des données essentielles à la <b>planification, la mise en place et l'évaluation</b> des pratiques de santé publique ; l'<b>étape finale</b> du cycle est l'<b>application des données au contrôle et à la prévention</b>.</p>
<h3>🔁 Les 4 activités de la surveillance</h3>
<p>1. <b>Collecte</b> des données pertinentes · 2. <b>Regroupement et tabulation</b> · 3. <b>Analyse et interprétation</b> · 4. <b>Diffusion</b> des données et résultats.</p>
<p><b>Éléments</b> : déclarations des <b>décès</b>, des <b>maladies</b>, des <b>épidémies</b>, rapports d'investigation des épisodes épidémiques.</p>
<h3>🎯 Objectifs de la surveillance</h3>
<p>Détecter les changements de distribution/tendance · <b>DÉCRIRE</b> l'ampleur et les tendances (temps, personne, lieu) · <b>ALERTER</b> (détecter les épidémies) · <b>ÉVALUER</b> l'impact des mesures · émettre des hypothèses · identifier des phénomènes pour la recherche · <b>faire les projections des besoins en soins</b>.</p>
<h3>📡 Les 3 types de surveillance</h3>
<p><b>Passive</b> : les informations sont acheminées <b>sans sollicitation</b> des services de surveillance.<br>
<b>Active</b> : collecte <b>périodique</b> par <b>contact régulier</b> avec les services concernés.<br>
<b>Sentinelle</b> : surveillance spéciale <b>limitée dans le temps et l'espace</b>, <b>répétée régulièrement à la même période de l'année</b>, chez des groupes particuliers.</p>
<h3>✅ Les 7 critères de qualité d'un système de surveillance</h3>
<p><b>Simplicité · Souplesse · Acceptabilité · Représentativité · Réactivité · Sensibilité · Spécificité</b>.</p>`,
qs:[
{q:`La première étape de l'investigation d'une épidémie est :`,o:[`Établir la définition des cas`,`Confirmer l'existence de l'épidémie`,`Collecter les données`,`Formuler des hypothèses`],c:1,e:`Étape 1 : confirmer l'existence de l'épidémie ; étape 2 : établir et vérifier le diagnostic.`},
{q:`Combien d'étapes compte l'investigation épidémiologique ?`,o:[`7`,`8`,`10`,`12`],c:2,e:`10 étapes, de la confirmation de l'épidémie à la poursuite de la surveillance.`},
{q:`La dernière étape de l'investigation d'une épidémie est :`,o:[`Préparer le rapport`,`Continuer la surveillance épidémiologique`,`Établir les mesures de contrôle`,`Tester les hypothèses`],c:1,e:`Étape 10 : continuer la surveillance épidémiologique (le rapport est l'étape 9).`},
{q:`La définition de la surveillance des maladies de 1963 est due à :`,o:[`Mac Mahon`,`Alexander Langmuir`,`L'OMS`,`Evans et Stoddart`],c:1,e:`Alexander Langmuir, 1963 ; l'OMS a défini la surveillance en santé publique lors de sa 21e assemblée en 1968.`},
{q:`Les 4 activités de la surveillance sont :`,o:[`Collecte, regroupement/tabulation, analyse/interprétation, diffusion`,`Détection, alerte, riposte, évaluation`,`Prévention, dépistage, soin, réhabilitation`,`Planification, exécution, contrôle, rapport`],c:0,e:`Processus continu et systématique en 4 activités.`},
{q:`Dans la surveillance passive :`,o:[`Les informations arrivent sans sollicitation des services de surveillance`,`On contacte régulièrement les services`,`On surveille des sites sentinelles`,`On fait des enquêtes de terrain`],c:0,e:`Surveillance passive : informations acheminées sans sollicitation ni intervention des services responsables.`},
{q:`La surveillance sentinelle est :`,o:[`Permanente et exhaustive`,`Limitée dans le temps et l'espace, répétée régulièrement à la même période de l'année`,`Réservée aux hôpitaux`,`Sans analyse des données`],c:1,e:`Surveillance spéciale, limitée dans le temps et l'espace, répétée à la même période, pour suivre la tendance d'une maladie dans un site précis chez des groupes particuliers.`},
{q:`Lequel N'EST PAS un critère de qualité d'un système de surveillance ?`,o:[`Simplicité`,`Souplesse`,`Rentabilité`,`Réactivité`],c:2,e:`Les 7 critères : simplicité, souplesse, acceptabilité, représentativité, réactivité, sensibilité, spécificité.`},
{q:`Selon l'OMS (1968), l'étape finale du cycle de la surveillance est :`,o:[`La publication`,`L'application des données au contrôle et à la prévention des maladies et accidents`,`La collecte`,`L'analyse statistique`],c:1,e:`L'étape finale est l'application de ces données au contrôle et à la prévention des maladies et accidents.`}
],
cards:[
{f:`Les 10 étapes de l'investigation d'une épidémie`,b:`Confirmer l'épidémie · vérifier le diagnostic · définir les cas · collecter les données · décrire · formuler des hypothèses · tester · mesures de contrôle · rapport · <b>continuer la surveillance</b>`},
{f:`Les 4 activités de la surveillance`,b:`Collecte · regroupement et tabulation · analyse et interprétation · <b>diffusion</b>`},
{f:`Les 3 types de surveillance`,b:`<b>Passive</b> (sans sollicitation) · <b>Active</b> (contact régulier périodique) · <b>Sentinelle</b> (limitée dans le temps et l'espace, répétée à la même période)`},
{f:`Les 7 critères de qualité d'un système de surveillance`,b:`Simplicité · souplesse · acceptabilité · représentativité · réactivité · sensibilité · spécificité`},
{f:`Décrire · Alerter · Évaluer`,b:`<b>DÉCRIRE</b> l'ampleur et les tendances · <b>ALERTER</b> (détecter les épidémies) · <b>ÉVALUER</b> l'impact des mesures de prévention et de contrôle`}
]},

/* U9 */
{t:`La chaîne de transmission`,ic:`🔗`,pages:`p.18-19`,
lesson:`<h3>🔗 Les 4 maillons de toute chaîne épidémiologique</h3>
<p>1. Un élément qui <b>circule</b> : l'<b>agent pathogène</b><br>
2. Un élément qui permet sa <b>conservation</b> : le <b>réservoir</b><br>
3. Un <b>agent de transmission</b> qui le fait passer du réservoir au sujet sain : le <b>vecteur</b> ou hôte intermédiaire<br>
4. Un sujet sain susceptible de contracter la maladie : l'<b>hôte réceptif</b></p>
<h3>🦠 Définitions</h3>
<p><b>Agents causaux</b> : microorganismes capables de produire une infection ou une maladie infectieuse.<br>
<b>Réservoir de germe</b> : l'homme, l'animal, les plantes, le sol, les matières organiques <b>où l'agent vit et se multiplie</b> et dont il dépend pour sa <b>survie et sa reproduction</b>.<br>
<b>Porteur de germe</b> : personne ou animal qui héberge l'agent infectieux — 4 types : porteur en <b>incubation</b>, en <b>période de maladie</b>, en <b>convalescence</b>, et <b>porteur sain</b>.<br>
<b>Vecteur</b> : eau, animaux, produits biologiques, toute substance ou objet servant d'intermédiaire, avec introduction dans l'hôte réceptif par <b>injection, inoculation ou dépôt</b> sur la peau ou les muqueuses.<br>
<b>Hôte primaire (définitif)</b> : celui chez qui le parasite atteint sa <b>maturité</b> ou passe par son <b>stade sexué</b>. <b>Hôte secondaire (intermédiaire)</b> : celui chez qui le parasite est à l'état <b>larvaire ou asexué</b>.<br>
<b>Hôte réceptif</b> : homme ou animal <b>dépourvu de résistance</b> à l'égard d'un agent pathogène et donc prédisposé à contracter la maladie s'il y est exposé.</p>`,
qs:[
{q:`Combien d'éléments comprend une chaîne épidémiologique ?`,o:[`3`,`4`,`5`,`6`],c:1,e:`4 : agent pathogène, réservoir, vecteur (ou hôte intermédiaire), hôte réceptif.`},
{q:`L'hôte chez lequel le parasite atteint sa maturité ou son stade sexué est :`,o:[`L'hôte secondaire`,`L'hôte primaire ou définitif`,`Le vecteur`,`Le réservoir`],c:1,e:`Hôte primaire ou définitif ; l'hôte secondaire héberge le parasite à l'état larvaire ou asexué.`},
{q:`Le porteur de germe peut être :`,o:[`En incubation, en période de maladie, en convalescence ou porteur sain`,`Uniquement malade`,`Uniquement sain`,`Uniquement en incubation`],c:0,e:`4 types de porteurs de germe.`},
{q:`Le réservoir de germe est :`,o:[`Le lieu où l'agent vit et se multiplie et dont il dépend pour sa survie`,`L'objet qui transporte l'agent`,`Le sujet sain exposé`,`Le vaccin`],c:0,e:`Homme, animal, plantes, sol, matières organiques dans lesquels l'agent infectieux vit et se multiplie.`},
{q:`L'hôte réceptif est :`,o:[`Immunisé`,`Présumé dépourvu de résistance à l'égard de l'agent pathogène`,`Le réservoir`,`Le vecteur`],c:1,e:`Tout homme ou animal présumé dépourvu de résistance, donc prédisposé à contracter la maladie s'il est exposé.`},
{q:`L'eau peut jouer le rôle :`,o:[`De vecteur`,`D'hôte réceptif`,`D'agent causal`,`De porteur sain`],c:0,e:`Le vecteur peut être l'eau, des animaux, des produits biologiques ou tout objet servant d'intermédiaire.`},
{q:`L'élément qui circule sur la chaîne épidémiologique est :`,o:[`Le vecteur`,`L'agent pathogène`,`L'hôte réceptif`,`Le réservoir`],c:1,e:`L'agent pathogène circule ; le réservoir le conserve ; le vecteur le transmet ; l'hôte réceptif le reçoit.`}
],
cards:[
{f:`Les 4 maillons de la chaîne épidémiologique`,b:`<b>Agent pathogène</b> (circule) · <b>réservoir</b> (conserve) · <b>vecteur</b> / hôte intermédiaire (transmet) · <b>hôte réceptif</b> (reçoit)`},
{f:`Hôte primaire vs hôte secondaire`,b:`<b>Primaire (définitif)</b> : parasite à maturité / stade <b>sexué</b> · <b>Secondaire (intermédiaire)</b> : stade <b>larvaire ou asexué</b>`},
{f:`Les 4 types de porteurs de germe`,b:`En <b>incubation</b> · en <b>période de maladie</b> · en <b>convalescence</b> · <b>porteur sain</b>`}
]},

{t:`Définitions de mortalité et natalité`,ic:`👶`,pages:`p.20`,
lesson:`<h3>👶 Les mortalités de l'enfant — à connaître par cœur</h3>
<table><tr><th>Terme</th><th>Définition</th></tr>
<tr><td><b>Mortalité infantile</b></td><td>Décès d'enfants de <b>moins d'un an</b></td></tr>
<tr><td><b>Mortalité fœto-infantile</b></td><td>Enfants <b>nés sans vie</b> + décès d'enfants de moins d'un an</td></tr>
<tr><td><b>Mortalité fœtale tardive (mortinatalité)</b></td><td>Enfants <b>nés sans vie</b></td></tr>
<tr><td><b>Mortalité périnatale</b></td><td>Morts à la naissance + décès durant les <b>7 premiers jours</b></td></tr>
<tr><td><b>Mortalité néonatale</b></td><td>Décès avant <b>28 jours</b></td></tr>
<tr><td><b>Mortalité néonatale précoce</b></td><td>Décès avant <b>7 jours</b></td></tr>
<tr><td><b>Mortalité post-néonatale</b></td><td>Décès entre <b>28 jours et 1 an</b></td></tr></table>
<h3>📈 Natalité et fécondité</h3>
<p><b>Natalité</b> : nombre de <b>naissances</b> au cours d'une période donnée.<br>
<b>Fécondité</b> : nombre de naissances <b>par femme en âge d'être féconde (15 à 49 ans)</b>.<br>
<b>Indice synthétique de fécondité</b> : <b>somme des taux de fécondité par âge</b> entre 15 et 49 ans.</p>
<h3>⚰️ Mortalité générale</h3>
<p><b>Taux brut de mortalité</b> : nombre de décès pendant une période donnée × 1000.<br>
<b>Taux de mortalité (par maladie)</b> : décès dus à une maladie rapportés au <b>nombre de patients atteints</b> par cette maladie.<br>
<b>Espérance de vie</b> : ⚠️ ce <b>n'est pas un indicateur de mortalité</b> mais représente la <b>durée de vie</b>.</p>`,
qs:[
{q:`La mortalité néonatale concerne les décès d'enfants de moins de :`,o:[`7 jours`,`28 jours`,`1 an`,`5 ans`],c:1,e:`Mortalité néonatale : moins de 28 jours. Néonatale précoce : moins de 7 jours.`},
{q:`La mortalité périnatale comprend :`,o:[`Les morts à la naissance et les décès des 7 premiers jours`,`Les décès de moins d'un an`,`Les décès entre 28 jours et un an`,`Les seuls enfants nés sans vie`],c:0,e:`Nombre d'enfants morts à la naissance + décès au cours des sept premiers jours de vie.`},
{q:`La mortalité post-néonatale concerne les décès :`,o:[`Avant 7 jours`,`Entre 28 jours et un an`,`Avant 28 jours`,`Après un an`],c:1,e:`Décès entre 28 jours de vie et un an.`},
{q:`La mortinatalité désigne :`,o:[`Les enfants nés sans vie`,`Les décès de moins d'un an`,`Les décès de moins de 28 jours`,`Les naissances vivantes`],c:0,e:`Mortalité fœtale tardive, ou mortinatalité : les enfants nés sans vie.`},
{q:`La fécondité se rapporte aux femmes âgées de :`,o:[`15 à 45 ans`,`15 à 49 ans`,`18 à 45 ans`,`20 à 50 ans`],c:1,e:`Nombre de naissances par femme en âge d'être féconde, de 15 à 49 ans.`},
{q:`L'indice synthétique de fécondité est :`,o:[`La somme des taux de fécondité par âge entre 15 et 49 ans`,`Le nombre de naissances vivantes`,`Le rapport naissances/décès`,`Le taux brut de natalité`],c:0,e:`Somme des taux de fécondité par âge entre 15 et 49 ans.`},
{q:`L'espérance de vie est :`,o:[`Un indicateur de mortalité`,`Non un indicateur de mortalité, mais la représentation de la durée de vie`,`Un taux de morbidité`,`Un ratio`],c:1,e:`Elle n'est pas un indicateur de mortalité mais représente la durée de vie.`},
{q:`La mortalité fœto-infantile correspond :`,o:[`Aux enfants nés sans vie et aux décès de moins d'un an`,`Aux seuls décès de moins de 28 jours`,`Aux décès des 7 premiers jours`,`Aux décès de moins de 5 ans`],c:0,e:`Nombre d'enfants nés sans vie + décès d'enfants de moins d'un an.`}
],
cards:[
{f:`Mortalité néonatale, précoce, post-néonatale`,b:`<b>Néonatale</b> : &lt; 28 jours · <b>Néonatale précoce</b> : &lt; 7 jours · <b>Post-néonatale</b> : entre 28 jours et 1 an`},
{f:`Mortalité périnatale`,b:`Enfants <b>morts à la naissance</b> + décès au cours des <b>7 premiers jours</b> de vie`},
{f:`Mortalité infantile vs fœto-infantile`,b:`<b>Infantile</b> : décès &lt; 1 an · <b>Fœto-infantile</b> : enfants <b>nés sans vie</b> + décès &lt; 1 an`},
{f:`Fécondité et ISF`,b:`<b>Fécondité</b> : naissances par femme de <b>15 à 49 ans</b> · <b>ISF</b> : somme des taux de fécondité par âge de 15 à 49 ans`},
{f:`Statut de l'espérance de vie`,b:`Ce <b>n'est pas</b> un indicateur de mortalité : elle représente la <b>durée de vie</b>`}
]}

{t:`Définition de l'infirmier et rôle propre`,ic:`🩺`,pages:`Dispositions générales`,
lesson:`<h3>👩‍⚕️ Définition légale</h3>
<p>L'infirmier est <b>toute personne qui dispense, en fonction du titre ou diplôme qui l'y habilite, des soins infirmiers à titre préventif, curatif ou palliatif</b>.</p>
<p>Il dispense également, <b>dans le cadre de son propre rôle</b>, des soins visant à assurer l'<b>hygiène et le confort</b> du malade.</p>
<h3>🧩 Les 5 domaines de participation</h3>
<p>Il participe en outre aux actions de <b>planification</b>, d'<b>encadrement</b>, de <b>formation</b>, de <b>gestion</b> et de <b>recherche</b> en soins infirmiers.</p>
<h3>⚖️ Les 3 modes d'accomplissement des actes</h3>
<p>L'infirmier exerce sa profession :</p>
<p>• <b>soit sur prescription médicale</b><br>
• <b>soit sous l'encadrement et la responsabilité d'un médecin</b><br>
• <b>soit de manière indépendante</b> pour les <b>actes qui lui sont propres</b></p>
<p>Les actes propres et ceux qui exigent une prescription ou un encadrement sont fixés dans une <b>nomenclature établie par l'administration</b>, <b>après consultation de l'association professionnelle et du conseil national de l'Ordre national des médecins</b>.</p>
<h3>🎓 Cadre de compétence</h3>
<p>La profession s'exerce <b>en fonction du diplôme détenu</b> et <b>dans la limite des compétences acquises</b> au cours de la <b>formation de base ou de la formation continue</b>.</p>`,
qs:[
{q:`Selon la loi 43-13, l'infirmier dispense des soins :`,o:[`Uniquement curatifs`,`À titre préventif, curatif ou palliatif`,`Uniquement sur prescription`,`Uniquement à l'hôpital`],c:1,e:`Définition légale : soins préventifs, curatifs ou palliatifs, en fonction du titre ou diplôme qui l'habilite.`},
{q:`Les soins d'hygiène et de confort du malade relèvent :`,o:[`De la prescription médicale`,`Du propre rôle de l'infirmier`,`De l'aide-soignant uniquement`,`Du médecin`],c:1,e:`« Dans le cadre de son propre rôle », l'infirmier dispense des soins visant l'hygiène et le confort du malade.`},
{q:`L'infirmier participe également aux actions de :`,o:[`Planification, encadrement, formation, gestion et recherche en soins infirmiers`,`Diagnostic et prescription`,`Contrôle financier`,`Inspection des cliniques`],c:0,e:`Cinq domaines de participation.`},
{q:`Les actes propres à l'infirmier sont fixés :`,o:[`Par une nomenclature établie par l'administration`,`Par le médecin traitant`,`Par le contrat de travail`,`Par l'employeur`],c:0,e:`Nomenclature de l'administration, après consultation de l'association professionnelle et du conseil national de l'Ordre national des médecins.`},
{q:`Avant d'établir la nomenclature des actes, l'administration consulte :`,o:[`L'association professionnelle et le conseil national de l'Ordre national des médecins`,`Le Parlement`,`Le ministère de l'Intérieur`,`Les cliniques privées`],c:0,e:`Double consultation obligatoire.`},
{q:`L'infirmier peut exercer de manière indépendante :`,o:[`Pour tous les actes`,`Pour les actes qui lui sont propres`,`Jamais`,`Seulement dans le public`],c:1,e:`3 modes : sur prescription, sous encadrement et responsabilité d'un médecin, ou de manière indépendante pour ses actes propres.`},
{q:`La profession s'exerce dans la limite des compétences acquises :`,o:[`En formation de base ou en formation continue`,`À l'université seulement`,`Par l'expérience seule`,`Par le concours`],c:0,e:`Formation de base ou formation continue.`}
],
cards:[

{f:`Les 3 modes d'exercice des actes`,b:`Sur <b>prescription médicale</b> · sous l'<b>encadrement et la responsabilité</b> d'un médecin · de manière <b>indépendante</b> pour les actes propres`},
{f:`Les 5 actions auxquelles l'infirmier participe`,b:`<b>Planification · encadrement · formation · gestion · recherche</b> en soins infirmiers`},
{f:`Qui fixe la nomenclature des actes ?`,b:`L'<b>administration</b>, après consultation de l'<b>association professionnelle</b> et du <b>conseil national de l'Ordre national des médecins</b>`}
]},

/* U2 */
{t:`Les spécialités infirmières`,ic:`🏷️`,pages:`Dispositions générales`,
lesson:`<h3>🏷️ Les qualités reconnues par la loi</h3>
<p>Infirmier <b>polyvalent</b> · en <b>anesthésie réanimation</b> · en <b>psychiatrie</b> · en <b>gériatrie</b> · en <b>soins d'urgence et soins intensifs</b> · en <b>maladies chroniques</b> · en <b>pédiatrie, médecine néonatale et des prématurés</b>.</p>
<table><tr><th>Qualité</th><th>Mission</th></tr>
<tr><td><b>Polyvalent</b></td><td>Soins infirmiers <b>globaux</b> aux individus de <b>tous âges, malades ou bien-portants</b>, aux familles ou aux membres d'un groupement</td></tr>
<tr><td><b>Anesthésie réanimation</b></td><td>Actes d'anesthésie ou de réanimation, <b>sous la responsabilité et la surveillance directe</b> d'un médecin spécialiste en anesthésie réanimation</td></tr>
<tr><td><b>Psychiatrie</b></td><td>Prévention et soins aux personnes atteintes de <b>troubles psychiques ou mentaux</b></td></tr>
<tr><td><b>Gériatrie</b></td><td>Soins <b>curatifs ou palliatifs</b> adaptés aux <b>personnes âgées</b></td></tr>
<tr><td><b>Urgence et soins intensifs</b></td><td>Prise en charge <b>paramédicale</b> des patients admis en urgence nécessitant une <b>surveillance permanente</b></td></tr>
<tr><td><b>Maladies chroniques</b></td><td>Soins curatifs ou palliatifs aux personnes atteintes de <b>maladies chroniques</b></td></tr>
<tr><td><b>Maladies infantiles et prématurés</b></td><td>Soins <b>préventifs, curatifs ou palliatifs</b> aux <b>enfants, nouveau-nés et prématurés</b></td></tr></table>
<div class="warn">⚠️ Règle d'or : <b>en cas de nécessité, la spécialisation ne peut être invoquée pour refuser</b> de prêter assistance ou de fournir des prestations relevant d'une autre spécialité infirmière.</div>`,
qs:[
{q:`En cas de nécessité, un infirmier spécialisé peut-il refuser un acte d'une autre spécialité ?`,o:[`Oui, sa spécialité le protège`,`Non, la spécialisation ne peut être invoquée pour refuser de prêter assistance`,`Oui, avec accord du médecin`,`Uniquement dans le privé`],c:1,e:`Disposition expresse de la loi 43-13.`},
{q:`L'infirmier en anesthésie réanimation accomplit ses actes :`,o:[`De façon totalement autonome`,`Sous la responsabilité et la surveillance directe d'un médecin spécialiste en anesthésie réanimation`,`Sur simple protocole`,`Sous la responsabilité du chirurgien`],c:1,e:`Surveillance directe d'un médecin spécialiste en anesthésie réanimation.`},
{q:`Quel infirmier dispense des soins globaux aux individus de tous âges, malades ou bien-portants ?`,o:[`L'infirmier polyvalent`,`L'infirmier en gériatrie`,`L'infirmier en psychiatrie`,`L'infirmier en soins intensifs`],c:0,e:`Définition de l'infirmier polyvalent.`},
{q:`L'infirmier en soins d'urgence et soins intensifs assure :`,o:[`La prise en charge paramédicale des patients admis en urgence nécessitant une surveillance permanente`,`Le tri administratif`,`Le transport sanitaire`,`Le diagnostic médical`],c:0,e:`Prise en charge paramédicale et soins appropriés sous surveillance permanente.`},
{q:`Les soins aux prématurés relèvent de l'infirmier :`,o:[`En pédiatrie, médecine néonatale et des prématurés`,`Polyvalent uniquement`,`En gériatrie`,`En maladies chroniques`],c:0,e:`Soins préventifs, curatifs ou palliatifs aux enfants, nouveau-nés et prématurés.`},
{q:`L'infirmier en gériatrie dispense des soins :`,o:[`Curatifs ou palliatifs adaptés à l'état de santé des personnes âgées`,`Uniquement préventifs`,`Uniquement à domicile`,`Uniquement en institution`],c:0,e:`Soins curatifs ou palliatifs adaptés aux personnes âgées.`}
],
cards:[
{f:`Les qualités infirmières de la loi 43-13`,b:`Polyvalent · anesthésie réanimation · psychiatrie · gériatrie · soins d'urgence et soins intensifs · maladies chroniques · pédiatrie, médecine néonatale et prématurés`},
{f:`La spécialisation et le refus de soins`,b:`En cas de <b>nécessité</b>, la spécialisation <b>ne peut jamais être invoquée</b> pour refuser assistance ou prestations d'une autre spécialité`}
]},

{t:`Secteurs d'exercice et obligations`,ic:`🏛️`,pages:`Dispositions générales`,
lesson:`<h3>🏛️ Où s'exercent les professions infirmières ?</h3>
<p><b>Secteur public</b> : services de l'État, collectivités territoriales, établissements publics.<br>
<b>Secteur privé</b> : à but <b>lucratif ou non lucratif</b>.</p>
<p>Dans le <b>public</b>, l'infirmier accomplit ses actes <b>sous l'encadrement de sa hiérarchie</b> et suivant les <b>directives techniques</b> édictées par l'<b>autorité gouvernementale compétente</b>.</p>
<h3>🤝 Les 6 principes déontologiques</h3>
<p>Quel que soit le secteur, l'infirmier est tenu au respect des principes de : <b>moralité, dignité, probité, intégrité, abnégation et éthique professionnelle</b>.</p>
<h3>🤐 Le secret professionnel</h3>
<p>Il est tenu au <b>secret professionnel</b> dans les conditions prévues par la législation. Cette obligation <b>s'étend aux étudiants</b> des établissements de formation <b>publics ou privés</b> préparant à un diplôme permettant l'exercice de l'une des professions infirmières.</p>`,
qs:[
{q:`Dans le secteur public, l'infirmier accomplit ses actes :`,o:[`Sous l'encadrement de sa hiérarchie et selon les directives techniques de l'autorité gouvernementale compétente`,`En toute autonomie`,`Sur ordre du wali`,`Selon son contrat de travail`],c:0,e:`Encadrement hiérarchique + directives techniques de l'autorité gouvernementale compétente.`},
{q:`L'obligation de secret professionnel s'étend :`,o:[`Aux seuls infirmiers du public`,`Aux étudiants des établissements de formation publics ou privés`,`Aux seuls titulaires`,`Aux médecins uniquement`],c:1,e:`Extension expresse aux étudiants préparant un diplôme permettant l'exercice.`},
{q:`Parmi les principes imposés à l'infirmier figure :`,o:[`L'abnégation`,`La rentabilité`,`La productivité`,`La disponibilité permanente`],c:0,e:`Moralité, dignité, probité, intégrité, abnégation et éthique professionnelle.`},
{q:`Le secteur privé où s'exercent les professions infirmières est :`,o:[`À but lucratif uniquement`,`À but lucratif ou non lucratif`,`À but non lucratif uniquement`,`Interdit`],c:1,e:`La loi vise le privé à but lucratif ou non lucratif.`},
{q:`Combien de principes de comportement s'imposent à l'infirmier ?`,o:[`4`,`5`,`6`,`8`],c:2,e:`6 : moralité, dignité, probité, intégrité, abnégation, éthique professionnelle.`}
],
cards:[
{f:`Les 6 principes imposés à l'infirmier`,b:`<b>Moralité · dignité · probité · intégrité · abnégation · éthique professionnelle</b>`},
{f:`Étendue du secret professionnel`,b:`Il s'impose à l'infirmier <b>et aux étudiants</b> des établissements de formation <b>publics ou privés</b> préparant au diplôme`}
]},

{t:`L'exercice dans le privé : modes et société`,ic:`🏢`,pages:`Secteur privé`,
lesson:`<h3>💼 Les 2 modes d'exercice dans le privé</h3>
<p><b>Forme libérale à titre individuel</b> ou <b>salariat</b>.</p>
<div class="warn">⚠️ Quatre professions <b>ne peuvent s'exercer que dans le cadre du SALARIAT</b>, auprès d'un médecin, d'une clinique ou d'un établissement assimilé : <b>anesthésie réanimation</b>, <b>psychiatrie</b>, <b>soins d'urgence et soins intensifs</b>, <b>maladies infantiles</b> (pour les prématurés).</div>
<p>Le salariat exige un <b>contrat de travail écrit</b>, qui doit stipuler que l'exercice s'effectue <b>conformément à la loi 43-13</b> et à ses textes d'application.</p>
<h3>🤝 L'exercice en commun</h3>
<p>Pour l'exercice en commun des professions d'<b>infirmier polyvalent et en gériatrie</b>, deux ou plusieurs infirmiers <b>de la même profession</b> doivent se constituer en <b>société civile professionnelle</b> (régie par le dahir du <b>12 août 1913</b> formant code des obligations et contrats).</p>
<p>• Objet unique : l'exercice de la profession par les associés<br>
• Le <b>siège</b> correspond au <b>local professionnel</b> des associés, où tous élisent domicile professionnel<br>
• <b>Un infirmier ne peut être associé dans plus d'une société</b><br>
• La <b>gérance</b> du local est assurée par <b>l'un des associés</b> désigné dans le contrat ou les statuts<br>
• L'autorisation d'exercice en commun est accordée <b>nominativement à chacun</b> des associés<br>
• La <b>responsabilité</b> des actes incombe à <b>l'infirmier qui les a prodigués</b><br>
• Toute clause <b>aliénant l'indépendance professionnelle</b> est frappée de <b>nullité</b></p>
<h3>🔁 Changements</h3>
<p><b>Changer de mode d'exercice</b> → demander l'<b>autorisation</b> à l'administration, qui met à jour l'autorisation initiale.<br>
<b>Changer d'employeur</b> (salarié) → <b>déclaration dans la quinzaine</b> à l'administration, qui met à jour l'autorisation, et information de l'Ordre national des infirmiers s'il existe.</p>`,
qs:[
{q:`Quelles professions ne peuvent s'exercer que dans le cadre du salariat ?`,o:[`Polyvalent et gériatrie`,`Anesthésie réanimation, psychiatrie, soins d'urgence et soins intensifs, maladies infantiles (prématurés)`,`Toutes`,`Aucune`],c:1,e:`Ces quatre professions s'exercent uniquement en salariat auprès d'un médecin, d'une clinique ou d'un établissement assimilé.`},
{q:`Quelles professions peuvent s'exercer en commun au sein d'une société civile professionnelle ?`,o:[`Infirmier polyvalent et infirmier en gériatrie`,`Toutes les spécialités`,`Anesthésie et psychiatrie`,`Aucune`],c:0,e:`Exercice en commun réservé aux professions d'infirmiers polyvalents et en gériatrie, entre infirmiers de la même profession.`},
{q:`Un infirmier peut être associé :`,o:[`Dans plusieurs sociétés`,`Dans une seule société`,`Dans deux sociétés au maximum`,`Sans limite`],c:1,e:`« Un infirmier ne peut être associé dans plus d'une société. »`},
{q:`En cas de changement d'employeur, l'infirmier salarié doit faire une déclaration :`,o:[`Dans la quinzaine`,`Dans le mois`,`Dans les 30 jours`,`Dans l'année`],c:0,e:`Déclaration dans la quinzaine à l'administration, qui met à jour l'autorisation.`},
{q:`La responsabilité des actes accomplis dans un local exploité en commun incombe :`,o:[`Au gérant du local`,`À l'infirmier qui les a prodigués`,`À la société`,`Au médecin référent`],c:1,e:`Responsabilité personnelle de l'auteur de l'acte.`},
{q:`Le siège de la société civile professionnelle correspond :`,o:[`Au domicile du gérant`,`Au local professionnel des associés`,`Au siège de l'Ordre`,`À l'adresse de l'administration`],c:1,e:`Tous les associés y élisent domicile professionnel.`},
{q:`Changer de mode d'exercice dans le privé suppose :`,o:[`Une simple déclaration`,`Une demande d'autorisation à l'administration`,`Un accord de l'employeur`,`Rien de particulier`],c:1,e:`Autorisation demandée à l'administration, qui met à jour l'autorisation initiale.`},
{q:`Le contrat de travail de l'infirmier salarié doit :`,o:[`Être écrit et stipuler la conformité à la loi 43-13`,`Être verbal`,`Être visé par l'Ordre`,`Être renouvelé chaque année`],c:0,e:`Contrat écrit mentionnant que l'exercice s'effectue conformément à la loi et à ses textes d'application.`}
],
cards:[
{f:`Les 4 professions réservées au salariat`,b:`<b>Anesthésie réanimation · psychiatrie · soins d'urgence et soins intensifs · maladies infantiles (prématurés)</b>`},
{f:`Exercice en commun : conditions`,b:`Réservé aux <b>polyvalents et gériatrie</b> · <b>société civile professionnelle</b> (dahir du 12 août 1913) · <b>une seule société</b> par infirmier · autorisation <b>nominative</b> · responsabilité <b>personnelle</b>`},
{f:`Les délais de déclaration (privé)`,b:`Changement d'<b>employeur</b> : <b>quinzaine</b> · nomination à un <b>emploi public</b> : <b>quinzaine</b> · <b>cessation</b> d'activité (définitive ou &gt; 1 an) : <b>quinzaine</b>`}
]},

{t:`Les conditions d'autorisation (art. 20)`,ic:`📝`,pages:`Art. 20`,
lesson:`<h3>📝 Qui délivre l'autorisation ?</h3>
<p>L'exercice de la profession infirmière est subordonné à une <b>autorisation délivrée par l'administration</b>, <b>après avis du conseil national de l'Ordre national des médecins</b> et de l'<b>Ordre national des infirmiers s'il existe</b>, au vu d'un dossier fixé par voie réglementaire.</p>
<h3>✅ Les 4 conditions pour un Marocain</h3>
<p>1. Être de <b>nationalité marocaine</b><br>
2. Être <b>titulaire</b> de l'un des titres ou diplômes reconnus<br>
3. <b>N'avoir encouru aucune condamnation</b> devenue définitive pour les faits visés<br>
4. Fournir un <b>certificat médical</b> attestant l'<b>aptitude physique et mentale</b></p>
<h3>🎓 Les diplômes admis</h3>
<p>• <b>Diplôme d'État du 1er cycle des études paramédicales</b> (IFCS ou ISPITS) — sections polyvalent, psychiatrie, anesthésie réanimation, gériatrie, urgence et soins intensifs<br>
• <b>Licence en soins infirmiers</b> (ISPITS ou établissement d'enseignement supérieur public marocain)<br>
• Diplôme d'un <b>établissement d'enseignement supérieur privé autorisé</b>, filière accréditée, <b>au moins 3 ans après le baccalauréat (Bac+3)</b><br>
• Diplôme d'un <b>établissement de formation professionnelle privée autorisé</b>, filière qualifiée, <b>au moins 3 ans après le baccalauréat</b></p>
<h3>🌍 Les 3 conditions supplémentaires pour un étranger</h3>
<p>1. <b>Résider au Maroc</b> conformément à la législation sur l'entrée et le séjour<br>
2. Être : <b>ressortissant d'un État lié au Maroc par une convention</b> (ou appliquant la réciprocité), <b>OU conjoint d'un citoyen marocain</b>, <b>OU né au Maroc et y ayant résidé de manière continue pendant 10 ans au moins</b><br>
3. <b>Ne pas être inscrit à un Ordre étranger</b> d'infirmiers, ou <b>justifier de sa radiation</b></p>
<p>👉 L'autorisation mentionne la <b>commune</b> d'exercice, l'<b>adresse professionnelle</b> et le <b>mode d'exercice</b>. <b>Le refus doit être motivé.</b> La liste des infirmiers autorisés dans le privé est <b>publiée au Bulletin officiel chaque année</b>.</p>`,
qs:[
{q:`L'autorisation d'exercice est délivrée par :`,o:[`L'administration, après avis du conseil national de l'Ordre national des médecins`,`L'Ordre des infirmiers seul`,`Le tribunal`,`L'employeur`],c:0,e:`Administration, après avis du conseil national de l'Ordre national des médecins et de l'Ordre national des infirmiers s'il existe.`},
{q:`Un infirmier étranger né au Maroc doit y avoir résidé de manière continue pendant au moins :`,o:[`5 ans`,`10 ans`,`15 ans`,`3 ans`],c:1,e:`10 ans au moins de résidence continue — l'une des trois options ouvertes aux étrangers.`},
{q:`La liste des infirmiers autorisés à exercer dans le privé est publiée :`,o:[`Au Bulletin officiel, chaque année`,`Tous les 5 ans`,`Sur le site de l'Ordre`,`Jamais`],c:0,e:`Publication annuelle au Bulletin officiel par l'administration.`},
{q:`Le diplôme d'un établissement d'enseignement supérieur privé doit sanctionner des études d'au moins :`,o:[`2 ans après le bac`,`3 ans après le baccalauréat (Bac+3)`,`4 ans`,`5 ans`],c:1,e:`Au moins trois ans effectués avec succès après le baccalauréat, dans une filière accréditée d'un établissement autorisé.`},
{q:`Le refus d'autorisation :`,o:[`N'a pas à être justifié`,`Doit être motivé`,`Est définitif`,`Est prononcé par le tribunal`],c:1,e:`« Le refus de l'autorisation doit être motivé. »`},
{q:`Que mentionne l'autorisation d'exercice ?`,o:[`La commune d'exercice, l'adresse professionnelle et le mode d'exercice`,`Le salaire`,`Le nombre de patients`,`La durée de validité`],c:0,e:`Trois mentions obligatoires.`},
{q:`Un infirmier étranger inscrit à un Ordre étranger :`,o:[`Peut exercer sans formalité`,`Doit justifier de sa radiation`,`Est automatiquement autorisé`,`Doit payer une taxe`],c:1,e:`Il ne doit pas être inscrit à un Ordre étranger d'infirmiers, ou justifier de sa radiation.`},
{q:`Parmi les conditions générales figure :`,o:[`Un certificat médical d'aptitude physique et mentale`,`Une attestation de stage`,`Un casier vierge de 10 ans`,`Une recommandation de médecin`],c:0,e:`4 conditions : nationalité, diplôme, absence de condamnation définitive, certificat médical d'aptitude.`}
],
cards:[
{f:`Qui autorise et après quel avis ?`,b:`L'<b>administration</b>, après avis du <b>conseil national de l'Ordre national des médecins</b> et de l'<b>Ordre national des infirmiers s'il existe</b>`},
{f:`Les 4 conditions d'autorisation (Marocain)`,b:`<b>Nationalité marocaine</b> · <b>diplôme</b> reconnu · <b>aucune condamnation définitive</b> · <b>certificat médical</b> d'aptitude physique et mentale`},
{f:`Les 3 voies ouvertes à un infirmier étranger`,b:`Ressortissant d'un État lié par <b>convention</b> ou réciprocité · <b>conjoint</b> d'un citoyen marocain · <b>né au Maroc</b> avec <b>10 ans</b> de résidence continue`},
{f:`Mentions de l'autorisation`,b:`La <b>commune</b> d'exercice · l'<b>adresse professionnelle</b> · le <b>mode d'exercice</b> — le refus doit être <b>motivé</b>`}
]},
